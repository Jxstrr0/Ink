<style>
/* ===================== Ink: base page CSS =====================
   Theme tokens (dark default, light under html[data-theme=light]), the app frame (header, scrolling panel, bottom tab bar),
   cards, buttons, the settings/backup sheet, toasts, the "New version ready" bar, and the design-board cream (both themes:
   the board stays cream with black ink, Q10 default; only the chrome around it follows the theme).
   Reduced motion and reduced transparency are honoured at the bottom. */
:root{
  --bg:#17130f;--panel:#211c17;--panel2:#2b241d;--line:#3b3229;--text:#f2ebdd;--mute:#a39a8b;--faint:#6f665a;
  --red:#c8553d;--red2:#e06a50;--teal:#3f8f86;--gold:#d9a441;--ok:#6fbf8a;--warn:#e0a03f;--crit:#e0574f;
  --board:#f3ead8;--boardInk:#16120e;--boardLine:#d8ccb4;
  --tabh:62px;--hdr:52px;--r:12px;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  --ui:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:Oswald,"Arial Narrow",Impact,sans-serif;
  color-scheme:dark;
}
html[data-theme=light]{
  --bg:#f4efe6;--panel:#fffaf1;--panel2:#efe7d9;--line:#ddd2bf;--text:#1c1813;--mute:#6b6255;--faint:#a39886;
  --red:#b3432c;--red2:#c8553d;--teal:#2f7f77;--gold:#a8791f;--ok:#2f8a52;--warn:#a86a10;--crit:#c0392f;
  --shadow:0 6px 20px rgba(60,40,20,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--ui);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red2)}
h1,h2,h3{margin:0;font-weight:700}
.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* ---- app frame ---- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
#hdr{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:var(--hdr);padding:calc(env(safe-area-inset-top,0px) + 6px) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
#hdr .brand{font-family:var(--disp);font-size:26px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1}
#hdr .brand em{font-style:normal;color:var(--red)}
#hdr .when{display:flex;flex-direction:column;line-height:1.15;font-size:12px;color:var(--mute);margin-left:4px}
#hdr .when b{color:var(--text);font-size:13px}
#hdr .sp{flex:1}
#hdr .cash{font-weight:700;font-variant-numeric:tabular-nums}
.ibtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--text);cursor:pointer}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover{background:var(--panel2)}
#panel{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.tabpage{display:none}
.tabpage.on{display:block}

/* ---- bottom tab bar ---- */
#tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tabh);border:0;background:transparent;color:var(--mute);font-size:11.5px;font-weight:500;letter-spacing:.02em;cursor:pointer;position:relative}
#tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--text)}
#tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
#tabs button:focus-visible{outline:2px solid var(--red2);outline-offset:-4px}

/* ---- cards, rows, buttons ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h2{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.card h3{font-size:15px;margin:0 0 4px}
.hint{color:var(--mute);font-size:13.5px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff8ef}
.btn.pri:hover{background:var(--red2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;border:0;background:transparent;color:var(--mute);font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -3px 0 var(--red)}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}
.empty svg{width:56px;height:56px;fill:none;stroke:var(--faint);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.empty p{margin:6px auto;max-width:30ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
label{display:inline-flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
select{min-height:40px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px}
pre.raw{margin:0;padding:10px;border-radius:8px;background:var(--panel2);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto}

/* ---- the studio view (3D placeholder until PR 6) ---- */
#studioView{position:relative;height:min(42vh,320px);border-radius:var(--r);overflow:hidden;background:#0f0c09;margin:0 0 12px;border:1px solid var(--line)}
#studioView canvas{display:block;width:100%;height:100%;cursor:grab}
#studioView.nogl{height:auto;min-height:44px;background:linear-gradient(160deg,#2a1f17,#0f0c09)}#studioView.nogl .cap{position:static;display:block;margin:12px}
.stChair .stWho{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}.stChair .stWho b{font-size:17px}
#studioView .cap{position:absolute;left:12px;bottom:10px;font-size:12px;color:#d8cdb9;background:rgba(15,12,9,.6);padding:3px 8px;border-radius:6px}

/* ---- design board: cream in both themes ---- */
.board{background:var(--board);color:var(--boardInk);border:1px solid var(--boardLine);border-radius:var(--r)}
html[data-theme=light] .board{border-color:#c4b28c;box-shadow:0 1px 3px rgba(60,40,20,.12)}   /* PR 9: cream on a cream page needs a firmer edge */

/* ---- sheet (Settings, Back up, Restore) ---- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:min(760px,100%);max-height:88vh;transform:translate(-50%,105%);transition:transform .25s cubic-bezier(.2,.7,.2,1);z-index:71;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.on{transform:translate(-50%,0)}
#sheet .sh{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line)}
#sheet .sh h2{flex:1;font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
#sheetBody{overflow-y:auto;padding:14px 16px 22px}
#sheetBody section{margin:0 0 18px}
#sheetBody section h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
textarea.code{width:100%;min-height:120px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;resize:vertical}
.buerr{color:var(--crit);min-height:1.2em}

/* ---- toast ---- */
#toast{position:fixed;left:50%;width:max-content;text-align:center;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:80;max-width:calc(100% - 32px);padding:10px 14px;border-radius:10px;background:#1f1a15;color:#f2ebdd;border:1px solid var(--red);box-shadow:var(--shadow);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* PR 9: with a sheet open the toast drops in from the top, so it never sits over the sheet's buttons */
html.sheetOn #toast,html.helpOn #toast{top:calc(env(safe-area-inset-top,0px) + 12px);bottom:auto;transform:translate(-50%,-12px)}
html.sheetOn #toast.on,html.helpOn #toast.on{transform:translate(-50%,0)}
html[data-theme=light] #toast{background:#2a231c}

/* ---- "New version ready" bar (app/boot.js, PEW's pwa.js pattern) ---- */
#pwaBar{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);z-index:75;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 24px);padding:8px 8px 8px 14px;border-radius:10px;background:#1f1a15;color:#f2ebdd;border:1px solid var(--red);box-shadow:var(--shadow);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#pwaBar.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#pwaBar .btn{min-height:44px}
#pwaBar .pwalater{min-height:44px;min-width:44px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#b6ac9b;font-weight:500;cursor:pointer}

/* ---- help overlays (PR 9, app/help.js): a spotlight on the real control and a short card ---- */
#help{position:fixed;inset:0;z-index:60}
#help[hidden]{display:none}
#helpSpot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(10,8,6,.62);border:2px solid var(--gold);pointer-events:none;transition:all .25s ease}
#helpBox{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:440px;margin:0 auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);transition:top .25s ease,bottom .25s ease}
#helpBox h3{font-size:17px;margin:2px 0 4px}
#helpBox p{margin:0 0 10px;font-size:14.5px;line-height:1.45}
#helpBox .row{justify-content:flex-end}
#helpBox .clK{color:var(--gold)}

/* ---- Settings rows (PR 9) ---- */
.setS .setR{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:8px 0;border-top:1px solid var(--line)}
.setS .setR:first-of-type{border-top:0;padding-top:0}
.setL{display:flex;flex-direction:column;font-weight:600;min-width:0;flex:1 1 140px}
.setL .clMeta{font-weight:400}
.setS .row{margin-top:8px}

/* ---- share cards (PR 9, app/share.js) ---- */
.shBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- short screens: a phone on its side (PR 9). A slimmer header and a tab bar with the label beside the icon ---- */
@media (max-height:500px) and (orientation:landscape){
  :root{--tabh:44px;--hdr:40px}
  #hdr{padding-top:calc(env(safe-area-inset-top,0px) + 2px);padding-bottom:2px}
  #hdr .brand{font-size:20px}
  #hdr .when{flex-direction:row;gap:8px;align-items:baseline}
  #tabs button{flex-direction:row;gap:6px;font-size:12.5px}
  #tabs button svg{width:20px;height:20px}
  #panel{padding-top:10px}
  #sheet{max-height:94vh}
  #studioView{height:min(56vh,260px)}
}

/* ---- wide screens ---- */
@media (min-width:900px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* ---- accessibility preferences ---- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (prefers-reduced-transparency:reduce){#scrim{background:rgba(0,0,0,.8)}#studioView .cap{background:#0f0c09}#helpSpot{box-shadow:0 0 0 9999px rgba(10,8,6,.86)}}
html.noanim *,html.noanim *::before,html.noanim *::after{transition:none!important;animation:none!important}
/* ===================== Ink: the Design tab (PR 2) =====================
   The body diagram, the cream design board (cream with black ink in both themes; only the chrome around it follows the
   theme), the selected element's toolbar, the element drawer in the sheet, the docked capsule with live deltas and the
   aging strip, the stress report and the flash wall. Classes start with dz (board) or bm (body diagram).
   Touch targets are 44 px. The deltas use colour AND shape (▲ / ▼), so they read colour-blind. */
.dz{--dzUp:var(--ok);--dzDn:var(--crit);--dzNu:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dzSeg{display:flex;margin:0 0 12px}
.dzSeg button{flex:1;min-height:44px;font-size:14.5px;letter-spacing:.02em}
.dzTag{display:inline-block;font:600 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 8px;vertical-align:middle}
.dzFull{display:flex;flex-direction:column;gap:4px;width:100%;font-size:12.5px}
.dzFull select{width:100%;min-height:44px}
.dz .sp{flex:1}

/* ---- Body view ---- */
.dzClientHd{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.dzClientHd h2{margin:0}
.dzBodyCtl{margin:0 0 6px}
.dzBodyCtl .seg{display:flex}
.dzBodyCtl .seg button{flex:1;min-height:44px;padding:0 10px}
.dzFigCol .seg{display:flex;margin:0 0 4px}
.dzFigCol .seg button{flex:1;min-height:44px;padding:0 8px}
.dzCap.mini .dzAge,.dzCap.mini .dzCapT{display:none}
.dzCap.mini .dzMs{padding-right:0}
.dzTone{margin:0 0 6px}
.dzToneRow{display:flex;align-items:center;gap:10px}
.dzToneRow input{flex:1}
.dzToneChip{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--line)}
input[type=range]{min-height:44px;accent-color:var(--red);background:transparent}
.dzBodyGrid{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,1.1fr);gap:12px;align-items:start}
.dzFigWrap{background:radial-gradient(ellipse at 50% 40%,var(--panel2),transparent 70%);border-radius:var(--r);padding:4px 0}
.bm{display:block;width:100%;height:auto;max-height:62vh;margin:0 auto;-webkit-user-select:none;user-select:none}
.bmz{cursor:pointer;outline:none}
.bmz .f{fill:var(--red);fill-opacity:0;stroke:var(--red);stroke-opacity:0;stroke-width:1.2;transition:fill-opacity .15s}
.bmz .s{fill:none;stroke:var(--red);stroke-opacity:0;stroke-linecap:round;transition:stroke-opacity .15s}
.bmz:hover .f,.bmz:focus-visible .f{fill-opacity:.22;stroke-opacity:.6}
.bmz:hover .s,.bmz:focus-visible .s{stroke-opacity:.28}
.bmz.on .f{fill-opacity:.5;stroke-opacity:.9}
.bmz.on .s{stroke-opacity:.55}
.bmz:focus-visible .f,.bmz:focus-visible .s{stroke-dasharray:3 2}
.bmLbl{font:600 9px var(--ui);letter-spacing:.2em;fill:var(--mute)}
.dzSpot h3{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:4px 0 8px}
.dzSpot .kv{grid-template-columns:auto 1fr;gap:8px 10px;font-size:13.5px;align-items:start}
.dzSpot .kv dd small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.dzBar{display:block;height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.dzBar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red))}
.dzGo{width:100%;margin-top:10px}
.dzPlSel{margin-top:12px}

/* ---- Board view: the bars above the board ---- */
.dzBar1{display:flex;gap:8px;align-items:stretch;margin:0 0 8px}
.dzSpotBtn{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;min-height:48px;padding:4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer;text-align:left}
.dzSpotBtn b{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dzSpotBtn small{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dzSpotBtn:hover{border-color:var(--faint)}
.dzStyle select{min-height:48px;max-width:42vw}
.dzBar2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.dzBar2 .btn svg,.dzBar3 .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dzIb{border:1px solid var(--line);background:var(--panel)}
.dzIb:disabled{opacity:.35;cursor:default}
.dzIb:focus-visible,.dzChip:focus-visible,.dzSpotBtn:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.dzChip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-weight:600;font-size:13.5px;cursor:pointer}
.dzChip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.dzChip.on{color:var(--text);border-color:var(--teal);background:var(--panel2);background:color-mix(in srgb,var(--teal) 18%,var(--panel))}
.dzFlashTag{font:700 12px/1 var(--ui);letter-spacing:.04em;color:#fff8ef;background:var(--teal);border-radius:999px;padding:7px 10px}

/* ---- the board itself: cream, black ink, both themes ---- */
.dzBoardWrap{display:flex;justify-content:center;margin:0 0 10px}
.dzBoard{position:relative;padding:0;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(80,60,30,.08),0 2px 14px rgba(0,0,0,.25);max-width:100%}
html[data-theme=light] .dzBoard{box-shadow:inset 0 0 0 1px rgba(80,60,30,.08),0 2px 10px rgba(60,40,20,.12)}
.dzSvg{display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dzSvg:focus{outline:none}
.dzBg{fill:var(--board)}
.dzLimb{fill:#efe3cc;stroke:none}
.dzLimbE{fill:url(#dzLimbG);stroke:#c7b494;stroke-width:.6}
.dzRuler{stroke:#b39e7c;stroke-width:.4;fill:none}
.dzRulT,.dzFootT,.dzCreaseT{font-family:var(--ui);fill:#8c7655}
.dzFlow polyline{fill:none;stroke:#9b8058;stroke-opacity:.35;stroke-width:.5;stroke-dasharray:3 3;stroke-linecap:round}
.dzCrease{stroke:#b3432c;stroke-opacity:.65;stroke-width:.7;stroke-dasharray:2 2}
.dzCreaseT{fill:#a04a33;font-weight:600}
.dzFoot{fill:none;stroke:#8c7655;stroke-opacity:.5;stroke-width:.4;stroke-dasharray:1.5 1.5}
.dzFootT{font-weight:600}
.dzEmpty{font-family:var(--disp);fill:#6f5a3a;letter-spacing:.06em;text-transform:uppercase;stroke:#f3ead8;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}   /* PR 9: darker, with a cream halo so it reads over the ruler and flow lines */
.dzEmpty.sub{font-family:var(--ui);text-transform:none;letter-spacing:0}
.dzEl{cursor:grab;outline:none}
.dzEl .hit{fill:transparent}
.dzEl:focus-visible .hit{fill:rgba(63,143,134,.12)}
.dzSelR{fill:rgba(63,143,134,.06);stroke:#2f7f77}
.dzHdl{cursor:nwse-resize}
.dzHdl .hit{fill:transparent}
.dzHdl .dot{fill:#fffaf1;stroke:#2f7f77}
.dzHdl .arr{stroke:#2f7f77;stroke-linecap:round}

/* ---- the toolbar under the board ---- */
.dzTools{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:0 0 10px}
.dzToolHint{margin:4px 0;color:var(--mute);font-size:13.5px}
.dzToolHint.sm{font-size:12.5px;margin:6px 0 0}
.dzToolHd{display:flex;align-items:center;gap:8px;margin:-4px 0 6px}
.dzToolHd b{font-size:15px}
.dzToolHd span{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.dzToolHd span.bad{color:var(--crit)}
.dzToolHd em{font-style:normal}
.dzDel{color:var(--crit)}
.dzToolRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dzStep{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden}
.dzStep button{flex:0 0 44px;min-height:44px;border:0;background:transparent;color:var(--text);font-size:20px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dzStep button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dzStep button:hover{background:var(--line)}
.dzStep button:focus-visible{outline:2px solid var(--red2);outline-offset:-2px}
.dzStep span{flex:1;text-align:center;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.dzFillL{flex-direction:row;align-items:center;gap:10px;margin-top:6px;font-size:13px}
.dzFillL input{flex:1}
.dzFillL span{min-width:3.2em;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.dzSws{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dzSw{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:44px;min-height:44px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer}
.dzSw i{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.dzSw.on{border-color:var(--text);box-shadow:inset 0 0 0 2px var(--text)}
.dzSw.weak i{opacity:.35;background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(0,0,0,.45) 3px 4px)!important}
.dzSw small{font-size:9.5px;line-height:1;color:var(--warn);font-weight:700;white-space:nowrap}
.dzSw:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.dzBar3{margin:0 0 12px}

/* ---- the docked capsule ---- */
.dzCap{position:sticky;bottom:0;z-index:5;margin:12px 0 0;padding:8px 8px 6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.dzMs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.5fr);gap:2px;padding-right:34px}
.dzM{display:flex;flex-direction:column;align-items:center;min-width:0;padding:2px 0}
.dzM .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.dzM b{font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.dzM.money b{font-size:15px}
.dzM.meh b{color:var(--warn)}
.dzM.bad b{color:var(--crit)}
.dzM .d{min-height:15px;font-size:11.5px;font-weight:700;line-height:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dzM .d.up{color:var(--dzUp)}
.dzM .d.dn{color:var(--dzDn)}
.dzM .d.nu{color:var(--dzNu)}
.dzCapT{position:absolute;top:6px;right:6px;width:32px;height:44px;border:0;border-radius:8px;background:transparent;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dzCapT svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.dzCap.shut .dzCapT svg{transform:rotate(180deg)}
.dzCap.shut .dzAge{display:none}
.dzAge{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.dzAgeL{flex:0 0 auto;width:46px;font-size:10px;line-height:1.2;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.dzAgeNone{font-size:12.5px;color:var(--mute)}
.dzAgeF{flex:1;margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dzAgeI{width:44px;height:44px;border-radius:8px;background:var(--board);border:1px solid var(--boardLine);overflow:hidden}
.dzAgeI svg{width:44px;height:44px;display:block}
.dzAgeF figcaption{font-size:11px;line-height:1.1;color:var(--mute);white-space:nowrap}
.dzAgeF figcaption b{font-size:13px;font-variant-numeric:tabular-nums}
.dzAgeF b.ok{color:var(--text)}
.dzAgeF b.meh{color:var(--warn)}
.dzAgeF b.bad{color:var(--crit)}

/* ---- the stress report ---- */
.dzStress h2{margin-bottom:2px}
.dzSub{margin:0 0 8px;color:var(--mute);font-size:13px}
.dzSub b{color:var(--text);font-variant-numeric:tabular-nums}
.dzSt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dzSt li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35;padding:8px 10px;border-radius:10px;background:var(--panel2)}
.dzSt .ic{flex:0 0 22px;height:22px;margin-top:-1px}
.dzSt .ic svg{width:22px;height:22px;display:block}
.dzSt .sev3{box-shadow:inset 3px 0 0 var(--crit)}
.dzSt .sev3 .ic{color:var(--crit)}
.dzSt .sev2{box-shadow:inset 3px 0 0 var(--warn)}
.dzSt .sev2 .ic{color:var(--warn)}
.dzSt .sev1 .ic{color:var(--mute)}
.dzOk{display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--ok);font-weight:600}
.dzOk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---- the drawer (in the sheet) ---- */
.dzDrF{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.dzDrF select{width:100%;min-height:44px}
.dzDrFam{overflow-x:auto;margin:0 0 8px;-webkit-overflow-scrolling:touch}
.dzDrFam .seg button{min-height:44px;padding:0 12px;white-space:nowrap}
.dzSand{flex-direction:row;align-items:center;gap:10px;min-height:44px;font-size:13px;color:var(--mute);cursor:pointer}
.dzSand input{width:22px;height:22px;accent-color:var(--red)}
.dzDrG{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:6px}
.dzTile{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;padding:8px 6px;border:1px solid var(--boardLine);border-radius:10px;background:var(--board);color:var(--boardInk);cursor:pointer;text-align:center}
.dzTile svg{width:56px;height:56px}
.dzTile b{font-size:12.5px;line-height:1.2}
.dzTile small{display:flex;align-items:center;gap:3px;font-size:10.5px;color:#7c6a50;line-height:1.2}
.dzTile small svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2}
.dzTile:hover{border-color:#a99470}
.dzTile:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.dzTile.lock{opacity:.5;filter:grayscale(1)}

/* ---- the flash wall ---- */
.dzFlHd h2{display:flex;align-items:center;gap:8px}
.dzFls{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin:0 0 14px}
.dzFl{display:flex;gap:12px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.dzFlArt{flex:0 0 96px;height:96px;display:flex;align-items:center;justify-content:center;background:var(--board);border-radius:10px}
.dzFlArt svg{width:88px;height:88px}
.dzFlTx{flex:1;min-width:0}
.dzFlTx h3{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.dzFlTx .hint{margin:4px 0;font-size:12.5px}
.dzFlMeta{margin:2px 0;color:var(--mute);font-size:12px}
.dzFlNum{display:flex;gap:10px;margin:4px 0 8px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.dzFlNum span+span::before{content:"·";margin-right:10px;color:var(--faint)}

/* ---- narrow phones and landscape ---- */
@media (max-width:420px){
  .dzBodyGrid{grid-template-columns:1fr 1fr;gap:8px}
  .dzToolRow{gap:4px}
  .dzStep button{flex-basis:40px}
  .dzM .l{font-size:9.5px;letter-spacing:.03em}
  .dzM b{font-size:15.5px}
  .dzM.money b{font-size:13.5px}
  .dzAgeL{width:38px;font-size:9px}
}
@media (max-width:360px){.dzStep span{font-size:11px}.dzAgeL{display:none}}
@media (orientation:landscape) and (max-height:560px){
  .dzCap{position:relative}
  .bm{max-height:80vh}
}
@media (prefers-reduced-motion:reduce){.bmz .f,.bmz .s,.dzCapT svg{transition:none}}
/* ===================== css/ui-clients.css: the Clients and Career tabs (PR 3) =====================
   This week's cards, the consult chat, the client list and card, the board's booking bar, the Next button. */
.cl>.seg{margin:0 0 12px}
.clH{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.clQs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.clQ{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:var(--r);padding:12px 14px}
.clQ.consult{border-left-color:var(--gold)}
.clQ.ses{border-left-color:var(--red);border-left-style:double;border-left-width:6px}
.clQ header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.clQ h3{margin:0;font-size:16px}
.clK{display:block;width:100%;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.clMeta{font-size:12.5px;color:var(--mute)}
.clQ blockquote{margin:8px 0;padding:0 0 0 10px;border-left:2px solid var(--line);font-size:14px;line-height:1.45}
.clQ p{margin:6px 0}
.clAsk{font-size:13.5px;font-weight:600;margin:6px 0}
.clDz{font-size:13.5px;font-weight:600}
.clDz.todo{color:var(--warn)}.clDz.ok{color:var(--ok)}
.clSum{padding:10px 14px}
.clSum dl,.crLast dl{margin:0}
.clLater{padding:6px 14px}
.clRow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.clRow:last-child{border-bottom:0}
.clRow .btn{margin-left:auto}
.clChips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.clChip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.clChip.must{border-color:var(--teal)}.clChip.must::before{content:"+ ";color:var(--teal)}
.clChip.deal{border-color:var(--crit)}.clChip.deal::before{content:"× ";color:var(--crit)}
.clLoy{display:inline-block;width:64px;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden;vertical-align:middle;
  background-image:linear-gradient(90deg,transparent 24%,var(--line) 24% 26%,transparent 26% 49%,var(--line) 49% 51%,transparent 51% 74%,var(--line) 74% 76%,transparent 76%)}
.clLoy i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
/* the consult */
.clConHd{margin-bottom:10px}
.clConT{display:flex;gap:10px;align-items:flex-start}
.clConT h2{margin:0}
.clConT p{margin:2px 0 0}
.clQuote{margin:8px 0 0;font-size:14px}
.clChat{display:flex;flex-direction:column;gap:8px;padding:4px 2px 12px}
.clB{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.45;background:var(--panel);border:1px solid var(--line)}
.clB.client{align-self:flex-start;border-bottom-left-radius:4px}
.clB.artist{align-self:flex-end;border-bottom-right-radius:4px;background:var(--panel2);border-color:var(--faint)}
.clBw{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.clNote{align-self:center;margin:2px 0;font-size:12px;color:var(--mute);text-align:center}
.clOpts{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.clOpt{justify-content:flex-start;text-align:left;padding:10px 14px;line-height:1.35;height:auto}
.clOpt.k-talk{border-color:var(--gold)}
.clOpt.k-quote{border-color:var(--teal)}
.clOpt.k-talk::before{content:"!";font-weight:800;color:var(--gold);margin-right:4px}
.clOpt.k-quote::before{content:"₽";font-weight:800;color:var(--teal);margin-right:4px}
.clEnd.accepted{border-color:var(--ok)}.clEnd.walked{border-color:var(--crit)}
/* the list and the client card */
.clFil .row{margin-bottom:8px}
.clSearch input{width:100%;box-sizing:border-box;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
.clLis{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.clLi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;cursor:pointer}
.clLi:hover{border-color:var(--faint)}.clLi:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.clLiN,.clLiR{display:flex;flex-direction:column;gap:3px}
.clLiR{align-items:flex-end;text-align:right}
.clPcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.clPc{margin:0;display:flex;flex-direction:column;gap:6px}
.clPcA{height:110px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--board)}
.clPcA svg{width:92px;height:92px}
.clPc figcaption{display:flex;flex-direction:column;gap:2px;font-size:13px}
.clPc b.ok{color:var(--ok)}.clPc b.meh{color:var(--warn)}.clPc b.bad{color:var(--crit)}
.clHist{list-style:none;margin:0;padding:0;font-size:13.5px}
.clHist li{padding:6px 0;border-bottom:1px solid var(--line)}
/* the board's booking bar */
.clBk{border-left:4px solid var(--red);padding:10px 14px}
.clBkT{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.clBk .clK{width:auto}
.clBk .row{margin-top:6px}
/* the Career tab */
.crWhen{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.crWhen b{font-family:var(--disp);font-size:28px;font-weight:600;letter-spacing:.03em}
.crBtn{width:100%;min-height:56px;font-size:18px;letter-spacing:.04em}
.crBtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.crBtn.arm{background:var(--gold);border-color:var(--gold);color:#1c1813}
.crWarn{margin:8px 0 0;font-size:13px;color:var(--warn);text-align:center}
.crLast p{margin:4px 0 8px}
.crLog,.crLines{list-style:none;margin:0;padding:0;font-size:13.5px}
.crLog li,.crLines li{padding:6px 0;border-bottom:1px solid var(--line)}
.crLog li:last-child,.crLines li:last-child{border-bottom:0}
.crK{display:inline-block;min-width:84px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.crLog .k-referral .crK,.crLog .k-return .crK{color:var(--teal)}
.crLog .k-left .crK,.crLog .k-gaveup .crK{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.clB{transition:none}}
/* ===================== Ink: the Session tab and the Studio kit panel (PR 4) =====================
   The chair (.se): the top card with the client and the pain/fatigue meters (bars with notches, a hatch or dot pattern and
   an icon, so they read without colour), the stage (the care rail on the free hand's side and the four stacked canvases),
   the steady-hand gauge, the zone meter, liner chips and the results card. The kit panel (.kp): the summary and option
   rows with ▲/▼ deltas. Light theme overrides and reduced motion at the bottom. Skin is skin in both themes. */
.se .clK{display:block}
.seTop{padding:10px 12px}
.seTopT{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.seTopT .clK{width:100%}
.seTopT b{font-size:16px}
.seProg{margin-left:auto;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.seMeters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seMeter{display:grid;grid-template-columns:18px auto 1fr auto;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);position:relative}
.seMI svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;display:block}
.seMeter.pain .seMI{color:var(--red2)}
.seMeter.fatigue .seMI{color:var(--teal)}
.seMB{position:relative;height:12px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.seMB i{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;transition:width .15s}
.seMeter.pain .seMB i{background:repeating-linear-gradient(135deg,var(--red) 0 4px,var(--red2) 4px 7px)}
.seMeter.fatigue .seMB i{background:radial-gradient(circle,rgba(255,255,255,.35) 1.2px,transparent 1.6px) 0 0/6px 6px,var(--teal)}
.seMB s{position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(25% - 1px),var(--bg) calc(25% - 1px) 25%,transparent 25% calc(50% - 1px),var(--bg) calc(50% - 1px) 50%,transparent 50% calc(75% - 1px),var(--bg) calc(75% - 1px) 75%,transparent 75%);opacity:.7}
.seMV{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right;color:var(--text);font-weight:600}
.seWarn{display:none;position:absolute;right:-2px;top:-9px;width:16px;height:14px;font-size:10px;font-weight:800;line-height:15px;text-align:center;color:#fff;background:var(--crit);clip-path:polygon(50% 0,100% 100%,0 100%)}
.seMeter.hi .seWarn{display:block}
.seMeter.hi .seMV{color:var(--crit)}

/* the stage: rail on the free hand's side */
.seStage{display:flex;gap:8px;align-items:stretch;margin:0 0 8px}
.se[data-hand="left"] .seStage{flex-direction:row-reverse}
.seRail{flex:0 0 52px;display:flex;flex-direction:column;gap:6px}
.seAct{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:58px;padding:4px 2px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:11px;font-weight:600;cursor:pointer}
.seAct svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seAct em{font-style:normal;font-size:9.5px;color:var(--mute);font-weight:500}
.seAct:hover{border-color:var(--faint)}
.seAct:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
#seStop{margin-top:auto;color:var(--red2)}
.seWrap{position:relative;flex:1 1 auto;min-width:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#d9a982;touch-action:none;-webkit-user-select:none;user-select:none}
.seWrap canvas{position:absolute;left:0;top:0;display:block}
#seOver{touch-action:none;cursor:crosshair}
.seDot{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;border:3px solid #2f7f77;background:rgba(47,127,119,.25);pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.seDot::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(47,127,119,.6);animation:sePulse 1.4s ease-out infinite}
.seDot.still::after{animation:none;border-style:dashed}
.seDot.nudge{animation:seNudge .35s}
@keyframes sePulse{from{transform:scale(.6);opacity:1}to{transform:scale(1.3);opacity:0}}
@keyframes seNudge{0%,100%{margin-left:0}25%{margin-left:-5px}75%{margin-left:5px}}

/* under the stage: gauge, status, tools */
.seUnder{display:flex;flex-direction:column;gap:6px}
.seGauge,.seZone{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.seGL{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.seGT,.seZT{position:relative;height:18px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.seGT .band{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(111,191,138,.35);border:1.5px solid var(--ok)}
.seGT .rush{position:absolute;top:0;bottom:0;right:0;border-radius:0 9px 9px 0;background:repeating-linear-gradient(135deg,rgba(224,87,79,.45) 0 3px,transparent 3px 7px)}
.seGT i{position:absolute;top:-5px;width:0;height:0;margin-left:-7px;border:7px solid transparent;border-top:10px solid var(--text);border-bottom:0;transition:left .06s linear}
.seGT i::after{content:"";position:absolute;left:-1px;top:-1px;width:2px;height:22px;background:var(--text)}
.seGT i.rush{border-top-color:var(--crit)}
.seGT i.rush::after{background:var(--crit)}
.seZT{overflow:visible}
.seZT i{position:absolute;left:0;top:0;bottom:0;border-radius:9px 0 0 9px;opacity:.9}
.seZT .tgt{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--text);border-radius:2px}
.seZT .over{position:absolute;top:0;bottom:0;right:0;border-radius:0 9px 9px 0;background:repeating-linear-gradient(135deg,rgba(224,87,79,.45) 0 3px,transparent 3px 7px)}
.seStatus{margin:0;min-height:1.4em;font-size:13.5px;color:var(--text)}
.seTools .row{gap:10px}
.seLiners{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seChipL{flex:0 0 auto;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:6px;align-items:center;min-height:44px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;text-align:left}
.seChipL svg{grid-row:1/3;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seChipL b{font-size:13.5px}
.seChipL span{font-size:11px;color:var(--mute)}
.seChipL.on{border-color:var(--red);box-shadow:inset 0 -3px 0 var(--red);background:var(--panel2)}
.seChipL.hint{border-style:dashed;border-color:var(--gold)}
.seChipL:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.seLw{margin:0;font-size:12.5px;color:var(--mute)}
.seLw.bad{color:var(--warn)}
.seLw.ok span{color:var(--ok)}

/* placement */
.sePlaceWrap{display:flex;justify-content:center;background:var(--panel2);border-radius:10px;padding:8px;margin:6px 0 8px}
.sePlace{width:100%;max-height:min(52vh,460px);touch-action:none;cursor:grab}
.sePlace3d{position:relative;height:min(52vh,420px);border-radius:10px;overflow:hidden;background:#0f0c09;margin:6px 0 8px;border:1px solid var(--line)}
.sePlace3d canvas{display:block;width:100%;height:100%;cursor:grab}
.seRot{margin:0 0 8px}
.seFlow polyline{fill:none;stroke:rgba(60,40,20,.28);stroke-width:.6;stroke-dasharray:2 2}
.seCrease{stroke:rgba(150,40,30,.6);stroke-width:.7;stroke-dasharray:3 2}
.seCreaseT{fill:rgba(120,30,20,.75);font-family:var(--ui)}
.seChk{margin:0 0 8px}
.seChkFlow{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--panel2);margin-bottom:4px}
.seIss{margin:3px 0;font-size:13.5px}
.seIss.crit span{color:var(--crit)}
.seIss.warn span,.seIss.minor span{color:var(--warn)}
.seIss.ok span{color:var(--ok)}

/* lobby and results */
.seDue{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.seDue:first-of-type{border-top:0}
.seDueT{flex:1;display:flex;flex-direction:column;min-width:0}
.seGrow{flex:1 1 180px}
.seGrow select{width:100%}
.seKitLine{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.seKitLine p{margin:0;flex:1 1 200px;font-size:13.5px}
.seNextB,.seResB{display:flex;gap:12px;align-items:flex-start}
.seRen{flex:0 0 auto;width:112px;height:112px;border-radius:10px;border:1px solid var(--line)}
.seNextB p{margin:0 0 4px}
.seResMsg{color:var(--warn);font-weight:600;margin:4px 0}
.seRes .kv{flex:1;font-size:13.5px}
.seRes .kv .hint{display:block;font-size:11.5px;margin:0}
.seRes .clChips{margin:10px 0 4px}

/* the kit panel */
.kpSum{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin:4px 0 12px}
.kpSum div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}
.kpSum span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.kpSum b{font-size:16px;font-variant-numeric:tabular-nums}
.kpSum em{font-style:normal;font-size:11px;color:var(--mute)}
.kp .seg{margin-bottom:10px;display:flex}
.kp .seg button{flex:1;padding:0 6px}
.kpRow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.kpRow:first-child{border-top:0}
.kpRow.on .kpRT b::after{content:" ✓";color:var(--ok)}
.kpRT{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kpRT .hint{margin:0;font-size:12.5px}
.kpRB{flex:0 0 auto}
.kpUse{font-size:12.5px;font-weight:700;color:var(--ok)}
.kpDs{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.kpD{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.kpD.up{color:var(--ok);border-color:currentColor}
.kpD.dn{color:var(--crit);border-color:currentColor;border-style:dashed}
.kpD.n{color:var(--mute)}
.kpSl{display:flex;flex-direction:column;gap:4px;width:100%;font-size:13px;color:var(--text);margin-top:4px}
.kpSl span{display:flex;justify-content:space-between}
.kpSl input{width:100%;accent-color:var(--red);min-height:32px}
.kpVs{margin:10px 0 0;font-size:12.5px;color:var(--mute)}
#kpReset{margin-top:10px}

@media (max-width:380px){.seMeters{grid-template-columns:1fr}.seRen{width:88px;height:88px}}
@media (prefers-reduced-motion:reduce){.seDot::after{animation:none;border-style:dashed}.seGT i,.seMB i{transition:none}}
html[data-theme=light] .seMB s{opacity:.9}
html[data-theme=light] .seGT .band{background:rgba(47,138,82,.18)}
html[data-theme=light] .seMeter.fatigue .seMB i{background:radial-gradient(circle,rgba(255,255,255,.5) 1.2px,transparent 1.6px) 0 0/6px 6px,var(--teal)}
/* ===================== css/ui-gallery.css: the heal reveal, the body of work, reputation (PR 5) =====================
   The reveal card on the Career tab (verdict, fresh against healed with the stencil ghost, reaction, review, portfolio),
   the Work view on the Clients tab (filters, the grid of pieces as they look today), a piece's history in the sheet,
   and the reputation bars on the Career card. Heal grades always carry a shape and a word, never colour alone. */
/* heal grades: shape + word */
.gvShape{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.gvShape .f{fill:currentColor;stroke:none}
.g-crisp{--g:var(--ok)}.g-soft{--g:var(--teal)}.g-patchy{--g:var(--warn)}.g-blownout{--g:var(--crit)}.g-infected{--g:var(--crit)}.g-none{--g:var(--mute)}.g-port{--g:var(--gold)}
.gvShape[class*="g-"]{color:var(--g)}
.gvGrade{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:3px 9px 3px 6px;border-radius:999px;border:1px solid var(--g);color:var(--text);background:var(--panel2)}
.gvGrade .gvShape{width:16px;height:16px;color:var(--g)}
/* skin renders */
.gvSvg{display:block;width:100%;height:100%;border-radius:8px}

/* ---- the reveal ---- */
.rv{border-color:var(--g);border-width:1px 1px 1px 5px;animation:rvIn .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rvIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rvHd h2{margin:2px 0}
.rvVerdict{display:flex;gap:12px;align-items:center;margin:10px 0 12px;padding:10px 12px;border-radius:10px;border:1px solid var(--g);background:var(--panel2)}
.rvVerdict .gvShape.big{width:40px;height:40px;stroke-width:1.8}
.rvBig{font-family:var(--disp);font-size:26px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1;color:var(--g)}
.rvVerdict p{margin:4px 0 0;font-size:14px;color:var(--mute);line-height:1.4}
.rvPair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rvPair figure{margin:0;display:flex;flex-direction:column;gap:6px}
.rvPair figcaption{font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.rvFrame{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
/* the bandage comes off: a gauze pad that peels away once (none with reduced motion) */
.rvFrame.heal::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#f6f1e6 0 6px,#ece4d4 6px 12px);border-radius:10px;
  transform-origin:100% 0;animation:rvPeel .8s .25s cubic-bezier(.5,0,.3,1) forwards;pointer-events:none}
@keyframes rvPeel{0%{transform:none;opacity:1}70%{opacity:1}100%{transform:translate(40%,-40%) rotate(18deg) scale(.6);opacity:0}}
html.noanim .rvFrame.heal::after{display:none}
@media (prefers-reduced-motion:reduce){.rvFrame.heal::after{display:none}}
.rvKey{display:inline-flex;align-items:center;gap:4px}
.rvKey i{display:inline-block;width:16px;height:0;border-top:2px dashed #7b52ea}
html[data-theme=dark] .rvKey i{border-top-color:#a98bff}
.rvScene{display:flex;flex-direction:column;margin:10px 0 0}
.rvScene .clB{max-width:92%}
.rvNote{margin:8px 0 0;font-size:13.5px;font-weight:600;color:var(--crit)}
.rvRev{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.rvRev blockquote{margin:4px 0 0;font-size:14px;line-height:1.45;font-style:italic}
.rvStars{font-size:16px;letter-spacing:2px;color:var(--gold)}.rvStars span{color:var(--faint)}
.rvAsk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rvAsk p{margin:0 0 8px}
.rvAsk .btn{flex:1 1 140px}

/* ---- the body of work ---- */
.gvFil{padding:12px 14px}
.gvSel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.gvSel select{width:100%}
.gvFil .row{flex-wrap:nowrap}
.gvQ{flex:1 1 auto;min-width:0}
.gvPortB{flex:0 0 auto;min-height:44px}
.gvPortB svg,.gvPort svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.gvPortB.on{border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.gvPortB.on svg{fill:var(--gold);stroke:var(--gold)}
.gvCount{margin:8px 0 0}
.gvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.gvT{display:flex;flex-direction:column;gap:0;padding:0;text-align:left;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;cursor:pointer;overflow:hidden;content-visibility:auto;contain-intrinsic-size:150px 220px}
.gvT:hover{border-color:var(--faint)}.gvT:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.gvT.port{border-color:var(--gold)}
.gvA{position:relative;display:block;aspect-ratio:1/1;padding:8px;background:var(--panel2)}
.gvA .gvSvg{border-radius:8px}
.gvPort{position:absolute;top:12px;right:12px;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#1f1a15;color:var(--gold);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.gvPort svg{fill:var(--gold);stroke:var(--gold)}
.gvL{display:flex;flex-direction:column;gap:2px;padding:8px 10px 10px;font-size:13.5px}
.gvL b{font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gvM{display:flex;align-items:center;gap:5px}
.gvM .gvShape{width:15px;height:15px}
.gvR.ok{color:var(--ok)}.gvR.meh{color:var(--warn)}.gvR.bad{color:var(--crit)}
/* a piece's history */
.gvHead{display:flex;gap:14px;align-items:flex-start}
.gvBigA{flex:0 0 auto;width:132px;height:132px}
.gvHead p{margin:0 0 6px}
.gvName{font-weight:700;font-size:15px}
.gvStrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.gvStrip figure{margin:0;display:flex;flex-direction:column;gap:4px}
.gvStrip .gvSvg{aspect-ratio:1/1;height:auto}
.gvStrip figcaption{font-size:12px;color:var(--mute);line-height:1.3}
.clPc[data-gp]{cursor:pointer}
.clPc[data-gp]:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:10px}

/* ---- reputation on the Career card ---- */
.crRepH{margin:14px 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.crRep{display:flex;flex-direction:column;gap:10px}
.crRepR{display:grid;grid-template-columns:minmax(0,1fr) 96px 36px;grid-template-areas:"n b v" "x x x";gap:2px 10px;align-items:center}
.crRepN{grid-area:n;display:flex;flex-direction:column;line-height:1.2}
.crRepB{grid-area:b;height:10px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden;
  background-image:linear-gradient(90deg,transparent 24%,var(--line) 24% 26%,transparent 26% 49%,var(--line) 49% 51%,transparent 51% 74%,var(--line) 74% 76%,transparent 76%)}
.crRepB i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.crRepV{grid-area:v;text-align:right;font-variant-numeric:tabular-nums}
.crRepX{grid-area:x}
@media (max-width:380px){.gvGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.gvBigA{width:104px;height:104px}}
@media (prefers-reduced-transparency:reduce){.gvPort{box-shadow:none}}
/* ===================== ui-career.css: the career, the shop, scenes, slots (PR 7) =====================
   The act card on the Career tab (Arkady's word, the one-line goal, the step list, chores), invitations, money and
   skills; the shop cards on the Studio tab (build-out levels, artists); the shop-closed scene and the Legacy screen;
   the save slots and the New career sheet. Theme tokens only, so the light theme follows; no motion. */
.caSay{margin:8px 0 10px;padding:10px 12px;border-left:3px solid var(--gold);background:var(--panel2);border-radius:0 10px 10px 0;font-size:15px;font-style:italic}
.caSay cite{display:block;margin-top:4px;font-style:normal;font-size:12.5px;color:var(--mute)}
.caSay cite::before{content:"— "}
.caGoal{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--red);border-radius:10px;margin:0 0 10px}
.caGoal b{font-size:15.5px}
.caSteps{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--mute)}
.caSteps li{display:flex;gap:8px;align-items:baseline}
.caSteps li::before{content:"";flex:0 0 auto;width:9px;height:9px;border:1.5px solid var(--faint);border-radius:50%;transform:translateY(1px)}
.caSteps li.done{color:var(--mute);text-decoration:line-through}
.caSteps li.done::before{background:var(--ok);border-color:var(--ok)}
.caSteps li.now{color:var(--text);font-weight:600}
.caSteps li.now::before{border-color:var(--red);background:var(--red)}
.caRow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.caBar{min-width:80px}
.caChores{display:flex;flex-wrap:wrap;gap:6px}
.caChores .btn{flex:1 1 calc(50% - 6px);min-height:44px;text-align:left;justify-content:flex-start}
.caNeed{list-style:none;margin:4px 0;padding:0;font-size:14px;display:flex;flex-direction:column;gap:3px;color:var(--mute)}
.caNeed li.ok{color:var(--ok)}
.caLater{font-style:italic}
.caProj{display:flex;flex-direction:column;gap:8px}
.caPr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.caPr .clMeta{grid-column:1}
.caPr .btn,.caPr .ok{grid-column:2;grid-row:1/span 2}
.caPast{margin:4px 0;padding-left:18px;font-size:14px}
.caInvR{padding:10px 0;border-top:1px solid var(--line)}
.caInvR:first-of-type{border-top:0;padding-top:0}
.caInvR p{margin:0 0 8px}
.caMoney .kv dd.in{color:var(--ok)}
.caMoney .kv dd.out{color:var(--mute)}
.caSkL{display:flex;flex-direction:column;gap:8px}
.caSkR{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:10px;align-items:center}
.caSkR>span:first-child{display:flex;flex-direction:column;min-width:0}
.caPr .ok,.shB .ok{color:var(--ok)}.shS .warn{color:var(--warn)}.caAct .crit{color:var(--crit)}

/* ---- the shop (Studio tab) ---- */
.shBs{display:flex;flex-direction:column}
.shB{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.shB:first-child{border-top:0;padding-top:0}
.shBN{display:flex;flex-direction:column;gap:2px;min-width:0}
.shLv{display:flex;gap:4px;margin-top:2px}
.shLv i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.shLv i.on{background:var(--gold)}

   INK_SIM holds design scoring, the aging model, client logic, the calendar and the economy. It never touches the DOM
   or three.js, and it runs in plain node (tools/sim-test.js cuts src/sim/*.js out and runs them). The sim files are one
   IIFE spread over src/sim/: this file opens it (SIM is the object every file adds to) and sim/market.js closes it.
   rng.js: the seeded random number generator. ALL randomness in the sim goes through INK_SIM.rng; no bare Math.random()
   anywhere in src/sim/.
     const r=SIM.rng(seed)      a generator (mulberry32). r() or r.next() -> [0,1)
     r.range(a,b) r.int(a,b) (inclusive) r.chance(p) r.pick(list) r.weighted(list, w=>weight) r.shuffle(list) r.normal(mean,sd)
     r.fork(label)              a new, independent generator seeded from this seed + a label, so adding a draw in one system
                                never shifts the numbers in another (e.g. SIM.rng(S.seed).fork("walkins:"+week))
     SIM.hash(str)              32-bit FNV-1a of a string, for stable per-thing seeds */
const INK_SIM=(function(){"use strict";
const SIM={};
function hash(str){let h=2166136261;str=String(str);for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}

  const base=(seed>>>0)||0x9e3779b9;let a=base;
  const next=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
  const r=()=>next();
  r.next=next;
  r.range=(lo,hi)=>lo+(hi-lo)*next();
  r.int=(lo,hi)=>lo+Math.floor(next()*(hi-lo+1));
  r.chance=p=>next()<p;
  r.pick=list=>list[Math.floor(next()*list.length)];
  r.weighted=(list,wf)=>{let tot=0;const ws=list.map(x=>{const w=Math.max(0,+wf(x)||0);tot+=w;return w;});if(!tot)return list[0];let t=next()*tot;for(let i=0;i<list.length;i++){t-=ws[i];if(t<0)return list[i];}return list[list.length-1];};

/* build the left and right versions of a paired zone (the right side mirrors x and the flow angle) */
function plPair(b){
  const out={};
  for(const side of ["l","r"]){
    const m=side==="r";
    const flow=b.flow.map(line=>line.map(p=>[m?+(1-p[0]).toFixed(3):p[0],p[1]]));
    const creases=b.creases.map(c=>Object.assign({},c));
    out[b.id+"_"+side]=Object.assign({},b,{id:b.id+"_"+side,name:(side==="l"?"left ":"right ")+b.name,side,island:ISLANDS.indexOf(b.island+"_"+side)>=0?b.island+"_"+side:b.island,
      flowDeg:m?-b.flowDeg:b.flowDeg,flow,creases,crease:creases[0]||null});
  }
  return out;
}
const PLACEMENTS={};

function placementBox(placementId,bodyShape){
  const p=PLACEMENTS[placementId];if(!p)return null;
  const sh=BODY_SHAPES[bodyShape]||BODY_SHAPES.neutral;
  return{wrapMm:Math.round(p.wrapMm*(sh.wrap[p.region]||1)),lengthMm:p.lengthMm};
}

/* ===== sim/design.js: design scoring: scoreDesign(design, client, skills), the stress report from COMBOS (PR 1) =====
   Scores a design on the board before it goes on skin. Every number that tunes it is in a named table at the top.
     SIM.scoreDesign(design, client, skills, opts) -> {readability, flow, balance, coherence, fit, total,
                                                       agePrediction:{5,10,20}, hours, sessions, price, stress:[{id,sev,text}]}
   How it thinks (see docs/SIM-CONTRACT.md for the shapes):
   - readability: is each element big enough (minSizeMm at its real size, scale*sizeMm), are the gaps between its strokes
     wider than its lines (LINE_MM), does its colour show on this client's skin (SKIN_CONTRAST), is the piece crowded.
     The same function re-scores an aged piece: aging.js widens the lines and fades the ink, and the gaps close up.
   - flow: does each element run with the placement's flow lines, is the piece wider than the wrap or longer than the box
     (after the body-shape scale), does it cross a joint crease.
   - balance: visual weight (area x (fill + line) x darkness) around the centre of the piece's footprint.
   - coherence: elements from other styles clash unless the style lists them in blendsWith; wildly different line weights
     fight; lines outside the style's range and colours outside its palette cost a little.
   - fit: the client's wants (style weights, size range, tags, colour appetite), must-haves (each missing one costs a lot),
     dealbreakers (one hit crushes it), a hard-to-hide spot for a job that needs cover, a painful spot for a low tolerance.
   - hours from the inked area and its detail (HOURS), sessions from hours and the spot's pain (SESSION_HOURS),
     price = hours x rate x repMult x SIM.priceIndex(year). Money is rubles (RATE_DEFAULT is a 2000 rate).
   Element geometry: an element's long side is scale*sizeMm; its short side and its natural long axis come from the
   bounding box of its SVG path (dzShape), or from its family when it has none (FAMILY_SHAPE: lettering is wide and reads
   across, motifs stand upright). rot is clockwise degrees, like CSS. Elements tagged band/armband/wrap are meant to
   go round the limb, so the piece is not marked down for being wider than the wrap.
   An optional design.pos {x,y} (0..1 in the placement box) says where the piece's centre sits; default the middle.
   client.traits.pain is read as pain TOLERANCE (1 = sits like a rock, 0 = can't sit still).
   Private helpers start with dz. Nothing here is random: the same design always scores the same. ===== */

/* line width on skin (mm) for each liner grouping in LINE_WEIGHTS */
const LINE_MM={1:0.3,3:0.5,5:0.75,7:0.95,9:1.15,11:1.35,14:1.7};
/* the rough shape of each element family: aspect = short side / long side, ink = share of its box that is inked,
   axis = its natural long axis (0 = upright, 90 = reads across), elong = how much its rotation matters for flow */

  motif:{aspect:0.8,ink:0.6,axis:0,elong:0.55},
  lettering:{aspect:0.3,ink:0.35,axis:90,elong:0.6},

  fill:{aspect:1,ink:0.85,axis:0,elong:0.15},
  texture:{aspect:1,ink:0.7,axis:0,elong:0.15}

const ROUND_TAGS={mandala:1,radial:1,round:1,circle:1,dot:1,dotwork:1};
/* tags that mark an element meant to wrap round the limb (an armband): it should run ACROSS the flow, and the piece is
   not marked down for being wider than the wrap */

/* readability knobs */
const READ={

  gapWide:0.25,gapTight:0.04,// stroke pitch as a share of the element's size, from detail 0 (open) to detail 1 (dense)
  gapMin:0.2,gapOk:1.2,      // clear gap between strokes (mm) that reads not at all .. fully
  lineOk:0.5,lineFloor:0.8,  // lines thinner than lineOk mm read a bit weaker (down to lineFloor at 0 mm)
  fadeHit:0.8,               // how much of the faded share is lost contrast

/* ---- small helpers ---- */
function dzLineMm(rl){
  if(LINE_MM[rl]!=null)return LINE_MM[rl];

  if(!(rl>ks[0]))return LINE_MM[ks[0]];
  for(let i=1;i<ks.length;i++)if(rl<=ks[i])return lerp(LINE_MM[ks[i-1]],LINE_MM[ks[i]],(rl-ks[i-1])/(ks[i]-ks[i-1]));

function dzInterp(xs,ys,x){

/* SKIN_CONTRAST, bilinear in ink lightness and skin tone */
function dzContrast(light,tone){

}
function dzFold(a){a=((a%180)+180)%180;return a>90?180-a:a;}   // angle between two undirected axes, 0..90
function dzColour(id){

}
function dzStyle(id){return(SIM.STYLES||{})[id]||null;}
/* an element's real proportions from its SVG path (0..100 viewBox), cached: {aspect, axis} or null without a path.

const DZ_UNKNOWN={name:"element",family:"motif",styles:[],minSizeMm:15,detail:0.5,lineWeightDefault:7,colourable:true,tags:[]};

/* an element's name as it reads mid-sentence: "Rose" -> "rose", "Script: Family" -> '"Family" script' */

/* which of an element's styles it is drawn in here: the design's style if it can be, else the one whose line range

/* ---- the element table for a design: geometry, weight and looks of every element, and the piece's footprint ---- */
function dzElems(design){
  const S0=design.sizeMm||50,style=design.style,els=[];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const el of design.elements||[]){

/* ---- readability of one element; wear = {spread, blur, fade} from aging.js or null for fresh ink ---- */
function dzElemRead(e,tone,wear,tol){

  const con=con0*(1-READ.fadeHit*fd);

/* how open the gaps between an element's strokes still are, 0..1 (the letters "closing up") */
function dzGap(e,sp,bl){

/* readability of the whole piece (and each element's, for the stress report) */

/* ---- flow ---- */

/* ---- balance ---- */
function dzBalance(E){
  let sw=0,gx=0,gy=0;
  for(const e of E.els){sw+=e.w;gx+=e.w*e.x;gy+=e.w*e.y;}
  if(!sw)return 0;

/* ---- coherence ---- */

    if(st&&st.lineRange){const d=e.rl<st.lineRange[0]?st.lineRange[0]-e.rl:e.rl>st.lineRange[1]?e.rl-st.lineRange[1]:0;m*=Math.max(COHERENCE.rangeFloor,1-COHERENCE.rangeStep*d);}

/* ---- fit to the client ---- */
function dzHas(E,design,m){
  if(m.kind==="tag")return E.els.some(e=>e.tags.indexOf(m.v)>=0);
  if(m.kind==="element")return E.els.some(e=>e.id===m.v);
  if(m.kind==="style")return design.style===m.v;
  if(m.kind==="colour")return E.els.some(e=>e.colourId===m.v);

}
function dzColourShare(E){
  let sw=0,c=0;for(const e of E.els){sw+=e.w+1e-6;if(e.colourId!=="black"&&e.colourId!=="grey")c+=e.w+1e-6;}
  return sw?c/sw:0;
}
/* how much a piece shows: the spot's visibility, less for a piece that is small next to the spot (a watch hides it) */
function dzShows(p,F){return(p.visibility||0)*lerp(FIT.smallShow,1,clamp((F?F.rel:1)/0.6,0,1));}
function dzFit(E,design,cl,p,F){
  const wants=cl.wants||{},ws=wants.styles||{},vals=Object.keys(ws).map(k=>ws[k]),mx=Math.max(0,...vals);
  const style=mx>0?FIT.styleFloor+(1-FIT.styleFloor)*clamp((ws[design.style]||0)/mx,0,1):FIT.noWants;
  const sr=wants.sizeMm||[0,1e9],sz=design.sizeMm;
  const size=sz<sr[0]?Math.pow(sz/sr[0],FIT.sizeUnder):sz>sr[1]?Math.pow(sr[1]/sz,FIT.sizeOver):1;
  const wt=wants.tags||[];
  let tags=FIT.noTags;
  if(wt.length){const hits=wt.filter(t=>E.els.some(e=>e.tags.indexOf(t)>=0)).length;tags=clamp(FIT.tagFloor+(1-FIT.tagFloor)*hits/Math.min(2,wt.length),0,1);}
  const colour=wants.colour==null?0.7:clamp(1-Math.abs(dzColourShare(E)-wants.colour)*FIT.colourSlope,0,1);
  let f=FIT.parts.style*style+FIT.parts.size*size+FIT.parts.tags*tags+FIT.parts.colour*colour;
  for(const m of cl.mustHaves||[])if(!dzHas(E,design,m))f*=FIT.mustMiss;
  for(const m of cl.dealbreakers||[])if(dzHas(E,design,m))f*=FIT.dealbreaker;
  if(p){
    f*=1-FIT.cover*dzShows(p,F)*(cl.cover!=null?cl.cover:dzJobCover(cl.job));
    const tol=cl.traits&&cl.traits.pain!=null?cl.traits.pain:0.5;
    f*=1-FIT.pain*Math.max(0,(p.pain||0)-tol-FIT.painSlack);

function dzFill(t,v){return t.replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?String(v[k]):m);}
function dzStress(ctx){

    for(const h of hits.slice(0,2)){const text=dzFill(rule.text,h);if(!out.some(o=>o.text===text))out.push({id:rule.id,sev:h.sev||1,text});}

/* ---- the main entry ---- */
const DZ_CLIENT={skinTone:0.3,bodyShape:"neutral",traits:{pain:0.5,sun:0.4},wants:{},mustHaves:[],dealbreakers:[]};
function scoreDesign(design,client,skills,opts){
  design=design||{};client=client||DZ_CLIENT;skills=skills||{};opts=opts||{};
  const p=SIM.PLACEMENTS&&SIM.PLACEMENTS[design.placement]||null;
  const box=p?SIM.placementBox(design.placement,client.bodyShape):{wrapMm:120,lengthMm:240};
  const pf=p||{id:"none",name:"spot",region:"arm",flow:[[[0.5,0],[0.5,1]]],flowDeg:0,creases:[],curve:0.5,pain:0.3,visibility:0.5,sun:0.5};
  const E=dzElems(design),tone=client.skinTone!=null?client.skinTone:0.3;
  const lvl=clamp(((skills.styles||{})[design.style])||0,0,10),tol=DESIGN_SKILL.minSizeTol*lvl/10;
  const R=dzReadability(E,tone,null,tol),F=dzFlow(E,design,pf,box);
  const readability=R.score,flow=F.score,balance=dzBalance(E),coherence=dzCoherence(E,design,lvl),fit=dzFit(E,design,client,p,F);
  const Wt=DESIGN_WEIGHTS,wsum=Wt.readability+Wt.flow+Wt.balance+Wt.coherence+Wt.fit;
  const sub={readability,flow,balance,coherence,fit};
  let ar=0,lg=0;for(const k in sub){ar+=Wt[k]*sub[k];lg+=Wt[k]*Math.log(Math.max(TOTAL_BLEND.floor,sub[k]));}
  const total=lerp(ar/wsum,Math.exp(lg/wsum),TOTAL_BLEND.geo);
  /* aging at 5/10/20 with default session outputs */
  const sun=client.traits&&client.traits.sun!=null?client.traits.sun:0.4;
  const ageTattoo={design,out:DEFAULT_OUT,heal:null,ink:null,skinTone:tone,sun};
  const agePrediction={};
  for(const y of [5,10,20])agePrediction[y]=agAge(ageTattoo,y,E,tol);
  /* time and money */
  let dsum=0,fsum=0,sw=0;for(const e of E.els){const a=e.area+1e-6;sw+=a;dsum+=a*e.detail;fsum+=a*e.fill;}
  const det=sw?dsum/sw:0.5,fl=sw?fsum/sw:0,speed=clamp(skills.speed||0,0,10);
  let hours=(HOURS.setup+E.inkedCm2*lerp(HOURS.perCm2Simple,HOURS.perCm2Detailed,det)*(1+HOURS.fill*fl)*(1+HOURS.colour*dzColourShare(E)))*lerp(HOURS.speedSlow,HOURS.speedFast,speed/10);
  if(design.flash||opts.flash)hours*=FLASH_DISCOUNT.hours;
  hours=Math.max(HOURS.round*2,Math.round(hours/HOURS.round)*HOURS.round);
  const sessions=Math.max(1,Math.ceil(hours/lerp(SESSION_HOURS.easy,SESSION_HOURS.hard,clamp(((pf.pain||0)-0.25)/0.7,0,1))-1e-9));
  const rate=opts.rate!=null?opts.rate:RATE_DEFAULT.rate,rep=opts.repMult!=null?opts.repMult:1,year=opts.year!=null?opts.year:2000;
  const price=Math.round(Math.max(RATE_DEFAULT.minHours,hours)*rate*rep*SIM.priceIndex(year));
  /* stress */
  let wTot=0;for(const e of E.els)wTot+=e.w;
  const ctx={design,client,p,box,E,F,tone,tol,sun,wTot,ageTattoo,painTol:client.traits&&client.traits.pain!=null?client.traits.pain:0.5,cover:client.cover!=null?client.cover:dzJobCover(client.job)};
  const stress=dzStress(ctx);

    agePrediction,hours,sessions,price,stress};
}

/* ===== sim/aging.js: the aging model: age(tattoo, years) -> {blur, fade, spread, readability} (PR 1) =====
   How a tattoo looks after N years on a real person. Every line slowly spreads as ink migrates under the skin, edges soften,
   and pigment fades, lights first. What speeds it up:
     - placement (PLACEMENT_WEAR: hands and feet shed skin and rub, so they spread and fade far faster than a back),
     - sun (the client's sun trait x the placement's sun; darker skin shields a little),
     - the colours (COLOUR_FADE: yellow and white go first, black last),
     - the session (depthQuality: too shallow falls out, too deep blows out; lineQuality: ragged edges start soft;
       saturation: badly packed colour starts faded). trauma feeds the heal grade in PR 5, not aging directly,
     - the heal (HEAL_GRADES: a patchy heal starts with spread already applied, a blowout with a big one),
     - the ink (INKS in sim/kit.js: the one table of ink tiers, read here at call time), and the style's ageFactor (a nudge
       for what the numbers miss).
   Thin lines don't get wider so much as spread to nothing: the same ink over a wider area reads paler (the dilution term),
   so a 1RL line fades much faster than a 14RL one. Packed solid fill does not dilute.
   readability is the design re-scored with the aged lines and faded ink (design.js dzReadability), so 9 mm script closes up
   within a few years while a bold 80 mm rose still reads at 20.
     tattoo = {design, out:{lineQuality, depthQuality, saturation, trauma} (default 0.75), heal: HEAL_GRADES id or null,
               ink: INKS id (sim/kit.js) or null = standard, skinTone, sun}
   Private helpers start with ag. ===== */

/* share of pigment lost per year (an exponential rate) at baseline wear, by colour id */
const COLOUR_FADE={black:0.007,grey:0.011,brown:0.012,blue:0.015,green:0.016,red:0.017,purple:0.019,teal:0.019,orange:0.024,
  pink:0.028,skyblue:0.028,yellow:0.034,white:0.05,_default:0.02};
/* multipliers on spread and fade by placement region */
const PLACEMENT_WEAR={hand:{spread:1.8,fade:1.9},foot:{spread:1.7,fade:1.8},neck:{spread:1.1,fade:1.15},arm:{spread:1.05,fade:1.05},
  shoulder:{spread:1,fade:1},leg:{spread:1,fade:1},side:{spread:1,fade:0.95},chest:{spread:0.95,fade:0.95},back:{spread:0.9,fade:0.9}};
/* the heal result (PR 5). spread0/blur0 mm and fade0 are where year 0 starts; rate scales everything after */
const HEAL_GRADES={
  crisp:{name:"crisp",spread0:0,blur0:0,fade0:0,rate:0.92},
  soft:{name:"slightly soft",spread0:0.12,blur0:0.1,fade0:0.03,rate:1},
  patchy:{name:"patchy",spread0:0.3,blur0:0.15,fade0:0.15,rate:1.1},
  blownout:{name:"blown out",spread0:0.7,blur0:0.45,fade0:0.05,rate:1.2},
  infected:{name:"infected",spread0:0.45,blur0:0.35,fade0:0.25,rate:1.3}
};
const AG_NO_HEAL={spread0:0,blur0:0,fade0:0,rate:1};   // heal null: the prediction before the heal is known
/* ink quality comes from INKS in sim/kit.js (loaded after this file, read at call time); this is the fallback if it's missing */
const AG_INK_NONE={fade:1,spread:1};
/* the model's own knobs */
const AGING={
  spreadK:0.065,spreadExp:0.75,       // spread mm = spreadK x years^spreadExp x multipliers (+ the heal's head start)
  sunSpread:0.3,sunFade:1.3,          // how much full sun on a full-sun spot adds to spread and fade
  skinShield:0.35,                    // darker skin takes this much off the sun term at skinTone 1
  styleLo:1.35,styleHi:0.85,          // style multiplier at ageFactor 0 .. 1
  depthSpreadLo:1.7,depthSpreadHi:0.85,depthFadeLo:1.5,depthFadeHi:0.9,   // at depthQuality 0 .. 1
  lineBlur:0.25,                      // mm of edge blur from lineQuality 0
  satRef:0.85,satFade:0.4,            // saturation under satRef starts this much faded per point
  dilution:0.55,dilutionExp:1.5,fillHold:0.7,   // thin lines spreading to nothing; packed fill resists
  blurFromSpread:0.6,detailBlur:0.3   // blur radius from spread, more for dense detail
};

/* everything about a tattoo that doesn't change element to element */
function agEnv(t,p){
  const design=t.design||{},out=Object.assign({},DEFAULT_OUT,t.out||{});
  p=p||(SIM.PLACEMENTS&&SIM.PLACEMENTS[design.placement])||{region:"arm",sun:0.5};
  const wear=PLACEMENT_WEAR[p.region]||{spread:1,fade:1};
  const heal=(t.heal&&HEAL_GRADES[t.heal])||AG_NO_HEAL;
  const inks=SIM.INKS||{};
  const ink=(t.ink&&inks[t.ink])||inks.standard||AG_INK_NONE;
  const tone=t.skinTone!=null?t.skinTone:0.3,sun=(t.sun!=null?t.sun:0.4)*(p.sun!=null?p.sun:0.5)*(1-AGING.skinShield*tone);
  const st=(SIM.STYLES||{})[design.style],af=st&&st.ageFactor!=null?st.ageFactor:0.6;
  const styleM=lerp(AGING.styleLo,AGING.styleHi,af),dq=clamp(out.depthQuality,0,1);
  return{
    spreadM:wear.spread*lerp(AGING.depthSpreadLo,AGING.depthSpreadHi,dq)*(ink.spread||1)*styleM*heal.rate*(1+AGING.sunSpread*sun),
    fadeM:wear.fade*lerp(AGING.depthFadeLo,AGING.depthFadeHi,dq)*(ink.fade||1)*styleM*heal.rate*(1+AGING.sunFade*sun),
    lineBlur:(1-clamp(out.lineQuality,0,1))*AGING.lineBlur,
    fade0:1-(1-heal.fade0)*(1-Math.max(0,AGING.satRef-clamp(out.saturation,0,1))*AGING.satFade),
    heal,tone
  };
}
/* one element's wear after `years`: {spread, blur, fade} */
function agWear(e,env,years){
  const y=Math.max(0,years||0);
  const spread=env.heal.spread0+AGING.spreadK*env.spreadM*Math.pow(y,AGING.spreadExp);
  const blur=env.heal.blur0+env.lineBlur+spread*AGING.blurFromSpread*(1+AGING.detailBlur*e.detail);
  const cr=COLOUR_FADE[e.colourId]!=null?COLOUR_FADE[e.colourId]:COLOUR_FADE._default;
  const rate=lerp(COLOUR_FADE.black,cr,e.colShare!=null?e.colShare:1)*env.fadeM;
  const col=1-Math.exp(-rate*y);
  const dil=AGING.dilution*Math.pow(spread/(e.lineMm+spread||1),AGING.dilutionExp)*(1-AGING.fillHold*e.fill);
  return{spread,blur,fade:clamp(1-(1-env.fade0)*(1-col)*(1-dil),0,1)};
}
/* the whole piece: wear weighted by each element's visual weight, plus readability re-scored with it */
function agAge(t,years,E,tol){
  E=E||dzElems(t.design||{});
  const env=agEnv(t,null),wears=E.els.map(e=>agWear(e,env,years));
  let sw=0,b=0,f=0,s=0;
  E.els.forEach((e,i)=>{const w=e.w+1e-6;sw+=w;b+=w*wears[i].blur;f+=w*wears[i].fade;s+=w*wears[i].spread;});
  const R=dzReadability(E,env.tone,wears,tol||0);
  return{blur:dzR(sw?b/sw:0),fade:dzR(sw?f/sw:0),spread:dzR(sw?s/sw:0),readability:dzR(R.score)};
}
function age(tattoo,years){return agAge(tattoo||{},years,null,0);}
SIM.age=age;SIM.COLOUR_FADE=COLOUR_FADE;SIM.PLACEMENT_WEAR=PLACEMENT_WEAR;SIM.HEAL_GRADES=HEAL_GRADES;SIM.AGING=AGING;
