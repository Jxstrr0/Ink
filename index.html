/* the stencil */
const STENCIL={curveStep:2.5,stepMm:1,minStrokeMm:2.5,segMm:8,minZoneMm2:8,lineW:1,zoneW:0.12,colourW:1.2,viewPad:0.06,minView:24};
/* pace: target = view size x frac per second x the kit's pace. A ratio over 1 + band x rush is rushing */
const PACE={frac:0.11,speedMs:120,smoothMs:60,warmMs:160,stop:0.15,go:0.45,stopMs:350,rush:1.25,blowMs:110,fall:0.38,backMm:3,aheadMm:0.6,aheadK:1.4,
  startSlop:3.2,endSlop:1.6,doneShare:0.94};
/* accuracy: full marks inside acc mm (a little off-centre is fine), falling to nothing at acc x (1 + fall) */
const ACC={minMm:1,inner:0.25,fall:2};
/* depth: depth = hit / ratio^paceExp; scored by how far log(depth) is from 0 against the kit's depthTol */
const DEPTH={paceExp:0.6,deep:0.3,minRatio:0.15};
const BLOW={q:0.6};                       // a segment with a blowout keeps this share of its quality
const JOIN={q:0.9};                       // each join keeps this share of the stroke's quality
/* the line weight the element wants against the liner in use: per LINE_WEIGHTS step outside its band */
const LW_FIT={under:0.82,over:0.86,overRush:0.85,passTrauma:0.015};
/* zones: one full pass of saturation = sqrt(area) x passes mm of sweeping. Sweep speed band as view shares per second */
const ZONE={slop:0.02,slopMin:1.2,passes:3.2,slack:0.12,vLo:0.04,vHi:0.45,depthW:0.6};
const COLOUR={windowMs:550,minLegShare:0.015,sweepK:0.35,turnDot:-0.2};
/* skin trauma: per hour of work, per second lingering on a line (x log depth past DEPTH.deep), each blowout, overworking a zone, holding still in a zone */
const TRAUMA={perHour:0.035,linger:0.02,blow:0.05,over:0.6,dig:0.05};
/* the client's meters: per hour. pain = k x (placement pain + floor) x tolerance factor x machine x (1 + ramp x hours) */
const PAIN={k:0.24,floor:0.1,tolLo:1.6,tolHi:0.55,ramp:0.25,trauma:0.6,limit:1};
const FATIGUE={k:0.15,pain:0.45,limit:1};
const BREAK={hours:0.25,pain:0.4,fatigue:0.28,fade:0.65,max:4};
const NUMB={price:250,mult:0.45,now:0.25,hours:2,max:1};   // price in 2000 rubles x priceIndex
const CHAT={hours:0.75,fatigue:0.6,max:3,quiet:0.3,annoy:0.04};
const CLOCK={maxDt:0.3};                  // seconds: a longer gap between samples counts as this much work time
/* XP for a sitting (added straight onto the 0..10 skill levels), less as the level climbs */
const SKILL_XP={practice:{linework:0.05,shading:0.04,colour:0.04,style:0.02,speed:0.01},
  sample:{linework:0.08,shading:0.06,colour:0.06,style:0.04,speed:0.015},
  booked:{linework:0.1,shading:0.08,colour:0.08,style:0.05,speed:0.02},
  diminish:0.75,floor:0.3};

/* ---- the SVG flattener: path data -> subpaths [{pts:[x,y,...], closed}] in path units ---- */
function ssFlatten(d){
  const tk=String(d||"").match(/[a-zA-Z]|-?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g)||[];
  const N={m:2,l:2,h:1,v:1,c:6,s:4,q:4,t:2,a:7,z:0},subs=[];
  let cur=null,i=0,cmd="",x=0,y=0,sx=0,sy=0,c2x=0,c2y=0,qx=0,qy=0,prev="";
  const start=(px,py)=>{cur={pts:[px,py],closed:false};subs.push(cur);};
  const to=(px,py)=>{if(!cur)start(x,y);cur.pts.push(px,py);};
  const steps=l=>clamp(Math.ceil(l/STENCIL.curveStep),3,48);
  const cubic=(x0,y0,x1,y1,x2,y2,x3,y3)=>{
    const n=steps(Math.hypot(x1-x0,y1-y0)+Math.hypot(x2-x1,y2-y1)+Math.hypot(x3-x2,y3-y2));
    for(let j=1;j<=n;j++){const t=j/n,u=1-t;to(u*u*u*x0+3*u*u*t*x1+3*u*t*t*x2+t*t*t*x3,u*u*u*y0+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y3);}};
  const quad=(x0,y0,x1,y1,x2,y2)=>{
    const n=steps(Math.hypot(x1-x0,y1-y0)+Math.hypot(x2-x1,y2-y1));
    for(let j=1;j<=n;j++){const t=j/n,u=1-t;to(u*u*x0+2*u*t*x1+t*t*x2,u*u*y0+2*u*t*y1+t*t*y2);}};
  while(i<tk.length){
    if(/[a-zA-Z]/.test(tk[i])){cmd=tk[i++];
      if(cmd==="z"||cmd==="Z"){if(cur){cur.closed=true;if(x!==sx||y!==sy)cur.pts.push(sx,sy);}x=sx;y=sy;cur=null;prev="z";continue;}}
    const lc=cmd.toLowerCase(),k=N[lc];if(!k){i++;continue;}
    const a=tk.slice(i,i+k).map(Number);i+=k;if(a.length<k||a.some(v=>isNaN(v)))break;
    const rel=cmd!==cmd.toUpperCase(),ox=rel?x:0,oy=rel?y:0;
    if(lc==="m"){x=ox+a[0];y=oy+a[1];sx=x;sy=y;start(x,y);cmd=rel?"l":"L";}
    else if(lc==="l"){x=ox+a[0];y=oy+a[1];to(x,y);}
    else if(lc==="h"){x=ox+a[0];to(x,y);}
    else if(lc==="v"){y=oy+a[0];to(x,y);}
    else if(lc==="c"){cubic(x,y,ox+a[0],oy+a[1],ox+a[2],oy+a[3],ox+a[4],oy+a[5]);c2x=ox+a[2];c2y=oy+a[3];x=ox+a[4];y=oy+a[5];}
    else if(lc==="s"){const r1x=prev==="c"||prev==="s"?2*x-c2x:x,r1y=prev==="c"||prev==="s"?2*y-c2y:y;
      cubic(x,y,r1x,r1y,ox+a[0],oy+a[1],ox+a[2],oy+a[3]);c2x=ox+a[0];c2y=oy+a[1];x=ox+a[2];y=oy+a[3];}
    else if(lc==="q"){quad(x,y,ox+a[0],oy+a[1],ox+a[2],oy+a[3]);qx=ox+a[0];qy=oy+a[1];x=ox+a[2];y=oy+a[3];}
    else if(lc==="t"){const cx=prev==="q"||prev==="t"?2*x-qx:x,cy=prev==="q"||prev==="t"?2*y-qy:y;
      quad(x,y,cx,cy,ox+a[0],oy+a[1]);qx=cx;qy=cy;x=ox+a[0];y=oy+a[1];}
    else if(lc==="a"){const ex=ox+a[5],ey=oy+a[6];ssArc(x,y,a[0],a[1],a[2],a[3],a[4],ex,ey,to);x=ex;y=ey;}
    prev=lc;
  }
  return subs.filter(s=>s.pts.length>=4);
}
/* an SVG arc (endpoint form) sampled through its centre; ends exactly on (x2, y2) */
function ssArc(x1,y1,rx,ry,phi,fa,fs,x2,y2,to){
  rx=Math.abs(rx);ry=Math.abs(ry);if(!rx||!ry||(x1===x2&&y1===y2)){to(x2,y2);return;}
  const c=Math.cos(phi*Math.PI/180),s=Math.sin(phi*Math.PI/180),dx=(x1-x2)/2,dy=(y1-y2)/2;
  const xp=c*dx+s*dy,yp=-s*dx+c*dy,lam=xp*xp/(rx*rx)+yp*yp/(ry*ry);
  if(lam>1){const k=Math.sqrt(lam);rx*=k;ry*=k;}
  const num=rx*rx*ry*ry-rx*rx*yp*yp-ry*ry*xp*xp,den=rx*rx*yp*yp+ry*ry*xp*xp;
  const co=(fa===fs?-1:1)*Math.sqrt(Math.max(0,num/(den||1)));
  const cxp=co*rx*yp/ry,cyp=-co*ry*xp/rx,cx=c*cxp-s*cyp+(x1+x2)/2,cy=s*cxp+c*cyp+(y1+y2)/2;
  const ang=(ux,uy,vx,vy)=>Math.atan2(ux*vy-uy*vx,ux*vx+uy*vy);
  const t1=ang(1,0,(xp-cxp)/rx,(yp-cyp)/ry);let dt=ang((xp-cxp)/rx,(yp-cyp)/ry,(-xp-cxp)/rx,(-yp-cyp)/ry);
  if(!fs&&dt>0)dt-=2*Math.PI;else if(fs&&dt<0)dt+=2*Math.PI;
  const n=clamp(Math.ceil(Math.abs(dt)*Math.max(rx,ry)/STENCIL.curveStep),4,64);
  for(let i=1;i<n;i++){const t=t1+dt*i/n,ex=rx*Math.cos(t),ey=ry*Math.sin(t);to(c*ex-s*ey+cx,s*ex+c*ey+cy);}
  to(x2,y2);
}
/* resample a polyline every `step` mm: {pts, cum, len} */
function ssResample(p,step){
  let L=0;const raw=[0];for(let i=2;i<p.length;i+=2){L+=Math.hypot(p[i]-p[i-2],p[i+1]-p[i-1]);raw.push(L);}
  if(L<=0)return{pts:[p[0],p[1]],cum:[0],len:0};
  const n=Math.max(1,Math.round(L/step)),pts=[],cum=[];let j=1;
  for(let k=0;k<=n;k++){const u=L*k/n;while(j<raw.length-1&&raw[j]<u)j++;
    const a=raw[j-1],b=raw[j],t=b>a?(u-a)/(b-a):0;pts.push(lerp(p[2*j-2],p[2*j],t),lerp(p[2*j-1],p[2*j+1],t));cum.push(u);}
  return{pts,cum,len:L};
}
function ssAreaOf(poly){let a=0;for(let i=0,n=poly.length;i<n;i+=2){const j=(i+2)%n;a+=poly[i]*poly[j+1]-poly[j]*poly[i+1];}return a/2;}
/* inside a zone, or within slop mm of its edge (a finger is wider than a sliver of leaf) */
function ssNear(polys,x,y,slop){if(ssInside(polys,x,y))return true;if(!(slop>0))return false;const s2=slop*slop;
  for(const p of polys)for(let i=0,n=p.length,j=n-2;i<n;j=i,i+=2){const ax=p[j],ay=p[j+1],dx=p[i]-ax,dy=p[i+1]-ay,l2=dx*dx+dy*dy||1e-9;
    const t=clamp(((x-ax)*dx+(y-ay)*dy)/l2,0,1),qx=ax+t*dx-x,qy=ay+t*dy-y;if(qx*qx+qy*qy<=s2)return true;}
  return false;}
function ssInside(polys,x,y){let c=false;
  for(const p of polys)for(let i=0,n=p.length,j=n-2;i<n;j=i,i+=2){const yi=p[i+1],yj=p[j+1];
    if((yi>y)!==(yj>y)&&x<(p[j]-p[i])*(y-yi)/(yj-yi)+p[i])c=!c;}
  return c;}

/* ---- the plan: stencil strokes, zones and the work list for a design (cached by design + body shape) ---- */
const ssPlanCache=new Map();
function ssPlanFor(design,bodyShape,client,skills,parts){
  const key=JSON.stringify([design,bodyShape||"neutral",parts||0]);
  const hit=ssPlanCache.get(key);if(hit)return hit;
  const P=SIM.PLACEMENTS[design.placement]||null;
  const box=P?SIM.placementBox(design.placement,bodyShape):{wrapMm:120,lengthMm:240};
  const sz=design.sizeMm||50,pos=design.pos||{x:0.5,y:0.5},fp=SIM.footprintOf(design);
  const strokes=[],zones=[];let dots=0;
  (design.elements||[]).forEach((el,ei)=>{
    const def=SIM.elementById(el.id);if(!def)return;
    const b=SIM.elementBox(el.id),k=((el.scale!=null?el.scale:0.5)*sz)/Math.max(b.w,b.h,1e-6),bcx=b.x+b.w/2,bcy=b.y+b.h/2;
    const mx=pos.x*box.wrapMm+((el.x!=null?el.x:0.5)-fp.cx)*sz,my=pos.y*box.lengthMm+((el.y!=null?el.y:0.5)-fp.cy)*sz;
    const th=(el.rot||0)*Math.PI/180,cs=Math.cos(th),sn=Math.sin(th);
    const tf=p=>{const o=[];for(let i=0;i<p.length;i+=2){const px=(p[i]-bcx)*k,py=(p[i+1]-bcy)*k;o.push(mx+px*cs-py*sn,my+px*sn+py*cs);}return o;};
    const lw=el.lineWeight!=null?el.lineWeight:(def.lineWeightDefault||7);
    const colour=el.colour||null,lineCol=colour&&(design.style==="watercolour"||!(el.fill>0))?colour:null;
    for(const sp of ssFlatten(def.path)){
      const r=ssResample(tf(sp.pts),STENCIL.stepMm);
      if(r.len<STENCIL.minStrokeMm){dots++;continue;}
      const segs=[],ns=Math.max(1,Math.round(r.len/STENCIL.segMm));for(let s=0;s<ns;s++)segs.push(r.len*(s+1)/ns);
      strokes.push({el:ei,lw,colour:lineCol,pts:r.pts,cum:r.cum,len:r.len,segs,closed:sp.closed,detail:def.detail||0.5});
    }
    if(def.fill&&el.fill>0){
      const polys=ssFlatten(def.fill).map(sp=>tf(sp.pts));
      const area=Math.abs(polys.reduce((s,p)=>s+ssAreaOf(p),0))||Math.max(0,...polys.map(p=>Math.abs(ssAreaOf(p))));
      if(area>=STENCIL.minZoneMm2){
        let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of polys)for(let i=0;i<p.length;i+=2){x0=Math.min(x0,p[i]);x1=Math.max(x1,p[i]);y0=Math.min(y0,p[i+1]);y1=Math.max(y1,p[i+1]);}
        const col=colour&&colour!=="black"&&colour!=="grey";
        zones.push({el:ei,kind:col?"colour":"shade",colour:colour||"black",target:clamp(el.fill,0.05,1),polys,area,box:[x0,y0,x1,y1],cx:(x0+x1)/2,cy:(y0+y1)/2});
      }
    }
  });
  const sc=SIM.scoreDesign(design,client||null,skills||{});
  const items=[];
  strokes.forEach((s,i)=>items.push({k:"line",i,raw:s.len*STENCIL.lineW*(0.8+0.4*s.detail)}));
  zones.forEach((z,i)=>{if(z.kind==="shade")items.push({k:"shade",i,raw:z.area*z.target*STENCIL.zoneW});});
  zones.forEach((z,i)=>{if(z.kind==="colour")items.push({k:"colour",i,raw:z.area*z.target*STENCIL.zoneW*STENCIL.colourW});});
  const work=Math.max(0.25,sc.hours-((SIM.HOURS&&SIM.HOURS.setup)||0.5)),tot=items.reduce((s,it)=>s+it.raw,0)||1;
  let cw=0;for(const it of items){it.w=it.raw/tot*work;cw+=it.w;it.cw=cw;delete it.raw;}
  const plan={key,box,sizeMm:sz,strokes,zones,items,hours:sc.hours,work,parts:Math.max(1,parts||sc.sessions),price:sc.price,dots,
    pain:P?P.pain:0.4,placement:design.placement};
  if(ssPlanCache.size>40)ssPlanCache.clear();
  ssPlanCache.set(key,plan);
  return plan;
}
function ssPlan(sess){return ssPlanFor(sess.design,sess.bodyShape,sess.client,sess.skills,sess.partsTotal);}
/* where this sitting's work ends: the items up to part/partsTotal of the hours (at least one item past `next`) */
function ssSitEnd(plan,next,part,partsTotal){
  const n=plan.items.length;if(part>=partsTotal)return n;
  const B=plan.work*part/partsTotal*0.985;let j=next+1;
  while(j<n&&plan.items[j-1].cw<B)j++;
  return Math.min(n,j);
}
/* the view: the bounding box of this sitting's work, padded (pace and tolerance scale with it) */
function ssSitView(plan,a,b){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=a;i<b;i++){const it=plan.items[i];
    if(it.k==="line"){const p=plan.strokes[it.i].pts;for(let j=0;j<p.length;j+=2){x0=Math.min(x0,p[j]);x1=Math.max(x1,p[j]);y0=Math.min(y0,p[j+1]);y1=Math.max(y1,p[j+1]);}}
    else{const z=plan.zones[it.i];x0=Math.min(x0,z.box[0]);y0=Math.min(y0,z.box[1]);x1=Math.max(x1,z.box[2]);y1=Math.max(y1,z.box[3]);}}
  if(x0>x1){x0=0;y0=0;x1=plan.box.wrapMm;y1=plan.box.lengthMm;}
  const size=Math.max(STENCIL.minView,x1-x0,y1-y0),pad=size*STENCIL.viewPad,cx=(x0+x1)/2,cy=(y0+y1)/2;
  const w=Math.max(x1-x0,STENCIL.minView*0.6)+2*pad,h=Math.max(y1-y0,STENCIL.minView*0.6)+2*pad;
  return{x0:dsR(cx-w/2),y0:dsR(cy-h/2),w:dsR(w),h:dsR(h),size:dsR(size)};
}
const dsR=v=>Math.round(v*1000)/1000;

/* ---- the session object ---- */
function ssEmptyAcc(){return{lineLen:0,lineQ:0,depthW:0,depthQ:0,blow:0,joins:0,trauma:0,sittings:0,hours:0};}
function sessionNew(o){
  o=o||{};
  const kind=o.kind||"sample",design=JSON.parse(JSON.stringify(o.design||{}));
  const cl=o.client||null,practice=kind==="practice";
  const tr=cl&&cl.traits||{};
  const sess={v:1,kind,itemId:o.itemId||null,clientId:cl?cl.id||null:null,
    client:practice||!cl?null:{name:cl.name||"Client",pronouns:cl.pronouns||"",traits:{pain:tr.pain!=null?tr.pain:0.5,talkative:tr.talkative!=null?tr.talkative:0.5,sun:tr.sun!=null?tr.sun:0.4}},
    design,bodyShape:o.bodyShape||(cl&&cl.bodyShape)||"neutral",skinTone:o.skinTone!=null?o.skinTone:(cl&&cl.skinTone!=null?cl.skinTone:0.3),
    kit:SIM.kitClean(o.kit),settings:{assist:!!(o.settings&&o.settings.assist)},
    skills:{linework:+((o.skills||{}).linework)||0,shading:+((o.skills||{}).shading)||0,colour:+((o.skills||{}).colour)||0,speed:+((o.skills||{}).speed)||0,
      styles:Object.assign({},(o.skills||{}).styles||{})},
    year:o.year||2000,week:o.week||1,part:o.part||1,partsTotal:0,phase:"place",
    next:0,start:0,end:0,view:null,liner:null,cur:null,zsat:[],acc:ssEmptyAcc(),
    sit:{lineLen:0,lineQ:0,depthW:0,depthQ:0,blow:0,joins:0,trauma:0,zoneWork:{shade:0,colour:0}},
    m:{pain:0,fatigue:0,clock:0,breaks:0,numbH:0,numbs:0,chatH:0,chats:0},stop:null,pen:null};
  if(practice)sess.partsTotal=1;
  else sess.partsTotal=o.partsTotal||ssPlanFor(design,sess.bodyShape,sess.client,sess.skills,0).parts;
  const plan=ssPlan(sess),pr=o.progress||null;
  sess.zsat=plan.zones.map((z,i)=>pr&&Array.isArray(pr.zsat)&&typeof pr.zsat[i]==="number"?pr.zsat[i]:0);
  if(pr){sess.next=clamp(pr.next|0,0,plan.items.length);sess.acc=Object.assign(ssEmptyAcc(),pr.acc||{});sess.cur=pr.cur||null;
    if(sess.next>0||sess.cur)sess.phase="work";}
  ssStartSitting(sess);
  return sess;
}
function ssStartSitting(sess){
  const plan=ssPlan(sess);
  sess.start=sess.next;sess.end=ssSitEnd(plan,sess.next,sess.part,sess.partsTotal);
  sess.view=ssSitView(plan,sess.start,sess.end);
  const first=plan.items.slice(sess.start,sess.end).find(it=>it.k==="line");
  sess.liner=ssBestLiner(sess,first?plan.strokes[first.i].lw:7);
}
/* the liner on the tray whose clean band holds this line weight (or the nearest) */
function ssBestLiner(sess,lw){
  const B=SIM.kitBands(sess.kit,sess.skills,sess.settings),LW=SIM.LINE_WEIGHTS;let best=null,bd=1e9;
  for(const l of B.liners){const d=lw<l.lo?LW.indexOf(l.lo)-LW.indexOf(lw):lw>l.hi?LW.indexOf(lw)-LW.indexOf(l.hi):0;
    const dd=d*10+Math.abs(LW.indexOf(l.rl)-LW.indexOf(lw));if(dd<bd){bd=dd;best=l.id;}}
  return best;
}
const ssBandCache=new Map();
function ssBands(sess){
  const key=JSON.stringify([sess.kit,sess.skills.linework,sess.skills.shading,sess.skills.colour,sess.settings.assist,sess.liner,sess.view&&sess.view.size]);
  let b=ssBandCache.get(key);if(b)return b;
  b=Object.assign({},SIM.kitBands(sess.kit,sess.skills,sess.settings,{liner:sess.liner}));
  const v=sess.view?sess.view.size:50;
  b.view=v;b.paceMmS=v*PACE.frac*b.pace;b.accMm=Math.max(ACC.minMm,v*b.accFrac);
  if(ssBandCache.size>60)ssBandCache.clear();ssBandCache.set(key,b);
  return b;
}
function sessionItem(sess){
  const plan=ssPlan(sess);if(sess.next>=sess.end||sess.next>=plan.items.length)return null;
  const it=plan.items[sess.next];
  return Object.assign({idx:sess.next},it,it.k==="line"?{stroke:plan.strokes[it.i]}:{zone:plan.zones[it.i]});
}
/* stencil placement (only before any work): move the piece's centre, rebuild the plan, re-check flow and creases */
function stencilCheck(design,client,skills){
  const sc=SIM.scoreDesign(design,client||null,skills||{});
  const ids={crease:1,crease_near:1,too_wide:1,too_long:1,against_flow:1,against_shape:1};
  return{flow:sc.flow,issues:sc.stress.filter(s=>ids[s.id])};
}
function sessionPlace(sess,pos){
  if(sess.next>0||sess.cur||sess.acc.sittings>0)return stencilCheck(sess.design,sess.client,sess.skills);
  sess.design.pos={x:dsR(clamp(pos.x,0,1)),y:dsR(clamp(pos.y,0,1))};
  ssStartSitting(sess);
  return stencilCheck(sess.design,sess.client,sess.skills);
}
/* turn the whole stencil by deg about its footprint's centre. The real size of every element stays the same; if the turned
   design no longer fits its 0..1 box, the box is widened (sizeMm up, coordinates in) so the mm on skin don't change */
function sessionRotate(sess,deg){
  if(sess.next>0||sess.cur||sess.acc.sittings>0||!deg)return stencilCheck(sess.design,sess.client,sess.skills);
  const d=sess.design,fp=SIM.footprintOf(d),th=deg*Math.PI/180,cs=Math.cos(th),sn=Math.sin(th);
  d.elements=(d.elements||[]).map(el=>{const x=(el.x!=null?el.x:0.5)-fp.cx,y=(el.y!=null?el.y:0.5)-fp.cy;
    let r=((el.rot||0)+deg)%360;if(r>180)r-=360;if(r<=-180)r+=360;
    return Object.assign({},el,{x:fp.cx+x*cs-y*sn,y:fp.cy+x*sn+y*cs,rot:r});});
  const f2=SIM.footprintOf(d),k=Math.max(1,f2.w,f2.h);
  d.elements=d.elements.map(el=>Object.assign({},el,{x:dsR(0.5+(el.x-f2.cx)/k),y:dsR(0.5+(el.y-f2.cy)/k),scale:dsR((el.scale!=null?el.scale:0.5)/k),rot:Math.round(el.rot*10)/10}));
  if(k>1)d.sizeMm=Math.round((d.sizeMm||50)*k);
  ssStartSitting(sess);
  return stencilCheck(d,sess.client,sess.skills);
}

/* ---- the meters: advance the sitting clock by dH hours of work (and add any trauma) ---- */
function sessionPainRate(sess){
  if(sess.kind==="practice"||!sess.client)return 0;
  const plan=ssPlan(sess),b=ssBands(sess),tol=clamp(sess.client.traits.pain,0,1);
  return PAIN.k*(plan.pain+PAIN.floor)*lerp(PAIN.tolLo,PAIN.tolHi,tol)*b.pain*(1+PAIN.ramp*sess.m.clock)*(sess.m.numbH>0?NUMB.mult:1);
}
function ssClock(sess,dH,dT){
  const m=sess.m;dT=dT||0;
  const b=ssBands(sess);dT+=TRAUMA.perHour*b.trauma*dH;
  sess.acc.trauma+=dT;sess.sit.trauma+=dT;
  if(sess.kind==="practice"||!sess.client){m.clock+=dH;return;}
  const rate=sessionPainRate(sess);
  m.pain+=rate*dH+dT*PAIN.trauma;
  const talk=clamp(sess.client.traits.talkative,0,1);
  m.fatigue+=FATIGUE.k*(1+FATIGUE.pain*Math.min(1,m.pain))*(m.chatH>0?1-CHAT.fatigue*talk:1)*dH;
  m.clock+=dH;m.numbH=Math.max(0,m.numbH-dH);m.chatH=Math.max(0,m.chatH-dH);
  if(!sess.stop){if(m.pain>=PAIN.limit)sess.stop="pain";else if(m.fatigue>=FATIGUE.limit)sess.stop="fatigue";}
}

/* ---- linework ---- */
function ssProject(st,x,y,u0,u1){
  const c=st.cum,p=st.pts;let lo=0,hi=c.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(c[mid]<u0)lo=mid+1;else hi=mid;}
  let best=1e18,bu=u0;const i0=Math.max(1,lo);
  for(let i=i0;i<c.length&&c[i-1]<=u1;i++){
    const ax=p[2*i-2],ay=p[2*i-1],dx=p[2*i]-ax,dy=p[2*i+1]-ay,l2=dx*dx+dy*dy||1e-9;
    const t=clamp(((x-ax)*dx+(y-ay)*dy)/l2,0,1),qx=ax+t*dx-x,qy=ay+t*dy-y,d=qx*qx+qy*qy;
    if(d<best){best=d;bu=c[i-1]+t*(c[i]-c[i-1]);}
  }
  return{u:bu,d:Math.sqrt(best)};
}
function ssPointAt(st,u){
  const c=st.cum,p=st.pts;u=clamp(u,0,st.len);let lo=1,hi=c.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(c[mid]<u)lo=mid+1;else hi=mid;}
  const i=Math.max(1,lo),a=c[i-1],b=c[i],t=b>a?(u-a)/(b-a):0;
  return[lerp(p[2*i-2],p[2*i],t),lerp(p[2*i-1],p[2*i+1],t)];
}
function ssNewCur(st){const n=st.segs.length,z=()=>new Array(n).fill(0);return{u:0,T:z(),A:z(),P:z(),PT:z(),D:z(),R:z(),B:z(),joins:0,contacts:0,t:0,linger:0};}
function ssLwSteps(sess,lw){
  const b=ssBands(sess),LW=SIM.LINE_WEIGHTS,i=LW.indexOf(lw);if(i<0||!b.liner)return 0;
  if(lw>b.lineBand[1])return i-LW.indexOf(b.lineBand[1]);
  if(lw<b.lineBand[0])return-(LW.indexOf(b.lineBand[0])-i);
  return 0;
}
function ssLive(sess,o){const m=sess.m;return Object.assign({ok:true,pain:dsR(m.pain),fatigue:dsR(m.fatigue),clock:dsR(m.clock),stop:sess.stop},o||{});}
function penDown(sess,t,x,y){
  const it=sessionItem(sess);if(!it||sess.phase!=="work")return{ok:false,why:"none"};
  if(it.k==="line"){
    const st=it.stroke,b=ssBands(sess);if(!sess.cur)sess.cur=ssNewCur(st);
    const c=sess.cur,at=ssPointAt(st,c.u),slop=Math.max(b.accMm*PACE.startSlop,b.view*0.05);
    if(Math.hypot(x-at[0],y-at[1])>slop)return{ok:false,why:"start",at};
    if(c.contacts>0&&c.u<st.len-PACE.endSlop){c.joins++;sess.sit.joins++;}
    c.contacts++;
    sess.pen={k:"line",t0:t,t,x,y,u:c.u,v:null,still:0,stopped:false,hx:[x],hy:[y],ht:[t]};
    return ssLive(sess,{u:c.u,r:0,d:Math.hypot(x-at[0],y-at[1])});
  }
  sess.pen={k:it.k,t0:t,t,x,y,dx:0,dy:0,leg:0,lastRev:-1e9};
  const b=ssBands(sess);return ssLive(sess,{inside:ssNear(it.zone.polys,x,y,Math.max(ZONE.slopMin,b.view*ZONE.slop)),sat:dsR(sess.zsat[it.i])});
}
function penMove(sess,t,x,y){
  const pen=sess.pen,it=sessionItem(sess);if(!pen||!it)return{ok:false,why:"up"};
  const dt=(t-pen.t)/1000;if(dt<=0)return ssLive(sess,{});
  const dtc=Math.min(dt,CLOCK.maxDt),b=ssBands(sess);
  if(pen.k==="line"){
    const st=it.stroke,c=sess.cur;
    const ahead=Math.hypot(x-pen.x,y-pen.y)*PACE.aheadK+PACE.aheadMm;   // progress can't outrun the finger (no jumping across a loop)
    const pr=ssProject(st,x,y,Math.max(0,pen.u-PACE.backMm),pen.u+ahead);
    /* pace is the finger's own speed over the last PACE.speedMs (a chord, so touch jitter averages out); du is progress */
    pen.hx.push(x);pen.hy.push(y);pen.ht.push(t);
    while(pen.ht.length>2&&pen.ht[1]<=t-PACE.speedMs){pen.hx.shift();pen.hy.shift();pen.ht.shift();}
    const du=Math.max(0,pr.u-pen.u),inst=Math.hypot(x-pen.hx[0],y-pen.hy[0])/Math.max(1e-3,(t-pen.ht[0])/1000);
    const al=1-Math.exp(-dt*1000/PACE.smoothMs);
    pen.v=pen.v==null?inst:pen.v+(inst-pen.v)*al;
    const r=pen.v/b.paceMmS;
    let joinNow=false;
    if(r<PACE.stop){pen.still+=dt*1000;if(pen.still>=PACE.stopMs)pen.stopped=true;}
    else{if(pen.stopped&&r>PACE.go){c.joins++;sess.sit.joins++;joinNow=true;pen.stopped=false;}if(r>=PACE.go)pen.still=0;}
    const u=pen.u+du,s=Math.min(st.segs.length-1,st.segs.findIndex(e=>u<=e+1e-9)<0?st.segs.length-1:st.segs.findIndex(e=>u<=e+1e-9));
    const steps=ssLwSteps(sess,st.lw),band=b.paceBand,rushAt=1+band*PACE.rush*(steps<0?Math.pow(LW_FIT.overRush,-steps):1);
    const accF=pr.d<=b.accMm?1-ACC.inner*Math.pow(pr.d/b.accMm,2):Math.max(0,(1-ACC.inner)*(1-(pr.d-b.accMm)/(b.accMm*ACC.fall)));
    const lr=Math.abs(Math.log(Math.max(r,1e-3))),lb=Math.log(1+band);
    const paceF=lr<=lb?1:Math.exp(-Math.pow((lr-lb)/PACE.fall,2));
    const depth=b.hit/Math.pow(Math.max(r,DEPTH.minRatio),DEPTH.paceExp),ld=Math.log(depth);
    const depthF=Math.exp(-Math.pow(ld/b.depthTol,2));
    const warm=t-pen.t0<PACE.warmMs;
    c.T[s]+=dtc;c.A[s]+=dtc*accF;c.D[s]+=dtc*depthF;
    if(!warm&&!pen.stopped){c.P[s]+=dtc*paceF;c.PT[s]+=dtc;}
    const rushed=!warm&&r>rushAt;let blow=false;
    if(rushed){c.R[s]+=dt*1000;if(c.R[s]>=PACE.blowMs&&!c.B[s]){c.B[s]=1;blow=true;}}
    let dT=0;if(ld>DEPTH.deep&&!warm)dT+=dtc*(ld-DEPTH.deep)*TRAUMA.linger*b.trauma;
    if(blow)dT+=TRAUMA.blow*b.trauma;
    c.t+=dtc;
    const target=st.len/b.paceMmS;
    ssClock(sess,it.w*dtc/Math.max(0.5,target),dT);
    pen.t=t;pen.x=x;pen.y=y;pen.u=u;c.u=u;
    return ssLive(sess,{u:dsR(u),r:dsR(r),d:dsR(pr.d),rushed,stopped:pen.stopped,blow,join:joinNow,seg:s,acc:dsR(accF),pace:dsR(paceF)});
  }
  /* zones */
  const z=it.zone,dx=x-pen.x,dy=y-pen.y,dist=Math.hypot(dx,dy),slop=Math.max(ZONE.slopMin,b.view*ZONE.slop);
  const inside=ssNear(z.polys,x,y,slop)&&ssNear(z.polys,pen.x,pen.y,slop);
  const vRel=dist/dt/b.view;let f=0,dT=0,depthF=1;
  if(inside){
    f=vRel<ZONE.vLo?vRel/ZONE.vLo:vRel>ZONE.vHi?ZONE.vHi/vRel:1;
    depthF=vRel<ZONE.vLo?lerp(0.55,1,vRel/ZONE.vLo):vRel>ZONE.vHi?Math.max(0.3,ZONE.vHi/vRel):1;
    if(vRel<ZONE.vLo*0.5)dT+=TRAUMA.dig*b.trauma*dtc;
    if(pen.k==="colour"){
      if(dist>1e-6){const ux=dx/dist,uy=dy/dist;
        if(pen.leg>0&&(ux*pen.dx+uy*pen.dy)<COLOUR.turnDot){if(pen.leg>=b.view*COLOUR.minLegShare)pen.lastRev=t;pen.leg=0;}
        pen.dx=ux;pen.dy=uy;pen.leg+=dist;}
      if(t-pen.lastRev>COLOUR.windowMs)f*=COLOUR.sweepK;
    }
  }
  const rate=pen.k==="colour"?b.colour:b.shade;
  const dSat=inside?dist/(Math.sqrt(z.area)*ZONE.passes)*rate*f:0;
  const before=sess.zsat[it.i],after=before+dSat,lim=z.target+ZONE.slack;
  const over=Math.max(0,after-lim)-Math.max(0,before-lim);
  if(over>0)dT+=over*TRAUMA.over*b.trauma;
  sess.zsat[it.i]=after;
  if(dSat>0){const w=dSat*ZONE.depthW*Math.sqrt(z.area)/10;sess.acc.depthW+=w;sess.acc.depthQ+=w*depthF;sess.sit.depthW+=w;sess.sit.depthQ+=w*depthF;sess.sit.zoneWork[pen.k]+=dSat;}
  ssClock(sess,it.w*dSat/Math.max(0.1,z.target),dT);
  pen.t=t;pen.x=x;pen.y=y;
  return ssLive(sess,{inside,sat:dsR(after),target:z.target,over:after>lim,f:dsR(f)});
}
function penUp(sess,t){
  const pen=sess.pen;sess.pen=null;const it=sessionItem(sess);
  if(!pen||!it)return ssLive(sess,{done:false});
  if(pen.k==="line"){
    const st=it.stroke,c=sess.cur;
    if(c&&c.u>=Math.min(st.len-PACE.endSlop,st.len*PACE.doneShare)){ssFinishStroke(sess);return ssLive(sess,{done:true,lineDone:true});}
    return ssLive(sess,{done:false,u:c?dsR(c.u):0});
  }
  return ssLive(sess,{done:false});
}
/* score the current stroke from its segment sums and move on */
function ssFinishStroke(sess){
  const it=sessionItem(sess);if(!it||it.k!=="line"){sess.cur=null;return null;}
  const st=it.stroke,c=sess.cur||ssNewCur(st),n=st.segs.length;
  let sq=0,sd=0,blows=0,last=null,lastD=null;
  for(let s=0;s<n;s++){
    const s0=s?st.segs[s-1]:0;let q,dq;
    if(c.T[s]>0){const acc=c.A[s]/c.T[s],pace=c.PT[s]>0?c.P[s]/c.PT[s]:1;q=acc*pace*(c.B[s]?BLOW.q:1);dq=c.D[s]/c.T[s];last=q;lastD=dq;}
    else if(c.u>=st.segs[s]-1e-9&&last!=null){q=last;dq=lastD;}   // skimmed past in one sample
    else if(c.u>s0){q=(last!=null?last:0.5)*clamp((c.u-s0)/(st.segs[s]-s0),0,1);dq=lastD!=null?lastD:0.5;}
    else{q=0;dq=0;}
    if(c.B[s])blows++;
    const L=st.segs[s]-s0;sq+=q*L;sd+=dq*L;
  }
  const steps=ssLwSteps(sess,st.lw);
  const lwF=steps>0?Math.pow(LW_FIT.under,steps):steps<0?Math.pow(LW_FIT.over,-steps):1;
  const q=clamp(sq/st.len*Math.pow(JOIN.q,c.joins)*lwF,0,1),dq=clamp(sd/st.len,0,1);
  for(const A of [sess.acc,sess.sit]){A.lineLen+=st.len;A.lineQ+=q*st.len;A.depthW+=st.len;A.depthQ+=dq*st.len;A.blow+=blows;}
  sess.acc.joins+=c.joins;
  if(steps>0)ssClock(sess,0,LW_FIT.passTrauma*steps);
  sess.cur=null;sess.next++;
  const res={q:dsR(q),depth:dsR(dq),blowouts:blows,joins:c.joins,lwSteps:steps};
  sess.lastStroke=res;
  ssAfterItem(sess);
  return res;
}
function ssAfterItem(sess){
  const plan=ssPlan(sess);
  if(sess.next>=sess.end||sess.next>=plan.items.length){if(!sess.stop)sess.stop="done";return;}
  const it=plan.items[sess.next];
  if(it.k==="line"){const lw=plan.strokes[it.i].lw,B=SIM.kitBands(sess.kit,sess.skills,sess.settings,{liner:sess.liner});
    if(!(lw>=B.lineBand[0]&&lw<=B.lineBand[1])){const best=ssBestLiner(sess,lw);if(best)sess.autoLiner=best;}else sess.autoLiner=null;}
}
function sessionSetLiner(sess,id){
  const B=SIM.kitBands(sess.kit,sess.skills,sess.settings);if(!B.liners.some(l=>l.id===id))return false;
  if(sess.pen)return false;sess.liner=id;sess.autoLiner=null;return true;
}
/* leave the current zone (or give up the rest of the current line) */
function sessionNextItem(sess){
  const it=sessionItem(sess);if(!it||sess.pen)return false;
  if(it.k==="line"){ssFinishStroke(sess);return true;}
  sess.next++;ssAfterItem(sess);return true;
}
function sessionAction(sess,kind){
  const m=sess.m;
  if(sess.kind==="practice"||!sess.client)return{ok:false,why:"Fake skin doesn't need a break."};
  if(kind==="break"){
    if(m.breaks>=BREAK.max)return{ok:false,why:"They want to get it finished, not another break."};
    const eff=Math.pow(BREAK.fade,m.breaks);m.pain*=1-BREAK.pain*eff;m.fatigue*=1-BREAK.fatigue*eff;m.breaks++;m.clock+=BREAK.hours;
    return{ok:true,eff:dsR(eff)};}
  if(kind==="numb"){
    if(m.numbs>=NUMB.max)return{ok:false,why:"The cream is already on."};
    m.numbs++;m.numbH=NUMB.hours;m.pain*=1-NUMB.now;
    return{ok:true,cost:Math.round(NUMB.price*(SIM.priceIndex?SIM.priceIndex(sess.year):1)/10)*10};}
  if(kind==="chat"){
    if(m.chats>=CHAT.max)return{ok:false,why:"You've talked yourselves out."};
    if(m.chatH>0)return{ok:false,why:"You're already chatting."};
    m.chats++;const talk=clamp(sess.client.traits.talkative,0,1);m.chatH=CHAT.hours;
    if(talk<CHAT.quiet)m.fatigue+=CHAT.annoy;
    return{ok:true,talk:dsR(talk)};}
  return{ok:false,why:"?"};
}
/* the piece's outputs from progress */
function ssOut(acc,zsat,plan,b){
  const lineQ=acc.lineLen>0?acc.lineQ/acc.lineLen:1,depthQ=acc.depthW>0?acc.depthQ/acc.depthW:0.75;
  let sw=0,ss=0;plan.zones.forEach((z,i)=>{const w=z.area*z.target;sw+=w;ss+=w*Math.min(1,(zsat[i]||0)/z.target);});
  const sat=sw>0?clamp(ss/sw*b.sat,0,1):clamp(b.sat*(0.72+0.28*depthQ),0,1);
  return{lineQuality:dsR(clamp(lineQ,0,1)),depthQuality:dsR(clamp(depthQ,0,1)),saturation:dsR(sat),trauma:dsR(1-Math.exp(-acc.trauma))};
}
function sessionFinish(sess){
  const plan=ssPlan(sess),b=ssBands(sess),done=sess.next>=plan.items.length;
  const acc=Object.assign({},sess.acc,{sittings:sess.acc.sittings+1,hours:dsR(sess.acc.hours+sess.m.clock)});
  const progress={next:sess.next,zsat:sess.zsat.map(dsR),acc,cur:done?null:sess.cur};
  const out=ssOut(acc,sess.zsat,plan,b),S0=sess.sit;
  const sitting={lineQuality:S0.lineLen>0?dsR(S0.lineQ/S0.lineLen):null,depthQuality:S0.depthW>0?dsR(S0.depthQ/S0.depthW):null,
    blowouts:S0.blow,joins:S0.joins,trauma:dsR(1-Math.exp(-S0.trauma)),hours:dsR(sess.m.clock),items:sess.next-sess.start,pain:dsR(sess.m.pain),fatigue:dsR(sess.m.fatigue)};
  const early=!done&&sess.next<sess.end;
  return{done,early,stop:sess.stop||(early?"artist":"done"),out:Object.assign({},out,{sessionsUsed:acc.sittings,blowouts:acc.blow,joins:acc.joins}),
    sitting,progress,part:sess.part,partsTotal:sess.partsTotal,sessionsUsed:acc.sittings,
    nextPart:done?null:early?sess.part:Math.min(sess.part+1,sess.partsTotal),left:plan.items.length-sess.next};
}
function sessionXp(res,sess,skills){
  const T=SKILL_XP[sess.kind]||SKILL_XP.sample,sk=skills||{},o={styles:{}};
  const g=(k,q)=>{const lvl=clamp(+sk[k]||0,0,10);return dsR(T[k]*(SKILL_XP.floor+(1-SKILL_XP.floor)*clamp(q,0,1))*(1-SKILL_XP.diminish*lvl/10));};
  const S0=sess.sit,lq=S0.lineLen>0?S0.lineQ/S0.lineLen:0;
  o.linework=S0.lineLen>0?g("linework",lq):0;
  o.shading=S0.zoneWork.shade>0?g("shading",res.out.saturation):0;
  o.colour=S0.zoneWork.colour>0?g("colour",res.out.saturation):0;
  o.speed=g("speed",1-res.out.trauma);
  const st=sess.design.style;if(st){const lvl=clamp(+((sk.styles||{})[st])||0,0,10);o.styles[st]=dsR(T.style*(1-SKILL_XP.diminish*lvl/10)*(0.5+0.5*lq));}
  return o;
}
/* a synthetic trace of the current stroke for tests: {speed (x target pace), noise (mm, deterministic wobble), dtMs,
   stopAt (share of the stroke), stopMs, lift (true: lift and come back instead of stopping)} -> [[t,x,y],...] contacts */
function sessionSynth(sess,o){
  o=o||{};const it=sessionItem(sess);if(!it||it.k!=="line")return[];
  const st=it.stroke,b=ssBands(sess),v=b.paceMmS*(o.speed||1),dt=o.dtMs||16,u0=sess.cur?sess.cur.u:0,out=[];
  let t=o.t0||0,u=u0,cur=[],stopped=false,k=0;
  const wob=uu=>(o.noise||0)*Math.sin(uu*(o.wave||0.35)+0.4)*Math.cos(uu*(o.wave||0.35)*0.37);   // a slow hand wobble
  const pt=uu=>{const a=ssPointAt(st,uu),b2=ssPointAt(st,Math.min(st.len,uu+0.5)),nx=-(b2[1]-a[1]),ny=b2[0]-a[0],nl=Math.hypot(nx,ny)||1,w=wob(uu);return[a[0]+nx/nl*w,a[1]+ny/nl*w];};
  const push=uu=>{const p=pt(uu);cur.push([t,p[0],p[1]]);k++;};
  push(u);
  while(u<st.len){
    t+=dt;u=Math.min(st.len,u+v*dt/1000);
    if(o.stopAt!=null&&!stopped&&u>=st.len*o.stopAt){
      stopped=true;
      if(o.lift){push(u);out.push(cur);cur=[];t+=o.stopMs||600;push(u);continue;}
      const tEnd=t+(o.stopMs||600);while(t<tEnd){push(u);t+=dt;}
    }
    push(u);
  }
  out.push(cur);
  return out;
}
/* run contacts through the pen (tests and the browser check) */
function sessionTrace(sess,contacts){let last=null;
  for(const c of contacts){if(!c.length)continue;const d=penDown(sess,c[0][0],c[0][1],c[0][2]);if(!d.ok)return d;
    for(let i=1;i<c.length;i++)penMove(sess,c[i][0],c[i][1],c[i][2]);last=penUp(sess,c[c.length-1][0]);}
  return last;}
function sessionResume(sess){sess.pen=null;return sess;}

/* ===== sim/kit.js: the kit: MACHINES, NEEDLES, INKS, VOLTAGE and STROKE, and the session bands they give (PR 4) =====
   The kit is a build system (plan Q9): a machine, a tray of needle groupings, an ink tier and two sliders. Nothing in the
   game depends on it except the session (sim/session.js reads the bands) and aging (sim/aging.js reads INKS for fade and
   spread). INKS is the one table of ink tiers: aging.js reads SIM.INKS at call time, and SIM.INK_TIERS is the same object.
     kit = {machine: MACHINES id, needles: [NEEDLES ids on the tray], ink: INKS id, voltage, stroke (mm),
            owned: {machines:[ids], needles:[ids], inks:[ids]}}    (S.kit; KIT_DEFAULT is the apprentice's starter kit)
     SIM.kitBands(kit, skills, settings, opts?) -> the session bands (below). opts.liner picks the liner in use (default the
       first liner on the tray). settings.assist widens the bands and slows the marker (ASSIST).
     SIM.kitDeltas(kitA, kitB, skills?, settings?) -> what changing kitA into kitB does, for the Studio build panel:
       {band, pace, lineLo, lineHi, shade, trauma, fade} (band/pace/shade/trauma/fade are ratios - 1, so +0.12 = 12% more;
       lineLo/lineHi are steps in LINE_WEIGHTS for the tray's whole line range)
     SIM.kitPrice(kind, id, year) -> rubles in that year (prices in the tables are 2000 rubles x SIM.priceIndex(year))
     SIM.kitClean(kit) -> a valid kit (unknown ids dropped, sliders clamped, the starter kit for anything missing)
   The bands:
     paceBand   how far your speed may stray from the target pace and still count as steady (0.35 = within 35%)
     accFrac    how far off the stencil line still counts as on it, as a share of the view size (session.js turns it to mm)
     pace       the target pace multiplier (1 = PACE.frac of the view per second); faster machines set a quicker marker
     hit        how hard the needle hits at the target pace (1 = ideal depth); depthTol how forgiving depth is
     trauma     multiplier on skin trauma; pain the machine's share of the client's pain rate
     shade, colour   saturation per unit of sweeping (mags fill fastest)
     lineBand [lo, hi] RL the liner in use lays cleanly; lineAll [lo, hi] for the whole tray; lineMm [lo, hi] in mm
     fade, spread, sat    the ink tier (sat caps how solid colour and black pack)
     buzz       the machine's synth profile (sound/synth.js)
   Private helpers start with kt. ===== */

  rotary:{id:"rotary",name:"Rotary",kind:"rotary",band:1.14,trauma:0.86,depth:1.08,pain:0.94,price:14000,from:2000,

   how fast it fills a shaded or coloured zone (mags are made for it). price is 2000 rubles for a box */

/* ink tiers, brand-less. fade and spread multiply the aging model's rates; sat caps how solid it packs. price 2000 rubles */
const INKS={
  budget:{id:"budget",name:"Budget",fade:1.25,spread:1.1,sat:0.86,price:600,note:"Cheap and thin. Greys out early."},
  standard:{id:"standard",name:"Standard",fade:1,spread:1,sat:1,price:2200,note:"What most shops pour."},

/* the two sliders */
const VOLTAGE={min:5,max:10,def:7,step:0.1,unit:"V"};
const STROKE={min:2.5,max:4.5,def:3.5,step:0.1,unit:"mm"};
/* how the sliders and the rest turn into bands. dv = volts over VOLTAGE.def, ds = mm over STROKE.def */
const KIT_TUNE={
  paceBase:0.36,accBase:0.03,depthTol:0.45,   // pace band (share), stencil tolerance (share of the view), depth tolerance (log)
  paceV:0.09,paceS:0.1,                      // target pace per volt and per mm of stroke
  bandV:0.07,bandS:0.06,bandFloor:0.45,      // the band narrows per volt / mm (never below bandFloor of itself)
  hitV:0.05,hitS:0.09,                       // the needle hits harder per volt / mm
  traumaV:0.08,traumaS:0.12,                 // trauma per volt / mm
  painV:0.04,                                // pain per volt
  shadeS:0.12,shadeV:0.04,colour:0.85,       // shading fills faster with a longer stroke; colour packs at this share of shade
  noMag:0.55,                                // with no mag on the tray, the biggest liner shades at this share of its rate
  skillBand:0.45,skillAcc:0.35,skillDepth:0.4,skillShade:0.3   // skill 10 adds these shares
};
/* Assist (Settings): a wider pace band and stencil tolerance, a slower marker */
const ASSIST={band:1.6,acc:1.4,slow:0.75};
/* the apprentice's starter kit (freshState in app/state.js writes the same literal) */
const KIT_DEFAULT={machine:"coil_used",needles:["3RL","7RL","7M1"],ink:"budget",voltage:7,stroke:3.5,
  owned:{machines:["coil_used"],needles:["3RL","7RL","7M1"],inks:["budget"]}};
const KIT_TRAY_MAX=5;   // groupings on the tray at once

function ktCopy(o){return JSON.parse(JSON.stringify(o));}
function kitClean(kit){
  const k=kit&&typeof kit==="object"?kit:{},d=KIT_DEFAULT;
  const ow=k.owned&&typeof k.owned==="object"?k.owned:{};
  const list=(a,T,def)=>{const v=Array.isArray(a)?a.filter((x,i)=>T[x]&&a.indexOf(x)===i):[];return v.length?v:def.slice();};
  const owned={machines:list(ow.machines,MACHINES,d.owned.machines),needles:list(ow.needles,NEEDLES,d.owned.needles),inks:list(ow.inks,INKS,d.owned.inks)};
  const num=(v,R)=>typeof v==="number"&&isFinite(v)?clamp(Math.round(v*10)/10,R.min,R.max):R.def;
  let needles=list(k.needles,NEEDLES,d.needles).filter(n=>owned.needles.indexOf(n)>=0).slice(0,KIT_TRAY_MAX);
  if(!needles.length)needles=owned.needles.slice(0,KIT_TRAY_MAX);
  return{machine:MACHINES[k.machine]&&owned.machines.indexOf(k.machine)>=0?k.machine:owned.machines[0],
    needles,ink:INKS[k.ink]&&owned.inks.indexOf(k.ink)>=0?k.ink:owned.inks[0],
    voltage:num(k.voltage,VOLTAGE),stroke:num(k.stroke,STROKE),owned};
}
/* a liner's clean range in LINE_WEIGHTS terms */
function ktLinerBand(n){
  const LW=SIM.LINE_WEIGHTS||[1,3,5,7,9,11,14],i=LW.indexOf(n.rl);
  if(i<0)return[n.rl,n.rl];
  return[LW[Math.max(0,i-n.reach)],LW[Math.min(LW.length-1,i+n.reach)]];
}
function kitBands(kit,skills,settings,opts){
  kit=kit||KIT_DEFAULT;skills=skills||{};opts=opts||{};
  const T=KIT_TUNE,m=MACHINES[kit.machine]||MACHINES[KIT_DEFAULT.machine],ink=INKS[kit.ink]||INKS[KIT_DEFAULT.ink];
  const v=typeof kit.voltage==="number"?clamp(kit.voltage,VOLTAGE.min,VOLTAGE.max):VOLTAGE.def;
  const s=typeof kit.stroke==="number"?clamp(kit.stroke,STROKE.min,STROKE.max):STROKE.def;
  const dv=v-VOLTAGE.def,ds=s-STROKE.def,assist=!!(settings&&settings.assist);
  const sk=k=>clamp(+skills[k]||0,0,10)/10;
  const narrow=Math.max(T.bandFloor,(1-T.bandV*dv)*(1-T.bandS*ds));
  const ns=(Array.isArray(kit.needles)?kit.needles:[]).map(id=>NEEDLES[id]).filter(Boolean);
  const liners=ns.filter(n=>n.kind==="liner").map(n=>{const b=ktLinerBand(n);return{id:n.id,rl:n.rl,lo:b[0],hi:b[1]};});
  const mags=ns.filter(n=>n.kind==="mag");
  const act=liners.find(l=>l.id===opts.liner)||liners[0]||null;
  const lineBand=act?[act.lo,act.hi]:[1,1];
  const lineAll=liners.length?[Math.min(...liners.map(l=>l.lo)),Math.max(...liners.map(l=>l.hi))]:[1,1];
  const mm=rl=>SIM.lineMm?SIM.lineMm(rl):rl*0.12;
  let shade0=mags.length?Math.max(...mags.map(n=>n.shade)):0;
  if(!shade0){const big=ns.filter(n=>n.kind==="liner").sort((a,b)=>b.rl-a.rl)[0];shade0=big?big.shade*T.noMag:0.1;}
  const machineShade=lerp(1,1/m.trauma,0.5);
  const shade=shade0*(1+T.shadeS*ds)*(1+T.shadeV*dv)*machineShade;
  return{
    paceBand:T.paceBase*m.band*narrow*(1+T.skillBand*sk("linework"))*(assist?ASSIST.band:1),
    accFrac:T.accBase*Math.sqrt(m.band)*Math.sqrt(narrow)*(1+T.skillAcc*sk("linework"))*(assist?ASSIST.acc:1),
    pace:(1+T.paceV*dv)*(1+T.paceS*ds)*(assist?ASSIST.slow:1),
    hit:(1+T.hitV*dv)*(1+T.hitS*ds),
    depthTol:T.depthTol*m.depth*(1+T.skillDepth*sk("linework")),
    trauma:m.trauma*(1+T.traumaV*dv)*(1+T.traumaS*ds),
    pain:m.pain*(1+T.painV*dv),
    shade:shade*(1+T.skillShade*sk("shading")),
    colour:shade*T.colour*(1+T.skillShade*sk("colour")),
    liner:act?act.id:null,liners,lineBand,lineAll,lineMm:[mm(lineAll[0]),mm(lineAll[1])],
    fade:ink.fade,spread:ink.spread,sat:ink.sat,
    buzz:m.buzz,machine:m.id,ink:ink.id,assist
  };
}
function kitDeltas(a,b,skills,settings){
  const A=kitBands(a,skills,settings),B=kitBands(b,skills,settings),LW=SIM.LINE_WEIGHTS||[1,3,5,7,9,11,14];
  const r=(x,y)=>Math.round((y/x-1)*1000)/1000,st=v=>LW.indexOf(v);
  return{band:r(A.paceBand,B.paceBand),pace:r(A.pace,B.pace),lineLo:st(B.lineAll[0])-st(A.lineAll[0]),lineHi:st(B.lineAll[1])-st(A.lineAll[1]),
    shade:r(A.shade,B.shade),trauma:r(A.trauma,B.trauma),fade:r(A.fade,B.fade)};
}
function kitPrice(kind,id,year){
  const T=kind==="machine"?MACHINES:kind==="needle"?NEEDLES:INKS,it=T[id];if(!it)return 0;
  const pi=SIM.priceIndex?SIM.priceIndex(year||2000):1;
  return Math.round(it.price*pi/50)*50;
}

SIM.KIT_TUNE=KIT_TUNE;SIM.ASSIST=ASSIST;SIM.KIT_DEFAULT=KIT_DEFAULT;SIM.KIT_TRAY_MAX=KIT_TRAY_MAX;

function caFill(dst,src){for(const k in src){if(dst[k]==null)dst[k]=src[k];else if(src[k]&&typeof src[k]==="object"&&!Array.isArray(src[k])&&typeof dst[k]==="object"&&!Array.isArray(dst[k]))caFill(dst[k],src[k]);}return dst;}

/* ---- money: every ruble in or out goes through these, so the week has a ledger ---- */

  if(S.career&&S.career.money){const m=S.career.money;m.cur.in[kind]=(m.cur.in[kind]||0)+amt;m.total.in+=amt;}return amt;}

  if(S.career&&S.career.money){const m=S.career.money;m.cur.out[kind]=(m.cur.out[kind]||0)+amt;m.total.out+=amt;}return amt;}
function caSum(o){let s=0;for(const k in o||{})s+=o[k];return s;}

/* ---- the rate ---- */
function rateFor(S){
  const st=caStage(S),R=RATE_BY_REP;if(!R.base[st])return 0;
  let r=R.base[st];for(const k in R.perRep)r+=R.perRep[k]*((S.rep&&+S.rep[k])||0);
  const sig=signatureOf(S);r*=1+R.sig*(sig.ready?sig.strength:0);
  r*=1+R.lighting*((S.studio&&S.studio.build&&S.studio.build.lighting)||0);
  if(typeof SIM.rateMod==="function")r*=SIM.rateMod(S);   // PR 8: matching a rival's prices
  return Math.round(r*caPI(S)/R.round)*R.round;}

/* ---- skills: one curve for every source (SKILL_XP.diminish, as the session uses) ---- */

function skillGain(S,k,base){
  if(!S.skills)S.skills={styles:{}};const sk=S.skills;if(!sk.styles)sk.styles={};
  const st=/^style:(\w+)$/.exec(k),lvl=st?(+sk.styles[st[1]]||0):(+sk[k]||0);
  const g=base*(1-SKILL_XP.diminish*clamp(lvl,0,10)/10),v=Math.round(Math.min(10,lvl+g)*1000)/1000;
  if(st)sk.styles[st[1]]=v;else sk[k]=v;return g;}
/* the next element a style level opens: {level, names[]} or null */
function skillNextUnlock(style,level){
  let best=null;for(const e of SIM.ELEMENTS||[]){const m=/^style:(\w+):(\d+)$/.exec(e.unlock||"");if(!m||m[1]!==style)continue;const n=+m[2];
    if(n>Math.floor(level||0)&&(!best||n<best.level))best={level:n,names:[e.name]};else if(best&&n===best.level)best.names.push(e.name);}
  return best;}

/* ---- the signature ---- */
function caPlaceBase(id){return String(id||"").replace(/_[lr]$/,"");}
function caSigUpdate(S){
  const C=S.career,sg=C.sig;
  for(let i=sg.at;i<S.pieces.length;i++){const p=S.pieces[i];if(!p||p.by||!p.design)continue;
    const d=p.design;sg.n++;if(d.style)sg.styles[d.style]=(sg.styles[d.style]||0)+1;
    const el=caTopEl(d);if(el)sg.els[el]=(sg.els[el]||0)+1;
    const pl=caPlaceBase(d.placement);if(pl)sg.places[pl]=(sg.places[pl]||0)+1;}
  sg.at=S.pieces.length;}
function caTopEl(d){let best=null,bs=-1;for(const e of d.elements||[]){const el=SIM.elementById?SIM.elementById(e.id):null;if(!el||el.family==="fill"||el.family==="texture")continue;if((e.scale||0)>bs){bs=e.scale||0;best=e.id;}}return best;}
const caTop=o=>{let b=null,n=0,t=0;for(const k in o||{}){t+=o[k];if(o[k]>n){n=o[k];b=k;}}return{k:b,n,t};};
/* signatureOf(S) -> {ready, style, el, place, share, strength 0..1, n} */
function signatureOf(S){
  const sg=S.career&&S.career.sig;if(!sg||!sg.n)return{ready:false,style:null,el:null,place:null,share:0,strength:0,n:0};
  const st=caTop(sg.styles),el=caTop(sg.els),pl=caTop(sg.places),share=st.t?st.n/st.t:0;
  const ready=sg.n>=SIGNATURE.pieces&&share>=SIGNATURE.share;
  const strength=ready?caR3(clamp((share-SIGNATURE.share)/(1-SIGNATURE.share)*0.6+0.4,0,1)*Math.min(1,sg.n/SIGNATURE.full)):0;
  return{ready,style:st.k,el:el.k,place:pl.k,share:caR3(share),strength,n:sg.n};}
/* a walk-in who asks for "your thing" (called by market.js generateWalkins) */
function sigApply(c,sig,r){

  if(el&&el.tags&&el.tags[0]&&A.tags.indexOf(el.tags[0])<0)A.tags.unshift(el.tags[0]);
  c.wants.styles[sig.style]=1;if(c.known&&c.known.styles.indexOf(sig.style)<0)c.known.styles.push(sig.style);

  const left=weekIndex(1,2000+ACTS.apprentice.years[1])-weekIndex(S.week,S.year),early=left>0,G=MENTOR.goodwill;

/* softFail(S): the studio closes (plan Q12). Staff go, apprentices go, the lease and the build-out go; you rent a chair

function softFail(S,ctx){

  for(const s of S.studio.staff)C.alumni.push({id:s.id,name:s.name,style:s.style,y:S.year,why:"let go when the shop closed",pieces:s.pieces||0});
  for(const a of C.apprentices)if(a.status==="training"){a.status="gone";a.end={w:S.week,y:S.year};a.where="found another shop when yours closed";}

/* the walk-in multiplier and the extra segments the shop adds (market.js) */
function shopWalkins(S){
  const st=caStage(S),b=(S.studio&&S.studio.build)||{},out={mult:1,seg:{}};if(!S.studio)return out;
  if(st==="studio"||st==="legacy"){
    for(const k of ["waiting","flash","storefront"])out.mult+=(STUDIO_STAGES[k].walkins||0)*(b[k]||0);
    const v=VIBES[S.studio.vibe];if(v){out.mult+=v.walkins*Math.min(1,b.storefront||0);for(const s in v.seg)out.seg[s]=v.seg[s]*(0.5+0.5*(b.storefront||0));}
    out.mult+=STAFF.shopWalkins*((S.studio.rep||0)/100);}
  if(st!=="apprentice")out.mult+=(MARKETING[S.studio.marketing||0]||MARKETING[0]).walkins;
  const g=S.career&&S.career.guest;
  if(g&&weekIndex(S.week,S.year)<=g.until){const G=GUEST_SPOTS.find(x=>x.id===g.id);if(G){out.mult*=G.walkins;out.styles=G.styles;out.guest=G.id;}}
  if(typeof SIM.rivalWalkins==="function")SIM.rivalWalkins(S,out);   // PR 8: rival shops pull walk-ins away
  out.mult=Math.max(0.3,out.mult);

function caName(r){const c=makeClient(r,{id:"x0",year:2010,badIdea:false});return{name:c.name,first:c.first,pronouns:c.pronouns};}

/* simStaffSession(staff, design, {kit, shop, r}) -> outputs like the session's {lineQuality, depthQuality, saturation, trauma,
   sessionsUsed, blowouts, joins}: from the artist's skill, the shop's kit (SIM.kitBands) and its lighting and steril room.
   No minigame; the same heal and aging rules apply to what it makes */
function simStaffSession(staff,design,opts){
  opts=opts||{};const T=STAFF.out,sk=clamp(+staff.skill||0,0,10),shop=opts.shop||{},b=shop.build||{};
  const r=opts.r||rng(hash((staff.id||"s")+":"+JSON.stringify(design||{}).length+":"+((design&&design.sizeMm)||0)));
  const kb=kitBands(opts.kit||null,{linework:sk,shading:sk,colour:sk,speed:sk},{});
  const steady=clamp(kb.paceBand/0.25,0.7,1.4),light=STUDIO_STAGES.lighting.staffLine*(b.lighting||0);
  const lineQ=clamp(T.line+T.lineSkill*sk+0.08*(steady-1)+light+r.normal(0,T.sd),0.15,0.98);
  const depthQ=clamp(T.depth+T.depthSkill*sk+0.05*(steady-1)+r.normal(0,T.sd),0.15,0.98);
  const sat=clamp((T.sat+T.satSkill*sk)*clamp(kb.sat||1,0.8,1.2)+r.normal(0,T.sd),0.15,0.98);
  const trauma=clamp((T.trauma+T.traumaSkill*sk)*kb.trauma-STUDIO_STAGES.steril.trauma*(b.steril||0)+r.normal(0,T.sd),0.03,0.97);
  const lam=Math.max(0,(1-sk/10)*T.blowSkill*((design&&design.sizeMm)||60)/80);
  let blow=0;{const L=Math.exp(-lam);let p=1;do{blow++;p*=r();}while(p>L&&blow<20);blow--;}
  const joins=r.int(0,Math.max(0,Math.round(3-sk/3)));

/* one staff piece: a client off the shop's walk-in flow, a design in the artist's style, the outputs; the shop takes its cut */
function caStaffPiece(S,s,r,ctx,client){
  const st=caStage(S),sizes=WALKINS.sizes[st]||WALKINS.sizes.studio;
  const c=client||makeClient(r.fork("c"),{id:"x0",year:S.year,week:S.week,stage:st,sizes,style:s.style,badIdea:false,styleMult:{[s.style]:3}});

  const who=real?client:{id:"x"+(S.pieces.length+1),first:c.first,history:[],pieces:[]};
  const p=addPiece(S,{client:who,design,out,heal:null,price});
  p.by=s.id;if(!real)p.guest={n:c.first,t:c.skinTone,a:c.traits.aftercare,s:c.traits.sun};
  p.ink=(S.kit&&S.kit.ink)||"budget";p.machine=(S.kit&&S.kit.machine)||"coil_used";

function caStaffWeek(S,ctx){
  const r=ctx.r.fork("staff"),staff=S.studio.staff;if(!staff.length)return;
  let made=0,cuts=0;const leaving=[];
  const flow=STAFF.perWeek*(0.7+0.5*((S.studio.rep||0)/100)+0.3*(((S.rep&&S.rep.walkins)||0)/100))*mkSeason(S.week);
  for(const s of staff){
    const rs=r.fork(s.id);
    const n=Math.floor(flow)+(rs.chance(flow-Math.floor(flow))?1:0);
    for(let i=0;i<n;i++){const p=caStaffPiece(S,s,rs.fork("p"+i),ctx);if(p){made++;cuts+=Math.round(p.price*s.cut);}}
    s.skill=caR3(Math.min(10,s.skill+STAFF.grow*(1-s.skill/10)));
    const fair=s.cut<=fairCut(s.skill)+STAFF.loyalty.slack;
    s.loyalty=caR3(clamp(s.loyalty+(fair?STAFF.loyalty.fair:STAFF.loyalty.unfair*(1+s.ego)),0,1));
    const pq=STAFF.poachBase*s.poach*(1.4-s.loyalty)*(1+s.ego);
    if(rs.chance(pq))leaving.push(s);
  }
  for(const s of leaving){letGo(S,s.id,"poached by another shop");caLog(ctx,"event",s.name+" leaves for another shop. Their regulars may follow.",{staff:s.id});}
  if(made)caLog(ctx,"cost","Your artists finished "+made+(made===1?" piece":" pieces")+"; the shop's cut: "+caFmt(cuts)+".");}
const caFmt=n=>Math.round(n).toLocaleString("en-CA")+" ₽";

/* ---- apprentices (Act 4): they inherit a blend of your signature and their own leaning ---- */
function takeApprentice(S){
  const C=careerEnsure(S),st=caStage(S);if(st!=="studio"&&st!=="legacy")return{ok:false,why:"stage"};
  if(C.apprentices.some(a=>a.status==="training"))return{ok:false,why:"one"};
  const r=rng(S.seed).fork("app:"+C.apprentices.length),nm=caName(r.fork("n")),styles=Object.keys(SIM.STYLES||{traditional:1});
  const lean=r.pick(styles),sig=signatureOf(S),mine=sig.ready&&r.chance(0.35+0.5*sig.strength);

    skill:caR3(r.range(APPRENTICES.skill[0],APPRENTICES.skill[1])),bond:APPRENTICES.bond.start,start:{w:S.week,y:S.year},status:"training"};
  C.apprentices.push(a);return{ok:true,apprentice:a};}
function caApprenticeWeek(S,ctx){
  const C=S.career;for(const a of C.apprentices){if(a.status!=="training")continue;
    cashOut(S,caRub(S,APPRENTICES.stipend),"apprentice");
    a.skill=caR3(Math.min(10,a.skill+APPRENTICES.grow*(1-a.skill/10)));
    a.bond=caR3(clamp(a.bond+APPRENTICES.bond.week,0,1));
    if(weekIndex(S.week,S.year)-weekIndex(a.start.w,a.start.y)<APPRENTICES.weeks)continue;
    const r=ctx.r.fork("grad:"+a.id),stay=a.bond+r.normal(0,APPRENTICES.bond.sd)>=APPRENTICES.bond.staffAt&&staffRoom(S)>0;
    a.end={w:S.week,y:S.year};
    /* their first solo piece lands on a client you share: your most loyal regular on the books */
    let share=null;for(const c of S.clients)if(!c.compact&&(c.pieces||[]).length&&(!share||c.loyalty>share.loyalty))share=c;
    const s={id:"s"+(S.studio.nextStaff++),name:a.name,first:a.first,pronouns:a.pronouns,style:a.style,skill:Math.max(a.skill,3),ego:0.3,cut:fairCut(Math.max(a.skill,3)),poach:0.8,
      loyalty:0.7,hired:{w:S.week,y:S.year},pieces:0,earned:0,from:a.id};
    if(share){const p=caStaffPiece(S,s,r.fork("first"),ctx,share);if(p){a.piece=p.id;a.shared=share.id;}}
    if(stay){a.status="staff";a.where="took a station in your shop";S.studio.staff.push(s);

    else{a.status="rival";a.where=r.pick(APPRENTICES.rivalLines);C.rivals.push({name:a.name,style:a.style,el:a.el,from:"apprentice",y:S.year});
      caLog(ctx,"event",a.name+" finishes the apprenticeship and "+a.where+". Your style goes with them.",{apprentice:a.id});}
  }}

/* ---- invites: conventions, guest spots, the mentor's nudge, the TV offer ---- */
function caInvite(S,ctx,inv,text){const C=S.career;if(C.invites.some(i=>i.id===inv.id))return;inv.until=inv.until!=null?inv.until:weekIndex(S.week,S.year)+1;C.invites.push(inv);caLog(ctx,"event",text,{invite:inv.id});}
function caInvitesWeek(S,ctx){

    const g=ctx.r.fork("guestPick").pick(GUEST_SPOTS);
    caInvite(S,ctx,{id:"guest:"+g.id+":"+now,kind:"guest",spot:g.id,fee:caRub(S,g.travel),until:now+3},"A shop in "+g.name+" offers you a guest spot for "+g.weeks+" weeks.");}

}
/* enterInvite(S, id, yes) -> {ok, kind, ...result} */
function enterInvite(S,id,yes,picks){
  const C=careerEnsure(S),i=C.invites.findIndex(x=>x.id===id);if(i<0)return{ok:false};
  const inv=C.invites[i];
  if(inv.kind==="chair"){if(!yes)return{ok:true,kind:"chair",later:true};C.invites.splice(i,1);return Object.assign({kind:"chair"},rentChair(S));}
  C.invites.splice(i,1);
  if(inv.kind==="tv"){C.offers.tv=yes?"yes":"no";const T=LEGACY_OFFERS.tv;
    if(yes){cashIn(S,inv.pay,"tv");for(const k in T.rep)repAdd(S,k,T.rep[k]);}else for(const k in T.decline)repAdd(S,k,T.decline[k]);
    return{ok:true,kind:"tv",yes,pay:yes?inv.pay:0};}
  if(!yes)return{ok:true,kind:inv.kind,yes:false};
  if(inv.kind==="guest"){const G=GUEST_SPOTS.find(g=>g.id===inv.spot);cashOut(S,inv.fee,"travel");
    C.guest={id:G.id,until:weekIndex(S.week,S.year)+G.weeks};for(const k in GUEST.rep)repAdd(S,k,GUEST.rep[k]);
    return{ok:true,kind:"guest",spot:G,fee:inv.fee};}
  if(inv.kind==="conv")return Object.assign({ok:true,kind:"conv"},typeof SIM.convJudge==="function"?SIM.convJudge(S,inv,picks):caConvention(S,inv));

/* a convention: judged on your best portfolio piece today, your skill, your peers and how true you are to your signature */
function caConvention(S,inv){
  const C=S.career,cv=CONVENTIONS.find(c=>c.id===inv.conv),r=rng(S.seed).fork("conv:"+inv.id),W=CONV_SCORE;
  cashOut(S,inv.fee,"convention");
  let best=null,br=0;for(let i=S.pieces.length-1;i>=0;i--){const p=S.pieces[i];if(p.by||!p.portfolio)continue;const rd=caReads(S,p);if(rd>br){br=rd;best=p;}}
  if(!best)for(let i=S.pieces.length-1;i>=0&&i>=S.pieces.length-60;i--){const p=S.pieces[i];if(p.by||!p.heal)continue;const rd=caReads(S,p);if(rd>br){br=rd;best=p;}}
  const sk=S.skills||{},avg=(["linework","shading","colour","speed"].reduce((a,k)=>a+(+sk[k]||0),0)/4)/10;
  const sig=signatureOf(S),onSig=best&&sig.ready&&best.design.style===sig.style?1:sig.ready?0.4:0.2;
  const score=W.portfolio*br+W.skill*avg+W.peers*(((S.rep&&S.rep.peers)||0)/100)+W.sig*onSig*Math.max(0.3,sig.strength)+r.normal(0,W.sd);
  const place=score>=W.places[0]?1:score>=W.places[1]?2:score>=W.places[2]?3:0;

  repAdd(S,"peers",W.rep.peers[place?place-1:3]);repAdd(S,"collectors",W.rep.collectors[place?place-1:3]);
  if(best&&best.design.style)skillGain(S,"style:"+best.design.style,SKILL_XP.convention);
  const rec={id:cv.id,name:cv.name,y:S.year,place,piece:best?best.id:null,score:caR3(score)};C.conv.push(rec);
  return rec;}
function caReads(S,p){const c=findClient(S,p.client),g=p.guest;

  try{return SIM.age({design:p.design,out:p.out,heal:p.heal,skinTone:c?c.skinTone:g?g.t:0.3,sun:c&&c.traits?c.traits.sun:g?g.s:0.4},yrs).readability||0;}catch(e){return 0;}}
/* Act 4 projects: book, line, conv -> {ok, why} */

/* ---- the week (WEEK_HOOKS.costs) ---- */
function careerWeek(S,ctx){
  const C=careerEnsure(S),st=caStage(S),now=ctx.now,m=C.money;
  m.prev=m.cur;m.cur={in:{},out:{}};
  caSigUpdate(S);
  if(typeof SIM.rivalsCopy==="function"){const sg=signatureOf(S);if(sg.ready)SIM.rivalsCopy(S,sg,ctx);}   // PR 8: rivals copy your flash
  S.rate=rateFor(S);
  const out0=caSum(m.cur.out);
  /* the shop's cut of last week's takings */
  const took=((m.prev.in.sitting||0)+(m.prev.in.deposit||0));
  if(took>0&&(st==="apprentice"||st==="chair")){
    const k=st==="apprentice"?"apprentice":(C.split||"standard"),cut=Math.round(took*CHAIR_SPLIT[k]);
    cashOut(S,cut,st==="apprentice"?"mentor":"chair");}
  /* supplies for this week's booked hours (an apprentice uses the mentor's) */
  if(st!=="apprentice"){let h=0;for(const q of S.queue)if(q.kind==="session"&&weekIndex(q.w,q.y)===now)h+=q.hours||0;
    if(h)cashOut(S,caRub(S,SUPPLIES.perHour*h),"supplies");}
  if(st==="studio"||st==="legacy"){
    if(S.studio.lease)cashOut(S,caRub(S,LEASE.rentWeek+LEASE.utilities+STUDIO_STAGES.stations.upkeep*(S.studio.build.stations||0)),"rent");
    const mk=MARKETING[S.studio.marketing||0];if(mk&&mk.cost)cashOut(S,caRub(S,mk.cost),"marketing");
    if(!C.closed)caStaffWeek(S,ctx);
    if(S.studio.staff.length&&!C.closed)cashOut(S,caRub(S,SUPPLIES.shopPerHour*6*S.studio.staff.length),"supplies");
    caApprenticeWeek(S,ctx);
    S.studio.rep=Math.round((S.studio.rep||0)*(1-STAFF.shopRepDecay)*1000)/1000;
    caInspect(S,ctx);
  }
  if(st!=="apprentice"){
    const fl=(S.studio.build&&S.studio.build.flash)||0,mine=Math.min(40,(S.flash||[]).length);
    if(fl&&mine)cashIn(S,caRub(S,STUDIO_STAGES.flash.sales*fl*Math.min(1,mine/12)*(0.6+0.4*(((S.rep&&S.rep.walkins)||0)/100))),"flash");
    if(C.offers.book)cashIn(S,caRub(S,LEGACY_OFFERS.book.weekly),"book");
    if(C.offers.line)cashIn(S,caRub(S,LEGACY_OFFERS.line.weekly),"merch");
    caNoShows(S,ctx);}
  caInvitesWeek(S,ctx);
  /* the soft fail: cash under the floor for BROKE.weeks in a row closes the studio (once, Arkady may cover you) */

/* ===================== social media ===================== */
function followersTarget(S){return Math.max(SOCIAL.start.min,Math.round(SOCIAL.start.perRep*Math.pow(evRepSum(S),2)/10));}
function evPostIndex(W){const m={};for(const p of W.social.posts)m[p[0]]=p;return m;}
const evPid=id=>+String(id).slice(1);
/* canPost(S, piece) -> null if it can be posted, else why */
function canPost(S,p){
  const W=worldEnsure(S);if(S.year<SOCIAL.from||!W.social.on)return "year";

/* the quality a post is judged on: half the design's total score for its client, half how it reads today */
function evPieceQ(S,p){

  try{if(c&&c.wants)tot=scoreDesign(p.design,c,S.skills||{},{year:p.y}).total;}catch(e){}

/* postPiece(S, pieceId) -> {ok, why?, reach, gained, followers, viral, q} */
function postPiece(S,id){
  const W=worldEnsure(S),p=S.pieces.find(x=>x.id===id),why=canPost(S,p);if(why)return{ok:false,why};
  const R=SOCIAL.reach,so=W.social,r=rng(S.seed).fork("post:"+id),q=evPieceQ(S,p);
  let reach=(R.base+R.score*q*q)*(R.heal[p.heal]!=null?R.heal[p.heal]:0.5)*(1+R.follow*Math.sqrt(so.followers))*Math.exp(r.normal(0,R.sd));
  let viral=false;const V=SOCIAL.viral;
  if(!so.viral&&q>=V.minQ&&p.heal==="crisp"&&so.followers>=V.minFollowers&&r.chance(V.chance)){viral=true;reach*=V.mult;so.viral={piece:p.id,w:S.week,y:S.year};
    for(const k in V.rep)repAdd(S,k,V.rep[k]);}
  reach=Math.round(reach);const gained=Math.round(reach*SOCIAL.follow);
  so.followers+=gained;so.gained+=gained;
  so.posts.push([evPid(p.id),evNow(S),reach]);if(so.posts.length>SOCIAL.postsCap)so.posts.splice(0,so.posts.length-SOCIAL.postsCap);
  const T=SOCIAL.toRep;repAdd(S,"walkins",gained/T.per*T.walkins);repAdd(S,"collectors",gained/T.per*T.collectors*q);
  return{ok:true,reach,gained,followers:so.followers,viral,q:Math.round(q*1000)/1000,text:viral?evFill(SOCIAL.lines.viral,{name:p.name}):null};}
function evSocialWeek(S,ctx){
  const W=S.world,so=W.social,now=ctx.now;
  if(S.year<SOCIAL.from)return;
  if(!so.on){so.on={w:S.week,y:S.year};so.followers=Math.max(so.followers,followersTarget(S));evLog(ctx,"event",SOCIAL.lines.start,{social:"start"});return;}
  so.followers=Math.max(0,Math.round(so.followers+(followersTarget(S)-so.followers)*SOCIAL.drift));
  /* clients post their bad heals (the heals hook ran earlier this week) */
  const B=SOCIAL.bad,rb=ctx.r.fork("badpost");
  for(let i=S.pieces.length-1;i>=0;i--){const p=S.pieces[i];if(now-weekIndex(p.w,p.y)>WEEK.healWeeks+1)break;
    if(p.by||!p.heal||p.healW!==S.week||p.healY!==S.year||!B.chance[p.heal])continue;
    if(!rb.fork(p.id).chance(B.chance[p.heal]))continue;
    const c=findClient(S,p.client);so.followers=Math.round(so.followers*(1-B.lose));so.bad++;for(const k in B.rep)repAdd(S,k,B.rep[k]);
    evLog(ctx,"event",evFill(rb.pick(SOCIAL.lines.bad),{first:c?c.first:"A client",label:p.label,pos:evPos(c),grade:(HEAL_GRADES[p.heal]||{}).name||p.heal}),{piece:p.id,client:p.client,social:"bad"});}

  if(walkinsOpen(S)&&ctx.r.fork("far").chance(Math.min(SOCIAL.bookings.max,so.followers/SOCIAL.bookings.per))){
    const r=ctx.r.fork("farClient"),st=caStage(S),c=makeClient(r,{id:clNextId(S),year:S.year,week:S.week,stage:st,sizes:WALKINS.sizes[st]||null,src:"social",badIdea:false,segBoost:{collector:0.8,large_scale:0.4}});
    c.brief=evFill(r.pick(SOCIAL.lines.far),{far:r.pick(SOCIAL.far)})+" "+c.brief;
    const due=weekFrom(now+r.int(1,3));
    S.queue.push({id:queueId(S),kind:"consult",src:"social",client:c.id,newClient:c,w:due.w,y:due.y,expires:weekIndex(due.w,due.y)+WEEK.consultWait,brief:c.brief,ask:c.ask});
    so.booked++;evLog(ctx,"referral",c.name+" found you online and is booked for a consult.",{client:c.id,social:"far"});}}

function evRivalDef(rv){return RIVALS.find(x=>x.id===rv.id)||{pull:0.07,style:rv.style,where:rv.where,tactic:rv.tactic,name:rv.shop||rv.name};}
const evRivalName=rv=>rv.shop||rv.name;
/* rivalWalkins(S, out): open rivals pull walk-ins (and their style) away; shopWalkins in sim/career.js calls it */
function rivalWalkins(S,out){
  if(caStage(S)==="apprentice")return out;
  for(const rv of evRivals(S)){if(rv.status!=="open")continue;const d=evRivalDef(rv),s=clamp(rv.str||0.4,0,1);

function evPush(S,ctx,ev,text){
  const W=S.world;ev.id="e"+(W.nextEv++);ev.w=S.week;ev.y=S.year;ev.until=evNow(S)+(ev.wait||EVENTS.wait);ev.text=text;
  if(ev.rival){const rv=evRivals(S).find(x=>x.id===ev.rival);if(rv)rv.last=evNow(S);}
  W.pending.push(ev);evLog(ctx,"event",text,{ev:ev.id,rival:ev.rival||undefined});return ev;}
function evRivalsWeek(S,ctx){
  const L=evRivals(S),now=ctx.now,st=caStage(S),r=ctx.r.fork("rivals"),repSum=evRepSum(S),Rs=RIVAL.str;
  /* openings */
  for(const d of RIVALS){if(L.some(x=>x.id===d.id)||S.year<d.open[0]||S.year>d.open[1])continue;
    if(!(r.fork("open:"+d.id).chance(RIVAL.openChance)||(S.year===d.open[1]&&S.week>=40)))continue;
    const rv={id:d.id,name:d.name,shop:d.name,where:d.where,style:d.style,tactic:d.tactic,says:d.says,opened:{w:S.week,y:S.year},str:Rs.start,mem:0,acts:{},status:"open",from:"rival"};
    L.push(rv);evLog(ctx,"event",evFill(EVENTS.rivalOpen,{rival:d.name,where:d.where,says:d.says}),{rival:d.id});}
  for(const rv of L){if(rv.status!=="open")continue;
    const rr=r.fork(rv.id);
    rv.str=Math.round(clamp(rv.str+Rs.grow-Rs.press*Math.max(0,repSum-RIVAL.close.repSum)/100,Rs.min,1)*1000)/1000;
    if(rv.str<=Rs.closeAt&&now-weekIndex(rv.opened.w,rv.opened.y)>=Rs.closeAfter){rv.status="gone";rv.gone={w:S.week,y:S.year};
      evLog(ctx,"event",evFill(EVENTS.rivalGone,{rival:evRivalName(rv),where:rv.where}),{rival:rv.id});continue;}
    if(st==="apprentice"||(rv.truce&&now<rv.truce)||(rv.last&&now-rv.last<RIVAL.cool)||S.world.pending.some(e=>e.rival===rv.id))continue;
    const grudge=Math.max(0,-(rv.mem||0)),base=2*rv.str*(1+grudge);
    if(rv.tactic==="undercut"&&rr.chance(RIVAL.act.undercut*base)){
      evPush(S,ctx,{kind:"undercut",rival:rv.id,choices:EVENTS.undercut.choices,dflt:EVENTS.undercut.dflt},evFill(EVENTS.undercut.text,{rival:evRivalName(rv),where:rv.where}));}
    else if(rv.tactic==="poach"&&S.studio.staff.length&&rr.chance(RIVAL.act.poach*base)){
      const s=S.studio.staff.slice().sort((a,b)=>a.loyalty-b.loyalty)[0];
      evPush(S,ctx,{kind:"poach",rival:rv.id,staff:s.id,choices:EVENTS.poach.choices,dflt:EVENTS.poach.dflt},evFill(EVENTS.poach.text,{rival:evRivalName(rv),staff:s.name}));}
    else if((rv.mem||0)>=RIVAL.respect.at&&rr.chance(RIVAL.respect.chance))evCoverPuzzle(S,ctx,rr.fork("resp"),rv);}}
/* rivalsCopy(S, sig, ctx): sim/career.js calls it each week once your signature is ready */
function rivalsCopy(S,sig,ctx){

/* ===================== choices ===================== */

  undercut(S,ev,ch,rv,r){const E=EVENTS.undercut,U=RIVAL.undercut,o={rival:evRivalName(rv)};

  copy(S,ev,ch,rv,r){const E=EVENTS.copy,C=RIVAL.copy,o={rival:evRivalName(rv)};rv.acts.copy=(rv.acts.copy||0)+1;
    if(ch==="call"){const sig=signatureOf(S);rv.mem=caR3(clamp((rv.mem||0)-0.3,-1,1));
      if(sig.strength>=0.4){repAdd(S,"peers",C.call.peers);rv.str=clamp(rv.str-0.03,RIVAL.str.min,1);return evFill(E.says.call,o);}

    if(ch==="fresh"){repAdd(S,"collectors",C.fresh.collectors);if(ev.style)skillGain(S,"style:"+ev.style,C.fresh.xp);S.world.mods.fresh=evNow(S)+26;return evFill(E.says.fresh,o);}
    for(const k in C.let)repAdd(S,k,C.let[k]);rv.str=clamp(rv.str+0.03,0,1);return evFill(E.says.let,o);},

/* eventChoose(S, id, choice) -> {ok, kind, choice, text} */
function eventChoose(S,id,choice){
  const W=worldEnsure(S),i=W.pending.findIndex(e=>e.id===id);if(i<0)return{ok:false};
  const ev=W.pending[i];W.pending.splice(i,1);

function onReturn(item,S){

  const st=evStart(S),R=RECKONINGS.first_year;if(S.year<st+R.years[0]||S.year>st+R.years[1])return;

/* reckoningChoose(S, itemId, choice) -> {ok, text, consult (true: go on to a normal consult), item (a free sitting)} */

/* ===================== cover-ups ===================== */
/* a foreign piece's stand-in design: one dark element that matches its tags, at its size and place */
function evForeignDesign(f){
  const E=SIM.ELEMENTS||[],tags=f.tags||(FOREIGN_PIECES.find(x=>x.label===f.label)||{}).tags||[];
  const words=String(f.label||"").split(/[^a-z]+/).filter(w=>w.length>3);
  let el=E.find(e=>(e.family==="motif"||e.family==="lettering")&&words.some(w=>e.id.indexOf(w)>=0))||E.find(e=>(e.family==="motif"||e.family==="lettering")&&tags.some(t=>(e.tags||[]).indexOf(t)>=0)&&(e.styles||[]).indexOf("traditional")>=0)
    ||E.find(e=>(e.family==="motif"||e.family==="lettering")&&tags.some(t=>(e.tags||[]).indexOf(t)>=0))||E.find(e=>e.family==="motif");
  return{placement:f.placement,style:"traditional",flash:null,sizeMm:f.sizeMm||50,pos:{x:0.5,y:0.45},
    elements:el?[{id:el.id,x:0.5,y:0.5,scale:1,rot:(hash(f.label+":"+f.y)%40)-20,lineWeight:11,fill:0.7,colour:null}]:[]};}
/* coverOld(S, item) -> the old piece a cover-up goes over: {design, years, heal, label, foreign} or null */
function coverOld(S,item){
  const ret=item&&item.ret;if(!ret||(ret.rule!=="cover_own"&&ret.rule!=="cover_other")||item.rework)return null;
  if(ret.foreign){const f=ret.foreign;return{design:evForeignDesign(f),years:Math.max(0,S.year-f.y),heal:"blownout",label:f.label,foreign:true,ink:"budget"};}
  const p=S.pieces.find(x=>x.id===ret.piece);if(!p)return null;
  return{design:p.design,years:Math.max(0,(S.year-p.y)+(S.week-p.w)/WEEKS_PER_YEAR),heal:p.heal,out:p.out,label:p.label,piece:p.id,foreign:false,ink:p.ink};}
/* the elements of a design as ellipses in placement millimetres (the board's dzFromDesign, without the DOM) */
function evEllipses(d,box,k){k=k||0.9;
  const els=(d&&d.elements||[]).filter(e=>SIM.elementById(e.id));if(!els.length||!d.sizeMm)return[];
  const fp=SIM.footprintOf(Object.assign({},d,{elements:els})),pos=d.pos||{x:0.5,y:0.5},sz=d.sizeMm,cx=pos.x*box.wrapMm,cy=pos.y*box.lengthMm;
  return els.map(e=>{const b=SIM.elementBox(e.id),mx=Math.max(b.w,b.h,1e-6),mm=(e.scale!=null?e.scale:0.5)*sz,el=SIM.elementById(e.id),a=(e.rot||0)*Math.PI/180;
    return{x:cx+((e.x!=null?e.x:0.5)-fp.cx)*sz,y:cy+((e.y!=null?e.y:0.5)-fp.cy)*sz,rx:Math.max(0.5,mm*b.w/mx/2*k),ry:Math.max(0.5,mm*b.h/mx/2*k),c:Math.cos(a),s:Math.sin(a),
      fam:el.family,fill:+e.fill||0,colour:e.colour||null};});}
const evIn=(E,x,y)=>{const dx=x-E.x,dy=y-E.y,u=dx*E.c+dy*E.s,v=-dx*E.s+dy*E.c;return(u*u)/(E.rx*E.rx)+(v*v)/(E.ry*E.ry)<=1;};
/* coverScore(design, old, box) -> {coverage 0..1, dark 0..1, text}: how much of the old piece's ink sits under dark, filled
   work. Lines alone don't hide a blowout; fills and textures in dark colours do */
function coverScore(design,old,box){
  const K=COVER_SCORE,O=evEllipses(old,box,K.oldK),N=evEllipses(design,box,K.newK);
  if(!O.length)return{coverage:1,dark:1,text:"Nothing to cover."};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const E of O){const r=Math.max(E.rx,E.ry);x0=Math.min(x0,E.x-r);y0=Math.min(y0,E.y-r);x1=Math.max(x1,E.x+r);y1=Math.max(y1,E.y+r);}
  let pts=0,got=0,dk=0;

    if(!O.some(E=>evIn(E,x,y)))continue;pts++;let best=0;
    for(const E of N){if(!evIn(E,x,y))continue;const col=(SIM.COLOURS||{})[E.colour||"black"],dark=1-0.8*((col&&col.light)||0.05);
      const dens=(K.family[E.fam]!=null?K.family[E.fam]:K.lineOnly+K.fillW*E.fill)*dark;if(dens>best)best=dens;}
    got+=Math.min(1,best/K.need);dk+=best;}

/* a cover-up job turns up: a new client with someone else's old piece (or one a respectful rival sends over) */

/* finishing a cover-up: how well it covered goes into the client's loyalty, your peers and their history */
function evFinish(S,itemId,res){
  const q=S.queue.find(x=>x.id===itemId),old=q&&(q.sessionNo||1)>=(q.sessions||1)?coverOld(S,q):null;

/* ===================== conventions ===================== */
/* convCandidates(S) -> {fresh: [pieces done in the last freshWeeks], healed: [healed pieces a year old or more, portfolio
   first, best reading first]}, each at most CONV_JUDGE.list long, your own work only */
function convCandidates(S){
  const now=evNow(S),J=CONV_JUDGE,fresh=[],healed=[];
  for(let i=S.pieces.length-1;i>=0;i--){const p=S.pieces[i];if(p.by||!p.design||!(p.design.elements||[]).length)continue;
    const age=now-weekIndex(p.w,p.y);
    if(age<=J.freshWeeks){if(fresh.length<J.list*2)fresh.push(p);}
    else if(p.heal&&age>=J.healedYears*WEEKS_PER_YEAR&&p.heal!=="infected")healed.push(p);
    if(healed.length>J.list*12)break;}
  const hs=healed.map(p=>({p,v:caReads(S,p)+(p.portfolio?0.5:0)})).sort((a,b)=>b.v-a.v).slice(0,J.list).map(x=>x.p);
  const fs=fresh.map(p=>({p,v:evFreshQ(S,p)})).sort((a,b)=>b.v-a.v).slice(0,J.list).map(x=>x.p);
  return{fresh:fs,healed:hs};}
function evFreshQ(S,p){const c=findClient(S,p.client),o=p.out||{},J=CONV_JUDGE.fresh;let tot=0.55;
  try{if(c&&c.wants)tot=scoreDesign(p.design,c,S.skills||{},{year:p.y}).total;}catch(e){}
  const outs=o.lineQuality!=null?(o.lineQuality+o.depthQuality+(o.saturation||0.7)+(1-(o.trauma||0.4)))/4:0.6;
  return J.design*tot+J.outputs*outs;}
function evHealedQ(S,p){const J=CONV_JUDGE.healed,yrs=(S.year-p.y)+(S.week-p.w)/WEEKS_PER_YEAR;
  return J.reads*caReads(S,p)+J.heal*(CONV_JUDGE.heal[p.heal]||0)+J.years*Math.min(1,yrs/10);}
/* convJudge(S, inv, picks {fresh, healed: piece ids}) -> the convention record (sim/career.js enterInvite calls it) */
function convJudge(S,inv,picks){
  worldEnsure(S);const C=S.career,cv=CONVENTIONS.find(c=>c.id===inv.conv)||CONVENTIONS[0],r=rng(S.seed).fork("conv:"+inv.id),J=CONV_JUDGE,W=CONV_SCORE;
  cashOut(S,inv.fee,"convention");
  const cand=convCandidates(S),find=id=>id?S.pieces.find(p=>p.id===id&&!p.by):null;
  picks=picks||{};const fp=picks.fresh===undefined?cand.fresh[0]:find(picks.fresh),hp=picks.healed===undefined?cand.healed[0]:find(picks.healed);
  const sk=S.skills||{},avg=(["linework","shading","colour","speed"].reduce((a,k)=>a+(+sk[k]||0),0)/4)/10,sig=signatureOf(S);
  const onSig=p=>p&&sig.ready&&p.design.style===sig.style?1:sig.ready?0.4:0.2;
  const placeOf=v=>v>=J.places[0]?1:v>=J.places[1]?2:v>=J.places[2]?3:0;
  const cat=(p,kind)=>{if(!p)return null;const base=kind==="fresh"?evFreshQ(S,p)+J.fresh.skill*avg:evHealedQ(S,p);
    const sc=caR3(base+J[kind].sig*onSig(p)*Math.max(0.3,sig.strength)+r.fork(kind).normal(0,J.sd)),place=placeOf(sc);
    const prize=place?evRub(S,cv.prize[place-1]*J.prizeShare):0;if(prize)cashIn(S,prize,"convention");
    if(p.design.style)skillGain(S,"style:"+p.design.style,SKILL_XP.convention/2);
    return{piece:p.id,name:p.name,score:sc,place,prize};};
  const fr=cat(fp,"fresh"),he=cat(hp,"healed");
  const best=[fr,he].filter(x=>x&&x.place).sort((a,b)=>a.place-b.place)[0]||null,place=best?best.place:0;
  repAdd(S,"peers",W.rep.peers[place?place-1:3]);repAdd(S,"collectors",W.rep.collectors[place?place-1:3]);
  /* the booth: your flash sells to the crowd */
  const att=J.booth.attendance[cv.id]||1,sheets=Math.max(J.booth.min,Math.min(40,(S.flash||[]).length));
  const booth=evRub(S,J.booth.perSheet*sheets*att*(0.6+0.4*(((S.rep&&S.rep.walkins)||0)/100))*(0.8+0.4*r.fork("booth")()));cashIn(S,booth,"convention");
  /* collectors: one may book you */
  let met=null;
  if(r.fork("met").chance(J.collector.chance+J.collector.perPlace*(place?4-place:0))&&walkinsOpen(S)){
    const rc=r.fork("metClient"),st=caStage(S),c=makeClient(rc,{id:clNextId(S),year:S.year,week:S.week,stage:st,src:"referral",theme:"collector",badIdea:false});
    c.brief="We met at "+cv.name+". I stood at your booth for half an hour. "+c.brief;
    const due=weekFrom(evNow(S)+rc.int(2,4));
    S.queue.push({id:queueId(S),kind:"consult",src:"referral",client:c.id,newClient:c,w:due.w,y:due.y,expires:weekIndex(due.w,due.y)+WEEK.consultWait,brief:c.brief,ask:c.ask,from:"convention"});
    met={client:c.id,name:c.name,w:due.w,y:due.y};}
  /* rivals' booths */
  const rivals=[];for(const rv of evRivals(S)){if(rv.status!=="open")continue;const rs=caR3(0.45+0.3*rv.str+r.fork("rv:"+rv.id).normal(0,0.08)),rp=placeOf(rs);
    const style=((SIM.STYLES||{})[rv.style]||{}).name||rv.style;
    rivals.push({id:rv.id,name:evRivalName(rv),style,place:rp,line:evCap(evRivalName(rv))+"'s booth: "+String(style).toLowerCase()+" work, "+(rp?["","first","second","third"][rp]+" place":"no placing")+"."});
    if(place&&(!rp||place<rp)){rv.str=clamp(rv.str-0.04,RIVAL.str.min,1);rv.mem=caR3(clamp((rv.mem||0)-0.05,-1,1));}}
  const rec={id:cv.id,name:cv.name,y:S.year,place,piece:best?best.piece:(fr||he||{}).piece||null,score:best?best.score:Math.max((fr||{}).score||0,(he||{}).score||0),
    fresh:fr,healed:he,booth,met:met?met.client:null};
  C.conv.push(rec);
  return Object.assign({},rec,{metClient:met,rivals});}

const EV_GOAL_CHECK={
  first_heal:S=>S.pieces.some(p=>!p.by&&p.heal==="crisp"),
  first_custom:S=>S.pieces.some(p=>!p.by&&p.price>0&&p.design&&!p.design.flash&&!(p.ret&&p.ret.rule==="touchup")),
  first_return:S=>S.pieces.some(p=>!p.by&&p.ret),
  first_award:S=>S.career.conv.some(c=>!c.own&&c.place>=1),
  studio:S=>!!S.career.reached.studio,
  hire:S=>(S.studio.nextStaff||1)>1||S.studio.staff.length>0,
  five_pieces:S=>S.clients.some(c=>(c.pieces||[]).length>=5),
  survive_rival:S=>{const now=evNow(S),lf=S.career.lastFail?weekIndex(S.career.lastFail.w,S.career.lastFail.y):-1;
    return evRivals(S).some(rv=>rv.status==="gone"||(rv.opened&&now-weekIndex(rv.opened.w,rv.opened.y)>=156&&caStage(S)!=="apprentice"&&lf<weekIndex(rv.opened.w,rv.opened.y)));},
  twenty_reads:S=>{for(const p of S.pieces){if(p.y>S.year-20)break;if(p.by||!p.heal)continue;if(S.year-p.y+(S.week-p.w)/WEEKS_PER_YEAR>=20&&caReads(S,p)>=LEGACY.reads)return true;}return false;},
  apprentice_shop:S=>S.career.apprentices.some(a=>a.status==="rival")
};
/* checkGoals(S, slow) -> [goal ids reached now] (S.goals[id] = {w, y}); slow checks only when slow is true */
function checkGoals(S,slow){
  worldEnsure(S);const out=[];
  for(const g of GOALS){if(S.goals[g.id]||(g.slow&&!slow))continue;let ok=false;try{ok=EV_GOAL_CHECK[g.id](S);}catch(e){ok=false;}
    if(ok){S.goals[g.id]={w:S.week,y:S.year};out.push(g.id);}}
  return out;}
function goalList(S){worldEnsure(S);return GOALS.map(g=>Object.assign({},g,{done:S.goals[g.id]||null}));}

/* ===================== the week (WEEK_HOOKS.events) ===================== */
function evWeek(S,ctx){
  const W=worldEnsure(S),C=S.career,now=ctx.now,st=caStage(S);
  /* a shop closed by the inspector: reopen, or move this week's sittings past the closure */
  if(C.closed){
    if(now>=C.closed.until){C.closed=null;evLog(ctx,"event",EVENTS.reopen);}
    else{const to=weekFrom(C.closed.until),mv=S.queue.filter(q=>q.kind==="session"&&weekIndex(q.w,q.y)<C.closed.until);
      for(const q of mv){q.w=to.w;q.y=to.y;q.moved=(q.moved||0)+1;}
      if(mv.length)evLog(ctx,"carried",evFill(EVENTS.moved,{n:mv.length,sittings:mv.length===1?"sitting":"sittings",w:to.w}),{n:mv.length});}}
  /* choices nobody made: the default happens */
  for(const ev of W.pending.slice())if(ev.until<now){const res=eventChoose(S,ev.id,ev.dflt);if(res.ok&&res.text)evLog(ctx,"note",res.text,{ev:ev.id});}
  evSocialWeek(S,ctx);
  evRivalsWeek(S,ctx);
  evReckonWeek(S,ctx);
  if(st!=="apprentice"&&walkinsOpen(S)&&((S.rep&&S.rep.peers)||0)>=COVER_PUZZLE.peers&&!S.queue.some(q=>q.puzzle)&&ctx.r.fork("puzzle").chance(COVER_PUZZLE.chance))
    evCoverPuzzle(S,ctx,ctx.r.fork("puzzleClient"),null);
  for(const id of checkGoals(S,ctx.yearRolled||now%13===0)){const g=GOALS.find(x=>x.id===id);evLog(ctx,"goal",evFill(EVENTS.goal,{name:g.name}),{goal:id});}
}

/* ===== sim/market.js: walk-in generation and PRICE_INDEX by year (PR 3). Last sim file: it closes the INK_SIM IIFE. ===== */
/* PRICE_INDEX: what a ruble buys, by year (2000 = 1.0). A ruble-like curve: 10-14%/yr inflation in the early 2000s, a
   2008-09 and a 2015 jump, easing to about 4-7%/yr later (about x4 by the mid-2010s, x8.7 by 2030). Rates, rent and
   supplies all multiply by it, so a 2003 forearm piece and a 2027 one price like their era.
   SIM.priceIndex(year): clamped to 2000..2030, interpolated between years (2003.5 is half way from 2003 to 2004). */
const PRICE_INDEX={2000:1,2001:1.14,2002:1.29,2003:1.44,2004:1.60,2005:1.78,2006:1.96,2007:2.14,2008:2.40,2009:2.64,
  2010:2.85,2011:3.06,2012:3.25,2013:3.46,2014:3.72,2015:4.13,2016:4.41,2017:4.61,2018:4.80,2019:5.01,
  2020:5.21,2021:5.55,2022:6.11,2023:6.47,2024:6.80,2025:7.14,2026:7.46,2027:7.76,2028:8.07,2029:8.39,2030:8.73};
SIM.PRICE_INDEX=PRICE_INDEX;
SIM.priceIndex=year=>{
  const y=clamp(+year||2000,2000,2030),a=Math.floor(y),b=Math.min(2030,a+1);
  return lerp(PRICE_INDEX[a],PRICE_INDEX[b],y-a);
};
/* ---- walk-ins (PR 3) ----
   SIM.generateWalkins(S, r) -> [client]: who comes through the door this week. How many: WALKINS.base for the studio stage,
   times the season (WALKIN_SEASON: the White Nights bring the city out, January is dead), times the reputation tracks
   (S.rep on 0..WALKINS.repFull = 100, the REP_TRACKS scale in sim/heal.js), capped by WEEK walk-in slots. What they want:
   the brief and style are weighted by this year's style demand (STYLES[*].demandCurve; PR 8's trend wave multiplies in
   through SIM.trendMult(style, year) when it exists) and by client segments the reputation tracks attract (WALKINS.seg, each from its REP_TRACKS unlock).
   The stage limits size (an apprentice only gets small flash). Booked clients come from returns and referrals, not here. */
const WALKINS={
  base:{apprentice:0.5,chair:2.2,studio:3.4,legacy:2.4},     // expected walk-ins a week, before season and reputation
  repFull:100,                                               // S.rep values read on 0..repFull
  rep:{walkins:0.9,collectors:0.25,peers:0.1},               // + share of the expected count at full reputation
  seg:{walkins:{walk_in:1,first_timer:0.8,students:0.4,trades:0.3},       // segments each reputation track pulls in
       collectors:{collector:1.5,large_scale:1.2,memorial:0.2,creatives:0.3},
       peers:{cover_up:0.8,old_school:0.4}},
  sizes:{apprentice:["tiny","small"],chair:["tiny","small","medium","large"],studio:["tiny","small","medium","large","huge"],legacy:["small","medium","large","huge"]}
};
/* [week, multiplier], piecewise linear over the year */
const WALKIN_SEASON=[[1,0.55],[4,0.75],[12,0.9],[20,1.1],[24,1.4],[28,1.4],[33,1.1],[40,0.95],[48,0.85],[51,1.05],[52,0.7]];
function mkSeason(w){
  const t=WALKIN_SEASON;if(w<=t[0][0])return t[0][1];
  for(let i=1;i<t.length;i++)if(w<=t[i][0]){const a=t[i-1],b=t[i];return lerp(a[1],b[1],(w-a[0])/((b[0]-a[0])||1));}
