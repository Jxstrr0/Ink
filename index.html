<script>
/* ===================== Ink: app =====================
   The app script is one top-level script spread over src/app/ (state.js opens it, help.js closes it; html/tail.html then
   calls start()). It glues INK_SIM (numbers) and INK_VIS (pictures) to the page.
   state.js: VERSION, small helpers ($, esc, fmtMoney, toast), the state object S, save / load / snapshot / hydrate,
   the three save slots and the theme. S is defined ONCE, in freshState() below; later PRs add fields there (and to the
   S map in src/README.md), never inline. localStorage keys: ink-save, ink-slot1 .. ink-slot3 (all inside try/catch). */
const VERSION="0.1.9.0";

  v:SAVE_V,

  rate:0,            // your hourly rate (PR 7: RATE_BY_REP x PRICE_INDEX); 0 while an apprentice

  reveals:[],        // ids of healed pieces whose reveal you haven't seen yet, oldest first (PR 5, sim/heal.js REVEAL_CAP)

                     // storefront} levels, vibe, marketing (MARKETING index), rep (the shop's own 0..100), lease {w,y}, nextStaff
  career:SIMOK("careerFresh")?INK_SIM.careerFresh():null,
                     // the career (PR 7, sim/career.js careerFresh): mentor {goodwill, left, loan}, Act 1 steps/chores/practice/
                     // friends, sig (signature counts), money {cur, prev, total} ledger, broke weeks, fails, scene (a full-screen
                     // scene waiting: broke | legacy), invites, conv (conventions entered), guest (a guest spot running), offers
                     // (Act 4), apprentices, alumni, rivals (PR 8: rival shops), reached {chair, studio, legacy: {w,y}}, books,
                     // skipped, insp; PR 8: closed {until, w, y, why} (shut by the inspector), inspLast, inspFails, lastFail
  goals:{},          // GOALS done, id -> {w,y} (PR 8, sim/events.js GOALS)
  world:SIMOK("worldFresh")?INK_SIM.worldFresh():null,
                     // events, social media and reckonings (PR 8, sim/events.js worldFresh): fired {reckoning id: {w,y,...}},
                     // plan, pending [events waiting for a choice], nextEv, mods {rate, fresh}, social {on, followers, posts
                     // [[piece no, week index, reach]], viral, booked, bad, gained}
  board:{design:null,bodyShape:"neutral",skinTone:0.3,client:"wk_office",item:null},   // the design board (PR 2): the working design; client = a sample id or a real client id, item = the booking being designed for (PR 3)

  settings:{theme:"dark",gfx:null,gfxAuto:true,sound:true,reduced:false,handed:"right",assist:false,flatStencil:false,tips:true},   // handed and assist: the session (PR 4); flatStencil: the flat placement view (PR 6); tips: help overlays on (PR 9)
  help:{},           // help overlays already seen (PR 9, app/help.js HELP_TIPS): tip id -> {w, y}; a new career starts with none

let S=freshState();

/* save(): the game into ink-save, packed (INK_SIM.packSave: older pieces and archived clients as short arrays; hydrate
   unpacks them). If the browser refuses (storage full), say so once in a while and offer a backup code */
const SAVE_WARN={at:0,gap:120000};
function save(){if(saveSoonT){clearTimeout(saveSoonT);saveSoonT=0;}try{localStorage.setItem(SAVE_KEY,saveJson());if(typeof buPersist==="function")buPersist();}catch(e){saveFull(e);}}
/* saveSoon: for saves that happen many times a minute (every finger lift in a session, every stencil drag), write once
   the player pauses for SAVE_SOON ms. A late career's save is over a megabyte, so writing it on every stroke could
   stutter a slow phone. A pending save is flushed when the page is hidden or closed, and any save() cancels it. */
const SAVE_SOON=1500;let saveSoonT=0;
function saveSoon(){clearTimeout(saveSoonT);saveSoonT=setTimeout(()=>{saveSoonT=0;save();},SAVE_SOON);}
function saveFlush(){if(saveSoonT){clearTimeout(saveSoonT);saveSoonT=0;save();}}
if(typeof addEventListener==="function"){addEventListener("pagehide",saveFlush);addEventListener("visibilitychange",()=>{if(typeof document!=="undefined"&&document.hidden)saveFlush();});}
function saveJson(){return JSON.stringify(SIMOK("packSave")?INK_SIM.packSave(S):S);}
function snapshot(){return JSON.parse(saveJson());}
function saveFull(e){const now=Date.now();if(now-SAVE_WARN.at<SAVE_WARN.gap||typeof document==="undefined")return;SAVE_WARN.at=now;
  if(typeof toast==="function")toast("This phone's storage is full, so the game couldn't save");
  if(typeof openSheet!=="function"||typeof buBackupOpen!=="function"||(typeof sheetOn==="function"&&sheetOn()))return;
  openSheet("Storage full",`<p style="margin-top:0">This browser wouldn't let Ink save (its storage is full or blocked). Your career is still open here, but it may be lost when you close the page.</p>
<p class="hint">Make a backup code now and keep it in your notes. Clearing a save slot you don't need (Settings › Save) frees room too.</p>
<div class="row"><button class="btn pri" id="sfBack" style="flex:1">Back up now</button></div>`);$("sfBack").addEventListener("click",buBackupOpen);}
/* load a saved object into S on top of a fresh state, so a field added since that save gets its default. false if it
   isn't an Ink save. */
function hydrate(o){
  if(!o||typeof o!=="object"||Array.isArray(o))return false;
  if(o.settings!=null&&(typeof o.settings!=="object"||Array.isArray(o.settings)))return false;
  const f=freshState();
  const ob=o.board&&typeof o.board==="object"&&!Array.isArray(o.board)?o.board:{};
  const ok=o.kit&&typeof o.kit==="object"&&!Array.isArray(o.kit)?o.kit:{};
  S=Object.assign(f,o,{settings:Object.assign(f.settings,o.settings||{}),board:Object.assign(f.board,ob),
    kit:Object.assign(f.kit,ok,{owned:Object.assign(f.kit.owned,ok.owned&&typeof ok.owned==="object"?ok.owned:{})})});
  if(!Array.isArray(S.flash))S.flash=[];
  if(!S.help||typeof S.help!=="object"||Array.isArray(S.help))S.help={};   // PR 9
  S.reveals=Array.isArray(S.reveals)?S.reveals.filter(x=>typeof x==="string"):[];   // PR 5
  if(!S.rep||typeof S.rep!=="object"||Array.isArray(S.rep))S.rep=freshState().rep;
  for(const k of ["walkins","collectors","peers"])S.rep[k]=Math.max(0,Math.min(100,+S.rep[k]||0));
  if(S.session!=null&&(typeof S.session!=="object"||Array.isArray(S.session)))S.session=null;
  if(typeof INK_SIM!=="undefined"&&INK_SIM.kitClean)S.kit=INK_SIM.kitClean(S.kit);   // unknown ids dropped, sliders clamped
  /* PR 7: a save from before the career has no career (careerEnsure then treats the tutorial as done); packed pieces and
     archived clients come back as records; studio and career get any field added since */
  if(!o.career||typeof o.career!=="object"||Array.isArray(o.career))S.career=null;
  if(!o.studio||typeof o.studio!=="object"||Array.isArray(o.studio))S.studio=freshState().studio;
  if(SIMOK("unpackSave"))INK_SIM.unpackSave(S);
  if(SIMOK("careerEnsure"))INK_SIM.careerEnsure(S);
  if(!o.world||typeof o.world!=="object"||Array.isArray(o.world))S.world=null;   // PR 8: worldEnsure fills it

function loadSaved(){try{const j=localStorage.getItem(SAVE_KEY);if(j&&hydrate(JSON.parse(j)))return true;}catch(e){}S=freshState();return false;}
/* a restored or slot-loaded game takes over the running one */
function applyLoaded(o,msg){if(!hydrate(o)){toast("That save couldn't be loaded");return;}save();applySettings();renderAll();toast(msg||"Loaded");}

/* ---- theme and settings ---- */
function applyTheme(){const t=S.settings.theme||"dark";const eff=t==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):t;
  document.documentElement.setAttribute("data-theme",eff);
  const m=document.querySelector("meta[name=theme-color]");if(m)m.setAttribute("content",eff==="light"?"#f4efe6":"#17130f");}
function applySettings(){applyTheme();document.documentElement.classList.toggle("noanim",!!S.settings.reduced);INK_SOUND.setOn(S.settings.sound!==false);applyGfx();}

/* ---- toast ---- */
function toast(msg){const t=$("toast");if(!t)return;t.textContent=msg;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600);}
/* ===================== app/perf.js: graphics tiers and auto-adjust =====================
   Three tiers: lite (phone default), full, ultra. S.settings.gfx is the player's pick (null = automatic: lite on phones,
   full elsewhere). Auto-adjust (S.settings.gfxAuto, on unless false), lifted from Prairie Engine Works: while INK_VIS runs
   a frame loop, watch its fps; if it stays under ~27 fps for ~8 s, step ONE tier down (ultra > full > lite) and say so.
   It never steps up, and a manual pick after an auto-drop is respected for the session. A still scene reports no fps,
   so nothing happens while the studio is idle. */
const PERF={T:["lite","full","ultra"],LOW:27,NEED:8000,SETTLE:6000,HOLD:3000,boot:performance.now(),f:null,fAt:0,sAt:0,low:0,tier:null,tab:null,holdTo:0,dropped:false,manual:false,force:null};
function perfTier(){return S.settings.gfx||(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)?"lite":"full");}
function applyGfx(){if(typeof INK_VIS==="undefined")return;
  INK_VIS.setReduced(!!(S.settings.reduced||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)));   // camera moves become cuts
  if(INK_VIS.ready())INK_VIS.setTier(perfTier());}
function perfReset(hold){PERF.low=0;PERF.sAt=0;if(hold)PERF.holdTo=performance.now()+PERF.HOLD;}
function perfPoll(){
  if(!S||typeof INK_VIS==="undefined"||!INK_VIS.ready())return;
  const now=performance.now();
  if(S.settings.gfxAuto===false||(PERF.dropped&&PERF.manual)||document.hidden||now-PERF.boot<PERF.SETTLE){perfReset(true);return;}
  if(navigator.webdriver&&PERF.force==null)return;
  const tier=perfTier();if(tier!==PERF.tier){PERF.tier=tier;perfReset(true);}
  if(curTab!==PERF.tab){PERF.tab=curTab;perfReset(true);}
  if(now<PERF.holdTo)return;

  if(PERF.force!=null){fps=PERF.force;if(!PERF.sAt){PERF.sAt=now;return;}}
  else if(f!=null&&f!==PERF.f){PERF.f=f;PERF.fAt=now;fps=f;if(!PERF.sAt){PERF.sAt=now;return;}}
  else{if(now-PERF.fAt>1500)perfReset(false);return;}   // nothing drawn lately: start over
  const el=Math.min(now-PERF.sAt,1000);PERF.sAt=now;

  const n=PERF.T[i-1];PERF.dropped=true;S.settings.gfx=n;applyGfx();save();perfReset(true);
  toast(`Graphics lowered to ${n[0].toUpperCase()+n.slice(1)} to keep things smooth. Change it in Settings.`);}

/* ===================== app/savecode.js: SAVE CODES (Back up / Restore) =====================
   Lifted from Prairie Engine Works' savecode.js. One code holds everything Ink keeps in the browser, so a player can move
   to another phone or keep a copy somewhere safe. All of it lives in localStorage on this device; nothing is sent anywhere.
     save    the current game ("ink-save"), taken live with snapshot(). Settings ride in it.
     slots   the 3 manual slots ("ink-slot1" .. "ink-slot3"), null for an empty one. PR 7 (app/slots.js): a slot is
             {z: the save squeezed with buZip, savedAt, week, year, stage, pieces}; a plain save object still counts
     PR 7: the save inside is packed (INK_SIM.packSave: older pieces and archived clients as short arrays); hydrate
           unpacks it, so a code holds every piece ever done
   Code = "INK1:" + body + a 6-character checksum. body = that object as JSON -> UTF-8 bytes -> LZW (9..16-bit codes) ->
   base64url (A-Z a-z 0-9 - _ only), so it survives notes apps, email and chat.
   Tattoos are saved as design parameters + session outputs + dates, never as pictures; everything visual is re-rendered.
   Restore checks everything before it writes anything: checksum, unpack, JSON, the shape of every save and a trial
   hydrate() of each. Then buWrite() writes all four keys and puts the old values back if any write fails.
   A NEW localStorage key must be added to buMake and buWrite (and check-savecode.js), and asked about first.
   The next version of this format is INK2:. Tests: `node check-savecode.js` in the repo root. */
const BU_V=1,BU_PREFIX="INK"+BU_V+":";
const BU_B64="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_",BU_MAXCODES=65536;
const BU_MSG={
  empty:"Paste a backup code into the box first.",
  damaged:"That code is damaged or cut off. Copy the whole code again, from INK1: right to the end, and paste it here.",
  newer:"That code was made by a newer version of the game. Reload the page to update, then try again.",
  other:"That's a save code from a different game. Ink backup codes start with \"INK1:\".",
  notcode:"That doesn't look like a save code. Backup codes start with \"INK1:\".",
  bad:"That code opened, but the save inside doesn't look right, so nothing was changed.",
  store:"This browser wouldn't let the game save (storage may be full or blocked), so nothing was changed."
};
const buFail=k=>{const e=new Error(BU_MSG[k]);e.bu=k;return e;};   // an error with a message that's fine to show the player

/* ---- packing: bytes <-> base64url text ---- */
function buBits(n){let b=1;while(n>=2){n>>>=1;b++;}return b;}   // how many bits it takes to write n
/* LZW over bytes. Bits go MSB-first into 6-bit base64url characters and the tail is zero-padded. A code's width is the
   bit length of the largest code the reader could see next, so both sides always agree on it. */
function buZip(bytes){
  const out=[];let acc=0,nacc=0;
  const put=(v,w)=>{for(let i=w-1;i>=0;i--){acc=acc<<1|(v>>>i&1);if(++nacc===6){out.push(BU_B64[acc]);acc=0;nacc=0;}}};
  if(!bytes.length)return"";
  const dict=new Map();let next=256,cur=bytes[0];
  for(let i=1;i<bytes.length;i++){
    const key=cur*256+bytes[i],hit=dict.get(key);
    if(hit!==undefined){cur=hit;continue;}
    put(cur,buBits(next-1));
    if(next<BU_MAXCODES)dict.set(key,next++);
    cur=bytes[i];}
  put(cur,buBits(next-1));
  if(nacc)out.push(BU_B64[acc<<(6-nacc)]);
  return out.join("");}
function buUnzip(str){
  let pos=0;const total=str.length*6,out=[];
  const read=w=>{let v=0;for(let i=0;i<w;i++,pos++){const d=BU_B64.indexOf(str[pos/6|0]);if(d<0)throw buFail("damaged");v=v*2+(d>>(5-pos%6)&1);}return v;};
  if(total<8)return out;
  const prefix=[],suffix=[],first=[];for(let i=0;i<256;i++){prefix.push(-1);suffix.push(i);first.push(i);}
  let size=256;
  const emit=code=>{const at=out.length;while(code>=0){out.push(suffix[code]);code=prefix[code];}   // the bytes come out backwards
    for(let a=at,b=out.length-1;a<b;a++,b--){const t=out[a];out[a]=out[b];out[b]=t;}};
  let prev=read(8);emit(prev);
  for(;;){
    const w=buBits(Math.min(size,BU_MAXCODES-1));
    if(total-pos<w)break;   // what's left is padding
    const code=read(w);let fb;
    if(code<size)fb=first[code];
    else if(code===size)fb=first[prev];   // the code being defined right now (the classic LZW "KwKwK" case)
    else throw buFail("damaged");
    if(size<BU_MAXCODES){prefix.push(prev);suffix.push(fb);first.push(first[prev]);size++;}
    emit(code);prev=code;}
  return out;}
/* FNV-1a of the body, as 6 base64url characters: a missing, extra or changed character almost surely won't match */
function buSum(body){let h=2166136261;for(let i=0;i<body.length;i++){h^=body.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  let s="";for(let i=0;i<6;i++){s+=BU_B64[h&63];h=Math.floor(h/64);}return s;}

/* ---- making a code ---- */
function buStored(k){try{const j=localStorage.getItem(k);if(!j)return null;const o=JSON.parse(j);return o&&typeof o==="object"&&!Array.isArray(o)?o:null;}catch(e){return null;}}
function buMake(){const slots=[];for(let i=1;i<=SLOTS;i++)slots.push(buStored(slotKey(i)));
  return{v:BU_V,at:Date.now(),ver:VERSION,save:snapshot(),slots};}
function buCode(d){const body=buZip(new TextEncoder().encode(JSON.stringify(d||buMake())));return BU_PREFIX+body+buSum(body);}

/* ---- checking a save before anything is written ---- */
const buObj=o=>!!o&&typeof o==="object"&&!Array.isArray(o);

/* the shape of an Ink save. Fields later PRs add are checked here when they arrive */
function buSaveOk(o){
  if(!buObj(o))return false;
  if("settings" in o&&!buObj(o.settings))return false;
  if(buObj(o.settings)&&"flatStencil" in o.settings&&typeof o.settings.flatStencil!=="boolean")return false;   // PR 6
  if(buObj(o.settings)&&"tips" in o.settings&&typeof o.settings.tips!=="boolean")return false;   // PR 9
  if("help" in o&&o.help!=null&&!buObj(o.help))return false;   // PR 9: tip id -> {w, y}
  for(const k of ["week","year","cash","seed"])if(k in o&&!buNum(o[k]))return false;
  for(const k of ["clients","pieces","queue","flash"])if(k in o&&!Array.isArray(o[k]))return false;
  if("studio" in o&&(!buObj(o.studio)||("staff" in o.studio&&!Array.isArray(o.studio.staff))||("stage" in o.studio&&typeof o.studio.stage!=="string")))return false;   // PR 7
  if("career" in o&&o.career!=null){const c=o.career;if(!buObj(c))return false;   // PR 7: the career (sim/career.js careerFresh)
    for(const f of ["invites","apprentices","alumni","friends","conv"])if(f in c&&!Array.isArray(c[f]))return false;
    for(const f of ["mentor","money","sig","steps"])if(f in c&&!buObj(c[f]))return false;
    if("rivals" in c&&!(Array.isArray(c.rivals)&&c.rivals.every(buObj)))return false;   // PR 8: rival shops
    if(c.closed!=null&&!(buObj(c.closed)&&buNum(c.closed.until)))return false;}
  if("goals" in o&&!buObj(o.goals))return false;   // PR 8: id -> {w, y}
  if("world" in o&&o.world!=null){const w=o.world;if(!buObj(w))return false;   // PR 8: sim/events.js worldFresh
    for(const f of ["fired","plan","mods"])if(f in w&&!buObj(w[f]))return false;
    if("pending" in w&&!(Array.isArray(w.pending)&&w.pending.every(e=>buObj(e)&&typeof e.id==="string")))return false;
    if("social" in w){const so=w.social;if(!buObj(so))return false;if("followers" in so&&!buNum(so.followers))return false;
      if("posts" in so&&!(Array.isArray(so.posts)&&so.posts.every(p=>Array.isArray(p)&&p.every(buNum))))return false;}}
  if("board" in o){const b=o.board;if(!buObj(b))return false;
    if(b.design!=null&&(!buObj(b.design)||!Array.isArray(b.design.elements)))return false;
    if("skinTone" in b&&!buNum(b.skinTone))return false;}
  if("flash" in o&&!o.flash.every(f=>buObj(f)&&buObj(f.design)&&Array.isArray(f.design.elements)))return false;
  if("reveals" in o&&!(Array.isArray(o.reveals)&&o.reveals.every(x=>typeof x==="string")))return false;   // PR 5: piece ids
  if("rep" in o){if(!buObj(o.rep))return false;for(const k of ["walkins","collectors","peers"])if(k in o.rep&&!buNum(o.rep[k]))return false;}
  if("kit" in o){const k=o.kit;if(!buObj(k))return false;   // PR 4: an old save's kit:{} is fine (hydrate fills the starter kit)
    if("needles" in k&&!(Array.isArray(k.needles)&&k.needles.every(n=>typeof n==="string")))return false;
    for(const f of ["voltage","stroke"])if(f in k&&!buNum(k[f]))return false;
    for(const f of ["machine","ink"])if(f in k&&typeof k[f]!=="string")return false;
    if("owned" in k){if(!buObj(k.owned))return false;for(const f of ["machines","needles","inks"])if(f in k.owned&&!Array.isArray(k.owned[f]))return false;}}
  if("session" in o&&o.session!=null){const s=o.session;if(!buObj(s))return false;   // PR 4: the chair, numbers only
    for(const f of ["live","next"])if(s[f]!=null&&(!buObj(s[f])||!buObj(s[f].design)||!Array.isArray(s[f].design.elements)))return false;
    if(s.live&&!buNum(s.live.next))return false;}
  return buTry(o);}
/* load a copy the way the game would (hydrate), then put the running game back exactly as it was */
function buTry(o){const keepS=S;let ok=false;
  try{ok=hydrate(JSON.parse(JSON.stringify(o)))===true;}catch(e){ok=false;}
  finally{S=keepS;}
  return ok;}
function buFullOk(d){return buObj(d)&&d.v===BU_V&&buSaveOk(d.save)&&Array.isArray(d.slots)&&d.slots.length<=SLOTS
  &&d.slots.every(o=>o===null||buSlotOk(o));}
/* a slot: the save itself, or (PR 7) {z: the save as JSON, UTF-8, buZip} plus a label. Throws on a damaged z */
function buSlotData(o){if(buObj(o)&&typeof o.z==="string")return JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(new Uint8Array(buUnzip(o.z))));return o;}
function buSlotOk(o){if(!buObj(o))return false;let d;try{d=buSlotData(o);}catch(e){return false;}return buSaveOk(d);}

/* ---- reading a code: {kind:"full",data}. Spaces, line breaks and text around the code are fine.
   Throws buFail(...) with a message for the player. ---- */
function buRead(text){
  const s=String(text==null?"":text).replace(/[\s​-‍⁠﻿]+/g,"");
  if(!s)throw buFail("empty");
  const m=/INK(\d+):/.exec(s);
  if(!m){
    if(/(^|[^A-Za-z0-9])[A-Za-z]{2,8}\d+:[A-Za-z0-9_-]/.test(s))throw buFail("other");   // e.g. PEW1:... from another game
    throw buFail("notcode");}
  const n=+m[1];
  if(n!==BU_V)throw buFail(n>BU_V?"newer":"notcode");
  const c=s.slice(m.index+m[0].length).replace(/[^A-Za-z0-9_-].*$/,"");   // drop quotes or punctuation pasted after it
  if(c.length<7)throw buFail("damaged");
  const body=c.slice(0,-6);
  if(buSum(body)!==c.slice(-6))throw buFail("damaged");
  let d;try{d=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(new Uint8Array(buUnzip(body))));}catch(e){throw buFail("damaged");}
  if(!buFullOk(d))throw buFail("bad");
  return{kind:"full",data:d};}

/* ---- writing a checked backup: all four keys, or none of them ---- */
function buWrite(d){
  const keys=[[SAVE_KEY,d.save]];for(let i=1;i<=SLOTS;i++)keys.push([slotKey(i),d.slots[i-1]||null]);
  const old=[];
  try{for(const [k] of keys)old.push([k,localStorage.getItem(k)]);}catch(e){return false;}
  try{for(const [k,v] of keys){if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}return true;}
  catch(e){   // put the old values back: clear all first, so a full storage has room for what fitted before
    try{for(const [k] of old)localStorage.removeItem(k);for(const [k,v] of old)if(v!=null)localStorage.setItem(k,v);}catch(_){}
    return false;}}

/* ---- backup files and keep-my-storage (from PEW 1.76.66). Every Longlight game lives at jxstrr0.github.io and shares
   one storage pot, which a phone short on space may clear all at once. buPersist() asks the browser to keep it;
   buFileSave() puts the same INK1: code in a text file; buFileLoad() runs a file through the Restore checks. ---- */
const BU_FILE_MAX=4e6;
let buPersistAsked=false;
function buPersist(){if(buPersistAsked)return;buPersistAsked=true;
  try{const st=typeof navigator!=="undefined"&&navigator.storage;if(!st||!st.persist||!st.persisted)return;
    st.persisted().then(p=>p||st.persist()).then(()=>{},()=>{});}catch(e){}}
function buMarkBackup(){if(!S)return;S.bkAt=Date.now();try{save();}catch(e){}buPersist();}
function buFileName(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`ink-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.txt`;}
async function buFileSave(){let code="";try{code=buCode();}catch(e){}
  if(!code){toast("Couldn't make a backup on this device");return;}
  const name=buFileName(),text=code+"\n";
  let file=null;try{file=new File([text],name,{type:"text/plain"});}catch(e){}
  if(file&&navigator.canShare&&navigator.share){let can=false;try{can=navigator.canShare({files:[file]});}catch(e){}
    if(can){try{await navigator.share({files:[file]});buMarkBackup();toast("Backup file saved");return;}
      catch(e){if(e&&e.name==="AbortError")return;}}}   // cancelled: not saved. Any other refusal falls back to a download
  try{const url=URL.createObjectURL(new Blob([text],{type:"text/plain"})),a=document.createElement("a");
    a.href=url;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);

/* ---- PWA: install offer and the update bar ---- */
let pwaDeferred=null;
const pwaStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pwaIos=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function pwaSync(){const sec=$("set-app");if(!sec)return;const inst=!!pwaDeferred&&!pwaStandalone(),tip=pwaIos()&&!pwaStandalone();
  $("pwaInstall").hidden=!inst;$("pwaIos").hidden=!tip;sec.hidden=!(inst||tip);
  $("pwaInstall").onclick=async()=>{if(!pwaDeferred)return;const p=pwaDeferred;pwaDeferred=null;pwaSync();try{p.prompt();const r=await p.userChoice;if(r&&r.outcome==="accepted")toast("Installed");}catch(_){}};}
function pwaInit(){
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();pwaDeferred=e;pwaSync();});
  window.addEventListener("appinstalled",()=>{pwaDeferred=null;pwaSync();});
  const bar=document.createElement("div");bar.id="pwaBar";bar.setAttribute("role","status");
  bar.innerHTML='<span>New version ready</span><button type="button" class="btn sm pri" id="pwaReload">Reload</button><button type="button" class="pwalater" id="pwaLater" aria-label="Dismiss until next visit">Later</button>';
  document.body.appendChild(bar);
  let waiting=null,reloading=false;
  const offer=w=>{waiting=w;bar.classList.add("on");};
  $("pwaLater").addEventListener("click",()=>bar.classList.remove("on"));
  $("pwaReload").addEventListener("click",()=>{if(waiting)waiting.postMessage({type:"SKIP_WAITING"});else location.reload();});
  const host=location.hostname,web=/^https?:$/.test(location.protocol),local=/^(localhost|127\.\d+\.\d+\.\d+|\[?::1\]?|0\.0\.0\.0)$/.test(host);
  if(!("serviceWorker" in navigator)||!web||(local&&!/[?&]sw=1(&|$)/.test(location.search)))return;
  const sw=navigator.serviceWorker;
  sw.addEventListener("controllerchange",()=>{if(reloading||!waiting)return;reloading=true;location.reload();});
  sw.register("sw.js").then(reg=>{
    const watch=w=>w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&sw.controller)offer(w);});
    if(reg.waiting&&sw.controller)offer(reg.waiting);
    watch(reg.installing);reg.addEventListener("updatefound",()=>watch(reg.installing));
    /* an installed app can stay open for days: look for a new version when it comes back to the front and every few hours */
    const chk=()=>{try{reg.update().catch(()=>{});}catch(_){}};
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk();});setInterval(chk,4*3600*1000);
  }).catch(()=>{});}

    rot:e.rot||0,lineWeight:e.lineWeight||df.lineWeightDefault,fill:clamp(e.fill||0,0,1),colour:e.colour||null};});

function dzLoad(){
  const P=INK_SIM.PLACEMENTS,d=S.board.design;

/* ---- scoring ---- */
function dzScore(m){const d=dzToDesign(m);
  try{const r=Object.assign(INK_SIM.scoreDesign(d,dzClient(),S.skills,{year:S.year,rate:S.rate>0?S.rate:undefined}),{_d:d});
    const old=!m||m===DZ.m?dzOld():null;if(old)r.cover=INK_SIM.coverScore(d,old.design,dzBox(d.placement));   // PR 8: a cover-up
    return r;}catch(e){return null;}}
/* PR 8: the old piece a cover-up booking goes over (sim/events.js coverOld), when the board is on its spot; it draws as a

function dzOld(){
  const id=S.board.item;if(!id||!DZ.m||typeof INK_SIM.coverOld!=="function")return null;

/* ---- changes, undo and redo ---- */
function dzBegin(){DZ.snap0=JSON.stringify(DZ.m);DZ.base=DZ.cur;}
function dzEnd(){
  if(DZ.snap0==null)return;const was=DZ.snap0;DZ.snap0=null;
  if(JSON.stringify(DZ.m)===was){DZ.base=null;return;}
  if(DZ.m.flash&&dzSig(DZ.m.els)!==DZ.m.fsig){DZ.m.flash=null;DZ.m.fsig=null;toast("New elements: a custom piece now, no flash discount");const t=$("dzFlashTag");if(t)t.remove();}
  DZ.undo.push(was);if(DZ.undo.length>DZ_UNDO_CAP)DZ.undo.shift();DZ.redo.length=0;
  DZ.prev=DZ.base||DZ.prev;DZ.base=null;

function dzUndoRedo(back){
  const from=back?DZ.undo:DZ.redo,to=back?DZ.redo:DZ.undo;if(!from.length)return;
  const before=DZ.cur;to.push(JSON.stringify(DZ.m));DZ.m=JSON.parse(from.pop());

/* ---- drawing elements (board, minis) ---- */
/* one element as an SVG group in mm. Colour sits on the fill and the lines stay black; with no fill (or in watercolour)
   the colour is the lines, the same way scoreDesign reads it */
function dzElSvg(e,style,attrs,hit,spreadMm){
  const d=dzDef(e.id);if(!d)return"";
  const b=dzEB(e.id),k=e.mm/Math.max(b.w,b.h,1e-6),cx=b.x+b.w/2,cy=b.y+b.h/2;
  const fc=e.colour?dzColHex(e.colour):DZ_INK,lc=e.colour&&(style==="watercolour"||!(e.fill>0))?fc:DZ_INK;
  let h=`<g${attrs||""} transform="${dzTf(e)}">`;
  if(hit){const mu=hit/k,w=Math.max(b.w,mu),hh=Math.max(b.h,mu);h+=`<rect class="hit" x="${dzR2(cx-w/2)}" y="${dzR2(cy-hh/2)}" width="${dzR2(w)}" height="${dzR2(hh)}"/>`;}
  if(d.fill&&e.fill>0)h+=`<path d="${d.fill}" fill="${fc}" fill-opacity="${dzR2(e.fill)}"/>`;
  h+=`<path d="${d.path}" fill="none" stroke="${lc}" stroke-width="${dzR4((INK_SIM.lineMm(e.lineWeight)+(spreadMm||0))/k)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  return h+"</g>";}
function dzTf(e){const b=dzEB(e.id),k=e.mm/Math.max(b.w,b.h,1e-6);
  return`translate(${dzR2(e.mx)} ${dzR2(e.my)}) rotate(${dzR2(e.rot)}) scale(${dzR4(k)}) translate(${dzR2(-(b.x+b.w/2))} ${dzR2(-(b.y+b.h/2))})`;}
/* the elements of a model (or a design) in a small square svg fitted to the piece */
function dzMini(m,cls,style,spreadMm){
  if(!m.els.length)return`<svg class="${cls||""}" viewBox="0 0 10 10"></svg>`;
  const d=dzToDesign(m),sz=d.sizeMm,cx=d.pos.x*dzBox(m.placement).wrapMm,cy=d.pos.y*dzBox(m.placement).lengthMm,pad=sz*0.08;
  return`<svg class="${cls||""}" viewBox="${dzR2(cx-sz/2-pad)} ${dzR2(cy-sz/2-pad)} ${dzR2(sz+2*pad)} ${dzR2(sz+2*pad)}"${style?` style="${style}"`:""} aria-hidden="true">${m.els.map(e=>dzElSvg(e,m.style,"",0,spreadMm)).join("")}</svg>`;}

/* the board svg: viewBox in mm, the placement box at the origin with margins round it so a piece can hang off the edge */
function dzRenderBoard(){
  const host=$("dzBoard");if(!host)return;
  const m=DZ.m,p=INK_SIM.PLACEMENTS[m.placement],box=dzBox(),W=box.wrapMm,L=box.lengthMm;
  const wrap=$("dzBoardWrap"),cw=Math.max(200,(wrap?wrap.clientWidth:340)-2);
  const land=innerWidth>innerHeight&&innerHeight<560,mh=land?Math.max(220,innerHeight-130):innerWidth<700?clamp(innerHeight-(DZ.capOpen?400:330),200,520):Math.min(innerHeight*0.58,620);
  /* margins in mm, widened so the ruler's numbers (about 40 px) always fit on the left */
  let mx=clamp(W*0.2,14,40),my=clamp(L*0.06,10,30),sc=Math.min(cw/(W+2*mx),mh/(L+2*my));
  for(let i=0;i<3&&mx*sc<40;i++){mx=40/sc;sc=Math.min(cw/(W+2*mx),mh/(L+2*my));}
  const vb={x:-mx,y:-my,w:W+2*mx,h:L+2*my},pw=Math.round(vb.w*sc),ph=Math.round(vb.h*sc);
  DZ.pxmm=sc;DZ.vb=vb;
  const px=n=>dzR2(n/sc);   // n screen pixels in mm
  let h=`<svg id="dzSvg" class="dzSvg${DZ.sel>=0?" sel":""}" width="${pw}" height="${ph}" viewBox="${dzR2(vb.x)} ${dzR2(vb.y)} ${dzR2(vb.w)} ${dzR2(vb.h)}" role="application" aria-label="Design board, ${esc(p.name)}, ${W} by ${L} millimetres" tabindex="-1">
<defs><linearGradient id="dzLimbG" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#8a6a40" stop-opacity=".22"/><stop offset=".2" stop-color="#8a6a40" stop-opacity="0"/><stop offset=".8" stop-color="#8a6a40" stop-opacity="0"/><stop offset="1" stop-color="#8a6a40" stop-opacity=".22"/></linearGradient></defs>
<rect class="dzBg" x="${dzR2(vb.x)}" y="${dzR2(vb.y)}" width="${dzR2(vb.w)}" height="${dzR2(vb.h)}"/>
<rect class="dzLimb" x="0" y="0" width="${W}" height="${L}" rx="${dzR2(Math.min(W,L)*0.1)}"/>
<rect class="dzLimbE" x="0" y="0" width="${W}" height="${L}" rx="${dzR2(Math.min(W,L)*0.1)}"/>`;
  /* the mm ruler down the left margin */
  let rul="";for(let y=0;y<=L+0.01;y+=10){const big=y%50===0;rul+=`M${dzR2(-px(big?12:6))} ${y}H0`;}
  h+=`<path class="dzRuler" d="${rul}"/>`;
  for(let y=50;y<=L;y+=50)h+=`<text class="dzRulT" x="${dzR2(-px(14))}" y="${dzR2(y+px(4))}" font-size="${px(10)}" text-anchor="end">${y}</text>`;
  /* flow lines and creases */
  h+=`<g class="dzFlow">${p.flow.map(line=>`<polyline points="${line.map(q=>dzR2(q[0]*W)+","+dzR2(q[1]*L)).join(" ")}"/>`).join("")}</g>`;
  for(const c of p.creases||[]){const y=c.at*L;h+=`<line class="dzCrease" x1="${dzR2(-px(4))}" x2="${dzR2(W+px(4))}" y1="${dzR2(y)}" y2="${dzR2(y)}"/><text class="dzCreaseT" x="${dzR2(W/2)}" y="${dzR2(c.at<0.5?y-px(5):y+px(13))}" font-size="${px(10.5)}" text-anchor="middle">${esc(c.name)} crease</text>`;}
  /* PR 8: someone's old piece under a cover-up, locked: no hit areas, not selectable */
  const old=dzOld();
  let oldLbl="";
  if(old){const om=dzFromDesign(old.design,m.placement);let a={blur:0.6,spread:0.8};
    /* drawn as it is on the skin today: the aging model's blur and spread, a blown-out halo, the ink gone blue-black */
    try{a=INK_SIM.age({design:old.design,out:old.out,heal:old.heal||"blownout",ink:old.ink,skinTone:S.board.skinTone},old.years)||a;}catch(e){}
    const sp=Math.max(0.6,a.spread||0),bl=Math.max(0.5,a.blur||0),blown=old.foreign||old.heal==="blownout"||old.heal==="infected";
    h+=`<defs><filter id="dzOldF" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${dzR4(0.35+bl*0.6)}"/></filter><filter id="dzOldH" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="${dzR4(0.9+sp*0.8)}"/></filter></defs>

/* ===================== app/session.js: the Session tab, the chair (PR 4) =====================
   The tattoo session on top of sim/session.js (INK_SIM.sessionNew and friends). Four screens:
     the lobby    sittings due this week (booked from the Clients tab, with a design), a sample walk-in's piece waiting for its
                  next sitting, and Practice on fake skin (pick the board's design or a flash piece). The empty state says
                  "No one in the chair. Book a client from the Clients tab." with a Practice button.
     placement    drag the purple stencil on the client's body in 3D (PR 6: the one WebGL canvas is borrowed from the Studio
                  view), or on the flat placement box (fake skin, no WebGL, or the "Flat view" toggle, S.settings.flatStencil);
                  turn it 15 degrees a tap (INK_SIM.sessionRotate); flow and creases are re-checked (INK_SIM.stencilCheck).
     the chair    linework (plan Q4: trace-and-rhythm), then shading and colour zones. Four stacked canvases: base (skin and
                  the purple stencil), fill (shading and colour), ink (the lines you lay, drawn bit by bit from your finger)
                  and overlay (the pacing marker, the finger dot; only the rectangles that changed are cleared). The frame loop
                  runs only while a finger is down, capped at SE_FPS (30 on Lite). With reduced motion the marker is a static
                  highlight of the next stretch of line. Meters: steady hand (pace ratio against the band), pain and fatigue
                  (bars with notches, a hatch or dot pattern and an icon, so they read without colour), and the saturation
                  meter in zones. Break, Numb (costs rubles) and Chat sit on a rail on your free hand's side (Settings ›
                  Session › Handedness). Liner chips say what each needle lays ("lays 1–5RL").
     results      the sitting's numbers, XP, money and what happens next.
   Where the work comes from:
     booked       sessionStartBooked(item), called by the Clients tab (app/clients.js clSession). Progress between sittings
                  rides on the queue item (item.progress, numbers only); INK_SIM.finishSession books the next sitting or makes
                  the piece and pays. A last sitting cut short (pain or fatigue) keeps the item and moves it a week, unpaid.
     sample       "Tattoo this" on the Design tab with a sample walk-in: a one-off test. Pays SE_PAY.sample of the price per
                  sitting; the next sitting can start straight away (S.session.next) since sample clients aren't on the calendar.
     practice     fake skin: no pain, no fatigue, no money, no piece, only XP (SKILL_XP.practice).
   S.session = {live: the sitting in progress (the sim's object: numbers and short strings, saved at every finger lift and
   every action, so a reload resumes it), next: a sample piece waiting for its next sitting}. A finished piece gets heal:null
   and healDue {w, y} SE_HEAL_WEEKS on (PR 5 shows the heal). window.__inkSessFps() reports the loop's frame rate. */
const SE_PAY={sample:0.35};          // a sample walk-in pays you this share of the price, split across its sittings (the shop keeps the rest)
const SE_HEAL_WEEKS=2;               // the heal is due this many weeks after the last sitting
const SE_FPS={lite:30,full:60,ultra:60};
const SE_DPR={lite:1.5,full:2,ultra:2.5};
const SE_SKIN=[[0,[243,217,192]],[0.35,[217,169,130]],[0.65,[168,113,74]],[1,[91,58,38]]];   // skin tone 0..1 to a colour
const SE_FAKE=[236,214,186];         // practice skin: a pale rubber pad
const SE_STENCIL={light:"#6a3fc8",dark:"#cbb6ff",w:1.1,cur:2.4,alpha:0.7};
const SE_LAYOUT={rail:56,minH:240,maxH:620,chrome:310,ahead:0.8};   // px; ahead = seconds of line the reduced-motion highlight shows
const SE_CHAT=["They tell you the bridges went up before they could get home last night. Two hours on the wrong bank.",
  "Talk turns to the canal ice. Nobody on the embankment trusts it before January.",
  "They ask how long you've been at this. Long enough to stop shaking, you say.",

  fatigue:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  breakB:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M12 3v3"/></svg>',
  numb:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v4l2 3v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V10l2-3z"/><path d="M7 13h10"/></svg>',
  chat:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',

/* ---- small helpers ---- */

function seRgb(c){return`rgb(${c.map(Math.round).join(",")})`;}
function seSkinRgb(t,practice){if(practice)return SE_FAKE;t=clamp(t==null?0.3:t,0,1);
  for(let i=1;i<SE_SKIN.length;i++){const a=SE_SKIN[i-1],b=SE_SKIN[i];if(t<=b[0]){const k=(t-a[0])/(b[0]-a[0]);return a[1].map((v,j)=>v+(b[1][j]-v)*k);}}

  for(let i=sess.start;i<sess.end;i++){const k=plan.items[i].k;if(k==="line")line++;else if(k==="shade")shade++;else colour++;}return{line,shade,colour,plan};}

    if(it.k==="line")INK_SOUND.buzzStart(INK_SIM.sessionBands(sess).buzz);else INK_SOUND.buzzStart(Object.assign({},INK_SIM.sessionBands(sess).buzz,{hz:INK_SIM.sessionBands(sess).buzz.hz*0.9}));

  if(must.length)out.push(`<span class="clChip must">Must have: ${esc(must.join(", "))}</span>`);
  if(deal.length)out.push(`<span class="clChip deal">Avoid: ${esc(deal.join(", "))}</span>`);
  const t=c.traits||{},band=v=>v<0.34?"low":v<0.67?"medium":"high";
  if(known.pain)out.push(`<span class="clChip">Pain tolerance ${band(t.pain)}</span>`);
  if(known.sun)out.push(`<span class="clChip">Sun ${band(t.sun)}</span>`);
  if(known.budget)out.push(`<span class="clChip">Budget ${band(t.budget)}</span>`);
  if(known.cover)out.push(`<span class="clChip">${(c.cover||0)>0.5?"Needs to cover it for work":"Can show it at work"}</span>`);
  if(known.aftercare)out.push(`<span class="clChip">Aftercare ${band(t.aftercare)}</span>`);
  return out.join("");}
/* loyalty as a bar with notches, so it reads without colour */
function clLoyal(v){v=clamp(v||0,0,1);return`<span class="clLoy" role="img" aria-label="Loyalty ${Math.round(v*100)} out of 100"><i style="width:${Math.round(v*100)}%"></i></span>`;}
function clSrc(q){if(q.kind==="walkin")return"Walk-in";
  if(q.beat==="first_year")return"One of your first";if(q.beat==="bad_mouth")return"The bad review";if(q.from==="mentor")return"Sent by Arkady";   // PR 8
  if(q.from==="convention")return"Met at a convention";if(q.src==="social")return"Found you online";if(q.puzzle)return"Cover-up job";if(q.src==="referral"){const f=clReal(q.from);return f?`Sent by ${f.first}`:"Referral";}
  if(q.ret)return"Coming back: "+(CL_RET[q.ret.rule]||"more work");return"Booked consult";}
const CL_RET={touchup:"touch-up",addon:"add-on",sleeve:"sleeve",cover_own:"cover your old work",cover_other:"cover-up"};
function clAskOf(q){return q.ask||(clWho(q)||{}).ask||{};}

function renderClients(){

  if(CL.view==="list")clRenderList();else if(CL.view==="work"&&typeof gvRenderWork==="function")gvRenderWork($("clView"));else clRenderWeek();}

/* ---- This week ---- */
function clCard(q){
  const c=clWho(q);if(!c)return"";
  const a=clAskOf(q);
  if(q.kind==="session"){
    const label=q.design&&q.design.elements&&q.design.elements.length?INK_SIM.pieceLabel(q.design):(a.tags||[]).slice(0,3).join(", ")||"a piece";
    const ready=!!(q.design&&q.design.elements&&q.design.elements.length);
    return`<article class="clQ ses"><header><span class="clK">In the chair</span><h3>${esc(c.name)}</h3><span class="clMeta">${clAge(c)} · ${esc(c.pronouns)}</span></header>
<p class="clAsk">${esc(clAskLine(a))}</p>
<p class="clMeta">Sitting ${q.sessionNo||1} of ${q.sessions||1} · ${+(q.hours||0).toFixed(1)} h · ${q.fix?"free fix after an infection":`${fmtMoney(q.price||0)} (${fmtMoney(q.deposit||0)} paid up front)`}${q.moved?` · moved ${q.moved}×`:""}</p>
<p class="clDz ${ready?"ok":"todo"}"><span aria-hidden="true">${ready?"●":"○"}</span> ${ready?`Design ready: ${esc(label)}`:"Needs a design"}</p>
<div class="row"><button class="btn sm${ready?"":" pri"}" data-dz="${q.id}">${ready?"Edit design":"Design it"}</button><button class="btn sm${ready?" pri":""}" data-ses="${q.id}"${ready?"":" disabled"}>${typeof sessionStartBooked==="function"?"Start session":"Quick session"}</button></div></article>`;}
  const exp=q.expires!=null?INK_SIM.weekFrom(q.expires):null;
  return`<article class="clQ ${q.kind}"><header><span class="clK">${esc(clSrc(q))}</span><h3>${esc(c.name)}</h3><span class="clMeta">${clAge(c)} · ${esc(c.pronouns)} · ${esc(c.job||"")}</span></header>
<blockquote>${esc(q.brief||c.brief||"")}</blockquote>
<p class="clMeta">${q.kind==="walkin"?"Leaves at the end of the week if nobody talks to them.":exp?`Will wait until week ${exp.w}, ${exp.y}.`:""}</p>
<div class="row"><button class="btn sm pri" data-con="${q.id}">Consult</button></div></article>`;}
function clRenderWeek(){
  const due=S.queue.filter(clDue),door=due.filter(q=>q.kind==="walkin"),cons=due.filter(q=>q.kind==="consult"),chair=due.filter(q=>q.kind==="session").sort(clByWeek);
  const later=S.queue.filter(q=>q.kind==="session"&&!clDue(q)).sort(clByWeek);
  const used=chair.reduce((h,q)=>h+(q.hours||0),0),cap=INK_SIM.weekHours(S),wait=INK_SIM.waitWeeks(S);
  const sec=(t,items)=>items.length?`<h2 class="clH">${t} <span class="dzTag">${items.length}</span></h2><div class="clQs">${items.map(clCard).join("")}</div>`:"";
  let h=`<div class="card clSum"><dl class="kv"><dt>Week</dt><dd>${S.week}, ${S.year}</dd><dt>Chair this week</dt><dd>${+used.toFixed(1)} of ${cap} h booked</dd><dt>Waiting list</dt><dd>${wait<0.5?"none":`about ${Math.ceil(wait)} week${Math.ceil(wait)===1?"":"s"}`}</dd></dl></div>`;
  h+=sec("At the door",door)+sec("Booked consults",cons)+sec("In the chair",chair);
  if(!door.length&&!cons.length&&!chair.length)h+=`<div class="card empty"><svg viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16"/><path d="M2 21h20"/><circle cx="15" cy="12" r="1"/></svg><p><b>Nobody at the door this week.</b></p><p>Practise, draw flash, then press Next on the Career tab.</p><div class="row" style="justify-content:center"><button class="btn pri" id="clGoNext">Go to Next</button></div></div>`;
  if(later.length)h+=`<h2 class="clH">Coming up</h2><div class="card clLater">${later.slice(0,8).map(q=>{const c=clWho(q);return`<div class="clRow"><b>Week ${q.w}, ${q.y}</b><span>${esc(c?c.name:"?")}</span><span class="clMeta">sitting ${q.sessionNo||1} of ${q.sessions||1} · ${+(q.hours||0).toFixed(1)} h${q.design?"":" · needs a design"}</span>${q.design?"":`<button class="btn sm" data-dz="${q.id}">Design it</button>`}</div>`;}).join("")}${later.length>8?`<p class="hint">And ${later.length-8} more.</p>`:""}</div>`;
  $("clView").innerHTML=h;
  const v=$("clView");
  v.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.id==="clGoNext")return showTab("career");
    if(b.dataset.con)clStartConsult(b.dataset.con);else if(b.dataset.dz)clDesignFor(b.dataset.dz);else if(b.dataset.ses)clSession(b.dataset.ses);});}

<div class="row">${o==="accepted"&&it?`<button class="btn pri" id="clEndDz">Design it now</button>`:""}<button class="btn" id="clEndBack">Back to this week</button></div></div>`;}
  else foot=`<div class="clOpts" role="group" aria-label="What do you say?">${opts.map(o=>`<button class="btn clOpt k-${o.kind}" data-o="${esc(o.id)}">${esc(o.text)}</button>`).join("")}</div>`;

  $("clientsBody").innerHTML=`<div class="cl clCon">
<div class="card clConHd"><div class="clConT"><button class="btn sm" id="clConX" aria-label="Leave the consult">‹ Back</button><div><h2>${esc(cl.name)}</h2><p class="clMeta">${esc(cl.job||"")} · ID checked, 18+ · ${c.stage==="done"?"done":`${left} exchange${left===1?"":"s"} left`}</p></div></div>
<p class="clAsk">${esc(clAskLine(c.ask))}${(c.ask.tags||[]).length?` · ${esc(c.ask.tags.slice(0,4).join(", "))}`:""}</p>
<div class="clChips">${clWhat(cl,c.known)||`<span class="clMeta">Ask questions to find out what matters to them.</span>`}</div>
${q?`<p class="clQuote">Quote: <b>${fmtMoney(q.price)}</b> · ${fmtMoney(q.deposit)} deposit · ${+q.hours.toFixed(1)} h over ${q.sessions} sitting${q.sessions===1?"":"s"}</p>`:`<p class="clMeta">Rough size of the job: ${+c.est.hours.toFixed(1)} h${c.est.sessions>1?` over ${c.est.sessions} sittings`:""} · your rate ${fmtMoney(c.rate)} an hour${c.wait>0.5?` · ${Math.ceil(c.wait)} week wait`:""}</p>`}</div>
<div class="clChat" id="clChat" aria-live="polite">${c.transcript.map(bub).join("")}</div>
${foot}</div>`;
  $("clConX").addEventListener("click",()=>{if(c.stage!=="done"&&!confirm(`Leave the consult? ${cl.first} is still waiting; you can come back to it this week.`))return;CL.consult=null;CL.done=null;renderClients();});
  const ch=$("clChat");if(ch.lastElementChild&&c.step)ch.lastElementChild.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches||S.settings.reduced?"auto":"smooth"});
  if(c.stage==="done"){
    $("clEndBack").addEventListener("click",()=>{CL.consult=null;CL.done=null;CL.view="week";renderClients();});
    const dz=$("clEndDz");if(dz)dz.addEventListener("click",()=>{const id=CL.done.item.id;CL.consult=null;CL.done=null;clDesignFor(id);});
    return;}
  $("clientsBody").querySelector(".clOpts").addEventListener("click",e=>{const b=e.target.closest("button[data-o]");if(b)clChoose(b.dataset.o);});}
function clChoose(id){
  const c=CL.consult;if(!c||c.stage==="done")return;
  const r=INK_SIM.rng(S.seed).fork(`consult:${c.clientId}:${S.year}:${S.week}:${c.step}:${id}`);
  CL.consult=INK_SIM.consultChoose(c,id,r);INK_SOUND.tick();
  if(CL.consult.stage==="done"){CL.done=INK_SIM.consultCommit(S,CL.consult);save();renderHeader();
    if(CL.consult.outcome==="accepted")toast(`${CL.consult.client.first} is booked`);}
  renderClients();}

/* ---- designing for a booking (the board's bar) ---- */
function clDesignFor(id){
  const q=S.queue.find(x=>x.id===id),c=q&&INK_SIM.findClient(S,q.client);if(!c)return;
  const a=clAskOf(q),old=typeof DZ!=="undefined"&&DZ.m&&DZ.m.els.length&&S.board.item!==id?JSON.stringify(DZ.m):null;
  Object.assign(S.board,{client:c.id,item:q.id,bodyShape:c.bodyShape||"neutral",skinTone:c.skinTone!=null?c.skinTone:0.3});
  S.board.design=q.design?JSON.parse(JSON.stringify(q.design)):{placement:INK_SIM.PLACEMENTS[a.placement]?a.placement:"forearm_l",style:a.style||"traditional",flash:null,sizeMm:0,pos:{x:.5,y:.5},elements:[]};
  if(typeof DZ!=="undefined"){DZ.m=null;DZ.undo.length=0;DZ.redo.length=0;DZ.base=null;DZ.prev=null;DZ.view="board";dzLoad();if(old)DZ.undo.push(old);}
  save();showTab("design");$("panel").scrollTop=0;toast(`Designing for ${c.first}${old?" (Undo brings back what was on the board)":""}`);}
/* called by renderDesign: the bar above the board when it's working on a real client */
function clBookingBar(){
  const b=S.board,c=clReal(b.client);if(!c)return"";
  const q=b.item&&S.queue.find(x=>x.id===b.item);
  if(b.item&&!q)b.item=null;

  return`<div class="card clBk"><div class="clBkT"><span class="clK">Designing for</span><b>${esc(c.name)}</b>${q?`<span class="clMeta">sitting ${q.sessionNo||1} of ${q.sessions||1}, week ${q.w}, ${q.y}</span>`:""}</div>
<p class="clAsk">Asked for: ${esc(clAskLine(a))}${(a.tags||[]).length?` · ${esc(a.tags.slice(0,4).join(", "))}`:""}</p>${what?`<div class="clChips">${what}</div>`:""}
<div class="row">${q?`<button class="btn sm pri" id="clBkSave">Save to booking</button>`:""}<button class="btn sm" id="clBkOff">${q?"Stop":"Back to sample clients"}</button></div></div>`;}
function clBookingWire(){
  const s=$("clBkSave"),o=$("clBkOff");
  if(s)s.addEventListener("click",()=>{const q=S.queue.find(x=>x.id===S.board.item),c=clReal(S.board.client);if(!q||!c)return;
    const d=dzToDesign();if(!d.elements.length){toast("Put something on the board first");return;}

  if(o)o.addEventListener("click",()=>{S.board.item=null;S.board.client=DZ_SAMPLE_CLIENTS[0].id;const s0=DZ_SAMPLE_CLIENTS[0];S.board.bodyShape=s0.bodyShape;S.board.skinTone=s0.skinTone;
    DZ.m=Object.assign(dzFromDesign(dzToDesign()),{fsig:DZ.m.fsig});save();renderDesign();});}

/* ---- sittings ---- */
function clSession(id){
  const q=S.queue.find(x=>x.id===id);if(!q)return;
  if(!(q.design&&q.design.elements&&q.design.elements.length)){toast("Design it first");return;}
  if(typeof sessionStartBooked==="function")return sessionStartBooked(q);
  clQuickSession(q);}
/* until PR 4's session: a sitting worked out from your skills, on dice forked from the item and the week */
const CL_QUICK={base:0.55,perSkill:0.035,sd:0.06,trauma:0.25,traumaPerSkill:0.015};
function clQuickSession(q){
  const sk=S.skills||{},r=INK_SIM.rng(S.seed).fork(`quick:${q.id}:${S.year}:${S.week}`),K=CL_QUICK;
  const roll=k=>clamp(K.base+K.perSkill*(sk[k]||0)+r.normal(0,K.sd),0.2,0.98);
  const out={lineQuality:roll("linework"),depthQuality:roll("linework"),saturation:roll("shading"),trauma:clamp(K.trauma-K.traumaPerSkill*(sk.linework||0)+r.normal(0,K.sd),0,1)};
  for(const k in out)out[k]=Math.round(out[k]*1000)/1000;
  const res=INK_SIM.finishSession(S,q.id,{design:q.design,out,heal:null});if(!res)return;
  if(S.board.item===q.id)S.board.item=res.next?res.next.id:null;
  save();renderHeader();renderClients();INK_SOUND.tick();
  toast(res.piece?`Finished: ${res.piece.name}. ${fmtMoney(res.paid)} paid.`:`Sitting ${q.sessionNo||1} of ${q.sessions||1} done, ${fmtMoney(res.paid)} paid. Next sitting week ${res.next.w}.`);}

/* ---- the client list and a client's card ---- */
const CL_FILTERS=[["all","All"],["regular","Regulars"],["booked","Booked"],["walked","Walked"]];
function clLastConsult(c){for(let i=(c.history||[]).length-1;i>=0;i--)if(c.history[i].kind==="consult")return c.history[i];return null;}
function clMatch(c,f,booked){
  if(f==="regular")return(c.pieces||[]).length>=2;
  if(f==="booked")return booked.has(c.id);
  if(f==="walked"){const l=clLastConsult(c);return!!l&&l.outcome!=="accepted";}
  return true;}
function clRenderList(){
  const booked=new Set(S.queue.filter(q=>q.client).map(q=>q.client)),qs=CL.q.trim().toLowerCase();
  const list=S.clients.filter(c=>clMatch(c,CL.filter,booked)&&(!qs||(c.name||"").toLowerCase().includes(qs)))
    .sort((a,b)=>INK_SIM.weekIndex((b.lastSeen||b.since||{}).w||1,(b.lastSeen||b.since||{}).y||2000)-INK_SIM.weekIndex((a.lastSeen||a.since||{}).w||1,(a.lastSeen||a.since||{}).y||2000));
  const rows=list.slice(0,CL.show).map(c=>{const ls=c.lastSeen||c.since||{},np=(c.pieces||[]).length;
    return`<button class="clLi" data-c="${esc(c.id)}"><span class="clLiN"><b>${esc(c.name)}</b><span class="clMeta">${clAge(c)} · ${esc(c.job||"")}</span></span><span class="clLiR"><span class="clMeta">${np} piece${np===1?"":"s"}${booked.has(c.id)?" · booked":""} · ${ls.y||""}</span>${clLoyal(c.loyalty)}</span></button>`;}).join("");
  $("clView").innerHTML=`<div class="card clFil"><div class="row">${segHtml("clF",CL_FILTERS,CL.filter)}</div>
<label class="clSearch"><span class="sr">Search by name</span><input id="clQ" type="search" placeholder="Search by name" value="${esc(CL.q)}" autocomplete="off"></label></div>
${S.clients.length?(list.length?`<div class="clLis">${rows}</div>${list.length>CL.show?`<div class="row" style="justify-content:center"><button class="btn" id="clMore">Show more (${list.length-CL.show})</button></div>`:""}`:`<div class="card empty"><p>Nobody matches.</p></div>`)
:`<div class="card empty"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/></svg><p><b>No clients yet.</b></p><p>Talk to whoever walks in. Everyone you consult is remembered here, even the ones who walk out.</p></div>`}`;
  $("clF").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(!b)return;CL.filter=b.dataset.v;CL.show=40;clRenderList();});
  $("clQ").addEventListener("input",e=>{CL.q=e.target.value;CL.show=40;const pos=e.target.selectionStart;clRenderList();const i=$("clQ");i.focus();try{i.setSelectionRange(pos,pos);}catch(_){}});
  const m=$("clMore");if(m)m.addEventListener("click",()=>{CL.show+=40;clRenderList();});
  $("clView").querySelector(".clLis")?.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b)clOpenClient(b.dataset.c);});}
/* a piece as it looks today: the design re-rendered, blurred and faded by the aging model for its age */
function clPieceToday(p,c){
  const yrs=Math.max(0,(S.year-p.y)+(S.week-p.w)/52);
  let a={blur:0,fade:0,spread:0,readability:1};
  try{a=INK_SIM.age({design:p.design,out:p.out,heal:p.heal,skinTone:c.skinTone,sun:(c.traits||{}).sun},yrs)||a;}catch(e){}
  const d=p.design||{};if(!(d.elements||[]).length)return{svg:`<svg viewBox="0 0 10 10"></svg>`,a,yrs};
  const m=dzFromDesign(d),pxPer=64/Math.max(1,(d.sizeMm||40)*1.16),fd=clamp(a.fade||0,0,1);
  return{svg:dzMini(m,"",`filter:blur(${dzR2(Math.max(0,(a.blur||0)*pxPer))}px) saturate(${dzR2(1-fd*0.9)});opacity:${dzR2(1-fd*0.7)}`,a.spread||0),a,yrs};}
const CL_HIST={consult:h=>`Consult: ${h.outcome==="accepted"?"booked":h.outcome==="walked"?"walked out":"no booking"}${h.talk==="won"?", talked out of a bad idea":h.talk==="lost"?", the talk went badly":""}${h.quote?` (${fmtMoney(h.quote.price)})`:""}`,
  piece:h=>`Finished ${h.name||"a piece"}`,session:h=>`Sitting ${h.n} of ${h.of}`,review:h=>`Review: ${"★".repeat(h.stars||0)}${"☆".repeat(5-(h.stars||0))} “${h.text||""}”`,
  referral:h=>{const r=clReal(h.client);return`Sent you ${r?r.first:"a friend"}`;},note:h=>h.text||"",heal:h=>`Healed: ${(INK_SIM.HEAL_GRADES[h.grade]||{}).name||h.grade||""}`};
function clOpenClient(id){
  const c=INK_SIM.findClient(S,id);if(!c)return;
  const pcs=(c.pieces||[]).map(pid=>S.pieces.find(p=>p.id===pid)).filter(Boolean);
  const ref=clReal(c.referredBy),since=c.since||{};
  const pieceHtml=pcs.length?`<div class="clPcs">${pcs.map(p=>{const t=clPieceToday(p,c),r=t.a.readability,cls=r<0.35?"bad":r<0.6?"meh":"ok";
    return`<figure class="clPc"${typeof gvOpen==="function"?` data-gp="${esc(p.id)}" role="button" tabindex="0"`:""}><div class="clPcA board">${t.svg}</div><figcaption><b>${esc(p.name)}</b><span class="clMeta">${p.y} · ${t.yrs<1?"fresh":Math.floor(t.yrs)+" yr"} · reads <b class="${cls}">${Math.round(r*100)}</b>${p.heal?` · healed ${esc((INK_SIM.HEAL_GRADES[p.heal]||{}).name||p.heal)}`:""}${p.portfolio?" · ★ portfolio":""}</span></figcaption></figure>`;}).join("")}</div>`:`<p class="hint">No pieces yet.</p>`;
  const hist=(c.history||[]).slice(-30).reverse().map(h=>{const f=CL_HIST[h.kind];return f?`<li><span class="clMeta">Wk ${h.w}, ${h.y}</span> ${esc(f(h))}</li>`:"";}).join("");

/* ---- conventions: pick the pieces, then the results ---- */
function evConvOpen(invId){

    return`<button class="evPk${EV.pick[kind]===p.id?" on":""}" data-pid="${esc(p.id)}" aria-pressed="${EV.pick[kind]===p.id}">${t.svg}<span><b>${esc(gvCap(p.label||"piece"))}</b><span class="clMeta">${p.y}${kind==="healed"?" · reads "+Math.round(t.a.readability*100):""}${p.portfolio?" · ★":""}</span></span></button>`;}).join("")}
<button class="evPk none${EV.pick[kind]?"":" on"}" data-pid="" aria-pressed="${!EV.pick[kind]}"><span><b>Don't enter this one</b></span></button></div>`:`<p class="clMeta">Nothing that qualifies.</p>`}</section>`;
  openSheet(gvCapS(cv.name||"Convention"),`<p class="hint" style="margin-top:0">Entry and travel ${fmtMoney(inv.fee)}. Your flash sells at the booth whatever the judges say.</p>
${row("fresh",cand.fresh,"Fresh work","Done in the last few months. Judged on the design and how cleanly it went in.")}
${row("healed",cand.healed,"Healed work","A year old or more. Judged on how it reads today and how it healed. This is where good work shows.")}
<div class="row"><button class="btn pri" id="evConvGo">Enter</button><button class="btn" id="evConvNo">Skip it</button></div>`);

function evConvResult(r){

<dl class="kv"><dt>Booth sales</dt><dd class="in">+${fmtMoney(r.booth)}</dd></dl>
${r.metClient?`<p>${esc(r.metClient.name)} stood at your booth for half an hour and booked a consult for week ${r.metClient.w}.</p>`:`<p class="clMeta">Plenty of people stopped at the booth. Nobody booked on the spot.</p>`}
${r.rivals&&r.rivals.length?`<section><h3>Other shops from Mostograd</h3><ul class="caPast">${r.rivals.map(x=>`<li>${esc(x.line)}</li>`).join("")}</ul></section>`:""}
${(r.goals||[]).map(id=>{const g=INK_SIM.GOALS.find(x=>x.id===id);return g?`<div class="evGoalNow"><span class="clK">Goal reached</span><b>${esc(g.name)}</b><button class="btn sm shBtn" data-gcard="${esc(id)}">${SH_ICON}Share card</button></div>`:"";}).join("")}

<div class="evChoices">${Object.keys(R.choices).map(k=>`<button class="btn${k===Object.keys(R.choices)[0]?" pri":""}" data-rc="${esc(k)}">${esc(R.choices[k].label)}</button>`).join("")}</div>`);

    $("sheetBody").innerHTML=`<p>${esc(r.text)}</p>${r.item?`<p class="hint">A free sitting is booked for week ${r.item.w}, ${r.item.y}. The design is the old one; open it on the board to rework it.</p>`:""}<div class="row"><button class="btn pri" id="evOk">OK</button></div>`;
    $("evOk").addEventListener("click",closeSheet);if(typeof renderClients==="function"&&curTab==="clients")renderClients();}));
