   cards, buttons, the settings/backup sheet, toasts, the "New version ready" bar, and the design-board cream (both themes:

:root{

html[data-theme=light]{

function tick(){if(!on||!init())return;try{if(ctx.state==="suspended")ctx.resume();const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
  o.type="triangle";o.frequency.setValueAtTime(1400,t);o.frequency.exponentialRampToValueAtTime(700,t+.04);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.06);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.07);}catch(e){}}
return{init,tick,setOn(v){on=!!v;},isOn(){return on;}};
})();
</script>
<script>
/* ===================== Ink: INK_VIS (three.js) =====================
   INK_VIS draws what the sim says: the mannequin, the tattoos as decals, the studio. One IIFE spread over src/vis/:
   this file opens it, vis/api.js closes it and sets window.INK_VIS. three.js r128 from the CDN.
   core.js: the renderer, the tier settings (lite / full / ultra) and on-demand rendering. Nothing draws every frame unless
   something is moving; a still scene renders once per change, which keeps phones cool. fps() reports the measured rate
   while a loop runs (null when idle) for app/perf.js. */
(function(){"use strict";
const V={renderer:null,scene:null,camera:null,canvas:null,tier:"lite",dirty:true,looping:false,fps:null,_f:0,_t0:0,raf:0};
const TIER={lite:{pr:1,aa:false,fpsCap:30},full:{pr:1.5,aa:true,fpsCap:60},ultra:{pr:2,aa:true,fpsCap:60}};
function hasGL(){return typeof THREE!=="undefined";}
function init(canvas,tier){
  if(!hasGL())return false;
  V.canvas=canvas;V.tier=TIER[tier]?tier:"lite";
  try{V.renderer=new THREE.WebGLRenderer({canvas,antialias:TIER[V.tier].aa,powerPreference:"low-power"});}catch(e){V.renderer=null;return false;}
  V.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,TIER[V.tier].pr));
  V.renderer.outputEncoding=THREE.sRGBEncoding;
  V.scene=new THREE.Scene();
  V.camera=new THREE.PerspectiveCamera(42,1,.1,60);
  resize();
  window.addEventListener("resize",()=>{resize();});
  return true;}
function resize(){if(!V.renderer||!V.canvas)return;const w=V.canvas.clientWidth||1,h=V.canvas.clientHeight||1;V.renderer.setSize(w,h,false);V.camera.aspect=w/h;V.camera.updateProjectionMatrix();V.dirty=true;draw();}
function setTier(t){if(!TIER[t]||!V.renderer)return;V.tier=t;V.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,TIER[t].pr));resize();}
/* render once if something changed */
function draw(){if(!V.renderer||!V.dirty)return;V.dirty=false;V.renderer.render(V.scene,V.camera);}
/* ===== vis/body.js: the mannequin, one low-poly adult mesh with three body-shape morphs, skin-tone material, one UV
   island per limb or zone (PR 6) ===== */
/* ===== vis/decals.js: tattoos rendered into each island's UV space and composited into a per-client skin texture;
   aging applies blur and fade on the canvas (PR 6) ===== */
/* ===== vis/studio.js: the shop interior. PR 0 is a placeholder (warm lamp, floor, back wall and the chair as simple
   shapes) so the three.js pipeline is proven on every tier; PR 6 replaces it with the real studio stages. ===== */
function studioPlaceholder(){
  const s=V.scene;s.background=new THREE.Color(0x0f0c09);
  s.add(new THREE.HemisphereLight(0xffe2bf,0x20160e,.55));
  const lamp=new THREE.PointLight(0xffc98a,1.1,14);lamp.position.set(.8,2.6,1.4);s.add(lamp);
  const mat=c=>new THREE.MeshLambertMaterial({color:c});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),mat(0x3a2b20));floor.rotation.x=-Math.PI/2;s.add(floor);
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(10,4),mat(0x6b4f3a));wall.position.set(0,2,-2.2);s.add(wall);
  const flash=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1),mat(0xf3ead8));flash.position.set(-1.4,1.7,-2.18);s.add(flash);
  const leather=mat(0x1d1a17),steel=mat(0x8a8780);
  const chair=new THREE.Group();
  const seat=new THREE.Mesh(new THREE.BoxGeometry(.7,.14,1.0),leather);seat.position.y=.62;chair.add(seat);
  const back=new THREE.Mesh(new THREE.BoxGeometry(.7,.12,.8),leather);back.position.set(0,.95,-.62);back.rotation.x=-1.05;chair.add(back);
  const post=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.5,10),steel);post.position.y=.3;chair.add(post);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,.06,16),steel);base.position.y=.03;chair.add(base);
  chair.position.set(.5,0,-.6);chair.rotation.y=-.5;s.add(chair);
  const stool=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.08,16),leather);stool.position.set(-.5,.5,.1);s.add(stool);
  const stoolPost=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.46,8),steel);stoolPost.position.set(-.5,.25,.1);s.add(stoolPost);
  V.camera.position.set(0,1.7,3.4);V.camera.lookAt(0,.8,-.6);V.dirty=true;}
/* ===== vis/api.js: the INK_VIS public object, IIFE close. Later PRs add setClient, setTattoos, setView, setStudio. ===== */
window.INK_VIS={
  init(canvas,tier){const ok=init(canvas,tier);if(ok){studioPlaceholder();draw();}return ok;},
  ready(){return !!V.renderer;},
  setTier,resize,
  redraw(){V.dirty=true;draw();},
  fps(){return V.looping?V.fps:null;},
  _state:V
};
})();
</script>

<script>
/* ===================== Ink: app =====================
   The app script is one top-level script spread over src/app/ (state.js opens it, help.js closes it; html/tail.html then
   calls start()). It glues INK_SIM (numbers) and INK_VIS (pictures) to the page.
   state.js: VERSION, small helpers ($, esc, fmtMoney, toast), the state object S, save / load / snapshot / hydrate,
   the three save slots and the theme. S is defined ONCE, in freshState() below; later PRs add fields there (and to the
   S map in src/README.md), never inline. localStorage keys: ink-save, ink-slot1 .. ink-slot3 (all inside try/catch). */
const VERSION="0.1.0.0";
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* money display. The currency is open (plan Q15: Lombard's Mostograd currency or plain dollars); only this table changes */
const MONEY={sym:"$",before:true};
const fmtMoney=n=>{const s=Math.round(Math.abs(n)).toLocaleString("en-CA");return(n<0?"-":"")+(MONEY.before?MONEY.sym+s:s+" "+MONEY.sym);};

/* ---- the state object ---- */
const SAVE_KEY="ink-save",SLOTS=3,slotKey=i=>"ink-slot"+i;
const SAVE_V=1;   // bump when a save needs migrating in hydrate()
function freshState(){return{
  v:SAVE_V,
  week:1,            // 1..52 within the year
  year:2000,         // 2000..2030
  cash:0,
  seed:(Date.now()>>>0)%2147483647||1,   // the career's rng seed (INK_SIM.rng); the only Date-based value in the game
  settings:{theme:"dark",gfx:null,gfxAuto:true,sound:true,reduced:false},
  bkAt:0             // when the last backup code or file was made (app/savecode.js)
};}
let S=freshState();

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot()));if(typeof buPersist==="function")buPersist();}catch(e){}}
function snapshot(){return JSON.parse(JSON.stringify(S));}
/* load a saved object into S on top of a fresh state, so a field added since that save gets its default. false if it
   isn't an Ink save. */
function hydrate(o){
  if(!o||typeof o!=="object"||Array.isArray(o))return false;
  if(o.settings!=null&&(typeof o.settings!=="object"||Array.isArray(o.settings)))return false;
  const f=freshState();
  S=Object.assign(f,o,{settings:Object.assign(f.settings,o.settings||{})});
  S.v=SAVE_V;
  return true;}
function loadSaved(){try{const j=localStorage.getItem(SAVE_KEY);if(j&&hydrate(JSON.parse(j)))return true;}catch(e){}S=freshState();return false;}
/* a restored or slot-loaded game takes over the running one */
function applyLoaded(o,msg){if(!hydrate(o)){toast("That save couldn't be loaded");return;}save();applySettings();renderAll();toast(msg||"Loaded");}

/* ---- theme and settings ---- */
function applyTheme(){const t=S.settings.theme||"dark";const eff=t==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):t;
  document.documentElement.setAttribute("data-theme",eff);
  const m=document.querySelector("meta[name=theme-color]");if(m)m.setAttribute("content",eff==="light"?"#f4efe6":"#17130f");}
function applySettings(){applyTheme();document.documentElement.classList.toggle("noanim",!!S.settings.reduced);INK_SOUND.setOn(S.settings.sound!==false);applyGfx();}

/* ---- toast ---- */
function toast(msg){const t=$("toast");if(!t)return;t.textContent=msg;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600);}
/* ===================== app/perf.js: graphics tiers and auto-adjust =====================
   Three tiers: lite (phone default), full, ultra. S.settings.gfx is the player's pick (null = automatic: lite on phones,
   full elsewhere). Auto-adjust (S.settings.gfxAuto, on unless false), lifted from Prairie Engine Works: while INK_VIS runs
   a frame loop, watch its fps; if it stays under ~27 fps for ~8 s, step ONE tier down (ultra > full > lite) and say so.
   It never steps up, and a manual pick after an auto-drop is respected for the session. A still scene reports no fps,
   so nothing happens while the studio is idle. */
const PERF={T:["lite","full","ultra"],LOW:27,NEED:8000,SETTLE:6000,HOLD:3000,boot:performance.now(),f:null,fAt:0,sAt:0,low:0,tier:null,tab:null,holdTo:0,dropped:false,manual:false,force:null};
function perfTier(){return S.settings.gfx||(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)?"lite":"full");}
function applyGfx(){if(typeof INK_VIS!=="undefined"&&INK_VIS.ready())INK_VIS.setTier(perfTier());}
function perfReset(hold){PERF.low=0;PERF.sAt=0;if(hold)PERF.holdTo=performance.now()+PERF.HOLD;}
function perfPoll(){
  if(!S||typeof INK_VIS==="undefined"||!INK_VIS.ready())return;
  const now=performance.now();
  if(S.settings.gfxAuto===false||(PERF.dropped&&PERF.manual)||document.hidden||now-PERF.boot<PERF.SETTLE){perfReset(true);return;}
  if(navigator.webdriver&&PERF.force==null)return;
  const tier=perfTier();if(tier!==PERF.tier){PERF.tier=tier;perfReset(true);}
  if(curTab!==PERF.tab){PERF.tab=curTab;perfReset(true);}
  if(now<PERF.holdTo)return;
  const f=INK_VIS.fps();let fps;
  if(PERF.force!=null){fps=PERF.force;if(!PERF.sAt){PERF.sAt=now;return;}}
  else if(f!=null&&f!==PERF.f){PERF.f=f;PERF.fAt=now;fps=f;if(!PERF.sAt){PERF.sAt=now;return;}}
  else{if(now-PERF.fAt>1500)perfReset(false);return;}   // nothing drawn lately: start over
  const el=Math.min(now-PERF.sAt,1000);PERF.sAt=now;
  if(fps>0&&fps<PERF.LOW)PERF.low+=el;else PERF.low=Math.max(0,PERF.low-2*el);
  if(PERF.low<PERF.NEED)return;
  PERF.low=0;const i=PERF.T.indexOf(tier);if(i<1)return;
  const n=PERF.T[i-1];PERF.dropped=true;S.settings.gfx=n;applyGfx();save();perfReset(true);
  toast(`Graphics lowered to ${n[0].toUpperCase()+n.slice(1)} to keep things smooth. Change it in Settings.`);}
setInterval(perfPoll,500);
/* ===================== app/savecode.js: SAVE CODES (Back up / Restore) =====================
   Lifted from Prairie Engine Works' savecode.js. One code holds everything Ink keeps in the browser, so a player can move
   to another phone or keep a copy somewhere safe. All of it lives in localStorage on this device; nothing is sent anywhere.
     save    the current game ("ink-save"), taken live with snapshot(). Settings ride in it.
     slots   the 3 manual slots ("ink-slot1" .. "ink-slot3"), null for an empty one
   Code = "INK1:" + body + a 6-character checksum. body = that object as JSON -> UTF-8 bytes -> LZW (9..16-bit codes) ->
   base64url (A-Z a-z 0-9 - _ only), so it survives notes apps, email and chat.
   Tattoos are saved as design parameters + session outputs + dates, never as pictures; everything visual is re-rendered.
   Restore checks everything before it writes anything: checksum, unpack, JSON, the shape of every save and a trial
   hydrate() of each. Then buWrite() writes all four keys and puts the old values back if any write fails.
   A NEW localStorage key must be added to buMake and buWrite (and check-savecode.js), and asked about first.
   The next version of this format is INK2:. Tests: `node check-savecode.js` in the repo root. */
const BU_V=1,BU_PREFIX="INK"+BU_V+":";
const BU_B64="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_",BU_MAXCODES=65536;
const BU_MSG={
  empty:"Paste a backup code into the box first.",
  damaged:"That code is damaged or cut off. Copy the whole code again, from INK1: right to the end, and paste it here.",
  newer:"That code was made by a newer version of the game. Reload the page to update, then try again.",
  other:"That's a save code from a different game. Ink backup codes start with \"INK1:\".",
  notcode:"That doesn't look like a save code. Backup codes start with \"INK1:\".",
  bad:"That code opened, but the save inside doesn't look right, so nothing was changed.",
  store:"This browser wouldn't let the game save (storage may be full or blocked), so nothing was changed."
};
const buFail=k=>{const e=new Error(BU_MSG[k]);e.bu=k;return e;};   // an error with a message that's fine to show the player

/* ---- packing: bytes <-> base64url text ---- */
function buBits(n){let b=1;while(n>=2){n>>>=1;b++;}return b;}   // how many bits it takes to write n
/* LZW over bytes. Bits go MSB-first into 6-bit base64url characters and the tail is zero-padded. A code's width is the
   bit length of the largest code the reader could see next, so both sides always agree on it. */
function buZip(bytes){
  const out=[];let acc=0,nacc=0;
  const put=(v,w)=>{for(let i=w-1;i>=0;i--){acc=acc<<1|(v>>>i&1);if(++nacc===6){out.push(BU_B64[acc]);acc=0;nacc=0;}}};
  if(!bytes.length)return"";
  const dict=new Map();let next=256,cur=bytes[0];
  for(let i=1;i<bytes.length;i++){
    const key=cur*256+bytes[i],hit=dict.get(key);
    if(hit!==undefined){cur=hit;continue;}
    put(cur,buBits(next-1));
    if(next<BU_MAXCODES)dict.set(key,next++);
    cur=bytes[i];}
  put(cur,buBits(next-1));
  if(nacc)out.push(BU_B64[acc<<(6-nacc)]);
  return out.join("");}
function buUnzip(str){
  let pos=0;const total=str.length*6,out=[];
  const read=w=>{let v=0;for(let i=0;i<w;i++,pos++){const d=BU_B64.indexOf(str[pos/6|0]);if(d<0)throw buFail("damaged");v=v*2+(d>>(5-pos%6)&1);}return v;};
  if(total<8)return out;
  const prefix=[],suffix=[],first=[];for(let i=0;i<256;i++){prefix.push(-1);suffix.push(i);first.push(i);}
  let size=256;
  const emit=code=>{const at=out.length;while(code>=0){out.push(suffix[code]);code=prefix[code];}   // the bytes come out backwards
    for(let a=at,b=out.length-1;a<b;a++,b--){const t=out[a];out[a]=out[b];out[b]=t;}};
  let prev=read(8);emit(prev);
  for(;;){
    const w=buBits(Math.min(size,BU_MAXCODES-1));
    if(total-pos<w)break;   // what's left is padding
    const code=read(w);let fb;
    if(code<size)fb=first[code];
    else if(code===size)fb=first[prev];   // the code being defined right now (the classic LZW "KwKwK" case)
    else throw buFail("damaged");
    if(size<BU_MAXCODES){prefix.push(prev);suffix.push(fb);first.push(first[prev]);size++;}
    emit(code);prev=code;}
  return out;}
/* FNV-1a of the body, as 6 base64url characters: a missing, extra or changed character almost surely won't match */
function buSum(body){let h=2166136261;for(let i=0;i<body.length;i++){h^=body.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  let s="";for(let i=0;i<6;i++){s+=BU_B64[h&63];h=Math.floor(h/64);}return s;}

/* ---- making a code ---- */
function buStored(k){try{const j=localStorage.getItem(k);if(!j)return null;const o=JSON.parse(j);return o&&typeof o==="object"&&!Array.isArray(o)?o:null;}catch(e){return null;}}
function buMake(){const slots=[];for(let i=1;i<=SLOTS;i++)slots.push(buStored(slotKey(i)));
  return{v:BU_V,at:Date.now(),ver:VERSION,save:snapshot(),slots};}
function buCode(d){const body=buZip(new TextEncoder().encode(JSON.stringify(d||buMake())));return BU_PREFIX+body+buSum(body);}

/* ---- checking a save before anything is written ---- */
const buObj=o=>!!o&&typeof o==="object"&&!Array.isArray(o);
const buNum=v=>typeof v==="number"&&isFinite(v);
/* the shape of an Ink save. Fields later PRs add are checked here when they arrive */
function buSaveOk(o){
  if(!buObj(o))return false;
  if("settings" in o&&!buObj(o.settings))return false;
  for(const k of ["week","year","cash","seed"])if(k in o&&!buNum(o[k]))return false;
  for(const k of ["clients","pieces","queue"])if(k in o&&!Array.isArray(o[k]))return false;
  return buTry(o);}
/* load a copy the way the game would (hydrate), then put the running game back exactly as it was */
function buTry(o){const keepS=S;let ok=false;
  try{ok=hydrate(JSON.parse(JSON.stringify(o)))===true;}catch(e){ok=false;}
  finally{S=keepS;}
  return ok;}
function buFullOk(d){return buObj(d)&&d.v===BU_V&&buSaveOk(d.save)&&Array.isArray(d.slots)&&d.slots.length<=SLOTS
  &&d.slots.every(o=>o===null||buSaveOk(o));}

/* ---- reading a code: {kind:"full",data}. Spaces, line breaks and text around the code are fine.
   Throws buFail(...) with a message for the player. ---- */
function buRead(text){
  const s=String(text==null?"":text).replace(/[\s​-‍⁠﻿]+/g,"");
  if(!s)throw buFail("empty");
  const m=/INK(\d+):/.exec(s);
  if(!m){
    if(/(^|[^A-Za-z0-9])[A-Za-z]{2,8}\d+:[A-Za-z0-9_-]/.test(s))throw buFail("other");   // e.g. PEW1:... from another game
    throw buFail("notcode");}
  const n=+m[1];
  if(n!==BU_V)throw buFail(n>BU_V?"newer":"notcode");
  const c=s.slice(m.index+m[0].length).replace(/[^A-Za-z0-9_-].*$/,"");   // drop quotes or punctuation pasted after it
  if(c.length<7)throw buFail("damaged");
  const body=c.slice(0,-6);
  if(buSum(body)!==c.slice(-6))throw buFail("damaged");
  let d;try{d=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(new Uint8Array(buUnzip(body))));}catch(e){throw buFail("damaged");}
  if(!buFullOk(d))throw buFail("bad");
  return{kind:"full",data:d};}

/* ---- writing a checked backup: all four keys, or none of them ---- */
function buWrite(d){
  const keys=[[SAVE_KEY,d.save]];for(let i=1;i<=SLOTS;i++)keys.push([slotKey(i),d.slots[i-1]||null]);
  const old=[];
  try{for(const [k] of keys)old.push([k,localStorage.getItem(k)]);}catch(e){return false;}
  try{for(const [k,v] of keys){if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}return true;}
  catch(e){   // put the old values back: clear all first, so a full storage has room for what fitted before
    try{for(const [k] of old)localStorage.removeItem(k);for(const [k,v] of old)if(v!=null)localStorage.setItem(k,v);}catch(_){}
    return false;}}

/* ---- the two sheets (Settings › Save) ---- */
function buSelect(ta){try{ta.select();ta.setSelectionRange(0,ta.value.length);}catch(e){}}
async function buCopy(ta){
  try{await navigator.clipboard.writeText(ta.value);buMarkBackup();toast("Copied. Paste it somewhere safe.");return;}catch(e){}   // no clipboard access: select it instead
  ta.focus();buSelect(ta);let ok=false;try{ok=document.execCommand("copy");}catch(e){}
  if(ok)buMarkBackup();
  toast(ok?"Copied. Paste it somewhere safe.":"Code selected. Long-press it and tap Copy.");}
function buBackupOpen(){let code="";try{code=buCode();}catch(e){}
  if(!code){toast("Couldn't make a backup code on this device");return;}
  openSheet("Back up",`<p class="hint" style="margin-top:0">This code is your whole game: the current career, all 3 save slots and your settings. Keep it in your notes, then paste it into <b>Restore</b> on any phone or browser.</p>
<textarea class="code" id="codeOut" readonly spellcheck="false" aria-label="Your backup code"></textarea>
<p class="hint">${code.length.toLocaleString("en-CA")} characters, starting with ${BU_PREFIX}</p>
<div class="row"><button class="btn pri" id="copyCode" style="flex:1">Copy code</button></div>`);
  const ta=$("codeOut");ta.value=code;ta.addEventListener("focus",()=>buSelect(ta));
  $("copyCode").addEventListener("click",()=>buCopy(ta));$("copyCode").focus({preventScroll:true});}
function buRestoreOpen(){
  openSheet("Restore",`<p class="hint" style="margin-top:0">Paste a backup code (it starts with ${BU_PREFIX}). Restoring replaces your current career and all 3 save slots on this device.</p>
<textarea class="code" id="codeIn" placeholder="${BU_PREFIX}…" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Backup code to restore" aria-describedby="codeErr"></textarea>
<p class="hint buerr" id="codeErr" role="alert"></p>
<div class="row"><button class="btn pri" id="doImport" style="flex:1">Restore</button></div>`);
  const ta=$("codeIn"),err=$("codeErr");
  ta.addEventListener("input",()=>{err.textContent="";});
  $("doImport").addEventListener("click",()=>buRestore(ta.value,err));
  if(matchMedia("(hover:hover) and (pointer:fine)").matches)ta.focus({preventScroll:true});}   // no surprise keyboard on phones
function buAsk(d){const when=buNum(d.at)?new Date(d.at).toLocaleString("en-CA",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}):"";
  const o=d.save,n=d.slots.filter(Boolean).length;
  return `Restore this backup?\n\n${when?"Made "+when+"\n":""}Week ${o.week||1}, ${o.year||2000}\n${n} of ${SLOTS} save slots used\n\nIt replaces your current career and all ${SLOTS} save slots on this device.`;}
function buRestore(text,err){
  const say=k=>{err.textContent=BU_MSG[k]||BU_MSG.damaged;};
  err.textContent="";
  let r;try{r=buRead(text);}catch(e){say(e&&e.bu||"damaged");return;}
  {const o=r.data.save,bk=S&&buNum(S.bkAt)?S.bkAt:0;if(bk>(buNum(o.bkAt)?o.bkAt:0))o.bkAt=bk;}   // this device's last-backup time survives a restore
  if(!confirm(buAsk(r.data)))return;
  if(!buWrite(r.data)){say("store");return;}
  closeSheet();applyLoaded(r.data.save,"Backup restored");buPersist();}

/* ---- backup files and keep-my-storage (from PEW 1.76.66). Every Longlight game lives at jxstrr0.github.io and shares
   one storage pot, which a phone short on space may clear all at once. buPersist() asks the browser to keep it;
   buFileSave() puts the same INK1: code in a text file; buFileLoad() runs a file through the Restore checks. ---- */
const BU_FILE_MAX=4e6;
let buPersistAsked=false;
function buPersist(){if(buPersistAsked)return;buPersistAsked=true;
  try{const st=typeof navigator!=="undefined"&&navigator.storage;if(!st||!st.persist||!st.persisted)return;
    st.persisted().then(p=>p||st.persist()).then(()=>{},()=>{});}catch(e){}}
function buMarkBackup(){if(!S)return;S.bkAt=Date.now();try{save();}catch(e){}buPersist();}
function buFileName(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`ink-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.txt`;}
async function buFileSave(){let code="";try{code=buCode();}catch(e){}
  if(!code){toast("Couldn't make a backup on this device");return;}
  const name=buFileName(),text=code+"\n";
  let file=null;try{file=new File([text],name,{type:"text/plain"});}catch(e){}
  if(file&&navigator.canShare&&navigator.share){let can=false;try{can=navigator.canShare({files:[file]});}catch(e){}
    if(can){try{await navigator.share({files:[file]});buMarkBackup();toast("Backup file saved");return;}
      catch(e){if(e&&e.name==="AbortError")return;}}}   // cancelled: not saved. Any other refusal falls back to a download
  try{const url=URL.createObjectURL(new Blob([text],{type:"text/plain"})),a=document.createElement("a");
    a.href=url;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
    buMarkBackup();toast("Backup file saved: "+name);}
  catch(e){toast("Couldn't save a file here. Use Back up and copy the code.");}}
function buFileLoad(){const inp=$("bkFileIn");if(inp){inp.value="";inp.click();}}
async function buFileRead(inp){const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  let text="";
  if(f.size>BU_FILE_MAX)text="\u0000";   // far too big to be a backup: the Restore sheet says it isn't a code
  else{try{text=await f.text();}catch(e){text="";}}
  text=String(text).trim();
  buRestoreOpen();$("codeIn").value=text;
  buRestore(text||"\u0000",$("codeErr"));}
/* ===================== app/boot.js: tabs, the sheet, Settings, PWA, start =====================
   showTab(t) swaps the five tabs (Studio, Design, Session, Clients, Career) and remembers each one's scroll place.
   The sheet (#sheet) hosts Settings, Back up and Restore. The PWA part (lifted from PEW's pwa.js) registers sw.js on a
   real host (never localhost unless ?sw=1, never file://), shows the "New version ready" bar when a new worker waits,
   and offers Install in Settings when the browser allows it. start() runs once, from html/tail.html. */
let curTab="studio";
const TABS=["studio","design","session","clients","career"];
const tabScroll={};
function showTab(t){if(!TABS.includes(t))t="studio";const pn=$("panel");tabScroll[curTab]=pn.scrollTop;curTab=t;
  document.documentElement.setAttribute("data-tab",t);
  document.querySelectorAll("#tabs button").forEach(b=>{const on=b.dataset.tab===t;b.classList.toggle("on",on);if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  document.querySelectorAll(".tabpage").forEach(p=>p.classList.toggle("on",p.id==="tab-"+t));
  renderTab(t);pn.scrollTop=tabScroll[t]||0;
  if(t==="studio"&&typeof INK_VIS!=="undefined"&&INK_VIS.ready())INK_VIS.resize();}
function renderTab(t){({studio:renderStudio,design:renderDesign,session:renderSession,clients:renderClients,career:renderCareer})[t]();}
function renderHeader(){$("whenLbl").textContent=`Week ${S.week}, ${S.year}`;$("cashLbl").textContent=fmtMoney(S.cash);}
function renderAll(){renderHeader();renderTab(curTab);}

/* ---- the sheet ---- */
let sheetBack=null;
function openSheet(title,html){sheetBack=document.activeElement;$("sheetTitle").textContent=title;$("sheetBody").innerHTML=html;$("sheet").classList.add("on");$("scrim").classList.add("on");$("sheetBody").scrollTop=0;}
function closeSheet(){$("sheet").classList.remove("on");$("scrim").classList.remove("on");if(sheetBack&&sheetBack.focus)try{sheetBack.focus({preventScroll:true});}catch(e){}sheetBack=null;}
function sheetOn(){return $("sheet").classList.contains("on");}

/* ---- Settings ---- */
function segHtml(id,opts,cur){return `<div class="seg" id="${id}" role="group">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${String(v)===String(cur)?"on":""}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join("")}</div>`;}
function openSettings(){
  const st=S.settings;
  openSheet("Settings",`
<section><h3>Look</h3><div class="row">${segHtml("setTheme",[["dark","Dark"],["light","Light"],["auto","Auto"]],st.theme)}</div>
<div class="row" style="margin-top:8px">${segHtml("setReduced",[["0","Effects on"],["1","Reduced"]],st.reduced?1:0)}</div></section>
<section><h3>Graphics</h3><div class="row">${segHtml("setGfx",[["","Auto"],["lite","Lite"],["full","Full"],["ultra","Ultra"]],st.gfx||"")}</div>
<div class="row" style="margin-top:8px">${segHtml("setGfxAuto",[["1","Auto-adjust on"],["0","Off"]],st.gfxAuto===false?0:1)}</div>
<p class="hint">Lite is the phone default. Auto-adjust steps down a tier if the studio stutters.</p></section>
<section><h3>Sound</h3><div class="row">${segHtml("setSound",[["1","On"],["0","Off"]],st.sound===false?0:1)}</div></section>
<section><h3>Save</h3><p class="hint" style="margin-top:0">Your game saves itself on this device. A backup code or file moves it to another phone.</p>
<div class="row"><button class="btn" id="bkCode">Back up</button><button class="btn" id="bkRestore">Restore</button><button class="btn" id="bkFile">Save file</button><button class="btn" id="bkLoad">Load file</button></div></section>
<section id="set-app" hidden><h3>App</h3><div class="row"><button class="btn pri" id="pwaInstall" hidden>Install app</button></div>
<p class="hint" id="pwaIos" hidden>On iPhone or iPad: tap Share, then <b>Add to Home Screen</b>.</p></section>
<section><h3>About</h3><p class="hint" style="margin-top:0">Ink ${VERSION}. © ${new Date().getFullYear()} Kelbo / Longlight Interactive.</p></section>`);
  const seg=(id,fn)=>$(id).addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(!b)return;
    $(id).querySelectorAll("button").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-pressed",on);});fn(b.dataset.v);save();});
  seg("setTheme",v=>{st.theme=v;applyTheme();});
  seg("setReduced",v=>{st.reduced=v==="1";applySettings();});
  seg("setGfx",v=>{st.gfx=v||null;PERF.manual=true;perfReset(true);applyGfx();});
  seg("setGfxAuto",v=>{st.gfxAuto=v==="1";PERF.dropped=PERF.manual=false;perfReset(true);});
  seg("setSound",v=>{st.sound=v==="1";INK_SOUND.setOn(st.sound);});
  $("bkCode").addEventListener("click",buBackupOpen);$("bkRestore").addEventListener("click",buRestoreOpen);
  $("bkFile").addEventListener("click",buFileSave);$("bkLoad").addEventListener("click",buFileLoad);
  pwaSync();}

/* ---- PWA: install offer and the update bar ---- */
let pwaDeferred=null;
const pwaStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pwaIos=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function pwaSync(){const sec=$("set-app");if(!sec)return;const inst=!!pwaDeferred&&!pwaStandalone(),tip=pwaIos()&&!pwaStandalone();
  $("pwaInstall").hidden=!inst;$("pwaIos").hidden=!tip;sec.hidden=!(inst||tip);
  $("pwaInstall").onclick=async()=>{if(!pwaDeferred)return;const p=pwaDeferred;pwaDeferred=null;pwaSync();try{p.prompt();const r=await p.userChoice;if(r&&r.outcome==="accepted")toast("Installed");}catch(_){}};}
function pwaInit(){
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();pwaDeferred=e;pwaSync();});
  window.addEventListener("appinstalled",()=>{pwaDeferred=null;pwaSync();});
  const bar=document.createElement("div");bar.id="pwaBar";bar.setAttribute("role","status");
  bar.innerHTML='<span>New version ready</span><button type="button" class="btn sm pri" id="pwaReload">Reload</button><button type="button" class="pwalater" id="pwaLater" aria-label="Dismiss until next visit">Later</button>';
  document.body.appendChild(bar);
  let waiting=null,reloading=false;
  const offer=w=>{waiting=w;bar.classList.add("on");};
  $("pwaLater").addEventListener("click",()=>bar.classList.remove("on"));
  $("pwaReload").addEventListener("click",()=>{if(waiting)waiting.postMessage({type:"SKIP_WAITING"});else location.reload();});
  const host=location.hostname,web=/^https?:$/.test(location.protocol),local=/^(localhost|127\.\d+\.\d+\.\d+|\[?::1\]?|0\.0\.0\.0)$/.test(host);
  if(!("serviceWorker" in navigator)||!web||(local&&!/[?&]sw=1(&|$)/.test(location.search)))return;
  const sw=navigator.serviceWorker;
  sw.addEventListener("controllerchange",()=>{if(reloading||!waiting)return;reloading=true;location.reload();});
  sw.register("sw.js").then(reg=>{
    const watch=w=>w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&sw.controller)offer(w);});
    if(reg.waiting&&sw.controller)offer(reg.waiting);
    watch(reg.installing);reg.addEventListener("updatefound",()=>watch(reg.installing));
    /* an installed app can stay open for days: look for a new version when it comes back to the front and every few hours */
    const chk=()=>{try{reg.update().catch(()=>{});}catch(_){}};
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk();});setInterval(chk,4*3600*1000);
  }).catch(()=>{});}

/* ---- start: load the save, wire the page, draw the studio ---- */
function start(){
  loadSaved();applySettings();
  document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{INK_SOUND.tick();const again=b.dataset.tab===curTab;showTab(b.dataset.tab);if(again)$("panel").scrollTo({top:0});}));
  $("setOpen").addEventListener("click",openSettings);
  $("sheetClose").addEventListener("click",closeSheet);$("scrim").addEventListener("click",closeSheet);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetOn()){closeSheet();e.preventDefault();}});
  $("bkFileIn").addEventListener("change",e=>buFileRead(e.target));
  matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(S.settings.theme==="auto")applyTheme();});
  try{if(typeof INK_VIS!=="undefined")INK_VIS.init($("gl"),perfTier());}catch(e){}
  pwaInit();
  renderHeader();showTab("studio");
  save();
  window.__ldDone&&__ldDone();}
