/* ===== generation ===== */
function clPick(r,list){return list[Math.floor(r()*list.length)];}
function clTrait(r,k,shift){const t=CLIENT_TRAITS[k];return clamp(r.normal(t.mean+(shift||0),t.sd),CLIENT_TRAITS.lo,CLIENT_TRAITS.hi);}
const clR2=v=>Math.round(v*100)/100;
/* an adult age from AGE_BANDS, inside [lo, hi] when a brief asks for it (never under 18) */
function clAge(r,range){
  const lo=Math.max(18,range?range[0]:18),hi=Math.min(75,range?range[1]:75);
  const bands=AGE_BANDS.map(b=>[Math.max(b[0],lo),Math.min(b[1],hi),b[2]*Math.max(0,Math.min(b[1],hi)-Math.max(b[0],lo)+1)/(b[1]-b[0]+1)]).filter(b=>b[2]>0);
  const b=bands.length?r.weighted(bands,x=>x[2]):[lo,Math.max(lo,hi)];
  return Math.max(18,r.int(b[0],b[1]));
}
function clName(r,pronouns){
  const g=r.weighted(NAMES.groups,x=>x.w),src=g.from?NAMES.groups.find(x=>x.id===g.from):g;
  let first;
  if(pronouns==="they/them")first=clPick(r,(src.they&&src.they.length?src.they:NAMES.neutral));
  else first=clPick(r,pronouns==="he/him"?src.he:src.she);
  let sur=g.surnames,last;
  if(pronouns==="they/them"){const ind=sur.filter(s=>typeof s==="string");last=ind.length?clPick(r,ind):clPick(r,sur)[0];}
  else{const s=clPick(r,sur);last=typeof s==="string"?s:s[pronouns==="he/him"?0:1];}
  let patronymic=null;
  if(g.patronymic&&pronouns!=="they/them"){const p=clPick(r,NAMES.patronymics);patronymic=p[pronouns==="he/him"?0:1];}
  return{first,last,patronymic,group:g.id,tone:g.tone};
}
function clJob(r,age,year,want){
  if(want){const names=Array.isArray(want)?want:[want],js=JOBS.filter(j=>names.indexOf(j.name)>=0);if(js.length)return clPick(r,js);}
  const ok=JOBS.filter(j=>{const a=j.ages||JOB_AGES;return(!j.from||year>=j.from)&&(!j.to||year<=j.to)&&age>=a[0]&&age<=a[1];});
  return r.weighted(ok.length?ok:JOBS,j=>j.w);
}
/* a placement id from a brief's place entry ("forearm" -> forearm_l / forearm_r) */
function clPlace(r,base){const P=SIM.PLACEMENTS||{};if(P[base])return base;const s=r.chance(0.5)?"_l":"_r";return P[base+s]?base+s:(P[base+"_l"]?base+"_l":"forearm_r");}
/* how a client says a placement after "my" (and how a piece name says it after "Darya's") */
const PLACE_WORDS={neck_l:"neck, left side",neck_r:"neck, right side",chest_l:"chest, left side",chest_r:"chest, right side"};
function clPlaceName(id){if(PLACE_WORDS[id])return PLACE_WORDS[id];const p=(SIM.PLACEMENTS||{})[id];return p?p.name:"arm";}
function clSlotFill(text,ctx){
  return text.replace(/\{(\w+)\}/g,(m,k)=>{
    if(ctx[k]!=null)return String(ctx[k]);
    const lk=k.charAt(0).toLowerCase()+k.slice(1);
    if(ctx[lk]!=null){const v=String(ctx[lk]);return v.charAt(0).toUpperCase()+v.slice(1);}
    return m;});
}
/* style demand this year (STYLES[*].demandCurve, piecewise linear) */
function styleDemand(styleId,year){
  const tm=typeof SIM.trendMult==="function"?SIM.trendMult(styleId,year):1;   // PR 8's trend wave, when it exists
  const st=(SIM.STYLES||{})[styleId],c=st&&st.demandCurve;if(!c||!c.length)return tm;
  if(year<=c[0][0])return c[0][1]*tm;
  for(let i=1;i<c.length;i++)if(year<=c[i][0]){const a=c[i-1],b=c[i];return lerp(a[1],b[1],(year-a[0])/((b[0]-a[0])||1))*tm;}
  return c[c.length-1][1]*tm;
}
/* the brief and its style: weighted by the demand for the brief's styles, the segment boosts and the size the stage allows */
function clChooseBrief(r,opts){
  const year=opts.year,boost=opts.segBoost||{},sizes=opts.sizes||null,sm=opts.styleMult||null;
  const sd=s=>styleDemand(s,year)*(sm&&sm[s]||1);   // PR 7: a guest spot's or a staff artist's style pull
  const segW=list=>{let m=1;for(const s of list||[])m+=boost[s]||0;return m;};
  const ok=BRIEFS.filter(b=>(!b.from||year>=b.from)&&(!b.to||year<=b.to)&&(!sizes||sizes.indexOf(b.size)>=0)&&(!opts.theme||b.theme===opts.theme)&&(!opts.style||b.styles.indexOf(opts.style)>=0));
  const pool=ok.length?ok:BRIEFS;
  const b=r.weighted(pool,x=>{let d=0;for(const s of x.styles)d+=sd(s);return d/x.styles.length*segW(x.seg)*(x.w||1);});
  const style=opts.style&&b.styles.indexOf(opts.style)>=0?opts.style:r.weighted(b.styles,s=>sd(s)*segW(((SIM.STYLES||{})[s]||{}).clientSegments)*(s===b.styles[0]?1.3:1));
  return{b,style};
}
/* id: the next free "c<n>" given S (scans S.clients, the newcomers waiting in the queue, and `taken`) */
function clNextId(S,taken){
  let mx=0;
  const see=id=>{const m=/^c(\d+)$/.exec(id||"");if(m)mx=Math.max(mx,+m[1]);};
  for(const c of S.clients||[])see(c.id);
  for(const q of S.queue||[])if(q.newClient)see(q.newClient.id);
  if(taken)for(const id of taken)see(id);
  return "c"+(mx+1);
}

/* makeClient(r, opts): opts = {id, year, week, stage, segBoost:{segment:+weight}, sizes:[SIZE_CLASSES ids],
   theme, style, briefId, referredBy: client, src:"walkin"|"referral"|"return"|"test", badIdea: true|false|undefined} */
function makeClient(r,opts){
  opts=opts||{};
  const year=opts.year||2000,week=opts.week||1;
  const pronouns=r.weighted(PRONOUNS,x=>x[1])[0];
  /* the brief first: it can ask for an age range and a job */
  const pick=opts.briefId?{b:BRIEFS.find(x=>x.id===opts.briefId)||BRIEFS[0],style:null}:clChooseBrief(r,{year,segBoost:opts.segBoost,sizes:opts.sizes,theme:opts.theme,style:opts.style,styleMult:opts.styleMult});
  const B=pick.b,style=pick.style||opts.style||B.styles[0];
  const age=clAge(r,B.ages);
  const nm=clName(r,pronouns);
  const job=clJob(r,age,year,B.job);
  const bodyShape=(()=>{const m=BODY_BY_PRONOUN[pronouns];return r.weighted(Object.keys(m),k=>m[k]);})();
  const skinTone=clR2(r.range(nm.tone[0],nm.tone[1]));
  const T=CLIENT_TRAITS;
  const traits={
    pain:clR2(clTrait(r,"pain")),
    sun:clR2(clamp(lerp(clTrait(r,"sun"),job.sun,T.sun.job),T.lo,T.hi)),
    aftercare:clR2(clTrait(r,"aftercare",T.aftercare.age*(age-30))),
    budget:clR2(clamp(lerp(clTrait(r,"budget"),job.pay,T.budget.job),T.lo,T.hi)),
    loyalty:clR2(clTrait(r,"loyalty",T.loyalty.age*(age-30))),
    talkative:clR2(clTrait(r,"talkative")),
    trusting:clR2(clTrait(r,"trusting"))
  };
  /* where and how big */
  const placement=clPlace(r,clPick(r,B.place));
  const sz=SIZE_CLASSES[B.size]||SIZE_CLASSES.small;
  const ask={placement,sizeMm:r.int(sz[0],sz[1]),style,tags:B.tags.slice(),theme:B.theme,size:B.size,bad:null};
  /* one in BAD_IDEA_CHANCE walk-ins (and some briefs on their own) arrive with something to talk them out of. The bad
     idea is applied before the brief is written, so {place} names where they now want it */
  const cover=job.cover,proto={traits,cover,job:job.name};
  let badAdd="";
  if(opts.badIdea===true||(opts.badIdea!==false&&r.chance(BAD_IDEA_CHANCE))){
    const cands=BAD_IDEAS.filter(b=>b.fits(B)&&(b.id!=="cover_job"||cover>=0.6)&&(b.id!=="ribs_low_pain"||traits.pain<0.3));
    if(cands.length){const bi=clPick(r,cands);bi.make(ask,r);badAdd=/\{place\}/i.test(B.text)&&bi.addPlaced!=null?bi.addPlaced:bi.add;}
  }
  const ctx={};
  const person=clPick(r,BRIEF_SLOTS.person);ctx.person=person.t;
  const pw=PRONOUN_WORDS[person.p==="he"?"he/him":person.p==="they"?"they/them":"she/her"];
  ctx.pr=pw.pr;ctx.pos=pw.pos;
  for(const k of ["loved","habit","flower","petName","workplace","partner"]){
    if(B.text.indexOf("{"+k)<0)continue;const v=clPick(r,BRIEF_SLOTS[k]);ctx[k]=v.t;if(v.tags)for(const t of v.tags)if(ask.tags.indexOf(t)<0)ask.tags.push(t);}
  ctx.place=clPlaceName(ask.placement);
  ctx.pastYear=String(Math.min(year-1,Math.max(year-age+18,year-r.int(1,8))));   // a year they were already an adult
  ctx.mm=ask.sizeMm;ctx.placename=ctx.place;
  let brief=clSlotFill(B.text+badAdd,ctx);
  for(const bi of BAD_IDEAS)if(bi.test(ask,proto,(SIM.PLACEMENTS||{})[ask.placement])){ask.bad=bi.id;break;}
  /* wants */
  const styles={};styles[style]=1;
  const st=(SIM.STYLES||{})[style],blends=(st&&st.blendsWith)||[];
  const nSec=r.int(1,2);for(let i=0;i<nSec&&blends.length;i++){const s=clPick(r,blends);if(!styles[s])styles[s]=clR2(r.range(0.35,0.75));}
  const wsz=[Math.max(8,Math.round(sz[0]*r.range(0.7,0.95))),Math.round(sz[1]*r.range(1.05,1.5))];
  const colour=clR2(clamp((STYLE_COLOUR[style]!=null?STYLE_COLOUR[style]:0.4)+r.normal(0,0.15),0,1));
  const wants={styles,tags:ask.tags.slice(0,4),sizeMm:wsz,colour};
  /* must-haves and dealbreakers: stated in the brief (known) and hidden */
  const mustHaves=[],dealbreakers=[];
  const known={styles:[style],tags:true,size:false,colour:false,pain:false,sun:false,cover:false,budget:false,aftercare:false,
    mustHaves:[],dealbreakers:[],mustAll:false,dealAll:false};
  const sameKV=(a,b)=>a.kind===b.kind&&a.v===b.v;
  for(const m of (B.known&&B.known.must)||[]){mustHaves.push({kind:m.kind,v:m.v});known.mustHaves.push({kind:m.kind,v:m.v});}
  for(const d of (B.known&&B.known.deal)||[]){dealbreakers.push({kind:d.kind,v:d.v});known.dealbreakers.push({kind:d.kind,v:d.v});}
  if(r.chance(HIDDEN_WANTS.mustChance)){
    const pal=(st&&st.palette)||[];
    const pool=HIDDEN_WANTS.must.filter(m=>m.themes.indexOf(B.theme)>=0&&!mustHaves.some(x=>sameKV(x,m))&&!dealbreakers.some(x=>sameKV(x,m))&&
      (m.kind!=="style"||B.styles.indexOf(m.v)>=0)&&(m.kind!=="colour"||pal.indexOf(m.v)>=0));
    if(pool.length){const m=clPick(r,pool);mustHaves.push({kind:m.kind,v:m.v});}
  }
  if(r.chance(HIDDEN_WANTS.dealChance)){
    const pool=HIDDEN_WANTS.deal.filter(d=>!dealbreakers.some(x=>sameKV(x,d))&&!(d.kind==="style"&&styles[d.v])&&!(d.kind==="tag"&&ask.tags.indexOf(d.v)>=0)&&!mustHaves.some(x=>x.kind===d.kind&&x.v===d.v));
    if(pool.length){const d=clPick(r,pool);dealbreakers.push({kind:d.kind,v:d.v});}
  }
  if(/small|tiny/i.test(brief))known.size=true;
  const rb=opts.referredBy||null;
  if(rb){
    const rp=PRONOUN_WORDS[rb.pronouns]||PRONOUN_WORDS["they/them"];
    const lp=opts.referrerLabel||"tattoo";
    brief=clSlotFill(clPick(r,REFERRAL.lines),{name:rb.first||rb.name,pr:rp.pr,pos:rp.pos,label:lp})+" "+brief;
  }
  const loyaltyStart=clR2(LOYALTY.start+LOYALTY.startTrait*traits.loyalty+(rb?LOYALTY.referral:0));
  return{
    id:opts.id||"c1",name:nm.first+" "+nm.last,first:nm.first,surname:nm.last,patronymic:nm.patronymic,
    addr:age>=FORMAL_AGE&&nm.patronymic?nm.first+" "+nm.patronymic:nm.first,
    pronouns,age,born:year-age,bodyShape,skinTone,job:job.name,cover:job.cover,
    traits,wants,mustHaves,dealbreakers,known,
    brief,ask,theme:B.theme,briefId:B.id,firstTattoo:!!B.first,
    loyalty:loyaltyStart,referredBy:rb?rb.id:null,src:opts.src||"walkin",
    since:{w:week,y:year},lastSeen:{w:week,y:year},visits:0,pieces:[],history:[]
  };
}
const clientAge=(c,year)=>c.born!=null?year-c.born:c.age;

/* ===== memory ===== */
function clientLog(client,entry){if(!client.history)client.history=[];client.history.push(entry);if(entry.w&&entry.y)client.lastSeen={w:entry.w,y:entry.y};return entry;}
function loyaltyBump(client,kind,scale){
  const d=(typeof kind==="number"?kind:LOYALTY[kind]||0)*(scale==null?1:scale);
  const t=(client.traits&&client.traits.loyalty!=null)?client.traits.loyalty:0.5;
  const m=d>0?lerp(LOYALTY.gainLo,LOYALTY.gainHi,t):1;
  client.loyalty=clR2(clamp((client.loyalty||0)+d*m,0,1));
  return client.loyalty;
}
const clBand=l=>l<REVIEW_BANDS[0]?"low":l<REVIEW_BANDS[1]?"mid":"high";
/* writeReview(client, piece, r) -> {stars, text} or null (most people don't write one). Logs it. */
function writeReview(client,piece,r,force){
  const g=piece.heal&&REVIEWS[piece.heal]?piece.heal:"soft";
  if(!force&&!r.chance(REVIEW_CHANCE[g]||0.2))return null;
  const row=clPick(r,REVIEWS[g][clBand(client.loyalty||0)]);
  const text=clSlotFill(row[1],{label:piece.label||"tattoo",place:clPlaceName(piece.design&&piece.design.placement)});
  return clientLog(client,{w:piece.healW||piece.w,y:piece.healY||piece.y,kind:"review",piece:piece.id,stars:row[0],text});
}
/* findClient(S, id): a Map index cached per clients array, rebuilt when the array grows or an entry is replaced */
const clIdxCache=new WeakMap();
function findClient(S,id){
  const arr=S.clients||[];let e=clIdxCache.get(arr);
  const hit=e&&e.n===arr.length?e.m.get(id):null;
  if(hit&&arr[hit.i]===hit.c)return hit.c;
  e={n:arr.length,m:new Map()};arr.forEach((c,i)=>e.m.set(c.id,{c,i}));clIdxCache.set(arr,e);
  const h=e.m.get(id);return h?h.c:null;
}

/* ===== pieces ===== */
/* the label a piece is known by: its biggest motif ("rose"); lettering reads as the word ("Hope" script) */
function pieceLabel(design){
  let best=null,bs=-1;
  for(const e of (design&&design.elements)||[]){
    const el=SIM.elementById?SIM.elementById(e.id):null;if(!el)continue;
    const w=(e.scale||0.5)*(el.family==="fill"||el.family==="texture"||el.family==="frame"?0.3:1);
    if(w>bs){bs=w;best=el;}
  }
  if(!best)return "tattoo";
  const m=/^Script: (.+)$/.exec(best.name);if(m)return "\""+m[1]+"\" script";
  return best.name.charAt(0).toLowerCase()+best.name.slice(1);
}
function pieceName(label,client,placement){return "the "+label+" on "+((client&&client.first)||"a client")+"'s "+clPlaceName(placement);}
/* addPiece(S, {client, design, out, heal, price, item}) -> piece. Pieces are never dropped (ids p1, p2, ...). */
function addPiece(S,o){
  const c=typeof o.client==="object"?o.client:findClient(S,o.client);
  const design=o.design||{};
  const label=pieceLabel(design);
  const piece={id:"p"+(S.pieces.length+1),client:c?c.id:o.client,design,out:o.out||null,heal:o.heal||null,w:S.week,y:S.year,
    name:pieceName(label,c,design.placement),label,stage:(S.studio&&S.studio.stage)||"apprentice",price:o.price||0};
  if(o.ret)piece.ret=o.ret;
  S.pieces.push(piece);
  if(c){
    if(!c.pieces)c.pieces=[];c.pieces.push(piece.id);c.visits=(c.visits||0)+1;
    clientLog(c,{w:S.week,y:S.year,kind:"piece",piece:piece.id,name:piece.name});
    loyaltyBump(c,"piece");
  }
  return piece;
}

/* ===== the consult =====
   consult = {client, step, max, stage:"talk"|"quote"|"done", transcript:[{who:"client"|"artist"|"note", text}],
     known (a copy of client.known that grows), ask (a copy that the talk-out may change), asked:[question ids], mood,
     bad: BAD_IDEAS id or null, talk: null|"won"|"lost"|"insisted", quote: null|{...}, outcome: null|"accepted"|"walked"|"declined",
     skill, year, week, rate, wait, src, item } */
function clCopy(o){return JSON.parse(JSON.stringify(o));}
function clRate(S){
  if(S.rate>0)return S.rate;
  const st=(S.studio&&S.studio.stage)||"apprentice";
  return RATE_DEFAULT.rate*(QUOTE.stageRate[st]||1)*SIM.priceIndex(S.year);
}
/* a one-element stand-in for the ask, so scoreDesign can estimate hours and sessions before the board exists */
function clProxyDesign(ask){
  const E=SIM.ELEMENTS||[];
  let best=null,bs=-1;
  for(const e of E){
    if(e.family==="fill"||e.family==="texture"||e.family==="frame")continue;
    let s=0;for(const t of ask.tags||[])if(e.tags.indexOf(t)>=0)s+=2;
    if(e.styles.indexOf(ask.style)>=0)s+=1.5;
    if(s>bs){bs=s;best=e;}
  }
  const st=(SIM.STYLES||{})[ask.style],lr=(st&&st.lineRange)||[5,9];
  const rl=LINE_WEIGHTS.reduce((a,b)=>Math.abs(b-(lr[0]+lr[1])/2)<Math.abs(a-(lr[0]+lr[1])/2)?b:a);
  return{placement:ask.placement,sizeMm:ask.sizeMm,style:ask.style,elements:best?[{id:best.id,x:0.5,y:0.5,scale:1,rot:0,lineWeight:rl,fill:0.5,colour:null}]:[]};
}
function clEstimate(ask,client,skills){
  const sc=scoreDesign(clProxyDesign(ask),client,skills||{},{year:2000});
  return{hours:sc.hours,sessions:sc.sessions};
}
/* consultStart(client, S, opts): opts.item = the queue item the client came in on (its brief/ask/ret win) */
function consultStart(client,S,opts){
  opts=opts||{};
  const item=opts.item||null;
  const ask=clCopy((item&&item.ask)||client.ask||{placement:"forearm_r",sizeMm:60,style:"traditional",tags:[]});
  const brief=(item&&item.brief)||client.brief||"";
  const P=(SIM.PLACEMENTS||{})[ask.placement];
  let bad=ask.bad||null;
  if(bad==null)for(const b of BAD_IDEAS)if(b.test(ask,client,P)){bad=b.id;break;}
  const tk=(client.traits&&client.traits.talkative)||0.5;
  const max=clamp(CONSULT.exchanges[0]+(tk>0.66?2:tk>0.33?1:0),CONSULT.exchanges[0],CONSULT.exchanges[1]);
  const skills=S.skills||{};
  const est=clEstimate(ask,client,skills);
  const c={client,clientId:client.id,step:0,max,stage:"talk",transcript:[{who:"client",text:brief}],
    known:clCopy(client.known||{}),ask,asked:[],mood:CONSULT.moodStart,bad,talk:null,quote:null,outcome:null,
    skill:clamp(skills.consult||0,0,10),year:S.year,week:S.week,rate:Math.round(clRate(S)),wait:waitWeeks(S),
    shopStage:(S.studio&&S.studio.stage)||"apprentice",est,src:(item&&item.src)||client.src||"walkin",item:item?item.id:null,ret:(item&&item.ret)||null};
  c.transcript.push({who:"note",text:clientAge(client,S.year)+" years old · "+client.pronouns+" · "+(client.patronymic&&clientAge(client,S.year)>=FORMAL_AGE?"call them "+client.addr:"goes by "+client.first)});
  return c;
}
/* options: questions not asked yet (a stable order per client and step, never sorted by what is hidden), the talk-out
   options while a bad idea is open, "talk price" from the second exchange; at the last exchange only the quote */
function consultOptions(c){
  if(!c||c.stage==="done")return[];
  if(c.stage==="quote"||c.step>=c.max-1){
    const o=QUOTE.options,out=[];
    for(const k of ["q_fair","q_high","q_low"])out.push({id:k,kind:"quote",text:o[k].text});
    out.push({id:"decline",kind:"quote",text:"Turn it down"});
    return out;
  }
  const out=[];
  const talkOpen=c.bad&&!c.talk;
  if(talkOpen){
    out.push({id:"talk_gentle",kind:"talk",text:"Suggest something that will last"});
    out.push({id:"talk_blunt",kind:"talk",text:"Tell them straight it won't hold up"});
  }
  const left=CONSULT_QUESTIONS.filter(q=>c.asked.indexOf(q.id)<0);
  const rr=rng(hash(c.clientId+":"+c.step+":"+c.year));
  const nq=talkOpen?CONSULT.questionsShown-1:CONSULT.questionsShown;
  for(const q of rr.shuffle(left).slice(0,nq))out.push({id:q.id,kind:"ask",text:q.text});
  if(c.step>=1)out.push({id:"to_quote",kind:"price",text:"Talk price"});
  return out.slice(0,5);
}
function clBandOf(v){return v<0.34?"low":v<0.67?"mid":"high";}
function clRevealLine(c,q,client){
  const t=client.traits||{},A=CONSULT_ANSWERS;
  const pw=PRONOUN_WORDS[client.pronouns]||PRONOUN_WORDS["they/them"];
  switch(q.reveal){
    case "must":{
      const hid=(client.mustHaves||[]).filter(m=>!c.known.mustHaves.some(k=>k.kind===m.kind&&k.v===m.v));
      if(!hid.length){c.known.mustAll=true;return null;}
      const m=hid[0];c.known.mustHaves.push({kind:m.kind,v:m.v});if(hid.length===1)c.known.mustAll=true;
      const row=HIDDEN_WANTS.must.find(x=>x.kind===m.kind&&x.v===m.v);
      return clSlotFill(row?row.say:"It has to have "+m.v+" in it.",{pos:pw.pos});}
    case "deal":{
      const hid=(client.dealbreakers||[]).filter(m=>!c.known.dealbreakers.some(k=>k.kind===m.kind&&k.v===m.v));
      if(!hid.length){c.known.dealAll=true;return null;}
      const m=hid[0];c.known.dealbreakers.push({kind:m.kind,v:m.v});if(hid.length===1)c.known.dealAll=true;
      const row=HIDDEN_WANTS.deal.find(x=>x.kind===m.kind&&x.v===m.v);
      return row?row.say:"No "+m.v+", please.";}
    case "colour":c.known.colour=true;return A.colour[clBandOf((client.wants&&client.wants.colour)||0)];
    case "size":{c.known.size=true;const s=(client.wants&&client.wants.sizeMm)||[40,90];return A.size[clBandOf(clamp((s[0]+s[1])/2/260,0,1))];}
    case "cover":c.known.cover=true;return clSlotFill(A.cover[clBandOf(client.cover||0)],{job:client.job});
    case "pain":c.known.pain=true;return A.pain[clBandOf(t.pain||0.5)];
    case "sun":c.known.sun=true;return A.sun[clBandOf(t.sun||0.4)];
    case "budget":c.known.budget=true;return A.budget[clBandOf(t.budget||0.5)];
    case "aftercare":c.known.aftercare=true;return A.aftercare[clBandOf(t.aftercare||0.5)];
    case "style":{
      const ws=(client.wants&&client.wants.styles)||{},next=Object.keys(ws).filter(s=>c.known.styles.indexOf(s)<0);
      if(!next.length)return null;c.known.styles.push(next[0]);
      const st=(SIM.STYLES||{})[next[0]];return clSlotFill(A.style,{style:st?st.name.toLowerCase():next[0]});}
  }
  return null;
}
function clArtistFill(text,c){
  const P=(SIM.PLACEMENTS||{})[c.ask.placement];
  return clSlotFill(text,{mm:c.ask.sizeMm,placename:P?P.name:"spot",job:c.client.job});
}
/* consultChoose(consult, choiceId, r) -> a new consult object */
function consultChoose(c0,choiceId,r){
  const c=Object.assign({},c0,{transcript:c0.transcript.slice(),known:clCopy(c0.known),ask:clCopy(c0.ask),asked:c0.asked.slice()});
  if(c.stage==="done")return c;
  const opts=consultOptions(c0),opt=opts.find(o=>o.id===choiceId);
  if(!opt)return c;
  const client=c.client,t=client.traits||{};
  c.step++;
  if(opt.kind==="ask"){
    const q=CONSULT_QUESTIONS.find(x=>x.id===choiceId);
    c.asked.push(q.id);c.transcript.push({who:"artist",text:q.text});
    const p=clamp(q.base+q.skill*c.skill+q.trust*(t.trusting||0.5)+q.talk*(t.talkative||0.5),0.05,0.97);
    let line=null;
    if(r.chance(p)){line=clRevealLine(c,q,client);
      if(line==null)line=q.reveal==="must"?clPick(r,CONSULT_ANSWERS.noneMust):q.reveal==="deal"?clPick(r,CONSULT_ANSWERS.noneDeal):clPick(r,CONSULT_ANSWERS.vague);
      c.mood+=CONSULT.moodAnswer;}
    else{line=clPick(r,CONSULT_ANSWERS.vague);c.mood+=CONSULT.moodVague;}
    if((t.talkative||0.5)<CONSULT.quietTalk&&c.asked.length>CONSULT.quietMax)c.mood+=CONSULT.moodPushy;
    c.transcript.push({who:"client",text:line});
  }else if(opt.kind==="talk"){
    const bi=BAD_IDEAS.find(b=>b.id===c.bad),T=choiceId==="talk_blunt"?CONSULT.talkBlunt:CONSULT.talkGentle;
    c.transcript.push({who:"artist",text:clArtistFill(choiceId==="talk_blunt"?bi.blunt:bi.gentle,c)});
    const p=clamp(T.base+T.trust*(t.trusting||0.5)+T.skill*c.skill+0.2*((client.loyalty||0)-0.2),0.05,0.95);
    if(r.chance(p)){
      bi.fix(c.ask);c.ask.bad=null;c.talk="won";c.respect=T.respect;c.mood+=0.08;
      c.transcript.push({who:"client",text:clArtistFill(bi.yes,c)});
      c.transcript.push({who:"note",text:"Changed to "+c.ask.sizeMm+" mm on the "+clPlaceName(c.ask.placement)+"."});
    }else if(r.chance(T.walk*(1-0.6*(client.loyalty||0)))){
      c.talk="lost";c.outcome="walked";c.stage="done";
      c.transcript.push({who:"client",text:clArtistFill(bi.no,c)});
      c.transcript.push({who:"note",text:client.first+" walked out."});
    }else{
      c.talk="insisted";c.mood-=0.05;
      c.transcript.push({who:"client",text:clArtistFill(bi.insist,c)});
    }
  }else if(opt.kind==="price"){
    c.stage="quote";c.transcript.push({who:"artist",text:"Let's talk about price."});
  }else if(opt.kind==="quote"){
    if(choiceId==="decline"){
      c.transcript.push({who:"artist",text:"I don't think I'm the right artist for this one. Let me tell you who might be."});
      c.transcript.push({who:"client",text:"Oh. Well. Thank you for being honest."});
      c.outcome="declined";c.stage="done";
    }else c.quote=clQuote(c,choiceId,r);
  }
  /* the last exchange must be the quote: if they haven't heard one by now, the next options are quote-only */
  if(c.stage!=="done"&&c.step>=c.max-1&&c.stage==="talk")c.stage="quote";
  if(c.stage!=="done"&&c.step>=c.max&&!c.quote){c.stage="done";c.outcome=c.outcome||"walked";c.transcript.push({who:"note",text:"They left to think about it."});}
  c.mood=clamp(c.mood,0,1);
  return c;
}
function clQuote(c,choiceId,r){
  const client=c.client,t=client.traits||{},Q=QUOTE,o=Q.options[choiceId];
  const est=clEstimate(c.ask,client,{});
  let price=est.hours*c.rate*o.mult;
  const ret=c.ret;
  if(ret&&ret.rule==="touchup")price=(weekIndex(c.week,c.year)-weekIndex(ret.w||c.week,ret.year||c.year))<Q.touchupFreeWeeks?0:price*Q.touchupMult;
  price=Math.round(price/Q.round)*Q.round;
  const deposit=price>0?Math.min(Math.round(price*Q.depositMax/Q.round)*Q.round,Math.max(Math.round(Q.depositMin*SIM.priceIndex(c.year)/Q.round)*Q.round,Math.round(price*Q.deposit/Q.round)*Q.round)):0;
  const sigW=c.ask&&c.ask.sig?SIGNATURE.wtp*(client.theme==="collector"?SIGNATURE.collector/1.4:1):1;   // PR 7: "your thing" (collectors weight it more)
  const wtp=est.hours*lerp(Q.wtpLo,Q.wtpHi,t.budget||0.5)*SIM.priceIndex(c.year)*(1+Q.wtpLoyal*(client.loyalty||0))*sigW;
  const ratio=wtp>0?price/wtp:0;
  const coll=client.theme==="collector"?1:0;
  const waitOk=lerp(Q.waitOk,Q.waitOkLoyal,client.loyalty||0)+coll*Q.waitOkCollector;
  let pa=Q.acceptAt1-Q.acceptSlope*(ratio-1)+Q.moodK*(c.mood-0.5)-Q.waitHit*Math.max(0,c.wait-waitOk);
  if(price===0)pa=0.99;
  pa=clamp(pa,Q.acceptMin,Q.acceptMax);
  const yes=r.chance(pa);
  const hrs=est.hours,ss=est.sessions;
  const when=c.wait<1?"next week":c.wait<2?"in a couple of weeks":"in about "+Math.round(c.wait)+" weeks";
  c.transcript.push({who:"artist",text:price>0?(hrs<=1?"About an hour":"About "+hrs+" hours")+(ss>1?" over "+ss+" sessions":"")+". "+fmtRub(price)+", with a "+fmtRub(deposit)+" deposit to book. I can start "+when+".":"This one's on me. Come in "+when+"."});
  c.transcript.push({who:"client",text:yes?(ratio<0.85?"That's fair. Book me in.":ratio<1.1?"OK. Yes. Let's do it.":"It's a lot. But I want it done right. Yes."):(c.wait>waitOk+20?"That's too long to wait. Sorry.":ratio>1.2?"That's more than I can do. Sorry.":"I need to think about it.")});
  c.outcome=yes?"accepted":"walked";c.stage="done";
  return{price,deposit,hours:hrs,sessions:ss,option:choiceId,mult:o.mult,wtp:Math.round(wtp),accept:clR2(pa),wait:c.wait};
}
const fmtRub=n=>Math.round(n).toLocaleString("en-CA")+" ₽";
/* consultCommit(S, consult) -> {client, item}: the client joins S.clients if new; history, loyalty and known are
   written; an accepted job books its first session into S.queue (after the wait) and the deposit goes into S.cash */
function consultCommit(S,c){
  const client=c.client;
  let isNew=!S.clients.some(x=>x.id===client.id);
  if(isNew)S.clients.push(client);
  client.known=c.known;
  if(c.talk==="won"||c.talk==="insisted"||c.outcome==="accepted")client.ask=c.ask;
  const e={w:S.week,y:S.year,kind:"consult",outcome:c.outcome,src:c.src,asked:c.asked.slice()};
  if(c.talk)e.talk=c.talk;if(c.bad)e.bad=c.bad;

/* ===== sim/calendar.js: the week clock: advanceWeek(S) is the only thing that moves time (PR 3) =====
   A career is 2000 week 1 to 2030 week 52 (1,612 weeks; a "30-year" run is 1,560). Each advanceWeek closes the week that
   is ending (walk-ins nobody saw leave, booked consults that waited too long give up), moves the clock one week (52 rolls
   to week 1 of the next year), then runs WEEK_ORDER, in the plan's order:
     heals     the bandage comes off pieces done WEEK.healWeeks ago (PR 5 fills in the grade through SIM.healPiece)
     aging     on a year boundary: clients turn a year older and pieces cross a year (PR 5 re-renders them)
     bookings  walk-ins from market.js, returns (RETURN_RULES), referrals (REFERRAL), then the week's chair hours are
               filled from the queue; sessions that don't fit move to next week
     costs     the shop's cut, supplies, rent, staff, sales (PR 7: sim/career.js careerWeek replaces the stub)
     events    queued events, reckonings, inspections (set by sim/events.js, PR 8)
     trend     the trend wave (set by sim/events.js, PR 8)
   Later PRs replace a stub by assigning SIM.WEEK_HOOKS.<name> = function(S, ctx){...}. ctx = {r (an rng forked for that hook and
   week), log, yearRolled, now (SIM.weekIndex of the new week)}; a hook pushes {k, text, ...} lines onto ctx.log.
   advanceWeek returns that log: [{k, text, client?, piece?, item?}], k one of week left gaveup heal year walkin return referral
   booked carried cost event trend goal note end. At 2030 week 52 it stops: the log ends with {k:"end"} and log.end = true.
   SIM.nextStop(S): the Career tab's Next button. Advances until a client is due (a booked session, a return, a referral or a
   walk-in), a heal or an event, never more than WEEK.maxSkip weeks; returns {weeks, why, line, log}.
   SIM.finishSession(S, itemId, {design, out, heal}): a sitting is done (PR 4 calls it): pays the share of the balance,

/* chair hours and bookings by career stage (S.studio.stage) */
const WEEK={
  stages:{
    apprentice:{hours:8,maxBookings:2,walkinSlots:1},    // mostly sweeping and practising; a little flash
    chair:{hours:30,maxBookings:8,walkinSlots:3},        // a rented chair
    studio:{hours:36,maxBookings:10,walkinSlots:5},      // your own shop (your own chair; staff are PR 7)
    legacy:{hours:28,maxBookings:6,walkinSlots:2}        // fewer, bigger pieces off the waiting list
  },
  healWeeks:2,          // weeks from the session to the bandage coming off (PR 5)
  sessionGap:3,         // weeks between sittings of a multi-session piece
  consultWait:CAL_CONSULT_WAIT,   // weeks a booked consult waits (see clients.js)
  maxSkip:4,            // Next never jumps more than this

/* ---- the week that is ending ---- */
function calCloseWeek(S,log){

    if(q.kind==="consult"&&q.expires!=null&&q.expires<=now){

      if(c&&!q.newClient){loyaltyBump(c,"noShow");clientLog(c,{w:S.week,y:S.year,kind:"note",text:"gave up waiting for a consult"});}
      log.push({k:"gaveup",text:(c?c.name:"A client")+" gave up waiting for a consult.",client:c?c.id:null});
      continue;}

/* ---- hooks ---- */
/* heals: pieces whose bandage comes off this week. PR 5 grades them via SIM.healPiece(S, piece, r, log) */
function calHeals(S,ctx){
  for(let i=S.pieces.length-1;i>=0;i--){
    const p=S.pieces[i],age=ctx.now-weekIndex(p.w,p.y);
    if(age>WEEK.healWeeks)break;
    if(age!==WEEK.healWeeks||p.heal)continue;
    if(typeof SIM.healPiece==="function")SIM.healPiece(S,p,ctx.r,ctx.log);

/* aging: on week 1 every client turns a year older and every piece crosses a year (PR 5 re-renders pieces that did) */
function calAging(S,ctx){
  if(!ctx.yearRolled)return;
  for(const c of S.clients)if(c.born!=null)c.age=S.year-c.born;
  let n=0;for(const p of S.pieces)if(p.y<S.year)n++;

/* bookings: walk-ins, returns, referrals, then fill the week's chair hours */
function calBookings(S,ctx){
  const r=ctx.r,log=ctx.log,now=ctx.now,wk=weekFrom(now);
  /* walk-ins (market.js) */
  const walk=typeof generateWalkins==="function"?generateWalkins(S,r.fork("walkins")):[];
  for(const c of walk){
    S.queue.push({id:queueId(S),kind:"walkin",client:c.id,newClient:c,src:"walkin",w:wk.w,y:wk.y,expires:now,brief:c.brief,ask:c.ask});

  /* returns */
  for(const it of scheduleReturns(S,r.fork("returns"))){
    const c=findClient(S,it.client);

  }

    const n=referral(c,rr,{id:clNextId(S),year:S.year,week:S.week,label:p.label,segBoost:typeof mkSegBoost==="function"?mkSegBoost(S):null});
    const due=weekFrom(now+rr.int(0,1));

    clientLog(c,{w:S.week,y:S.year,kind:"referral",client:n.id});loyaltyBump(c,"referral");
    log.push({k:"referral",text:n.name+" is booked for a consult: "+c.first+" sent them.",client:n.id,from:c.id});

function calRetWords(ret){

  const due=S.queue.filter(q=>q.kind==="session"&&weekIndex(q.w,q.y)<=now).sort((a,b)=>weekIndex(a.w,a.y)-weekIndex(b.w,b.y)||(a.sessionNo>b.sessionNo?-1:1));

  if(n)log.push({k:"booked",text:n+(n===1?" session":" sessions")+" this week ("+hrs+" of "+st.hours+" hours).",n,hours:hrs});
  if(moved.length)log.push({k:"carried",text:moved.length===1?calFirst(S,moved[0])+"'s session moves to next week: no chair time left.":moved.length+" sessions move to next week: no chair time left.",n:moved.length});

function calNoop(){}
const WEEK_HOOKS={heals:calHeals,aging:calAging,bookings:calBookings,costs:calNoop,events:calNoop,trend:calNoop};

/* advanceWeek(S) -> log. The only function that changes S.week / S.year. */
function advanceWeek(S){

  const close=[];calCloseWeek(S,close);

  log.push({k:"week",text:"Week "+S.week+", "+S.year+"."});
  for(const l of close)log.push(l);
  const now=clNow(S),base=rng(S.seed).fork("week:"+S.year+":"+S.week);

    const f=WEEK_HOOKS[k];
    if(typeof f==="function")f(S,{r:base.fork(k),log,yearRolled:S.year!==y0,now});

/* what stops Next this week */
function calStopReason(S,log){
  if(log.some(l=>l.k==="event"))return "event";
  const now=clNow(S);
  for(const q of S.queue){
    if(weekIndex(q.w,q.y)!==now)continue;
    if(q.kind==="session"||q.kind==="consult")return "client";
    if(q.kind==="walkin"&&WEEK.nextStopsOnWalkins)return "walkin";

/* one line for the Career tab */
function calSummary(from,S,all,why,weeks){

  const parts=[];
  const head=weeks===1?"Week "+S.week+", "+S.year:"Weeks "+from.w+(from.y!==S.year?" ("+from.y+")":"")+" to "+S.week+", "+S.year;
  const left=cnt("left");if(left)parts.push(left===1?"a walk-in left unseen":left+" walk-ins left unseen");
  const gave=all.filter(l=>l.k==="gaveup").length;if(gave)parts.push(gave===1?"one consult gave up waiting":gave+" consults gave up waiting");
  for(const l of all)if(l.k==="return"||l.k==="referral"||l.k==="heal"||l.k==="year"||l.k==="event"||l.k==="carried"||l.k==="trend"||l.k==="goal"||l.k==="note")parts.push(l.text.replace(/\.$/,"").replace(/^(The|A|An) /,m=>m.toLowerCase()));

/* nextStop(S) -> {weeks, why: "client"|"walkin"|"heal"|"event"|"cap"|"end", line, log} */
function nextStop(S){

  const from=weekFrom(clNow(S)+1),all=[];let why="cap",weeks=0;
  while(weeks<WEEK.maxSkip){
    const log=advanceWeek(S);weeks++;
    for(const l of log)all.push(l);
    if(log.end){why="end";break;}
    const s=calStopReason(S,log);if(s){why=s;break;}

}
/* finishSession(S, itemId, {design, out, heal}) -> {piece, next, paid}. Removes the queue item, pays this sitting's share

function finishSession(S,itemId,res){
  res=res||{};
  const i=S.queue.findIndex(q=>q.id===itemId);if(i<0)return null;
  const q=S.queue[i];S.queue.splice(i,1);
  const balance=Math.max(0,(q.price||0)-(q.deposit||0)),share=Math.round(balance/Math.max(1,q.sessions||1));
  cashIn(S,share,"sitting");   // PR 7: through the ledger (sim/career.js)
  const design=res.design||q.design||null;
  if((q.sessionNo||1)<(q.sessions||1)){
    const due=weekFrom(clNow(S)+WEEK.sessionGap);
    const next=Object.assign({},q,{id:queueId(S),w:due.w,y:due.y,sessionNo:(q.sessionNo||1)+1,design,paid:(q.paid||0)+share,moved:0});
    S.queue.push(next);
    const c=findClient(S,q.client);if(c)clientLog(c,{w:S.week,y:S.year,kind:"session",n:q.sessionNo||1,of:q.sessions});
    return{piece:null,next,paid:share};
  }
  const piece=addPiece(S,{client:q.client,design:design||{},out:res.out||null,heal:res.heal||null,price:q.price||0,ret:q.ret?{rule:q.ret.rule,piece:q.ret.piece}:null});
  if(!piece.ret)delete piece.ret;
  return{piece,next:null,paid:share};
}

/* ===== sim/heal.js: the heal two weeks after a session, and the three reputation tracks (PR 5) =====
   Two in-game weeks after the last sitting the bandage comes off (calendar.js calHeals calls SIM.healPiece). The grade is
   one of the HEAL_GRADES ids in aging.js (crisp, soft, patchy, blownout, infected) and from then on feeds the aging model.
     HEAL           how the session outputs and the client's aftercare trait become a grade:
                      infected  rare: needs trauma over infect.trauma AND aftercare under infect.care (low trauma never does)
                      blownout  a chance that climbs with the session's blowouts (none: never)
                      otherwise a heal score from lineQuality, depthQuality, saturation, (1 - trauma) and aftercare, with
                      a little dice: crisp over crisp, slightly soft over soft, else patchy; each join costs a little
     HEAL_REACTIONS what the client says when they see it, by grade x loyalty band (REVIEW_BANDS in clients.js)
     HEAL_APOLOGY   what you say when it got infected (the reveal's apology scene)
     REP_TRACKS     walk-ins (speed and price), collectors (custom work and style), peers (clean heals; conventions later).
                    Each is 0..100 in S.rep. unlocks: the client segments (WALKINS.seg in market.js) a track pulls in only
                    once it reaches that number; events: the PR 8 events it opens (data only until then)
     REP            how a heal, a review and the portfolio move each track; gains shrink as a track fills (soft cap), losses
                    don't; every track slips a little each week (decayWeek) so a reputation has to be kept up
   healPiece(S, piece, r, log): grades it once (piece.heal set, never changed after), stamps healW/healY, logs a heal line,
   writes the client's heal history, moves loyalty (LOYALTY[grade]), may write a review (writeReview), moves S.rep, and on
   an infection books a free fix (a price-0 session item with fix: piece id) for a client on the books. It queues the piece
   for the reveal in S.reveals (when S has that list; at most REVEAL_CAP waiting). Sample walk-ins aren't in S.clients:
   the app may set SIM.guestClient(id) -> {traits, skinTone} so their aftercare counts; their review rides on piece.review.
   Practice pieces are never saved, so they never heal.
   Private helpers start with hl (healing) and rp (reputation). ===== */

const HEAL={
  w:{line:0.28,depth:0.32,sat:0.18,trauma:0.22},   // the heal score's weights (trauma counts as 1 - trauma)
  care:0.3,careMid:0.55,                           // aftercare: + care x (aftercare - careMid)
  joinCost:0.012,joinMax:0.08,                      // each visible join takes this off the score, up to joinMax
  noise:0.05,                                       // sd of the dice on the score
  crisp:0.76,soft:0.6,                              // score thresholds; under soft is patchy
  infect:{trauma:0.55,care:0.45,max:0.5},           // both over/under or never; chance = max x trauma excess x care shortfall
  blow:{k:4,max:0.95},                              // chance of a blown-out heal = max x (1 - e^(-blowouts / k))
  careDefault:0.6,                                  // aftercare when the client isn't known

const REVEAL_CAP=12;

    mid:["It settled in a bit soft, but I love it.","Not as sharp as day one, but it's mine."],

  blownout:{

    mid:["It got infected. I'm OK now, but I was scared.","Doctor said it was infected. I didn't skip the cream, I swear. Mostly."],

/* the artist's apology when a piece got infected */
const HEAL_APOLOGY=[
  "I'm sorry. That should never happen in my chair. The fix is on me, and I'm going over every step of how I work.",
  "I'm truly sorry. Come back when it's settled and I'll make it right, no charge. I'm changing how I set up.",
  "That's on my shop, and I'm sorry. The touch-up is free, whenever your skin is ready."

/* the reputation tracks (S.rep, each 0..100). unlocks: segment -> the track value it starts pulling at (market.js reads
   WALKINS.seg weights; a segment under its unlock pulls nothing). events: for PR 8 (conventions, guest spots, ...) */
const REP_TRACKS={
  walkins:{name:"Walk-ins",says:"speed and price: quick, fair, open doors",
    unlocks:{walk_in:0,first_timer:0,students:15,trades:25},
    events:{flash_day:40,friday_13:60}},
  collectors:{name:"Collectors",says:"custom work and style: people who plan a body of work",
    unlocks:{creatives:10,memorial:15,collector:25,large_scale:45},
    events:{waiting_list:50,magazine:75}},
  peers:{name:"Peers",says:"clean heals: what other artists notice",
    unlocks:{old_school:20,cover_up:35},
    events:{guest_spot:30,convention:55,award:85}}
};
/* how things move the tracks (points on 0..100) */
const REP={
  full:100,soft:0.85,          // a gain is x (1 - soft x track / full), so a track fills slower as it rises
  decayWeek:0.0015,            // every track loses this share of itself each week
  heal:{                       // when a piece heals, by grade
    walkins:{crisp:0.3,soft:0.18,patchy:-0.2,blownout:-0.6,infected:-1.5},
    peers:{crisp:0.3,soft:0.08,patchy:-0.3,blownout:-1,infected:-2.5}
  },
  flash:{walkins:0.12},        // a flash piece (quick and cheap) adds this to walk-ins
  small:{mm:60,walkins:0.08},  // a piece this small or smaller adds this to walk-ins
  custom:{collectors:0.15,perMm:0.003,maxMm:250},   // a custom (not flash) piece: + this + perMm x size (to maxMm)
  collectorGrade:{crisp:1,soft:0.7,patchy:0.2,blownout:-0.6,infected:-1.2},   // the custom gain x this
  styleOk:{collectors:0.06,skill:6},                // a piece in a style you hold at skill or above adds this
  review:{walkins:0.25,collectors:0.12,peers:0.05}, // per star from 3 (5 stars = +2 x, 1 star = -2 x)
  portfolio:{collectors:0.5}   // putting a healed piece in your portfolio (taking it out takes it back)
};

/* ---- reputation ---- */
function rpEnsure(S){if(!S.rep||typeof S.rep!=="object")S.rep={walkins:0,collectors:0,peers:0};return S.rep;}
/* repAdd(S, track, delta) -> the new value. Gains are softened as the track fills; the result stays in 0..full */
function repAdd(S,k,d){
  const rep=rpEnsure(S),cur=+rep[k]||0;
  const eff=d>0?d*(1-REP.soft*cur/REP.full):d;
  rep[k]=Math.round(clamp(cur+eff,0,REP.full)*100)/100;
  return rep[k];
}
function repWeek(S){
  const rep=rpEnsure(S);
  for(const k in REP_TRACKS)if(rep[k]>0)rep[k]=Math.round(rep[k]*(1-REP.decayWeek)*1000)/1000;
}
/* repUnlocked(S, track, id): a segment or an event id the track has reached */
function repUnlocked(S,k,id){
  const t=REP_TRACKS[k];if(!t)return false;
  const at=t.unlocks[id]!=null?t.unlocks[id]:t.events[id];
  return at==null?true:((S.rep&&+S.rep[k])||0)>=at;
}
/* repNext(S, track) -> {id, kind:"segment"|"event", at} the next thing the track opens, or null */
function repNext(S,k){
  const t=REP_TRACKS[k],v=(S.rep&&+S.rep[k])||0;let best=null;
  if(!t)return null;
  for(const kind of ["unlocks","events"])for(const id in t[kind]){const at=t[kind][id];if(at>v&&(!best||at<best.at))best={id,kind:kind==="unlocks"?"segment":"event",at};}
  return best;
}
/* what a heal does to each track: {walkins, collectors, peers} in points before the soft cap */
function repHealDelta(S,piece){
  const g=piece.heal,d=piece.design||{},out={walkins:0,collectors:0,peers:0};
  out.walkins+=REP.heal.walkins[g]||0;out.peers+=REP.heal.peers[g]||0;
  if(d.flash)out.walkins+=REP.flash.walkins;
  if((d.sizeMm||0)>0&&d.sizeMm<=REP.small.mm)out.walkins+=REP.small.walkins;
  if(!d.flash){
    const mm=Math.min(REP.custom.maxMm,d.sizeMm||0);
    let c=REP.custom.collectors+REP.custom.perMm*mm;
    const lvl=((S.skills||{}).styles||{})[d.style]||0;
    if(lvl>=REP.styleOk.skill)c+=REP.styleOk.collectors;
    out.collectors+=c*(REP.collectorGrade[g]!=null?REP.collectorGrade[g]:0.5);
  }
  return out;
}
function repApply(S,delta){const after={};for(const k in delta)if(delta[k])after[k]=repAdd(S,k,delta[k]);return after;}
/* setPortfolio(S, piece, on): the piece's portfolio flag; collectors notice (a little). Only a healed piece. -> bool */
function setPortfolio(S,piece,on){
  on=!!on;if(!piece||!piece.heal||!!piece.portfolio===on)return !!(piece&&piece.portfolio);
  if(on)piece.portfolio=true;else delete piece.portfolio;
  const rep=rpEnsure(S);   // no soft cap here, so taking it out gives back exactly what putting it in gave
  rep.collectors=Math.round(clamp((+rep.collectors||0)+(on?1:-1)*REP.portfolio.collectors,0,REP.full)*100)/100;
  return on;
}

/* ---- the heal ---- */
const hlR3=v=>Math.round(v*1000)/1000;
function hlAftercare(c){const t=c&&c.traits;return t&&t.aftercare!=null?clamp(t.aftercare,0,1):HEAL.careDefault;}
function hlBlowouts(piece){const o=piece.out||{};return Math.max(0,+(piece.blowouts!=null?piece.blowouts:o.blowouts)||0);}
function hlJoins(piece){const o=piece.out||{};return Math.max(0,+(piece.joins!=null?piece.joins:o.joins)||0);}
/* healOdds(piece, aftercare) -> {infect, blow, score} before the dice: the chances and the heal score with no noise */
function healOdds(piece,care){
  const o=Object.assign({},DEFAULT_OUT,piece.out||{}),W=HEAL.w,I=HEAL.infect;
  const t=clamp(o.trauma,0,1);
  const infect=t>I.trauma&&care<I.care?I.max*((t-I.trauma)/(1-I.trauma))*((I.care-care)/I.care):0;
  const b=hlBlowouts(piece),blow=b>0?HEAL.blow.max*(1-Math.exp(-b/HEAL.blow.k)):0;
  const score=W.line*clamp(o.lineQuality,0,1)+W.depth*clamp(o.depthQuality,0,1)+W.sat*clamp(o.saturation,0,1)+W.trauma*(1-t)
    +HEAL.care*(care-HEAL.careMid)-Math.min(HEAL.joinMax,HEAL.joinCost*hlJoins(piece));
  return{infect:hlR3(infect),blow:hlR3(blow),score:hlR3(score)};
}
/* healGrade(piece, aftercare, r) -> HEAL_GRADES id. Draw order is fixed (infection, blowout, score) so it replays */
function healGrade(piece,care,r){
  const k=healOdds(piece,care);
  const a=r(),b=r(),s=k.score+r.normal(0,HEAL.noise);
  if(k.infect>0&&a<k.infect)return "infected";
  if(k.blow>0&&b<k.blow)return "blownout";
  return s>=HEAL.crisp?"crisp":s>=HEAL.soft?"soft":"patchy";
}
const hlBand=l=>l<REVIEW_BANDS[0]?"low":l<REVIEW_BANDS[1]?"mid":"high";
/* healReaction(piece, loyalty) -> the client's line at the reveal (stable per piece) */
function healReaction(piece,loyalty){
  const row=HEAL_REACTIONS[piece.heal];if(!row)return "";
  const list=row[hlBand(loyalty||0)];return list[hash(piece.id+":react")%list.length];
}
function healApology(piece){return HEAL_APOLOGY[hash(piece.id+":sorry")%HEAL_APOLOGY.length];}
/* the review for a piece: the client's history entry, or piece.review for a sample walk-in */
function pieceReview(S,piece){
  if(piece.review)return piece.review;
  const c=findClient(S,piece.client);if(!c)return null;
  for(let i=(c.history||[]).length-1;i>=0;i--){const h=c.history[i];if(h.kind==="review"&&h.piece===piece.id)return h;}
  return null;
}
/* the free fix after an infection: a price-0 session for a client on the books, after the skin settles */
function hlBookFix(S,piece,c){
  const d=piece.design||{},F=HEAL.fix;
  const hours=Math.round(clamp((d.sizeMm||40)*F.hoursPerMm,F.minHours,F.maxHours)*4)/4;
  const due=weekFrom(weekIndex(S.week,S.year)+F.weeksAfter);
  const ask={placement:d.placement,sizeMm:d.sizeMm,style:d.style,tags:[],theme:"fix",size:"tiny",bad:null};
  const item={id:queueId(S),kind:"session",client:c.id,w:due.w,y:due.y,hours,sessionNo:1,sessions:1,price:0,deposit:0,paid:0,
    ask,design:JSON.parse(JSON.stringify(d)),booked:{w:S.week,y:S.year},moved:0,fix:piece.id,ret:{rule:"touchup",piece:piece.id}};
  S.queue.push(item);
  return item;
}
/* healPiece(S, piece, r, log) -> the grade (or the existing one: a piece heals exactly once) */
function healPiece(S,piece,r,log){
  if(!piece||piece.heal)return piece&&piece.heal;
  const real=findClient(S,piece.client);
  const staff=!!piece.by;   // PR 7: a staff artist's piece (sim/career.js): the shop's reputation, the Shop gallery, no reveal
  const guest=!real&&piece.guest?{traits:{aftercare:piece.guest.a,sun:piece.guest.s},loyalty:0.4,skinTone:piece.guest.t}
    :!real&&typeof SIM.guestClient==="function"?SIM.guestClient(piece.client):null;
  const c=real||{id:piece.client,first:"",traits:(guest&&guest.traits)||{},loyalty:guest&&guest.loyalty!=null?guest.loyalty:0.3,history:[]};
  const g=healGrade(piece,hlAftercare(c),r.fork("grade:"+piece.id));
  piece.heal=g;piece.healW=S.week;piece.healY=S.year;
  const name=HEAL_GRADES[g].name;
  let text="The bandage comes off "+piece.name+": "+(g==="infected"?"it got infected.":"healed "+name+".");
  if(real){clientLog(real,{w:S.week,y:S.year,kind:"heal",piece:piece.id,grade:g});loyaltyBump(real,g);}
  if(staff){   /* the shop's name, not yours: a staff infection hits the shop */
    if(typeof shopRepHeal==="function")shopRepHeal(S,piece);
    if(g==="infected"&&log)log.push({k:"event",text:"A client of "+(typeof staffName==="function"?staffName(S,piece.by):"one of your artists")+"'s got infected. It's on the shop.",piece:piece.id,staff:piece.by});
    return g;}
  /* reputation: the heal, then the review */
  repApply(S,repHealDelta(S,piece));
  const rv=writeReview(c,piece,r.fork("review:"+piece.id));
  if(rv){
    if(!real)piece.review={stars:rv.stars,text:rv.text};
    const st=rv.stars-3;repApply(S,{walkins:st*REP.review.walkins,collectors:st*REP.review.collectors,peers:st*REP.review.peers});
  }
  if(S.career&&S.studio&&S.studio.stage==="apprentice"&&S.career.mentor&&typeof caGoodwill==="function")caGoodwill(S,g==="crisp"?MENTOR.goodwill.crisp:g==="soft"?0:MENTOR.goodwill.bad);   // PR 7
  if(g==="infected"&&real&&!real.compact){
    const fx=hlBookFix(S,piece,real);
    text+=" A free fix is booked for week "+fx.w+", "+fx.y+".";
  }
  if(Array.isArray(S.reveals)){S.reveals.push(piece.id);if(S.reveals.length>REVEAL_CAP)S.reveals.splice(0,S.reveals.length-REVEAL_CAP);}
  if(log)log.push({k:"heal",text,piece:piece.id,client:piece.client,grade:g,review:rv?rv.stars:null});
  return g;
}

const hlCalHeals=WEEK_HOOKS.heals;
WEEK_HOOKS.heals=function(S,ctx){hlCalHeals(S,ctx);repWeek(S);};

SIM.HEAL=HEAL;SIM.HEAL_REACTIONS=HEAL_REACTIONS;SIM.HEAL_APOLOGY=HEAL_APOLOGY;SIM.REVEAL_CAP=REVEAL_CAP;
SIM.REP_TRACKS=REP_TRACKS;SIM.REP=REP;SIM.repAdd=repAdd;SIM.repWeek=repWeek;SIM.repUnlocked=repUnlocked;SIM.repNext=repNext;
SIM.repHealDelta=repHealDelta;SIM.setPortfolio=setPortfolio;SIM.healOdds=healOdds;SIM.healGrade=healGrade;SIM.healPiece=healPiece;

/* ===== sim/session.js: the tattoo session: stencil, trace-and-rhythm scoring, shading, client meters, outputs (PR 4) =====
   A pure, deterministic model of one sitting in the chair. The app feeds it pointer samples in millimetres on the
   placement box (time in ms) and it keeps every running number in a plain object `sess` that saves as JSON (numbers and
   short strings only: never pointer streams). The same samples always give the same scores. Nothing here is random.

   The stencil. sessionPlan turns a design into what you tattoo: every element's SVG path is flattened (M L H V C S Q T A Z,
   absolute and relative), moved into placement millimetres exactly the way the board draws it (app/design.js dzTf: the
   piece's pos on the box, the element's x/y in the footprint, its scale and rot) and resampled every STENCIL.stepMm into a
   stroke. Strokes are split into STENCIL.segMm segments for scoring. Elements with fill > 0 give a zone from their fill path:
   black or grey fills are shading zones, coloured fills are colour zones. The work list is every stroke, then every
   shading zone, then every colour zone; each item carries a share of the piece's hours (scoreDesign hours less setup) by its
   length or its area x fill. A piece of N sittings (scoreDesign sessions, or the booking's) splits that list at 1/N, 2/N...
   of the hours, so the first sitting is mostly linework. A sitting that ends early leaves the rest to the next one.

   Linework (plan Q4: trace-and-rhythm). The player starts on the dot and follows the stroke while a pacing marker runs at the
   target pace (PACE.frac of the view per second x the kit's pace). Each sample is projected onto the stroke (forward only, and never further than the finger moved, so loops, crossings
   and sharp corners work); pace is the finger's own speed over the last PACE.speedMs. Per segment, time-weighted:
     accuracy  = how close to the line (ACC; the tolerance is the kit's accFrac of the view, so it is the same on screen)
     pace      = how near the target speed, flat inside the band (kitBands paceBand: skill, machine, voltage, Assist)
     depth     = needle hit / pace (slow = deep, digging in; fast = shallow): DEPTH
   segment quality = accuracy x pace, a blowout (BLOW) if you rushed past the band for PACE.blowMs inside it, and every
   restart (lifting and putting the finger back, or stopping for PACE.stopMs and going again) is a join (JOIN). A liner that
   doesn't lay the line weight the element wants costs quality (LW_FIT). Lingering adds trauma.
   Shading and colour. Hold and sweep inside a shading zone, or swipe back and forth in a colour zone: the zone's saturation
   meter fills by the distance swept inside it (or within ZONE.slop of its edge) (ZONE), fastest with a mag, at a steady sweep speed, and colour packs properly only while
   you keep reversing (COLOUR). Past the zone's target (its fill) + ZONE.slack you are overworking the skin: trauma.
   Client meters. A sitting has a clock in hours that moves with the work (a stroke traced at pace uses its share of the
   hours; tracing slower uses more). pain rises with the placement's pain, the client's pain TOLERANCE (traits.pain, 1 =
   tough), the machine and voltage, how long they've sat, and any trauma you cause; fatigue rises steadily, faster in pain.
   Break (BREAK), numbing cream (NUMB: a consumable that costs rubles) and chat (CHAT: helps with a talkative client) push
   back. Either meter at 1 ends the sitting: the piece continues next time. Practice on fake skin has no meters.
   Outputs (aging.js tattoo.out): lineQuality, depthQuality, saturation (0..1, higher is better), trauma (0..1, LOWER is
   better), plus sessionsUsed, blowouts, joins.

   API (all pure; sess is the only thing changed, and only by the functions that say so):
     SIM.sessionNew(o) -> sess        o = {design, client (or null), skills, kit, settings:{assist}, bodyShape, skinTone,
                                       kind: "practice"|"sample"|"booked", itemId, part, partsTotal, progress, year, week}
     SIM.sessionPlan(sess) -> plan    {box, strokes:[{el, lw, colour, pts:[x0,y0,x1,...], cum, len, segs}], zones:[{el, kind,
                                       colour, target, polys:[[x,y,...]], area, box}], items:[{k:"line"|"shade"|"colour", i, w}],
                                       hours, parts, dots}  (cached; never saved)
     SIM.sessionBands(sess)           the kit bands plus paceMmS, accMm, view (mm)
     SIM.sessionPlace(sess, pos)      move the stencil before the first line (pos 0..1 in the box); returns stencilCheck
     SIM.sessionRotate(sess, deg)     turn the stencil before the first line (about its own centre); returns stencilCheck
     SIM.stencilCheck(design, client, skills) -> {flow, issues:[{id, sev, text}]}   flow and crease, re-checked
     SIM.sessionItem(sess) -> the current item (with .stroke or .zone) or null
     SIM.penDown / penMove / penUp(sess, t, x, y) -> live {ok, r (pace ratio), d (mm off), u, rushed, stopped, blow, sat,
                                       inside, pain, fatigue, stop, done}   (mutate sess)
     SIM.sessionSetLiner(sess, id), SIM.sessionNextItem(sess) (leave a zone / give up the rest of a line), SIM.sessionAction(
       sess, "break"|"numb"|"chat") -> {ok, why, cost, talk}  (mutate sess)
     SIM.sessionFinish(sess) -> {done, early, stop, out, sitting, progress, part, partsTotal, sessionsUsed}   (pure)
     SIM.sessionXp(result, sess, skills) -> {linework, shading, colour, speed, styles:{id:+x}}   SKILL_XP
