<style>
/* ===================== Ink: base page CSS =====================
   Theme tokens (dark default, light under html[data-theme=light]), the app frame (header, scrolling panel, bottom tab bar),
   cards, buttons, the settings/backup sheet, toasts, the "New version ready" bar, and the design-board cream (both themes:
   the board stays cream with black ink, Q10 default; only the chrome around it follows the theme).
   Reduced motion and reduced transparency are honoured at the bottom. */
:root{
  --bg:#17130f;--panel:#211c17;--panel2:#2b241d;--line:#3b3229;--text:#f2ebdd;--mute:#a39a8b;--faint:#6f665a;
  --red:#c8553d;--red2:#e06a50;--teal:#3f8f86;--gold:#d9a441;--ok:#6fbf8a;--warn:#e0a03f;--crit:#e0574f;
  --board:#f3ead8;--boardInk:#16120e;--boardLine:#d8ccb4;
  --tabh:62px;--hdr:52px;--r:12px;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  --ui:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:Oswald,"Arial Narrow",Impact,sans-serif;
  color-scheme:dark;
}
html[data-theme=light]{
  --bg:#f4efe6;--panel:#fffaf1;--panel2:#efe7d9;--line:#ddd2bf;--text:#1c1813;--mute:#6b6255;--faint:#a39886;
  --red:#b3432c;--red2:#c8553d;--teal:#2f7f77;--gold:#a8791f;--ok:#2f8a52;--warn:#a86a10;--crit:#c0392f;
  --shadow:0 6px 20px rgba(60,40,20,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--ui);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red2)}
h1,h2,h3{margin:0;font-weight:700}
.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* ---- app frame ---- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
#hdr{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:var(--hdr);padding:calc(env(safe-area-inset-top,0px) + 6px) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
#hdr .brand{font-family:var(--disp);font-size:26px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1}
#hdr .brand em{font-style:normal;color:var(--red)}
#hdr .when{display:flex;flex-direction:column;line-height:1.15;font-size:12px;color:var(--mute);margin-left:4px}
#hdr .when b{color:var(--text);font-size:13px}
#hdr .sp{flex:1}
#hdr .cash{font-weight:700;font-variant-numeric:tabular-nums}
.ibtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--text);cursor:pointer}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover{background:var(--panel2)}
#panel{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.tabpage{display:none}
.tabpage.on{display:block}

/* ---- bottom tab bar ---- */
#tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tabh);border:0;background:transparent;color:var(--mute);font-size:11.5px;font-weight:500;letter-spacing:.02em;cursor:pointer;position:relative}
#tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--text)}
#tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
#tabs button:focus-visible{outline:2px solid var(--red2);outline-offset:-4px}

/* ---- cards, rows, buttons ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h2{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.card h3{font-size:15px;margin:0 0 4px}
.hint{color:var(--mute);font-size:13.5px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff8ef}
.btn.pri:hover{background:var(--red2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;border:0;background:transparent;color:var(--mute);font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -3px 0 var(--red)}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}
.empty svg{width:56px;height:56px;fill:none;stroke:var(--faint);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.empty p{margin:6px auto;max-width:30ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
label{display:inline-flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
select{min-height:40px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px}
pre.raw{margin:0;padding:10px;border-radius:8px;background:var(--panel2);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto}

/* ---- the studio view (3D placeholder until PR 6) ---- */
#studioView{position:relative;height:min(42vh,320px);border-radius:var(--r);overflow:hidden;background:#0f0c09;margin:0 0 12px;border:1px solid var(--line)}
#studioView canvas{display:block;width:100%;height:100%}
#studioView .cap{position:absolute;left:12px;bottom:10px;font-size:12px;color:#d8cdb9;background:rgba(15,12,9,.6);padding:3px 8px;border-radius:6px}

/* ---- design board: cream in both themes ---- */
.board{background:var(--board);color:var(--boardInk);border:1px solid var(--boardLine);border-radius:var(--r)}

/* ---- sheet (Settings, Back up, Restore) ---- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:min(760px,100%);max-height:88vh;transform:translate(-50%,105%);transition:transform .25s cubic-bezier(.2,.7,.2,1);z-index:71;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.on{transform:translate(-50%,0)}
#sheet .sh{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line)}
#sheet .sh h2{flex:1;font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
#sheetBody{overflow-y:auto;padding:14px 16px 22px}
#sheetBody section{margin:0 0 18px}
#sheetBody section h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
textarea.code{width:100%;min-height:120px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;resize:vertical}
.buerr{color:var(--crit);min-height:1.2em}

/* ---- toast ---- */
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:80;max-width:calc(100% - 32px);padding:10px 14px;border-radius:10px;background:#1f1a15;color:#f2ebdd;border:1px solid var(--red);box-shadow:var(--shadow);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---- "New version ready" bar (app/boot.js, PEW's pwa.js pattern) ---- */
#pwaBar{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);z-index:75;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 24px);padding:8px 8px 8px 14px;border-radius:10px;background:#1f1a15;color:#f2ebdd;border:1px solid var(--red);box-shadow:var(--shadow);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#pwaBar.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#pwaBar .btn{min-height:44px}
#pwaBar .pwalater{min-height:44px;min-width:44px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#b6ac9b;font-weight:500;cursor:pointer}

/* ---- wide screens ---- */
@media (min-width:900px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* ---- accessibility preferences ---- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (prefers-reduced-transparency:reduce){#scrim{background:rgba(0,0,0,.8)}#studioView .cap{background:#0f0c09}}
html.noanim *,html.noanim *::before,html.noanim *::after{transition:none!important;animation:none!important}
</style>

/* ===================== Ink: INK_SIM (the simulation) =====================
   INK_SIM holds design scoring, the aging model, client logic, the calendar and the economy. It never touches the DOM
   or three.js, and it runs in plain node (tools/sim-test.js cuts src/sim/*.js out and runs them). The sim files are one
   IIFE spread over src/sim/: this file opens it (SIM is the object every file adds to) and sim/market.js closes it.
   rng.js: the seeded random number generator. ALL randomness in the sim goes through INK_SIM.rng; no bare Math.random()
   anywhere in src/sim/.
     const r=SIM.rng(seed)      a generator (mulberry32). r() or r.next() -> [0,1)
     r.range(a,b) r.int(a,b) (inclusive) r.chance(p) r.pick(list) r.weighted(list, w=>weight) r.shuffle(list) r.normal(mean,sd)
     r.fork(label)              a new, independent generator seeded from this seed + a label, so adding a draw in one system
                                never shifts the numbers in another (e.g. SIM.rng(S.seed).fork("walkins:"+week))

/* build the left and right versions of a paired zone (the right side mirrors x and the flow angle) */
function plPair(b){
  const out={};
  for(const side of ["l","r"]){
    const m=side==="r";
    const flow=b.flow.map(line=>line.map(p=>[m?+(1-p[0]).toFixed(3):p[0],p[1]]));
    const creases=b.creases.map(c=>Object.assign({},c));
    out[b.id+"_"+side]=Object.assign({},b,{id:b.id+"_"+side,name:(side==="l"?"left ":"right ")+b.name,side,island:ISLANDS.indexOf(b.island+"_"+side)>=0?b.island+"_"+side:b.island,
      flowDeg:m?-b.flowDeg:b.flowDeg,flow,creases,crease:creases[0]||null});
  }
  return out;
}

     The same function re-scores an aged piece: aging.js widens the lines and fades the ink, and the gaps close up.

   - coherence: elements from other styles clash unless the style lists them in blendsWith; wildly different line weights

   - fit: the client's wants (style weights, size range, tags, colour appetite), must-haves (each missing one costs a lot),

const HOURS={setup:0.5,perCm2Simple:0.015,perCm2Detailed:0.04,fill:0.5,colour:0.25,speedSlow:1.25,speedFast:0.8,round:0.25};
/* longest sitting by pain: a forearm can take 6 hours, the ribs about 3.5 */
const SESSION_HOURS={easy:6,hard:3.5};
/* the default hourly rate for an average artist in 2000 rubles, and the shop minimum (hours) */
const RATE_DEFAULT={rate:850,minHours:1};
/* how much a job needs tattoos covered, by a word in client.job (first match wins); anything else is DEFAULT */
const JOB_COVER=[["bank",0.85],["lawyer",0.9],["solicitor",0.9],["notary",0.9],["judge",0.95],["accountant",0.75],["civil serv",0.8],
  ["official",0.8],["office",0.6],["clerk",0.6],["teacher",0.65],["doctor",0.6],["nurse",0.5],["police",0.7],["receptionist",0.6],
  ["hotel",0.6],["sales",0.5],["waiter",0.35],["chef",0.1],["cook",0.1],["builder",0.1],["courier",0.1],["mechanic",0.1],
  ["dock",0.1],["musician",0],["barista",0.1],["tattoo",0],["artist",0.05],["student",0.2],["DEFAULT",0.3]];
/* words for the stress report */
const REGION_WORDS={
  arm:{limb:"arm",past:"wraps past the side of the arm"},leg:{limb:"leg",past:"wraps past the side of the leg"},
  hand:{limb:"hand",past:"runs over the edge of the hand"},foot:{limb:"foot",past:"runs down the side of the foot"},
  side:{limb:"body",past:"wraps round onto the back and belly"},back:{limb:"back",past:"runs round the sides of the body"},
  chest:{limb:"chest",past:"runs into the armpit and over the collarbone"},neck:{limb:"neck",past:"wraps round to the throat"},
  shoulder:{limb:"shoulder",past:"wraps down past the shoulder cap"}

/* styles whose colour goes on the lines too (no black outline); everywhere else an element's colour is its fill and
   its lines stay black, so a red traditional rose still has a black outline that reads on any skin */
const COLOUR_LINES={watercolour:1};
/* the default session outputs used for the aging prediction */
const DEFAULT_OUT={lineQuality:0.75,depthQuality:0.75,saturation:0.75,trauma:0.75};

/* ---- small helpers ---- */
function dzLineMm(rl){
  if(LINE_MM[rl]!=null)return LINE_MM[rl];
  const ks=Object.keys(LINE_MM).map(Number).sort((a,b)=>a-b);
  if(!(rl>ks[0]))return LINE_MM[ks[0]];
  for(let i=1;i<ks.length;i++)if(rl<=ks[i])return lerp(LINE_MM[ks[i-1]],LINE_MM[ks[i]],(rl-ks[i-1])/(ks[i]-ks[i-1]));
  return LINE_MM[ks[ks.length-1]];
}
function dzInterp(xs,ys,x){
  if(x<=xs[0])return ys[0];
  for(let i=1;i<xs.length;i++)if(x<=xs[i])return lerp(ys[i-1],ys[i],(x-xs[i-1])/(xs[i]-xs[i-1]));
  return ys[ys.length-1];
}
/* SKIN_CONTRAST, bilinear in ink lightness and skin tone */
function dzContrast(light,tone){
  const T=SKIN_CONTRAST,rows=T.read.map(r=>dzInterp(T.tones,r,tone));
  return dzInterp(T.light,rows,light);
}
function dzFold(a){a=((a%180)+180)%180;return a>90?180-a:a;}   // angle between two undirected axes, 0..90
function dzColour(id){
  const C=SIM.COLOURS||{},c=C[id||"black"];
  if(c)return c;
  return{name:id||"black",light:id&&id!=="black"?0.5:0.06};
}
function dzStyle(id){return(SIM.STYLES||{})[id]||null;}
/* an element's real proportions from its SVG path (0..100 viewBox), cached: {aspect, axis} or null without a path.
   Reads absolute and relative M L H V C S Q T A Z; curve control points count (a little generous), arcs are sampled */
const dzShapeCache={};
function dzPathBox(d){
  const tk=String(d||"").match(/[a-zA-Z]|-?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g);if(!tk)return null;
  const N={m:2,l:2,h:1,v:1,c:6,s:4,q:4,t:2,a:7,z:0};
  let i=0,cmd="",x=0,y=0,sx=0,sy=0,x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,n=0;
  const add=(px,py)=>{x0=Math.min(x0,px);x1=Math.max(x1,px);y0=Math.min(y0,py);y1=Math.max(y1,py);n++;};
  while(i<tk.length){
    if(/[a-zA-Z]/.test(tk[i])){cmd=tk[i++];if(cmd==="z"||cmd==="Z"){x=sx;y=sy;continue;}}
    const lc=cmd.toLowerCase(),k=N[lc];if(!k){i++;continue;}
    const a=tk.slice(i,i+k).map(Number);i+=k;if(a.length<k||a.some(v=>isNaN(v)))break;
    const rel=cmd!==cmd.toUpperCase(),ox=rel?x:0,oy=rel?y:0;
    if(lc==="h"){x=ox+a[0];add(x,y);continue;}
    if(lc==="v"){y=oy+a[0];add(x,y);continue;}
    if(lc==="a"){const ex=ox+a[5],ey=oy+a[6];dzArcPts(x,y,a[0],a[1],a[2],a[3],a[4],ex,ey,add);x=ex;y=ey;add(x,y);continue;}
    for(let j=0;j<k;j+=2)add(ox+a[j],oy+a[j+1]);
    x=ox+a[k-2];y=oy+a[k-1];
    if(lc==="m"){sx=x;sy=y;cmd=rel?"l":"L";}

  return n>1?{w:x1-x0,h:y1-y0}:null;
}
/* sample an SVG arc (endpoint form) via its centre, so a circle drawn as two half arcs gets its real height */
function dzArcPts(x1,y1,rx,ry,phi,fa,fs,x2,y2,add){
  rx=Math.abs(rx);ry=Math.abs(ry);if(!rx||!ry)return;
  const c=Math.cos(phi*Math.PI/180),s=Math.sin(phi*Math.PI/180),dx=(x1-x2)/2,dy=(y1-y2)/2;
  const xp=c*dx+s*dy,yp=-s*dx+c*dy,lam=xp*xp/(rx*rx)+yp*yp/(ry*ry);
  if(lam>1){const k=Math.sqrt(lam);rx*=k;ry*=k;}
  const num=rx*rx*ry*ry-rx*rx*yp*yp-ry*ry*xp*xp,den=rx*rx*yp*yp+ry*ry*xp*xp;
  const co=(fa===fs?-1:1)*Math.sqrt(Math.max(0,num/(den||1)));
  const cxp=co*rx*yp/ry,cyp=-co*ry*xp/rx,cx=c*cxp-s*cyp+(x1+x2)/2,cy=s*cxp+c*cyp+(y1+y2)/2;
  const ang=(ux,uy,vx,vy)=>{const a=Math.atan2(ux*vy-uy*vx,ux*vx+uy*vy);return a;};
  const t1=ang(1,0,(xp-cxp)/rx,(yp-cyp)/ry);let dt=ang((xp-cxp)/rx,(yp-cyp)/ry,(-xp-cxp)/rx,(-yp-cyp)/ry);
  if(!fs&&dt>0)dt-=2*Math.PI;else if(fs&&dt<0)dt+=2*Math.PI;
  for(let i=1;i<8;i++){const t=t1+dt*i/8,ex=rx*Math.cos(t),ey=ry*Math.sin(t);add(c*ex-s*ey+cx,s*ex+c*ey+cy);}
}
function dzShape(def){
  const k=def.id;if(k!=null&&dzShapeCache[k]!==undefined)return dzShapeCache[k];
  let r=null;
  const a=def.path?dzPathBox(def.path):null,b=def.fill?dzPathBox(def.fill):null;
  if(a||b){
    const w=Math.max(a?a.w:0,b?b.w:0),h=Math.max(a?a.h:0,b?b.h:0),mx=Math.max(w,h);
    if(mx>0)r={aspect:Math.max(0.15,Math.min(w,h)/mx),axis:w>h*1.15?90:0};
  }
  if(k!=null)dzShapeCache[k]=r;
  return r;
}
const DZ_UNKNOWN={name:"element",family:"motif",styles:[],minSizeMm:15,detail:0.5,lineWeightDefault:7,colourable:true,tags:[]};
function dzDef(id){return(SIM.elementById&&SIM.elementById(id))||Object.assign({},DZ_UNKNOWN,{id,name:String(id)});}
/* an element's name as it reads mid-sentence: "Rose" -> "rose", "Script: Family" -> '"Family" script' */
function dzName(def){
  const n=String(def.name||def.id||"element"),m=n.match(/^([^:]+):\s*(.+)$/);
  if(m)return'"'+m[2]+'" '+m[1].toLowerCase();
  return n.length>1&&n[1]===n[1].toLowerCase()?n[0].toLowerCase()+n.slice(1):n;
}
function dzBlends(a,b){
  if(a===b)return true;
  const sa=dzStyle(a),sb=dzStyle(b);
  return!!((sa&&(sa.blendsWith||[]).indexOf(b)>=0)||(sb&&(sb.blendsWith||[]).indexOf(a)>=0));
}
/* which of an element's styles it is drawn in here: the design's style if it can be, else the one whose line range
   fits the line weight it is drawn at and that sits with the design's style (a 1RL moth is fine-line, not neo-trad) */
function dzBestStyle(styles,style,rl){
  let best=styles[0]||style,bs=-1e9;
  for(const s of styles){
    const st=dzStyle(s),lr=st&&st.lineRange,off=lr?(rl<lr[0]?lr[0]-rl:rl>lr[1]?rl-lr[1]:0):0;
    const sc=(s===style?2:0)+(dzBlends(s,style)?1:0)-0.4*off;
    if(sc>bs){bs=sc;best=s;}
  }
  return best;
}
function dzJobCover(job){
  const j=String(job||"").toLowerCase();
  for(const [k,v] of JOB_COVER)if(k!=="DEFAULT"&&j.indexOf(k)>=0)return v;
  return JOB_COVER[JOB_COVER.length-1][1];
}
const dzR=(v,n)=>{const m=Math.pow(10,n==null?3:n);return Math.round(v*m)/m;};

/* ---- the element table for a design: geometry, weight and looks of every element, and the piece's footprint ---- */
function dzElems(design){
  const S0=design.sizeMm||50,style=design.style,els=[];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const el of design.elements||[]){
    const def=dzDef(el.id),fam=FAMILY_SHAPE[def.family]?def.family:"motif",sh0=FAMILY_SHAPE[fam],ps=dzShape(def);
    const sh=ps?{aspect:ps.aspect,ink:sh0.ink,axis:ps.axis,elong:sh0.elong*clamp((1-ps.aspect)/0.5,0.1,1)}:sh0;
    const scale=el.scale!=null?el.scale:0.5,rl=el.lineWeight!=null?el.lineWeight:(def.lineWeightDefault||7);
    const colourId=el.colour||"black",col=dzColour(colourId),light=col.light!=null?col.light:0.5;
    const tags=def.tags||[],round=tags.some(t=>ROUND_TAGS[t]);
    const axis=sh.axis+(el.rot||0),th=axis*Math.PI/180,sn=Math.abs(Math.sin(th)),cs=Math.abs(Math.cos(th));
    const L=scale,Sh=scale*sh.aspect,hx=L/2*sn+Sh/2*cs,hy=L/2*cs+Sh/2*sn;
    const x=el.x!=null?el.x:0.5,y=el.y!=null?el.y:0.5;
    x0=Math.min(x0,x-hx);x1=Math.max(x1,x+hx);y0=Math.min(y0,y-hy);y1=Math.max(y1,y+hy);
    const fill=clamp(el.fill||0,0,1),lineMm=dzLineMm(rl),area=L*Sh*sh.ink;
    const styles=def.styles||[],best=dzBestStyle(styles,style,rl);
    const colShare=colourId==="black"||COLOUR_LINES[style]||fill<=0?1:fill/(fill+lineMm/1.7*0.6+0.15);
    const lightMix=lerp(dzColour("black").light!=null?dzColour("black").light:0.06,light,colShare);
    els.push({colShare,lightMix,el,def,id:el.id,name:dzName(def),fam,sh,x,y,scale,mm:scale*S0,rl,lineMm,colourId,col,light,fill,
      detail:def.detail!=null?def.detail:0.5,minMm:def.minSizeMm||10,styles,best,tags,axis,elong:round?0.1:sh.elong,area,
      w:area*(fill+lineMm/1.7*0.6+0.15)*(1-0.75*lightMix)});
  }
  if(!els.length){x0=y0=0.5;x1=y1=0.5;}
  const fw=Math.max(1e-3,x1-x0),fh=Math.max(1e-3,y1-y0);
  /* crowding: the room each motif or word needs to read (its minSizeMm squared, more for detail) against the room it has */
  let inked=0,need=0,nMotif=0;
  for(const e of els){inked+=e.area;if(e.fam==="motif"||e.fam==="lettering"){nMotif++;need+=(0.3+e.detail)*e.minMm*e.minMm;}}
  return{els,sizeMm:S0,fx0:x0,fy0:y0,fw,fh,cx:(x0+x1)/2,cy:(y0+y1)/2,Wmm:fw*S0,Hmm:fh*S0,
    coverage:inked/(fw*fh),crowd:nMotif>=2?need/(fw*fh*S0*S0):0,inkedCm2:Math.min(inked,fw*fh)*S0*S0/100};
}

/* ---- readability of one element; wear = {spread, blur, fade} from aging.js or null for fresh ink ---- */
function dzElemRead(e,tone,wear,tol){
  const sp=wear?wear.spread:0,bl=wear?wear.blur:0,fd=wear?wear.fade:0;
  const ratio=e.mm/(e.minMm*(1-(tol||0)));
  const sizeF=ratio>=1?1:Math.pow(Math.max(0,ratio),READ.sizeExp);
  const gapF=dzGap(e,sp,bl);
  const con0=e.colShare>=1?dzContrast(e.light,tone):lerp(dzContrast(dzColour("black").light||0.06,tone),dzContrast(e.light,tone),e.colShare);
  const con=con0*(1-READ.fadeHit*fd);
  let lineV=1;
  if(e.lineMm<READ.lineOk){
    const t=e.lineMm/READ.lineOk;
    lineV=lerp(READ.lineFloor,1,t)*lerp(dzInterp(SKIN_CONTRAST.tones,SKIN_CONTRAST.fineLine,tone),1,t);
    lineV=lerp(lineV,1,e.fill*0.6);
  }
  return sizeF*Math.pow(gapF,0.8)*con*lineV;
}
/* how open the gaps between an element's strokes still are, 0..1 (the letters "closing up") */
function dzGap(e,sp,bl){
  const pitch=e.mm*lerp(READ.gapWide,READ.gapTight,e.detail);
  return clamp((pitch-e.lineMm-(sp||0)-(bl||0)-READ.gapMin)/(READ.gapOk-READ.gapMin),0,1);
}
/* readability of the whole piece (and each element's, for the stress report) */
function dzReadability(E,tone,wears,tol){
  if(!E.els.length)return{score:0,each:[]};
  let sw=0,s=0,mn=1;const each=[];
  E.els.forEach((e,i)=>{
    const r=dzElemRead(e,tone,wears?wears[i]:null,tol);each.push(r);
    const imp=Math.sqrt(Math.max(1e-6,e.w))*(e.fam==="lettering"?READ.letterWeight:1);
    sw+=imp;s+=imp*r;mn=Math.min(mn,r);
  });
  const crowdF=1-READ.crowdHit*clamp((E.crowd-READ.crowdOk)/(READ.crowdBad-READ.crowdOk),0,1);
  return{score:clamp((s/sw*(1-READ.minBlend)+mn*READ.minBlend)*crowdF,0,1),each,crowdF};
}
/* for aging.js and the UI: readability of a design on a skin tone, optionally with per-element wear */
SIM.readabilityOf=(design,skinTone,wears)=>dzReadability(dzElems(design),skinTone==null?0.3:skinTone,wears||null,0).score;

/* ---- flow ---- */
const dzFlowCache={};
function dzFlowSegs(p,box){
  const k=p.id+":"+box.wrapMm+":"+box.lengthMm;
  if(dzFlowCache[k])return dzFlowCache[k];
  const segs=[];
  for(const line of p.flow||[])for(let i=1;i<line.length;i++){
    const ax=line[i-1][0]*box.wrapMm,ay=line[i-1][1]*box.lengthMm,bx=line[i][0]*box.wrapMm,by=line[i][1]*box.lengthMm;
    segs.push({ax,ay,dx:bx-ax,dy:by-ay,ang:Math.atan2(-(bx-ax),by-ay)*180/Math.PI});
  }
  return(dzFlowCache[k]=segs);
}
function dzLocalFlow(segs,px,py,fallback){
  let best=fallback,bd=1e18;
  for(const s of segs){
    const l2=s.dx*s.dx+s.dy*s.dy||1,t=clamp(((px-s.ax)*s.dx+(py-s.ay)*s.dy)/l2,0,1);
    const qx=s.ax+t*s.dx-px,qy=s.ay+t*s.dy-py,d=qx*qx+qy*qy;
    if(d<bd){bd=d;best=s.ang;}
  }
  return best;
}
function dzFlow(E,design,p,box){
  const pos=design.pos||{x:0.5,y:0.5},segs=dzFlowSegs(p,box);
  let sw=0,mis=0;const elMis=[],minSide=Math.min(box.wrapMm,box.lengthMm);
  for(const e of E.els){
    const px=pos.x*box.wrapMm+(e.x-E.cx)*E.sizeMm,py=pos.y*box.lengthMm+(e.y-E.cy)*E.sizeMm;
    const wraps=e.tags.some(t=>WRAP_TAGS[t]),loc=dzLocalFlow(segs,px,py,p.flowDeg||0)+(wraps?90:0),sn=Math.sin(dzFold(e.axis-loc)*Math.PI/180);
    const m=e.elong*sn*sn*lerp(FLOW.smallMis,1,clamp(e.mm/minSide/FLOW.bigShare,0,1));
    const imp=Math.sqrt(Math.max(1e-6,e.w));sw+=imp;mis+=imp*m;elMis.push(m);
  }
  const misE=sw?mis/sw:0;
  const W=E.Wmm,H=E.Hmm,elongF=Math.abs(H-W)/Math.max(H,W,1e-6),dAxis=H>=W?0:90;
  const band=E.els.some(e=>e.tags.some(t=>WRAP_TAGS[t]));

  const sf=Math.sin(dzFold(dAxis-(p.flowDeg||0))*Math.PI/180),misF=band?0:elongF*sf*sf*relF;
  const orient=clamp(1-(FLOW.elemW*misE+FLOW.footW*misF),0,1);
  const fitShare=(r,fall)=>r<=FLOW.comfy?1:r<=1?lerp(1,FLOW.edge,(r-FLOW.comfy)/(1-FLOW.comfy)):FLOW.edge*Math.exp(-(r-1)*fall);
  const wr=W/box.wrapMm,lr=H/box.lengthMm;
  const wrapF=band?1:fitShare(wr,FLOW.wrapFall*(0.6+(p.curve||0.5))),lenF=fitShare(lr,FLOW.lenFall);
  let creaseF=1,cross=null,near=null;
  const yTop=pos.y*box.lengthMm-H/2,yBot=pos.y*box.lengthMm+H/2,xL=pos.x*box.wrapMm-W/2,xR=pos.x*box.wrapMm+W/2;
  for(const c of p.creases||(p.crease?[p.crease]:[])){
    const lo=c.axis==="y"?xL:yTop,hi=c.axis==="y"?xR:yBot,at=c.at*(c.axis==="y"?box.wrapMm:box.lengthMm);
    if(at>lo+FLOW.creaseMarginMm&&at<hi-FLOW.creaseMarginMm){creaseF=Math.min(creaseF,FLOW.creaseCross);cross=cross||c;}
    else{const d=Math.min(Math.abs(at-lo),Math.abs(at-hi));if(d<FLOW.creaseNearMm||(at>lo&&at<hi)){creaseF=Math.min(creaseF,FLOW.creaseNear);near=near||{c,d:Math.round(d)};}}
  }
  return{score:clamp((FLOW.base+(1-FLOW.base)*orient)*wrapF*lenF*creaseF,0,1),orient,misE,misF,elMis,wr:band?0:wr,lr,rel,cross,near};
}

/* ---- balance ---- */
function dzBalance(E){
  let sw=0,gx=0,gy=0;
  for(const e of E.els){sw+=e.w;gx+=e.w*e.x;gy+=e.w*e.y;}
  if(!sw)return 0;
  gx/=sw;gy/=sw;
  const dx=(gx-E.cx)/Math.max(E.fw/2,BALANCE.minHalf),dy=(gy-E.cy)/Math.max(E.fh/2,BALANCE.minHalf);
  const off=Math.sqrt(BALANCE.x*dx*dx+BALANCE.y*dy*dy);
  let b=1-BALANCE.k*Math.pow(off,BALANCE.exp);
  if(E.coverage<BALANCE.sparse)b*=lerp(BALANCE.sparseFloor,1,E.coverage/BALANCE.sparse);
  return clamp(b,0,1);
}

/* ---- coherence ---- */
function dzCoherence(E,design,lvl){
  const st=dzStyle(design.style);
  let sw=0,s=0,lo=99,hi=0,pal=1;
  for(const e of E.els){
    let m=e.best===design.style?1:dzBlends(e.best,design.style)?COHERENCE.blend:COHERENCE.clash;
    if(st&&st.lineRange){const d=e.rl<st.lineRange[0]?st.lineRange[0]-e.rl:e.rl>st.lineRange[1]?e.rl-st.lineRange[1]:0;m*=Math.max(COHERENCE.rangeFloor,1-COHERENCE.rangeStep*d);}
    const imp=Math.sqrt(Math.max(1e-6,e.w));sw+=imp;s+=imp*m;
    lo=Math.min(lo,e.rl);hi=Math.max(hi,e.rl);
    if(st&&st.palette&&e.colourId!=="black"&&st.palette.indexOf(e.colourId)<0)pal*=COHERENCE.paletteHit;
  }
  if(!sw)return 0;
  const lwF=1-COHERENCE.lwHit*clamp((hi-lo-COHERENCE.lwGapFrom)/(COHERENCE.lwGapTo-COHERENCE.lwGapFrom),0,1);
  const c=s/sw*lwF*Math.max(COHERENCE.paletteFloor,pal);
  return clamp(c+(1-c)*DESIGN_SKILL.cohRecover*lvl/10,0,1);
}

/* ---- fit to the client ---- */
function dzHas(E,design,m){
  if(m.kind==="tag")return E.els.some(e=>e.tags.indexOf(m.v)>=0);
  if(m.kind==="element")return E.els.some(e=>e.id===m.v);
  if(m.kind==="style")return design.style===m.v;
  if(m.kind==="colour")return E.els.some(e=>e.colourId===m.v);
  return false;
}
function dzColourShare(E){
  let sw=0,c=0;for(const e of E.els){sw+=e.w+1e-6;if(e.colourId!=="black"&&e.colourId!=="grey")c+=e.w+1e-6;}
  return sw?c/sw:0;
}
/* how much a piece shows: the spot's visibility, less for a piece that is small next to the spot (a watch hides it) */
function dzShows(p,F){return(p.visibility||0)*lerp(FIT.smallShow,1,clamp((F?F.rel:1)/0.6,0,1));}
function dzFit(E,design,cl,p,F){
  const wants=cl.wants||{},ws=wants.styles||{},vals=Object.keys(ws).map(k=>ws[k]),mx=Math.max(0,...vals);
  const style=mx>0?FIT.styleFloor+(1-FIT.styleFloor)*clamp((ws[design.style]||0)/mx,0,1):FIT.noWants;
  const sr=wants.sizeMm||[0,1e9],sz=design.sizeMm;
  const size=sz<sr[0]?Math.pow(sz/sr[0],FIT.sizeUnder):sz>sr[1]?Math.pow(sr[1]/sz,FIT.sizeOver):1;
  const wt=wants.tags||[];

/* ===== sim/aging.js: the aging model: age(tattoo, years) -> {blur, fade, spread, readability} (PR 1) =====
   How a tattoo looks after N years on a real person. Every line slowly spreads as ink migrates under the skin, edges soften,
   and pigment fades, lights first. What speeds it up:
     - placement (PLACEMENT_WEAR: hands and feet shed skin and rub, so they spread and fade far faster than a back),
     - sun (the client's sun trait x the placement's sun; darker skin shields a little),
     - the colours (COLOUR_FADE: yellow and white go first, black last),
     - the session (depthQuality: too shallow falls out, too deep blows out; lineQuality: ragged edges start soft;
       saturation: badly packed colour starts faded). trauma feeds the heal grade in PR 5, not aging directly,
     - the heal (HEAL_GRADES: a patchy heal starts with spread already applied, a blowout with a big one),
     - the ink (INK_TIERS until sim/kit.js has INKS), and the style's ageFactor (a nudge for what the numbers miss).
   Thin lines don't get wider so much as spread to nothing: the same ink over a wider area reads paler (the dilution term),
   so a 1RL line fades much faster than a 14RL one. Packed solid fill does not dilute.
   readability is the design re-scored with the aged lines and faded ink (design.js dzReadability), so 9 mm script closes up
   within a few years while a bold 80 mm rose still reads at 20.
     tattoo = {design, out:{lineQuality, depthQuality, saturation, trauma} (default 0.75), heal: HEAL_GRADES id or null,
               ink: INK_TIERS / INKS id or null, skinTone, sun}

  pink:0.028,skyblue:0.028,yellow:0.034,white:0.05,_default:0.02};

  shoulder:{spread:1,fade:1},leg:{spread:1,fade:1},side:{spread:1,fade:0.95},chest:{spread:0.95,fade:0.95},back:{spread:0.9,fade:0.9}};

  soft:{name:"slightly soft",spread0:0.12,blur0:0.1,fade0:0.03,rate:1},
  patchy:{name:"patchy",spread0:0.3,blur0:0.15,fade0:0.15,rate:1.1},
  blownout:{name:"blown out",spread0:0.7,blur0:0.45,fade0:0.05,rate:1.2},

/* ===== sim/clients.js: client generation, the consult, memory and returns (PR 3) =====
   Everyone who sits in the chair is a persistent record (docs/SIM-CONTRACT.md "A client (full record)"). All of them are
   adults: makeClient draws an age from AGE_BANDS (18..75) and never anything younger. Mostograd is a port city, so most
   names are Russian with a sprinkling from the Caucasus, Tatarstan, the Baltic, West Africa and further off (NAMES).
     CLIENT_TRAITS      how each trait (0..1) is drawn; job and age nudge some of them
     NAMES              given names by pronoun set and surnames, in name groups with a broad skin-tone range
     JOBS               job titles (their words line up with design.js JOB_COVER), with an explicit cover need, sun
                        exposure and pay; client.cover copies the job's cover so scoring can switch to it later
     BRIEFS             ~50 opening briefs with {slots}, each with a theme, tags, styles, size and placements
     HIDDEN_WANTS       must-haves and dealbreakers a client keeps to themselves until asked, with the line that reveals them
     BAD_IDEAS          what an artist should talk a client out of (tiny script, a portrait on the hand, ...)
     CONSULT_QUESTIONS  what the artist can ask; each reveals one hidden thing with a chance scaled by the consult skill
     QUOTE              rate by stage, deposit, willingness to pay, the three quote options
     LOYALTY            how loyalty moves (scaled by the client's loyalty trait)
     REVIEWS            review text by heal grade x loyalty band
     RETURN_RULES       add-on, sleeve, cover-up of someone else's work, cover-up of your own early work, touch-up

/* ---- time ---- */
const WEEKS_PER_YEAR=52;
function weekIndex(w,y){return (y-2000)*WEEKS_PER_YEAR+(w-1);}
function weekFrom(i){i=Math.max(0,Math.floor(i));return{w:i%WEEKS_PER_YEAR+1,y:2000+Math.floor(i/WEEKS_PER_YEAR)};}
const clNow=S=>weekIndex(S.week,S.year);

const REVIEW_CHANCE={crisp:0.35,soft:0.2,patchy:0.3,blownout:0.55,infected:0.8};
const REVIEWS={
  crisp:{
    low:[[4,"Clean lines, healed well. Bit pricey."],[4,"Did a good job on my {label}. In and out."]],
    mid:[[5,"My {label} healed perfectly. Already planning the next one."],[5,"Calm, careful, and the lines are razor sharp. Recommend."]],
    high:[[5,"I'd trust this shop with my whole body. The {label} on my {place} is the best thing I own."],[5,"Third visit, still the best in Mostograd. The heal is flawless."]]},
  soft:{
    low:[[3,"It's fine. Softer than I expected once it healed."],[3,"OK work. A couple of lines went a bit fuzzy."]],
    mid:[[4,"Healed a little soft in places but I love it."],[4,"Lovely to work with. The {label} settled in nicely."]],
    high:[[5,"A line or two healed soft and they're already booking me a free touch-up. That's why I come back."],[4,"Not perfect, but it's mine and I'd come back tomorrow."]]},
  patchy:{
    low:[[2,"Healed patchy. Disappointed."],[2,"Paid full price for a {label} that looks half done."]],
    mid:[[3,"The heal came out patchy, but they offered to fix it. We'll see."],[3,"Nice design. The colour didn't stay everywhere."]],
    high:[[4,"Patchy heal, partly my fault, I went to the banya. They're fixing it."],[4,"Some spots fell out. Still coming back. Good people."]]},
  blownout:{
    low:[[1,"The lines blew out and my {label} looks like it's bleeding through paper. Avoid."],[1,"Lines spread everywhere. Never again."]],
    mid:[[2,"Some lines blew out. They were honest about it, at least."],[2,"Blurry in places after it healed. Talked to them about a fix."]],
    high:[[3,"A few lines blew out. It happens. They're making it right and I trust them."],[3,"Rough heal, but I've had six good ones here."]]},
  infected:{
    low:[[1,"Got infected. Doctor, antibiotics, the lot. Stay away."],[1,"Infection. That's all I'll say."]],
    mid:[[2,"It got infected, and they handled it well, but still."],[2,"Infection after two weeks. They fixed it for free."]],
    high:[[3,"It got infected, I'll admit I skipped the cream. They looked after me. Still my shop."],[3,"Bad week with an infection. The apology was real. I'll be back."]]}
};
/* pieces a client got somewhere else (for cover-ups of someone else's work) */
const FOREIGN_PIECES=[
  {label:"faded name",tags:["script"],where:"at a place by the station"},
  {label:"barbed-wire band",tags:["band"],where:"at a booth on the outer ring",from:2000},
  {label:"blurry star",tags:["star"],where:"from a friend with a sewing needle"},
  {label:"wobbly heart with initials",tags:["love"],where:"on holiday down south"},
  {label:"blown-out swallow",tags:["bird"],where:"at a shop that closed years ago"},
  {label:"green-grey anchor",tags:["nautical"],where:"from a man on a ship who swore he knew what he was doing"},
  {label:"cartoon dolphin",tags:["ocean"],where:"on a dare after a wedding"}
];
/* returns. after = [from, to] weeks since the piece (or since the last visit for "other"); p = chance over that window
   at loyalty 0 .. 1 (spread evenly as a weekly chance); needs = what the piece must be; brief = client lines with
   {label} {place} {year} {foreign} {where}. reckoning: PR 8 may turn this return into a scripted beat (SIM.onReturn) */
const RETURN_RULES=[
  {id:"touchup",after:[6,60],p:[0.04,0.18],needs:{},size:"tiny",ask:"same",
    brief:["The {label} on my {place} from {year} has a couple of light spots. Can I come in for a touch-up?",
      "Hi, it's me again. You did the {label} on my {place} in {year}. One line healed thin. Could you have a look?"]},
  {id:"addon",after:[20,200],p:[0.05,0.4],needs:{},size:"small",ask:"near",
    brief:["I keep looking at the {label} you did on my {place} in {year}. I want something next to it. It looks lonely.",
      "Remember the {label} on my {place}? {year}. I want to add to it. Same hand, same feel."]},
  {id:"sleeve",after:[40,520],p:[0.02,0.25],needs:{region:["arm","leg"]},size:"huge",ask:"grow",
    brief:["You did the {label} on my {place} in {year}. I want a full sleeve now, built around it. Don't touch it, it's my favourite.",
      "It's time. The {label} from {year} on my {place} needs company. Let's do the whole limb, and keep that one in the middle."]},
  {id:"cover_own",after:[260,1040],p:[0.01,0.08],needs:{early:3},size:"medium",ask:"cover",reckoning:true,
    brief:["The {label} you did on my {place} back in {year}... it's gone soft. Can you cover it, or rework it?",
      "I still like you, I promise. But the {label} on my {place} from {year} has seen better days. Can we fix it?"]},
  {id:"cover_other",after:[26,400],p:[0.01,0.1],needs:{},size:"medium",ask:"cover",foreign:true,
    brief:["I had a {foreign} done on my {place} {where} in {year}. You've done my other work. Can you cover it?",
      "Confession: there's a {foreign} on my {place}, from {year}, {where}. I want you to make it disappear."]}
];
/* word of mouth: a piece that healed REFERRAL.after weeks ago may send a friend (chance by loyalty) */
const REFERRAL={after:4,chance:[0.02,0.3],
  lines:["{name} sent me. {Pr} won't stop showing everyone {pos} {label}.","My friend {name} said you're the only one in Mostograd worth the wait.",
    "{name} told me to ask for you specifically.","I saw {name}'s {label} at a birthday and I had to know who did it."]};

/* ===== generation ===== */
function clPick(r,list){return list[Math.floor(r()*list.length)];}
function clTrait(r,k,shift){const t=CLIENT_TRAITS[k];return clamp(r.normal(t.mean+(shift||0),t.sd),CLIENT_TRAITS.lo,CLIENT_TRAITS.hi);}
const clR2=v=>Math.round(v*100)/100;
/* an adult age from AGE_BANDS, inside [lo, hi] when a brief asks for it (never under 18) */
function clAge(r,range){
  const lo=Math.max(18,range?range[0]:18),hi=Math.min(75,range?range[1]:75);
  const bands=AGE_BANDS.map(b=>[Math.max(b[0],lo),Math.min(b[1],hi),b[2]*Math.max(0,Math.min(b[1],hi)-Math.max(b[0],lo)+1)/(b[1]-b[0]+1)]).filter(b=>b[2]>0);
  const b=bands.length?r.weighted(bands,x=>x[2]):[lo,Math.max(lo,hi)];
  return Math.max(18,r.int(b[0],b[1]));
}
function clName(r,pronouns){
  const g=r.weighted(NAMES.groups,x=>x.w),src=g.from?NAMES.groups.find(x=>x.id===g.from):g;
  let first;
  if(pronouns==="they/them")first=clPick(r,(src.they&&src.they.length?src.they:NAMES.neutral));
  else first=clPick(r,pronouns==="he/him"?src.he:src.she);
  let sur=g.surnames,last;
  if(pronouns==="they/them"){const ind=sur.filter(s=>typeof s==="string");last=ind.length?clPick(r,ind):clPick(r,sur)[0];}
  else{const s=clPick(r,sur);last=typeof s==="string"?s:s[pronouns==="he/him"?0:1];}
  let patronymic=null;
  if(g.patronymic&&pronouns!=="they/them"){const p=clPick(r,NAMES.patronymics);patronymic=p[pronouns==="he/him"?0:1];}
  return{first,last,patronymic,group:g.id,tone:g.tone};
}
function clJob(r,age,year,want){
  if(want){const names=Array.isArray(want)?want:[want],js=JOBS.filter(j=>names.indexOf(j.name)>=0);if(js.length)return clPick(r,js);}
  const ok=JOBS.filter(j=>{const a=j.ages||JOB_AGES;return(!j.from||year>=j.from)&&(!j.to||year<=j.to)&&age>=a[0]&&age<=a[1];});
  return r.weighted(ok.length?ok:JOBS,j=>j.w);
}
/* a placement id from a brief's place entry ("forearm" -> forearm_l / forearm_r) */
function clPlace(r,base){const P=SIM.PLACEMENTS||{};if(P[base])return base;const s=r.chance(0.5)?"_l":"_r";return P[base+s]?base+s:(P[base+"_l"]?base+"_l":"forearm_r");}
/* how a client says a placement after "my" (and how a piece name says it after "Darya's") */
const PLACE_WORDS={neck_l:"neck, left side",neck_r:"neck, right side",chest_l:"chest, left side",chest_r:"chest, right side"};
function clPlaceName(id){if(PLACE_WORDS[id])return PLACE_WORDS[id];const p=(SIM.PLACEMENTS||{})[id];return p?p.name:"arm";}
function clSlotFill(text,ctx){
  return text.replace(/\{(\w+)\}/g,(m,k)=>{
    if(ctx[k]!=null)return String(ctx[k]);
    const lk=k.charAt(0).toLowerCase()+k.slice(1);
    if(ctx[lk]!=null){const v=String(ctx[lk]);return v.charAt(0).toUpperCase()+v.slice(1);}
    return m;});
}
/* style demand this year (STYLES[*].demandCurve, piecewise linear) */
function styleDemand(styleId,year){
  const tm=typeof SIM.trendMult==="function"?SIM.trendMult(styleId,year):1;   // PR 8's trend wave, when it exists
  const st=(SIM.STYLES||{})[styleId],c=st&&st.demandCurve;if(!c||!c.length)return tm;
  if(year<=c[0][0])return c[0][1]*tm;
  for(let i=1;i<c.length;i++)if(year<=c[i][0]){const a=c[i-1],b=c[i];return lerp(a[1],b[1],(year-a[0])/((b[0]-a[0])||1))*tm;}
  return c[c.length-1][1]*tm;
}
/* the brief and its style: weighted by the demand for the brief's styles, the segment boosts and the size the stage allows */
function clChooseBrief(r,opts){
  const year=opts.year,boost=opts.segBoost||{},sizes=opts.sizes||null;
  const segW=list=>{let m=1;for(const s of list||[])m+=boost[s]||0;return m;};
  const ok=BRIEFS.filter(b=>(!b.from||year>=b.from)&&(!b.to||year<=b.to)&&(!sizes||sizes.indexOf(b.size)>=0)&&(!opts.theme||b.theme===opts.theme)&&(!opts.style||b.styles.indexOf(opts.style)>=0));
  const pool=ok.length?ok:BRIEFS;
  const b=r.weighted(pool,x=>{let d=0;for(const s of x.styles)d+=styleDemand(s,year);return d/x.styles.length*segW(x.seg)*(x.w||1);});
  const style=opts.style&&b.styles.indexOf(opts.style)>=0?opts.style:r.weighted(b.styles,s=>styleDemand(s,year)*segW(((SIM.STYLES||{})[s]||{}).clientSegments)*(s===b.styles[0]?1.3:1));
  return{b,style};
}
/* id: the next free "c<n>" given S (scans S.clients, the newcomers waiting in the queue, and `taken`) */
function clNextId(S,taken){
  let mx=0;
  const see=id=>{const m=/^c(\d+)$/.exec(id||"");if(m)mx=Math.max(mx,+m[1]);};
  for(const c of S.clients||[])see(c.id);
  for(const q of S.queue||[])if(q.newClient)see(q.newClient.id);
  if(taken)for(const id of taken)see(id);
  return "c"+(mx+1);
}

/* makeClient(r, opts): opts = {id, year, week, stage, segBoost:{segment:+weight}, sizes:[SIZE_CLASSES ids],
   theme, style, briefId, referredBy: client, src:"walkin"|"referral"|"return"|"test", badIdea: true|false|undefined} */
function makeClient(r,opts){
  opts=opts||{};
  const year=opts.year||2000,week=opts.week||1;
  const pronouns=r.weighted(PRONOUNS,x=>x[1])[0];
  /* the brief first: it can ask for an age range and a job */
  const pick=opts.briefId?{b:BRIEFS.find(x=>x.id===opts.briefId)||BRIEFS[0],style:null}:clChooseBrief(r,{year,segBoost:opts.segBoost,sizes:opts.sizes,theme:opts.theme,style:opts.style});
  const B=pick.b,style=pick.style||opts.style||B.styles[0];
  const age=clAge(r,B.ages);
  const nm=clName(r,pronouns);
  const job=clJob(r,age,year,B.job);
  const bodyShape=(()=>{const m=BODY_BY_PRONOUN[pronouns];return r.weighted(Object.keys(m),k=>m[k]);})();
  const skinTone=clR2(r.range(nm.tone[0],nm.tone[1]));
  const T=CLIENT_TRAITS;
  const traits={
    pain:clR2(clTrait(r,"pain")),
    sun:clR2(clamp(lerp(clTrait(r,"sun"),job.sun,T.sun.job),T.lo,T.hi)),
    aftercare:clR2(clTrait(r,"aftercare",T.aftercare.age*(age-30))),
    budget:clR2(clamp(lerp(clTrait(r,"budget"),job.pay,T.budget.job),T.lo,T.hi)),
    loyalty:clR2(clTrait(r,"loyalty",T.loyalty.age*(age-30))),
    talkative:clR2(clTrait(r,"talkative")),
    trusting:clR2(clTrait(r,"trusting"))
  };
  /* where and how big */
  const placement=clPlace(r,clPick(r,B.place));
  const sz=SIZE_CLASSES[B.size]||SIZE_CLASSES.small;
  const ask={placement,sizeMm:r.int(sz[0],sz[1]),style,tags:B.tags.slice(),theme:B.theme,size:B.size,bad:null};
  /* one in BAD_IDEA_CHANCE walk-ins (and some briefs on their own) arrive with something to talk them out of. The bad
     idea is applied before the brief is written, so {place} names where they now want it */
  const cover=job.cover,proto={traits,cover,job:job.name};
  let badAdd="";
  if(opts.badIdea===true||(opts.badIdea!==false&&r.chance(BAD_IDEA_CHANCE))){
    const cands=BAD_IDEAS.filter(b=>b.fits(B)&&(b.id!=="cover_job"||cover>=0.6)&&(b.id!=="ribs_low_pain"||traits.pain<0.3));
    if(cands.length){const bi=clPick(r,cands);bi.make(ask,r);badAdd=/\{place\}/i.test(B.text)&&bi.addPlaced!=null?bi.addPlaced:bi.add;}
  }
  const ctx={};
  const person=clPick(r,BRIEF_SLOTS.person);ctx.person=person.t;
  const pw=PRONOUN_WORDS[person.p==="he"?"he/him":person.p==="they"?"they/them":"she/her"];
  ctx.pr=pw.pr;ctx.pos=pw.pos;
  for(const k of ["loved","habit","flower","petName","workplace","partner"]){
    if(B.text.indexOf("{"+k)<0)continue;const v=clPick(r,BRIEF_SLOTS[k]);ctx[k]=v.t;if(v.tags)for(const t of v.tags)if(ask.tags.indexOf(t)<0)ask.tags.push(t);}
  ctx.place=clPlaceName(ask.placement);
  ctx.pastYear=String(Math.min(year-1,Math.max(year-age+18,year-r.int(1,8))));   // a year they were already an adult
  ctx.mm=ask.sizeMm;ctx.placename=ctx.place;
  let brief=clSlotFill(B.text+badAdd,ctx);
  for(const bi of BAD_IDEAS)if(bi.test(ask,proto,(SIM.PLACEMENTS||{})[ask.placement])){ask.bad=bi.id;break;}
  /* wants */
  const styles={};styles[style]=1;
  const st=(SIM.STYLES||{})[style],blends=(st&&st.blendsWith)||[];
  const nSec=r.int(1,2);for(let i=0;i<nSec&&blends.length;i++){const s=clPick(r,blends);if(!styles[s])styles[s]=clR2(r.range(0.35,0.75));}
  const wsz=[Math.max(8,Math.round(sz[0]*r.range(0.7,0.95))),Math.round(sz[1]*r.range(1.05,1.5))];
  const colour=clR2(clamp((STYLE_COLOUR[style]!=null?STYLE_COLOUR[style]:0.4)+r.normal(0,0.15),0,1));
  const wants={styles,tags:ask.tags.slice(0,4),sizeMm:wsz,colour};
  /* must-haves and dealbreakers: stated in the brief (known) and hidden */
  const mustHaves=[],dealbreakers=[];
  const known={styles:[style],tags:true,size:false,colour:false,pain:false,sun:false,cover:false,budget:false,aftercare:false,
    mustHaves:[],dealbreakers:[],mustAll:false,dealAll:false};
  const sameKV=(a,b)=>a.kind===b.kind&&a.v===b.v;
  for(const m of (B.known&&B.known.must)||[]){mustHaves.push({kind:m.kind,v:m.v});known.mustHaves.push({kind:m.kind,v:m.v});}
  for(const d of (B.known&&B.known.deal)||[]){dealbreakers.push({kind:d.kind,v:d.v});known.dealbreakers.push({kind:d.kind,v:d.v});}
  if(r.chance(HIDDEN_WANTS.mustChance)){
    const pal=(st&&st.palette)||[];
    const pool=HIDDEN_WANTS.must.filter(m=>m.themes.indexOf(B.theme)>=0&&!mustHaves.some(x=>sameKV(x,m))&&!dealbreakers.some(x=>sameKV(x,m))&&
      (m.kind!=="style"||B.styles.indexOf(m.v)>=0)&&(m.kind!=="colour"||pal.indexOf(m.v)>=0));
    if(pool.length){const m=clPick(r,pool);mustHaves.push({kind:m.kind,v:m.v});}
  }
  if(r.chance(HIDDEN_WANTS.dealChance)){
    const pool=HIDDEN_WANTS.deal.filter(d=>!dealbreakers.some(x=>sameKV(x,d))&&!(d.kind==="style"&&styles[d.v])&&!(d.kind==="tag"&&ask.tags.indexOf(d.v)>=0)&&!mustHaves.some(x=>x.kind===d.kind&&x.v===d.v));
    if(pool.length){const d=clPick(r,pool);dealbreakers.push({kind:d.kind,v:d.v});}
  }
  if(/small|tiny/i.test(brief))known.size=true;
  const rb=opts.referredBy||null;
  if(rb){
    const rp=PRONOUN_WORDS[rb.pronouns]||PRONOUN_WORDS["they/them"];
    const lp=opts.referrerLabel||"tattoo";
    brief=clSlotFill(clPick(r,REFERRAL.lines),{name:rb.first||rb.name,pr:rp.pr,pos:rp.pos,label:lp})+" "+brief;
  }
  const loyaltyStart=clR2(LOYALTY.start+LOYALTY.startTrait*traits.loyalty+(rb?LOYALTY.referral:0));
  return{
    id:opts.id||"c1",name:nm.first+" "+nm.last,first:nm.first,surname:nm.last,patronymic:nm.patronymic,
    addr:age>=FORMAL_AGE&&nm.patronymic?nm.first+" "+nm.patronymic:nm.first,
    pronouns,age,born:year-age,bodyShape,skinTone,job:job.name,cover:job.cover,
    traits,wants,mustHaves,dealbreakers,known,
    brief,ask,theme:B.theme,briefId:B.id,firstTattoo:!!B.first,
    loyalty:loyaltyStart,referredBy:rb?rb.id:null,src:opts.src||"walkin",
    since:{w:week,y:year},lastSeen:{w:week,y:year},visits:0,pieces:[],history:[]
  };
}
const clientAge=(c,year)=>c.born!=null?year-c.born:c.age;

/* ===== memory ===== */
function clientLog(client,entry){if(!client.history)client.history=[];client.history.push(entry);if(entry.w&&entry.y)client.lastSeen={w:entry.w,y:entry.y};return entry;}
function loyaltyBump(client,kind,scale){
  const d=(typeof kind==="number"?kind:LOYALTY[kind]||0)*(scale==null?1:scale);
  const t=(client.traits&&client.traits.loyalty!=null)?client.traits.loyalty:0.5;
  const m=d>0?lerp(LOYALTY.gainLo,LOYALTY.gainHi,t):1;
  client.loyalty=clR2(clamp((client.loyalty||0)+d*m,0,1));
  return client.loyalty;
}
const clBand=l=>l<REVIEW_BANDS[0]?"low":l<REVIEW_BANDS[1]?"mid":"high";
/* writeReview(client, piece, r) -> {stars, text} or null (most people don't write one). Logs it. */
function writeReview(client,piece,r,force){
  const g=piece.heal&&REVIEWS[piece.heal]?piece.heal:"soft";
  if(!force&&!r.chance(REVIEW_CHANCE[g]||0.2))return null;
  const row=clPick(r,REVIEWS[g][clBand(client.loyalty||0)]);
  const text=clSlotFill(row[1],{label:piece.label||"tattoo",place:clPlaceName(piece.design&&piece.design.placement)});
  return clientLog(client,{w:piece.healW||piece.w,y:piece.healY||piece.y,kind:"review",piece:piece.id,stars:row[0],text});
}
/* findClient(S, id): a Map index cached per clients array, rebuilt when the array grows or an entry is replaced */
const clIdxCache=new WeakMap();
function findClient(S,id){
  const arr=S.clients||[];let e=clIdxCache.get(arr);
  const hit=e&&e.n===arr.length?e.m.get(id):null;
  if(hit&&arr[hit.i]===hit.c)return hit.c;
  e={n:arr.length,m:new Map()};arr.forEach((c,i)=>e.m.set(c.id,{c,i}));clIdxCache.set(arr,e);
  const h=e.m.get(id);return h?h.c:null;
}

/* ===== pieces ===== */
/* the label a piece is known by: its biggest motif ("rose"); lettering reads as the word ("Hope" script) */
function pieceLabel(design){
  let best=null,bs=-1;
  for(const e of (design&&design.elements)||[]){
    const el=SIM.elementById?SIM.elementById(e.id):null;if(!el)continue;
    const w=(e.scale||0.5)*(el.family==="fill"||el.family==="texture"||el.family==="frame"?0.3:1);
    if(w>bs){bs=w;best=el;}
  }
  if(!best)return "tattoo";
  const m=/^Script: (.+)$/.exec(best.name);if(m)return "\""+m[1]+"\" script";
  return best.name.charAt(0).toLowerCase()+best.name.slice(1);
}
function pieceName(label,client,placement){return "the "+label+" on "+((client&&client.first)||"a client")+"'s "+clPlaceName(placement);}
/* addPiece(S, {client, design, out, heal, price, item}) -> piece. Pieces are never dropped (ids p1, p2, ...). */
function addPiece(S,o){
  const c=typeof o.client==="object"?o.client:findClient(S,o.client);
  const design=o.design||{};
  const label=pieceLabel(design);
  const piece={id:"p"+(S.pieces.length+1),client:c?c.id:o.client,design,out:o.out||null,heal:o.heal||null,w:S.week,y:S.year,
    name:pieceName(label,c,design.placement),label,stage:(S.studio&&S.studio.stage)||"apprentice",price:o.price||0};
  if(o.ret)piece.ret=o.ret;
  S.pieces.push(piece);
  if(c){
    if(!c.pieces)c.pieces=[];c.pieces.push(piece.id);c.visits=(c.visits||0)+1;
    clientLog(c,{w:S.week,y:S.year,kind:"piece",piece:piece.id,name:piece.name});
    loyaltyBump(c,"piece");
  }
  return piece;
}

/* ===== the consult =====
   consult = {client, step, max, stage:"talk"|"quote"|"done", transcript:[{who:"client"|"artist"|"note", text}],
     known (a copy of client.known that grows), ask (a copy that the talk-out may change), asked:[question ids], mood,
     bad: BAD_IDEAS id or null, talk: null|"won"|"lost"|"insisted", quote: null|{...}, outcome: null|"accepted"|"walked"|"declined",
     skill, year, week, rate, wait, src, item } */
function clCopy(o){return JSON.parse(JSON.stringify(o));}
function clRate(S){
  if(S.rate>0)return S.rate;
  const st=(S.studio&&S.studio.stage)||"apprentice";
  return RATE_DEFAULT.rate*(QUOTE.stageRate[st]||1)*SIM.priceIndex(S.year);
}
/* a one-element stand-in for the ask, so scoreDesign can estimate hours and sessions before the board exists */
function clProxyDesign(ask){
  const E=SIM.ELEMENTS||[];
  let best=null,bs=-1;
  for(const e of E){
    if(e.family==="fill"||e.family==="texture"||e.family==="frame")continue;

/* bookings: walk-ins, returns, referrals, then fill the week's chair hours */
function calBookings(S,ctx){

  const due=S.queue.filter(q=>q.kind==="session"&&weekIndex(q.w,q.y)<=now).sort((a,b)=>weekIndex(a.w,a.y)-weekIndex(b.w,b.y)||(a.sessionNo>b.sessionNo?-1:1));

/* ===== sim/kit.js: the kit: MACHINES, NEEDLES, INKS, voltage (PR 4) ===== */
/* ===== sim/market.js: walk-in generation and PRICE_INDEX by year (PR 3). Last sim file: it closes the INK_SIM IIFE. ===== */
/* PRICE_INDEX: what a ruble buys, by year (2000 = 1.0). A ruble-like curve: 10-14%/yr inflation in the early 2000s, a
   2008-09 and a 2015 jump, easing to about 4-7%/yr later (about x4 by the mid-2010s, x8.7 by 2030). Rates, rent and

  seg:{walkins:{walk_in:1,first_timer:0.8,students:0.4,trades:0.3},       // segments each reputation track pulls in

<script>
/* ===================== Ink: app =====================
   The app script is one top-level script spread over src/app/ (state.js opens it, help.js closes it; html/tail.html then
   calls start()). It glues INK_SIM (numbers) and INK_VIS (pictures) to the page.
   state.js: VERSION, small helpers ($, esc, fmtMoney, toast), the state object S, save / load / snapshot / hydrate,
   the three save slots and the theme. S is defined ONCE, in freshState() below; later PRs add fields there (and to the
   S map in src/README.md), never inline. localStorage keys: ink-save, ink-slot1 .. ink-slot3 (all inside try/catch). */
const VERSION="0.1.1.0";
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* money display: rubles, matching Lombard (plan Q15). Only this table changes the symbol */
const MONEY={sym:"₽",before:false};
const fmtMoney=n=>{const s=Math.round(Math.abs(n)).toLocaleString("en-CA");return(n<0?"-":"")+(MONEY.before?MONEY.sym+s:s+" "+MONEY.sym);};

/* ---- the state object ---- */
const SAVE_KEY="ink-save",SLOTS=3,slotKey=i=>"ink-slot"+i;
const SAVE_V=1;   // bump when a save needs migrating in hydrate()
function freshState(){return{
  v:SAVE_V,
  week:1,            // 1..52 within the year
  year:2000,         // 2000..2030
  cash:0,
  rate:0,            // your hourly rate (PR 7: RATE_BY_REP x PRICE_INDEX); 0 while an apprentice
  rep:{walkins:0,collectors:0,peers:0},   // the three reputation tracks (REP_TRACKS, PR 5)
  skills:{styles:{},consult:0,linework:0,shading:0,colour:0,speed:0},   // levels 0..10; styles keyed by STYLES id (SKILLS, PR 7)
  kit:{},            // machine, needles, inks, voltage (PR 4)
  clients:[],        // client records (PR 3); full for the CLIENT_CAP most recent/loyal, compacted after (PR 7)
  pieces:[],         // every tattoo: design parameters + session outputs + date, never pictures (PR 4, PR 5)
  queue:[],          // booked sessions, including later sessions of multi-session pieces (PR 3, PR 4)
  studio:{stage:"apprentice",staff:[]},   // apprentice | chair | studio | legacy (PR 7)
  goals:{},          // GOALS done, id -> {w,y} (PR 8)
  seed:(Date.now()>>>0)%2147483647||1,   // the career's rng seed (INK_SIM.rng); the only Date-based value in the game
  settings:{theme:"dark",gfx:null,gfxAuto:true,sound:true,reduced:false},
  bkAt:0             // when the last backup code or file was made (app/savecode.js)
};}
let S=freshState();

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot()));if(typeof buPersist==="function")buPersist();}catch(e){}}
function snapshot(){return JSON.parse(JSON.stringify(S));}
/* load a saved object into S on top of a fresh state, so a field added since that save gets its default. false if it
   isn't an Ink save. */
function hydrate(o){
  if(!o||typeof o!=="object"||Array.isArray(o))return false;
  if(o.settings!=null&&(typeof o.settings!=="object"||Array.isArray(o.settings)))return false;
  const f=freshState();
  S=Object.assign(f,o,{settings:Object.assign(f.settings,o.settings||{})});
  S.v=SAVE_V;
  return true;}
function loadSaved(){try{const j=localStorage.getItem(SAVE_KEY);if(j&&hydrate(JSON.parse(j)))return true;}catch(e){}S=freshState();return false;}
/* a restored or slot-loaded game takes over the running one */
function applyLoaded(o,msg){if(!hydrate(o)){toast("That save couldn't be loaded");return;}save();applySettings();renderAll();toast(msg||"Loaded");}

/* ---- theme and settings ---- */
function applyTheme(){const t=S.settings.theme||"dark";const eff=t==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):t;
  document.documentElement.setAttribute("data-theme",eff);
  const m=document.querySelector("meta[name=theme-color]");if(m)m.setAttribute("content",eff==="light"?"#f4efe6":"#17130f");}
function applySettings(){applyTheme();document.documentElement.classList.toggle("noanim",!!S.settings.reduced);INK_SOUND.setOn(S.settings.sound!==false);applyGfx();}

/* ---- toast ---- */
function toast(msg){const t=$("toast");if(!t)return;t.textContent=msg;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600);}
/* ===================== app/perf.js: graphics tiers and auto-adjust =====================
   Three tiers: lite (phone default), full, ultra. S.settings.gfx is the player's pick (null = automatic: lite on phones,
   full elsewhere). Auto-adjust (S.settings.gfxAuto, on unless false), lifted from Prairie Engine Works: while INK_VIS runs
   a frame loop, watch its fps; if it stays under ~27 fps for ~8 s, step ONE tier down (ultra > full > lite) and say so.
   It never steps up, and a manual pick after an auto-drop is respected for the session. A still scene reports no fps,
   so nothing happens while the studio is idle. */
const PERF={T:["lite","full","ultra"],LOW:27,NEED:8000,SETTLE:6000,HOLD:3000,boot:performance.now(),f:null,fAt:0,sAt:0,low:0,tier:null,tab:null,holdTo:0,dropped:false,manual:false,force:null};
function perfTier(){return S.settings.gfx||(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)?"lite":"full");}
function applyGfx(){if(typeof INK_VIS!=="undefined"&&INK_VIS.ready())INK_VIS.setTier(perfTier());}
function perfReset(hold){PERF.low=0;PERF.sAt=0;if(hold)PERF.holdTo=performance.now()+PERF.HOLD;}
function perfPoll(){
  if(!S||typeof INK_VIS==="undefined"||!INK_VIS.ready())return;
  const now=performance.now();
  if(S.settings.gfxAuto===false||(PERF.dropped&&PERF.manual)||document.hidden||now-PERF.boot<PERF.SETTLE){perfReset(true);return;}
  if(navigator.webdriver&&PERF.force==null)return;
  const tier=perfTier();if(tier!==PERF.tier){PERF.tier=tier;perfReset(true);}
  if(curTab!==PERF.tab){PERF.tab=curTab;perfReset(true);}
  if(now<PERF.holdTo)return;
  const f=INK_VIS.fps();let fps;
  if(PERF.force!=null){fps=PERF.force;if(!PERF.sAt){PERF.sAt=now;return;}}
  else if(f!=null&&f!==PERF.f){PERF.f=f;PERF.fAt=now;fps=f;if(!PERF.sAt){PERF.sAt=now;return;}}
  else{if(now-PERF.fAt>1500)perfReset(false);return;}   // nothing drawn lately: start over
  const el=Math.min(now-PERF.sAt,1000);PERF.sAt=now;
  if(fps>0&&fps<PERF.LOW)PERF.low+=el;else PERF.low=Math.max(0,PERF.low-2*el);
  if(PERF.low<PERF.NEED)return;
  PERF.low=0;const i=PERF.T.indexOf(tier);if(i<1)return;
  const n=PERF.T[i-1];PERF.dropped=true;S.settings.gfx=n;applyGfx();save();perfReset(true);
  toast(`Graphics lowered to ${n[0].toUpperCase()+n.slice(1)} to keep things smooth. Change it in Settings.`);}
setInterval(perfPoll,500);
/* ===================== app/savecode.js: SAVE CODES (Back up / Restore) =====================
   Lifted from Prairie Engine Works' savecode.js. One code holds everything Ink keeps in the browser, so a player can move
   to another phone or keep a copy somewhere safe. All of it lives in localStorage on this device; nothing is sent anywhere.
     save    the current game ("ink-save"), taken live with snapshot(). Settings ride in it.
     slots   the 3 manual slots ("ink-slot1" .. "ink-slot3"), null for an empty one
   Code = "INK1:" + body + a 6-character checksum. body = that object as JSON -> UTF-8 bytes -> LZW (9..16-bit codes) ->
   base64url (A-Z a-z 0-9 - _ only), so it survives notes apps, email and chat.
   Tattoos are saved as design parameters + session outputs + dates, never as pictures; everything visual is re-rendered.
   Restore checks everything before it writes anything: checksum, unpack, JSON, the shape of every save and a trial
   hydrate() of each. Then buWrite() writes all four keys and puts the old values back if any write fails.
   A NEW localStorage key must be added to buMake and buWrite (and check-savecode.js), and asked about first.
   The next version of this format is INK2:. Tests: `node check-savecode.js` in the repo root. */
const BU_V=1,BU_PREFIX="INK"+BU_V+":";
const BU_B64="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_",BU_MAXCODES=65536;
const BU_MSG={
  empty:"Paste a backup code into the box first.",
  damaged:"That code is damaged or cut off. Copy the whole code again, from INK1: right to the end, and paste it here.",
  newer:"That code was made by a newer version of the game. Reload the page to update, then try again.",
  other:"That's a save code from a different game. Ink backup codes start with \"INK1:\".",
  notcode:"That doesn't look like a save code. Backup codes start with \"INK1:\".",
  bad:"That code opened, but the save inside doesn't look right, so nothing was changed.",
  store:"This browser wouldn't let the game save (storage may be full or blocked), so nothing was changed."
};
const buFail=k=>{const e=new Error(BU_MSG[k]);e.bu=k;return e;};   // an error with a message that's fine to show the player

/* ---- packing: bytes <-> base64url text ---- */
function buBits(n){let b=1;while(n>=2){n>>>=1;b++;}return b;}   // how many bits it takes to write n
/* LZW over bytes. Bits go MSB-first into 6-bit base64url characters and the tail is zero-padded. A code's width is the
   bit length of the largest code the reader could see next, so both sides always agree on it. */
function buZip(bytes){
  const out=[];let acc=0,nacc=0;
  const put=(v,w)=>{for(let i=w-1;i>=0;i--){acc=acc<<1|(v>>>i&1);if(++nacc===6){out.push(BU_B64[acc]);acc=0;nacc=0;}}};
  if(!bytes.length)return"";
  const dict=new Map();let next=256,cur=bytes[0];
  for(let i=1;i<bytes.length;i++){
    const key=cur*256+bytes[i],hit=dict.get(key);
    if(hit!==undefined){cur=hit;continue;}
    put(cur,buBits(next-1));
    if(next<BU_MAXCODES)dict.set(key,next++);
    cur=bytes[i];}
  put(cur,buBits(next-1));
  if(nacc)out.push(BU_B64[acc<<(6-nacc)]);
  return out.join("");}
function buUnzip(str){
  let pos=0;const total=str.length*6,out=[];
  const read=w=>{let v=0;for(let i=0;i<w;i++,pos++){const d=BU_B64.indexOf(str[pos/6|0]);if(d<0)throw buFail("damaged");v=v*2+(d>>(5-pos%6)&1);}return v;};
  if(total<8)return out;
  const prefix=[],suffix=[],first=[];for(let i=0;i<256;i++){prefix.push(-1);suffix.push(i);first.push(i);}
  let size=256;
  const emit=code=>{const at=out.length;while(code>=0){out.push(suffix[code]);code=prefix[code];}   // the bytes come out backwards
    for(let a=at,b=out.length-1;a<b;a++,b--){const t=out[a];out[a]=out[b];out[b]=t;}};
  let prev=read(8);emit(prev);
  for(;;){
    const w=buBits(Math.min(size,BU_MAXCODES-1));
    if(total-pos<w)break;   // what's left is padding
    const code=read(w);let fb;
    if(code<size)fb=first[code];
    else if(code===size)fb=first[prev];   // the code being defined right now (the classic LZW "KwKwK" case)
    else throw buFail("damaged");
    if(size<BU_MAXCODES){prefix.push(prev);suffix.push(fb);first.push(first[prev]);size++;}
    emit(code);prev=code;}
  return out;}
/* FNV-1a of the body, as 6 base64url characters: a missing, extra or changed character almost surely won't match */
function buSum(body){let h=2166136261;for(let i=0;i<body.length;i++){h^=body.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  let s="";for(let i=0;i<6;i++){s+=BU_B64[h&63];h=Math.floor(h/64);}return s;}

/* ---- making a code ---- */
function buStored(k){try{const j=localStorage.getItem(k);if(!j)return null;const o=JSON.parse(j);return o&&typeof o==="object"&&!Array.isArray(o)?o:null;}catch(e){return null;}}
function buMake(){const slots=[];for(let i=1;i<=SLOTS;i++)slots.push(buStored(slotKey(i)));
  return{v:BU_V,at:Date.now(),ver:VERSION,save:snapshot(),slots};}
function buCode(d){const body=buZip(new TextEncoder().encode(JSON.stringify(d||buMake())));return BU_PREFIX+body+buSum(body);}

/* ---- checking a save before anything is written ---- */
const buObj=o=>!!o&&typeof o==="object"&&!Array.isArray(o);
const buNum=v=>typeof v==="number"&&isFinite(v);
/* the shape of an Ink save. Fields later PRs add are checked here when they arrive */
function buSaveOk(o){
  if(!buObj(o))return false;
  if("settings" in o&&!buObj(o.settings))return false;
  for(const k of ["week","year","cash","seed"])if(k in o&&!buNum(o[k]))return false;
  for(const k of ["clients","pieces","queue"])if(k in o&&!Array.isArray(o[k]))return false;
  return buTry(o);}
/* load a copy the way the game would (hydrate), then put the running game back exactly as it was */
function buTry(o){const keepS=S;let ok=false;
  try{ok=hydrate(JSON.parse(JSON.stringify(o)))===true;}catch(e){ok=false;}
  finally{S=keepS;}
  return ok;}
function buFullOk(d){return buObj(d)&&d.v===BU_V&&buSaveOk(d.save)&&Array.isArray(d.slots)&&d.slots.length<=SLOTS
  &&d.slots.every(o=>o===null||buSaveOk(o));}

/* ---- reading a code: {kind:"full",data}. Spaces, line breaks and text around the code are fine.
   Throws buFail(...) with a message for the player. ---- */
function buRead(text){
  const s=String(text==null?"":text).replace(/[\s​-‍⁠﻿]+/g,"");
  if(!s)throw buFail("empty");
  const m=/INK(\d+):/.exec(s);
  if(!m){
    if(/(^|[^A-Za-z0-9])[A-Za-z]{2,8}\d+:[A-Za-z0-9_-]/.test(s))throw buFail("other");   // e.g. PEW1:... from another game
    throw buFail("notcode");}
  const n=+m[1];
  if(n!==BU_V)throw buFail(n>BU_V?"newer":"notcode");
  const c=s.slice(m.index+m[0].length).replace(/[^A-Za-z0-9_-].*$/,"");   // drop quotes or punctuation pasted after it
  if(c.length<7)throw buFail("damaged");
  const body=c.slice(0,-6);
  if(buSum(body)!==c.slice(-6))throw buFail("damaged");
  let d;try{d=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(new Uint8Array(buUnzip(body))));}catch(e){throw buFail("damaged");}
  if(!buFullOk(d))throw buFail("bad");
  return{kind:"full",data:d};}

/* ---- writing a checked backup: all four keys, or none of them ---- */
function buWrite(d){
  const keys=[[SAVE_KEY,d.save]];for(let i=1;i<=SLOTS;i++)keys.push([slotKey(i),d.slots[i-1]||null]);
  const old=[];
  try{for(const [k] of keys)old.push([k,localStorage.getItem(k)]);}catch(e){return false;}
  try{for(const [k,v] of keys){if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}return true;}
  catch(e){   // put the old values back: clear all first, so a full storage has room for what fitted before
    try{for(const [k] of old)localStorage.removeItem(k);for(const [k,v] of old)if(v!=null)localStorage.setItem(k,v);}catch(_){}
    return false;}}

/* ---- the two sheets (Settings › Save) ---- */
function buSelect(ta){try{ta.select();ta.setSelectionRange(0,ta.value.length);}catch(e){}}
async function buCopy(ta){
  try{await navigator.clipboard.writeText(ta.value);buMarkBackup();toast("Copied. Paste it somewhere safe.");return;}catch(e){}   // no clipboard access: select it instead
  ta.focus();buSelect(ta);let ok=false;try{ok=document.execCommand("copy");}catch(e){}
  if(ok)buMarkBackup();
  toast(ok?"Copied. Paste it somewhere safe.":"Code selected. Long-press it and tap Copy.");}
function buBackupOpen(){let code="";try{code=buCode();}catch(e){}
  if(!code){toast("Couldn't make a backup code on this device");return;}
  openSheet("Back up",`<p class="hint" style="margin-top:0">This code is your whole game: the current career, all 3 save slots and your settings. Keep it in your notes, then paste it into <b>Restore</b> on any phone or browser.</p>
<textarea class="code" id="codeOut" readonly spellcheck="false" aria-label="Your backup code"></textarea>
<p class="hint">${code.length.toLocaleString("en-CA")} characters, starting with ${BU_PREFIX}</p>
<div class="row"><button class="btn pri" id="copyCode" style="flex:1">Copy code</button></div>`);
  const ta=$("codeOut");ta.value=code;ta.addEventListener("focus",()=>buSelect(ta));
  $("copyCode").addEventListener("click",()=>buCopy(ta));$("copyCode").focus({preventScroll:true});}
function buRestoreOpen(){
  openSheet("Restore",`<p class="hint" style="margin-top:0">Paste a backup code (it starts with ${BU_PREFIX}). Restoring replaces your current career and all 3 save slots on this device.</p>
<textarea class="code" id="codeIn" placeholder="${BU_PREFIX}…" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Backup code to restore" aria-describedby="codeErr"></textarea>
<p class="hint buerr" id="codeErr" role="alert"></p>
<div class="row"><button class="btn pri" id="doImport" style="flex:1">Restore</button></div>`);
  const ta=$("codeIn"),err=$("codeErr");
  ta.addEventListener("input",()=>{err.textContent="";});
  $("doImport").addEventListener("click",()=>buRestore(ta.value,err));
  if(matchMedia("(hover:hover) and (pointer:fine)").matches)ta.focus({preventScroll:true});}   // no surprise keyboard on phones
function buAsk(d){const when=buNum(d.at)?new Date(d.at).toLocaleString("en-CA",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}):"";
  const o=d.save,n=d.slots.filter(Boolean).length;
  return `Restore this backup?\n\n${when?"Made "+when+"\n":""}Week ${o.week||1}, ${o.year||2000}\n${n} of ${SLOTS} save slots used\n\nIt replaces your current career and all ${SLOTS} save slots on this device.`;}
function buRestore(text,err){
  const say=k=>{err.textContent=BU_MSG[k]||BU_MSG.damaged;};
  err.textContent="";
  let r;try{r=buRead(text);}catch(e){say(e&&e.bu||"damaged");return;}
  {const o=r.data.save,bk=S&&buNum(S.bkAt)?S.bkAt:0;if(bk>(buNum(o.bkAt)?o.bkAt:0))o.bkAt=bk;}   // this device's last-backup time survives a restore
  if(!confirm(buAsk(r.data)))return;
  if(!buWrite(r.data)){say("store");return;}
  closeSheet();applyLoaded(r.data.save,"Backup restored");buPersist();}

/* ---- backup files and keep-my-storage (from PEW 1.76.66). Every Longlight game lives at jxstrr0.github.io and shares
   one storage pot, which a phone short on space may clear all at once. buPersist() asks the browser to keep it;
   buFileSave() puts the same INK1: code in a text file; buFileLoad() runs a file through the Restore checks. ---- */
const BU_FILE_MAX=4e6;
let buPersistAsked=false;
function buPersist(){if(buPersistAsked)return;buPersistAsked=true;
  try{const st=typeof navigator!=="undefined"&&navigator.storage;if(!st||!st.persist||!st.persisted)return;
    st.persisted().then(p=>p||st.persist()).then(()=>{},()=>{});}catch(e){}}
function buMarkBackup(){if(!S)return;S.bkAt=Date.now();try{save();}catch(e){}buPersist();}
function buFileName(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`ink-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.txt`;}
async function buFileSave(){let code="";try{code=buCode();}catch(e){}
  if(!code){toast("Couldn't make a backup on this device");return;}
  const name=buFileName(),text=code+"\n";
  let file=null;try{file=new File([text],name,{type:"text/plain"});}catch(e){}
  if(file&&navigator.canShare&&navigator.share){let can=false;try{can=navigator.canShare({files:[file]});}catch(e){}
    if(can){try{await navigator.share({files:[file]});buMarkBackup();toast("Backup file saved");return;}
      catch(e){if(e&&e.name==="AbortError")return;}}}   // cancelled: not saved. Any other refusal falls back to a download
  try{const url=URL.createObjectURL(new Blob([text],{type:"text/plain"})),a=document.createElement("a");
    a.href=url;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
    buMarkBackup();toast("Backup file saved: "+name);}
  catch(e){toast("Couldn't save a file here. Use Back up and copy the code.");}}
function buFileLoad(){const inp=$("bkFileIn");if(inp){inp.value="";inp.click();}}
async function buFileRead(inp){const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  let text="";
  if(f.size>BU_FILE_MAX)text="\u0000";   // far too big to be a backup: the Restore sheet says it isn't a code
  else{try{text=await f.text();}catch(e){text="";}}
  text=String(text).trim();
  buRestoreOpen();$("codeIn").value=text;
  buRestore(text||"\u0000",$("codeErr"));}
/* ===================== app/boot.js: tabs, the sheet, Settings, PWA, start =====================
   showTab(t) swaps the five tabs (Studio, Design, Session, Clients, Career) and remembers each one's scroll place.
   The sheet (#sheet) hosts Settings, Back up and Restore. The PWA part (lifted from PEW's pwa.js) registers sw.js on a
   real host (never localhost unless ?sw=1, never file://), shows the "New version ready" bar when a new worker waits,
   and offers Install in Settings when the browser allows it. start() runs once, from html/tail.html. */
let curTab="studio";
const TABS=["studio","design","session","clients","career"];
const tabScroll={};
function showTab(t){if(!TABS.includes(t))t="studio";const pn=$("panel");tabScroll[curTab]=pn.scrollTop;curTab=t;
  document.documentElement.setAttribute("data-tab",t);
  document.querySelectorAll("#tabs button").forEach(b=>{const on=b.dataset.tab===t;b.classList.toggle("on",on);if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  document.querySelectorAll(".tabpage").forEach(p=>p.classList.toggle("on",p.id==="tab-"+t));
  renderTab(t);pn.scrollTop=tabScroll[t]||0;
  if(t==="studio"&&typeof INK_VIS!=="undefined"&&INK_VIS.ready())INK_VIS.resize();}
function renderTab(t){({studio:renderStudio,design:renderDesign,session:renderSession,clients:renderClients,career:renderCareer})[t]();}
function renderHeader(){$("whenLbl").textContent=`Week ${S.week}, ${S.year}`;$("cashLbl").textContent=fmtMoney(S.cash);}
function renderAll(){renderHeader();renderTab(curTab);}

function closeSheet(){$("sheet").classList.remove("on");$("scrim").classList.remove("on");if(sheetBack&&sheetBack.focus)try{sheetBack.focus({preventScroll:true});}catch(e){}sheetBack=null;}
function sheetOn(){return $("sheet").classList.contains("on");}

    $(id).querySelectorAll("button").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-pressed",on);});fn(b.dataset.v);save();});
  seg("setTheme",v=>{st.theme=v;applyTheme();});
  seg("setReduced",v=>{st.reduced=v==="1";applySettings();});
  seg("setGfx",v=>{st.gfx=v||null;PERF.manual=true;perfReset(true);applyGfx();});
  seg("setGfxAuto",v=>{st.gfxAuto=v==="1";PERF.dropped=PERF.manual=false;perfReset(true);});
  seg("setSound",v=>{st.sound=v==="1";INK_SOUND.setOn(st.sound);});
  $("bkCode").addEventListener("click",buBackupOpen);$("bkRestore").addEventListener("click",buRestoreOpen);
  $("bkFile").addEventListener("click",buFileSave);$("bkLoad").addEventListener("click",buFileLoad);

/* ---- PWA: install offer and the update bar ---- */
let pwaDeferred=null;
const pwaStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pwaIos=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function pwaSync(){const sec=$("set-app");if(!sec)return;const inst=!!pwaDeferred&&!pwaStandalone(),tip=pwaIos()&&!pwaStandalone();
  $("pwaInstall").hidden=!inst;$("pwaIos").hidden=!tip;sec.hidden=!(inst||tip);
  $("pwaInstall").onclick=async()=>{if(!pwaDeferred)return;const p=pwaDeferred;pwaDeferred=null;pwaSync();try{p.prompt();const r=await p.userChoice;if(r&&r.outcome==="accepted")toast("Installed");}catch(_){}};}
function pwaInit(){
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();pwaDeferred=e;pwaSync();});
  window.addEventListener("appinstalled",()=>{pwaDeferred=null;pwaSync();});
  const bar=document.createElement("div");bar.id="pwaBar";bar.setAttribute("role","status");
  bar.innerHTML='<span>New version ready</span><button type="button" class="btn sm pri" id="pwaReload">Reload</button><button type="button" class="pwalater" id="pwaLater" aria-label="Dismiss until next visit">Later</button>';
  document.body.appendChild(bar);
  let waiting=null,reloading=false;
  const offer=w=>{waiting=w;bar.classList.add("on");};
  $("pwaLater").addEventListener("click",()=>bar.classList.remove("on"));
  $("pwaReload").addEventListener("click",()=>{if(waiting)waiting.postMessage({type:"SKIP_WAITING"});else location.reload();});
  const host=location.hostname,web=/^https?:$/.test(location.protocol),local=/^(localhost|127\.\d+\.\d+\.\d+|\[?::1\]?|0\.0\.0\.0)$/.test(host);
  if(!("serviceWorker" in navigator)||!web||(local&&!/[?&]sw=1(&|$)/.test(location.search)))return;
  const sw=navigator.serviceWorker;
  sw.addEventListener("controllerchange",()=>{if(reloading||!waiting)return;reloading=true;location.reload();});
  sw.register("sw.js").then(reg=>{
    const watch=w=>w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&sw.controller)offer(w);});
    if(reg.waiting&&sw.controller)offer(reg.waiting);
    watch(reg.installing);reg.addEventListener("updatefound",()=>watch(reg.installing));
    /* an installed app can stay open for days: look for a new version when it comes back to the front and every few hours */
    const chk=()=>{try{reg.update().catch(()=>{});}catch(_){}};
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk();});setInterval(chk,4*3600*1000);
  }).catch(()=>{});}

/* ---- start: load the save, wire the page, draw the studio ---- */
function start(){
  loadSaved();applySettings();
  document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{INK_SOUND.tick();const again=b.dataset.tab===curTab;showTab(b.dataset.tab);if(again)$("panel").scrollTo({top:0});}));
  $("setOpen").addEventListener("click",openSettings);
  $("sheetClose").addEventListener("click",closeSheet);$("scrim").addEventListener("click",closeSheet);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetOn()){closeSheet();e.preventDefault();}});
  $("bkFileIn").addEventListener("change",e=>buFileRead(e.target));
  matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(S.settings.theme==="auto")applyTheme();});
  try{if(typeof INK_VIS!=="undefined")INK_VIS.init($("gl"),perfTier());}catch(e){}
  pwaInit();
  renderHeader();showTab("studio");
  save();
  window.__ldDone&&__ldDone();}

   PR 1 (text only): a sample piece is scored against a sample client and the raw score object is shown, so the sim can be
   checked on a phone. Pick a placement, a size and a client to see the numbers move. The real design board (body diagram,
   cream board, element drawer, live deltas, stress report, flash wall) replaces this in PR 2. */
const DZ_SAMPLE_CLIENTS=[
  {id:"t1",name:"Office worker, light skin",pronouns:"she/her",age:29,bodyShape:"femme",skinTone:.15,job:"accountant",
   traits:{pain:.4,sun:.2,aftercare:.8,budget:.6,loyalty:.6,talkative:.5,trusting:.6},
   wants:{styles:{traditional:1,neotrad:.6},tags:["nature"],sizeMm:[60,120],colour:.7},mustHaves:[],dealbreakers:[]},
  {id:"t2",name:"Roofer, dark skin, outdoors",pronouns:"he/him",age:41,bodyShape:"masc",skinTone:.85,job:"roofer",
   traits:{pain:.8,sun:.9,aftercare:.4,budget:.4,loyalty:.7,talkative:.3,trusting:.5},
   wants:{styles:{blackwork:1,traditional:.7},tags:[],sizeMm:[80,200],colour:.2},mustHaves:[],dealbreakers:[{kind:"colour",v:"yellow"}]}
];
const DZ={placement:null,size:90,client:0,colour:"red"};
function dzSampleDesign(){
  const E=INK_SIM.ELEMENTS||[],P=INK_SIM.PLACEMENTS||{};
  const pick=(fam,style)=>E.find(e=>e.family===fam&&e.styles.includes(style))||E.find(e=>e.family===fam)||E[0];

  if(motif)els.push({id:motif.id,x:.5,y:.4,scale:.7,rot:0,lineWeight:motif.lineWeightDefault,fill:.5,colour:DZ.colour});
  if(word)els.push({id:word.id,x:.5,y:.85,scale:.6,rot:0,lineWeight:word.lineWeightDefault,fill:0,colour:null});
  return{placement:DZ.placement,sizeMm:DZ.size,style:"traditional",elements:els};}
function renderDesign(){

  const opt=(v,l,cur)=>`<option value="${esc(v)}"${String(v)===String(cur)?" selected":""}>${esc(l)}</option>`;

<label>Size <select id="dzSz">${[9,20,40,60,90,140,220].map(n=>opt(n,n+" mm",DZ.size)).join("")}</select></label>
<label>Colour <select id="dzCol">${["red","yellow","black","skyblue","green"].map(c=>opt(c,c,DZ.colour)).join("")}</select></label>

<pre class="raw" id="dzOut"></pre></div>`;
  $("dzOut").textContent=out;
